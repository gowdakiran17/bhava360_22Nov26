id: "<system>.<topic-key>.<stable-slug>"
system: "<system-root>"
topic: "<relative-topic-path>"
title: "<editorial title>"
doctrine_profile: "<versioned convention ID>"
approval: draft
rule: "<original paraphrase>"
conditions:
  all:
    - fact: "<registered fact key>"
      op: eq
      value: "<typed literal>"
meaning: "<what the matched facts may indicate>"
life_areas: []  # Use catalogue keys. Leave empty for area-neutral or context-dependent rules (see SCHEMA.yaml).
strength_notes: []  # Item: {when: <predicate>, effect: stronger|weaker, reason: <text>}
exceptions: []  # Item: {when: <predicate>, effect: soften|cancel, reason: <text>}
traditions_differ: []  # Item: {profile: <variant ID>, note: <difference>}
sources:
  - book: "<work>"
    work_id: "<registered work ID>"
    edition: null
    chapter: null
    verse: null
    other_locator: null
    supports: "<formation, meaning, modifier or exception>"
    verification: pending
    to_verify: true
confidence: medium  # high | medium | low | disputed
review_notes: "<open questions and verification needed>"
# Both user_text maps follow supported_locales in SCHEMA.yaml. Omit untranslated optional keys.
user_text:
  en: "<English>"
  kn: "<ಕನ್ನಡ>"
  hi: "<हिन्दी>"
native_review: {kn: pending, hi: pending}
remedy: null  # Or {type: mantra|charity|conduct, optional: true, free: true, cost: free, user_text: {en: ..., kn: ..., hi: ...}}
# Vedic sign entries also carry the rasi mapping defined in SCHEMA.yaml.
# Vedic planet entries also carry the graha mapping defined in SCHEMA.yaml.
# Vedic nakshatra entries also carry the nakshatra mapping defined in SCHEMA.yaml.
# The twelve bhava reference entries also carry the bhava mapping defined in SCHEMA.yaml.
# Western outer-planet entries carry the outer_planet mapping defined in SCHEMA.yaml.
# Vedic planetary state entries carry the state mapping defined in SCHEMA.yaml.
# Vedic planet-in-sign entries carry the placement mapping defined in SCHEMA.yaml.
# Vedic planet-in-house entries use the house placement mapping in SCHEMA.yaml.
# Vedic house-lord entries carry house_pair and related_rules as defined in SCHEMA.yaml.
evidence:
  direction: context
  weight_class: context
  time_scope: static
  reference: none
  area_strength: {}

  user_text:
    en: When you approach something new, you may enjoy giving one growing project regular attention.
    kn: 'ಹೊಸ ಕೆಲಸ ಆರಂಭಿಸುವಾಗ: ಬೆಳೆಯುತ್ತಿರುವ ಒಂದು ಕೆಲಸಕ್ಕೆ ಸತತ ಗಮನ ಕೊಡುವುದು ನಿಮಗೆ ಇಷ್ಟವಾಗಬಹುದು.'
    hi: 'नई शुरुआत पर विचार करते समय: किसी बढ़ते काम को नियमित समय देना आपको अच्छा लग सकता है।'
  quarter_user_text:
    en: When starting something new, you can try a direct first step.
    kn: ನೇರವಾಗಿ ಆರಂಭಿಸಲು ಗಮನ ಕೊಡಬಹುದು.
    hi: सीधी शुरुआत करने पर ध्यान दे सकते हैं।
  star_lord_user_text:
    en: You may find a way to make space for a familiar need.
    kn: ಪರಿಚಿತ ಅಗತ್ಯಕ್ಕೆ ಅವಕಾಶ ಕೊಡಲು ಅವಕಾಶ ಸಿಗಬಹುದು.
    hi: परिचित ज़रूरत को जगह देने का अवसर मिल सकता है।

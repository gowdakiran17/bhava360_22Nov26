  user_text:
    en: You may enjoy taking the first practical step when someone needs help.
    kn: ಯಾರಿಗಾದರೂ ನೆರವು ಬೇಕಾದಾಗ ಮೊದಲ ಹೆಜ್ಜೆ ಇಡುವುದು ನಿಮಗೆ ಇಷ್ಟವಾಗಬಹುದು.
    hi: किसी को मदद चाहिए तो पहला कदम उठाना आपको अच्छा लग सकता है।
  quarter_user_text:
    en: When noticing what feels familiar, you can build a steady routine.
    kn: ಪರಿಚಿತವೆನಿಸುವುದನ್ನು ಗಮನಿಸುವಾಗ ಸ್ಥಿರ ದಿನಚರಿ ಬೆಳೆಸಲು ಗಮನ ಕೊಡಬಹುದು.
    hi: जो अपना सा लगे उस पर ध्यान देते समय नियमित अभ्यास बनाने पर ध्यान दे सकते हैं।
  star_lord_user_text:
    en: You may find a way to learn from a wider perspective.
    kn: ವಿಶಾಲ ದೃಷ್ಟಿಯಿಂದ ಕಲಿಯಲು ಅವಕಾಶ ಸಿಗಬಹುದು.
    hi: व्यापक दृष्टि से सीखने का अवसर मिल सकता है।
lagna:
  star: rohini
  pada: 1
  lord: moon
  navamsha: aries
  user_text:
    en: You can make room in your routine for a project that is beginning to grow.
    kn: ಬೆಳೆಯುತ್ತಿರುವ ಯೋಜನೆಗೆ ನಿಯಮಿತವಾಗಿ ಸಮಯ ಮೀಸಲಿಡಬಹುದು.
    hi: आकार ले रही योजना के लिए नियमित समय निकाल सकते हैं।
  quarter_user_text:
    en: When starting something new, you can try a direct first step.
    kn: ಹೊಸದನ್ನು ಆರಂಭಿಸುವಾಗ ನೇರವಾಗಿ ಆರಂಭಿಸಲು ಗಮನ ಕೊಡಬಹುದು.
    hi: कुछ नया शुरू करते समय सीधी शुरुआत करने पर ध्यान दे सकते हैं।
  star_lord_user_text:
    en: You may find a way to make space for a familiar need.
    kn: ಪರಿಚಿತ ಅಗತ್ಯಕ್ಕೆ ಅವಕಾಶ ಕೊಡಲು ಅವಕಾಶ ಸಿಗಬಹುದು.
    hi: परिचित ज़रूरत को जगह देने का अवसर मिल सकता है।

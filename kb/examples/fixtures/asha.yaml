  public_kn:
    today: ಪರಿಚಿತ ದಿನಚರಿ ಮನಸ್ಸಿಗೆ ನೆಮ್ಮದಿ ನೀಡಬಹುದು.
    month: ಈ ತಿಂಗಳು ಯೋಜನೆಯೊಂದನ್ನು ಮುಂದಕ್ಕೆ ತೆಗೆದುಕೊಂಡು ಹೋಗಬಹುದು.
    career: ಕೆಲಸದ ಹೊಣೆಗಳನ್ನು ಪರಿಶೀಲಿಸುವುದು ನೆರವಾಗಬಹುದು.
    love-marriage: ಒಟ್ಟಿನ ಬದುಕಿನ ಬಗ್ಗೆ ಮಾತನಾಡಲು ಸಮಯ ನೀಡಬಹುದು.
    money: ಆದಾಯವು ಉಳಿತಾಯದ ಯೋಜನೆಗೆ ಹೇಗೆ ಹೊಂದುತ್ತದೆ ಎಂದು ನೋಡಬಹುದು.
    health: ದೇಹದ ಚೈತನ್ಯ, ಸ್ವಭಾವ ಮತ್ತು ದಿನಚರಿಯನ್ನು ಗಮನಿಸಬಹುದು.
    family-home: ಕುಟುಂಬದೊಂದಿಗೆ ಪರಿಚಿತ ದಿನಚರಿಗೆ ಸಮಯ ಸಿಗಬಹುದು.
    learning: ಶಿಕ್ಷಕರೊಂದಿಗೆ ಒಂದು ವಿಷಯವನ್ನು ಆಳವಾಗಿ ಕಲಿಯಬಹುದು.
    traditional_practice: ಇಚ್ಛೆಯಿದ್ದರೆ ಸಂಜೆ ಸ್ವಲ್ಪ ವಿರಾಮ ತೆಗೆದುಕೊಂಡು ಯಾವುದು ನಿಮಗೆ
      ನೆಮ್ಮದಿ ನೀಡಿತು ಎಂದು ಗಮನಿಸಬಹುದು.
  public_hi:
    today: जानी-पहचानी दिनचर्या सुकून दे सकती है।
    month: इस महीने किसी योजना में आगे बढ़ने का अवसर मिल सकता है।
    career: काम की जिम्मेदारियों पर विचार करना मददगार हो सकता है।
    love-marriage: साथ बिताए जीवन पर बातचीत के लिए समय रख सकते हैं।
    money: आमदनी और बचत की योजनाओं को साथ रखकर देख सकते हैं।
    health: आप शरीर की स्फूर्ति, स्वभाव और दिनचर्या पर ध्यान दे सकते हैं।
    family-home: परिवार के साथ परिचित दिनचर्या के लिए समय मिल सकता है।
    learning: शिक्षक के साथ किसी विषय को गहराई से समझ सकते हैं।
    traditional_practice: चाहें तो शाम को ठहरकर देख सकते हैं कि किस बात से आपको सुकून
      मिला।

  yoga_exceptions:
    vedic.yogas.anapha:
    - when:
        fact: d1.yoga.mixed_nature_witness
        op: eq
        value: true
      effect: soften
      reason: Resolve the actual contributing grahas. A mixed benefic and malefic
        witness does not support an unqualified positive reading.
    - when:
        fact: d1.yoga.participant_afflicted
        op: eq
        value: true
      effect: soften
      reason: A bound forming participant loses war or is combust; retain only softened
        language. Editorial qualification pending school review.
    - when:
        fact: d1.yoga.foundation_cancelled
        op: eq
        value: true
      effect: cancel
      reason: The bound prerequisite has been withdrawn by a matched cancellation.
        Apply only to that witness; never cancel an unrelated match.
    vedic.yogas.budhaditya:
    - when:
        fact: d1.yoga.mercury_combust
        op: eq
        value: true
      effect: soften
      reason: Measure Mercury–Sun separation using the inclusive direct or retrograde
        combustion orb.
    - when:
        fact: d1.yoga.foundation_cancelled
        op: eq
        value: true
      effect: cancel
      reason: The bound prerequisite has been withdrawn by a matched cancellation.
        Apply only to that witness; never cancel an unrelated match.

version: 1
approval: draft
mapping:
  1: AJS
  2: BKT
  3: CLU
  4: DMV
  5: ENW
  6: FOX
  7: GPY
  8: HQZ
  9: IR
fields:
- life-path
- expression
- soul-urge
- personality
- birthday
- maturity
- personal-year
- personal-month
- personal-day
algorithm: At each named reduction stage record the input, then repeatedly sum decimal digits until single-digit or
  a retained master value. Preserve the raw letter sum separately. Follow the metric IDs below.
privacy: Normalize case and remove accepted separators. Reject unsupported characters and empty input. Ask for the
  intended Latin spelling.
metrics:
  expression: numerology.pythagorean.expression
  soul-urge: numerology.pythagorean.soul-urge
  personality: numerology.pythagorean.personality
  life-path: numerology.pythagorean.life-path
  birthday: numerology.pythagorean.birthday
  personal-year: numerology.pythagorean.personal-year
  personal-month: numerology.pythagorean.personal-month
  personal-day: numerology.pythagorean.personal-day
  maturity: numerology.pythagorean.maturity
preserve_at_each_reduction:
- 11
- 22
- 33
convention: Preserve a master input or intermediate digit sum at every component and final reduction, including cycles.
  Schools can differ on which stages preserve masters.
letter_reference: Cyclic Latin alphabet in nine columns; ordinal A=1 through Z=26 reduced modulo nine.
life_path_methods:
  default: components
  components: Reduce month, day and year separately, retaining masters at each reduction; then reduce their sum with
    the same master stops.
  full-digit-sum: Add all Gregorian birth-date digits before the single reduction chain; retain 11, 22 or 33 whenever
    reached in that chain.
debt_detection:
  eligible_stages:
  - life-path-month
  - life-path-day
  - life-path-year
  - life-path-final
  - expression
  - soul-urge
  - personality
  - birthday
  compounds:
  - 13
  - 14
  - 16
  - 19
  method: Inspect each compound immediately before its digits are summed. Store stage, reduction index and matched
    value. Full-digit-sum emits only the final Life Path stage. Omit maturity and calendar cycles.
  public: Deduplicate birthday and life-path-day on the birth-day compound. Keep both stage records in admin evidence.
public_deduplication: Group detected compounds by their number. Preserve distinct Life Path day and Birthday stage
  tags privately; render each reflective meaning once.

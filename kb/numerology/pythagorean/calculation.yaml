  personal-month: numerology.pythagorean.personal-month
  personal-day: numerology.pythagorean.personal-day
  maturity: numerology.pythagorean.maturity
preserve_at_each_reduction:
- 11
- 22
- 33
convention: Preserve a master input or intermediate digit sum at every component and final reduction, including cycles.
  Schools can differ on which stages preserve masters.

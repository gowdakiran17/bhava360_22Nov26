algorithm: At each named reduction stage record the input, then repeatedly sum decimal digits until single-digit or
  a retained master value. Preserve the raw letter sum separately. Follow the metric IDs below.
privacy: Normalize case and remove accepted separators. Reject unsupported characters and empty input. Ask for the
  intended Latin spelling.

scheme: bhava360-orthographic-latin-v1
rules:
- Normalize NFC. Preview one Indic script per spelling. Unknown sequences or mixed scripts require an explicit Latin
  spelling.
- Each consonant supplies A unless a vowel sign replaces it or virama removes it. Conjuncts concatenate; permit joiners
  only immediately after virama. Keep final inherent A; never infer spoken schwa deletion.
- Use the listed letter digraphs. Collapse retroflex and dental stops to the same Latin letter; this scoring spelling
  is intentionally non-reversible. Each Latin character counts separately.
- The user confirms the preview or supplies their chosen Latin spelling before scoring. Confirmation takes precedence
  for pronunciation and family spelling.

approval: draft
access: admin
basis: For a confirmed cardinal plan wall, measure the doorway midpoint along its length clockwise from the named
  corner. The eight equal wall intervals are a modern lookup convention using the classical sequence; these are
  not compass wedges.
start_corner:
  east: northeast
  south: southeast
  west: southwest
  north: northwest
interval: For 0 <= distance < wall_length, index = 1 + floor(8 * distance / wall_length). At an exact terminal corner
  use position zero on the next clockwise wall. Withhold if the wall or midpoint is uncertain.

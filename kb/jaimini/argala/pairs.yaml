counting: Count inclusively from the selected D1 reference. Reverse both offsets when Ketu occupies the reference
  sign. Count the nine grahas once each, excluding Lagna.
outcomes: 'No interveners: absent. More interveners than blockers: survives. More blockers than interveners:
  obstructed. Equal nonzero counts: unresolved pending school-specific strength comparison.'
special_third: Three or more natural malefics in the counted third form the separate special intervention of
  I.1.6. Do not run this special through the standard pairs.
special_malefics:
- sun
- mars
- saturn
- rahu
- ketu
traditions_differ: The special rule uses fixed malefics in this profile. Some classifications include a waning
  Moon or afflicted Mercury.

- mars
- mercury
- jupiter
- venus
- saturn
eight_addition: rahu
sign_width_arcsec: 108000
rank: Normalize sidereal longitude modulo a turn, then take the remainder modulo one sign. Sort descending
  without rounding. Rahu alone uses sign width minus remainder, including the full width at zero. Ordinary
  retrogression does not reverse any other graha.
tie: All equal scores retain their slots. Set only those role values to unknown; do not promote lower-ranked
  bodies. An incomplete candidate set gives an unknown ranking.

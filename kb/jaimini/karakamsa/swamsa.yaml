  note: In the Sutras commentary swamsa can refer to the AK’s navamsa. This profile calls that D9 sign karakamsa
    and labels the D9 ascendant lagnamsa when using the separate swamsa-as-ascendant convention. A D1 projection
    uses D1 occupants at the same sign.

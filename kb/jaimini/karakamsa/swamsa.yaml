rule: Bind the requested swamsa convention. In the sutra-commentary reading use the AK’s D9 sign; in the lagnamsa
  reading use the D9 sign of the birth ascendant. Use the KB-11 Navamsa lookup and only D9 occupants. An unspecified
  convention yields unknown.

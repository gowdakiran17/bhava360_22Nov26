  note: This conservative benefic subset keeps a qualitative relationship theme. Other readings expand the
    benefic list or examine the ruler of the second from UL. The selected profile takes the tenth from a raw
    projection in the first or seventh. Suryanarain Rao’s examples in I.1.30–31 retain the raw result. Use
    Mars for Scorpio and Saturn for Aquarius here; other methods compare co-lords.

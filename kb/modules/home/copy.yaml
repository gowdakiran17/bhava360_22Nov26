  phase-support:
    en: You may find good support around you.
    kn: ಸುತ್ತಮುತ್ತ ಒಳ್ಳೆಯ ಬೆಂಬಲ ಸಿಗಬಹುದು.
    hi: आसपास अच्छा सहयोग मिल सकता है।
  phase-timing:
    en: The timing may also help.
    kn: ಸಮಯವೂ ನೆರವಾಗಬಹುದು.
    hi: समय भी सहायक हो सकता है।
  tomorrow-tone:
    en: Tomorrow may have a different rhythm.
    kn: ನಾಳೆ ದಿನದ ಗತಿ ಬದಲಾಗಬಹುದು.
    hi: कल दिन की लय अलग लग सकती है।
  tomorrow-change:
    en: You may notice a change of pace tomorrow.
    kn: ನಾಳೆ ಗತಿಯಲ್ಲಿ ಬದಲಾವಣೆ ಗಮನಿಸಬಹುದು.
    hi: कल गति में बदलाव महसूस कर सकते हैं।
  week-period:
    en: This week may open a new chapter.
    kn: ಈ ವಾರ ಹೊಸ ಅಧ್ಯಾಯ ಆರಂಭವಾಗಬಹುದು.
    hi: इस सप्ताह नया अध्याय शुरू हो सकता है।
  week-movement:
    en: The pace may shift during the week.
    kn: ವಾರದಲ್ಲಿ ಗತಿ ಬದಲಾಗಬಹುದು.
    hi: सप्ताह में गति बदल सकती है।
  week-continuity:
    en: You may find a familiar rhythm this week.
    kn: ಈ ವಾರ ಪರಿಚಿತ ಗತಿ ಅನುಭವವಾಗಬಹುದು.
    hi: इस सप्ताह परिचित लय महसूस हो सकती है।
  moon-chip:
    en: Moon movement
    kn: ಚಂದ್ರನ ಚಲನೆ
    hi: चंद्रमा की चाल
  star-chip:
    en: Daily star pattern
    kn: ದಿನದ ನಕ್ಷತ್ರ ವಿನ್ಯಾಸ
    hi: दिन का नक्षत्र क्रम
  season-chip:
    en: Current chapter
    kn: ಪ್ರಸ್ತುತ ಅಧ್ಯಾಯ
    hi: वर्तमान अध्याय
  career-chip:
    en: Work and responsibilities
    kn: ಕೆಲಸ ಮತ್ತು ಜವಾಬ್ದಾರಿ
    hi: काम और जिम्मेदारियाँ
  timing-chip:
    en: Timing patterns
    kn: ಸಮಯದ ವಿನ್ಯಾಸ
    hi: समय के संकेत
  slower:
    en: This may unfold more gradually.
    kn: ಇದು ನಿಧಾನವಾಗಿ ಸಾಗಬಹುದು.
    hi: यह धीरे आगे बढ़ सकता है।
  no-window:
    en: A clear window may take time to emerge. You can keep building on your efforts.
    kn: ಸ್ಪಷ್ಟ ಅವಧಿ ಕಾಣಲು ಸಮಯ ಹಿಡಿಯಬಹುದು. ನಿಮ್ಮ ಪ್ರಯತ್ನ ಮುಂದುವರಿಸಬಹುದು.
    hi: स्पष्ट अवसर उभरने में समय लग सकता है। आप प्रयास जारी रख सकते हैं।
  action:
    en: You can set aside time to review your next step.
    kn: ಮುಂದಿನ ಹೆಜ್ಜೆಯನ್ನು ಪರಿಶೀಲಿಸಲು ಸಮಯ ಬಿಡಬಹುದು.
    hi: अगले कदम पर विचार के लिए समय निकाल सकते हैं।
  mixed:
    en: The signals may be mixed.
    kn: ಸೂಚನೆಗಳು ಮಿಶ್ರವಾಗಿರಬಹುದು.
    hi: संकेत मिले-जुले हो सकते हैं।
  limited:
    en: There may be little to go on for this topic just now.
    kn: ಈ ವಿಷಯಕ್ಕೆ ಈಗ ಕಡಿಮೆ ಸೂಚನೆಗಳು ಸಿಗಬಹುದು.
    hi: इस विषय पर अभी कम संकेत मिल सकते हैं।
  delay:
    en: You can give this plan more time.
    kn: ಈ ಯೋಜನೆಗೆ ಇನ್ನಷ್ಟು ಸಮಯ ನೀಡಬಹುದು.
    hi: इस योजना को थोड़ा और समय दे सकते हैं।
  sustain:
    en: This may start smoothly and benefit from steady attention.
    kn: ಆರಂಭ ಸುಗಮವಾಗಬಹುದು; ಮುಂದೆಯೂ ಗಮನ ನೀಡುವುದು ನೆರವಾಗಬಹುದು.
    hi: शुरुआत सहज हो सकती है और आगे नियमित ध्यान मदद कर सकता है।
  improve:
    en: Things may improve with time.
    kn: ಕಾಲಕ್ರಮೇಣ ಸುಧಾರಣೆ ಕಾಣಬಹುದು.
    hi: समय के साथ सुधार हो सकता है।
  phase-end:
    en: This phase may ease by {date}.
    kn: '{date} ವೇಳೆಗೆ ಈ ಹಂತ ಸರಾಗವಾಗಬಹುದು.'
    hi: '{date} तक इस दौर में सहजता आ सकती है।'
  pair-easier:
    en: Things can flow together during this period.
    kn: ಈ ಅವಧಿಯಲ್ಲಿ ಕೆಲಸಗಳು ಹೊಂದಿಕೊಂಡು ಸಾಗಬಹುದು.
    hi: इस दौरान बातें सहजता से साथ चल सकती हैं।
  pair-harder:
    en: You may feel some pull between what you want and what circumstances allow.
    kn: ನಿಮ್ಮ ಬಯಕೆ ಮತ್ತು ಸಂದರ್ಭಕ್ಕೆ ಹೊಂದುವ ಆಯ್ಕೆಗಳ ನಡುವೆ ಎಳೆತ ಅನಿಸಬಹುದು.
    hi: अपनी चाह और परिस्थिति की गुंजाइश के बीच खिंचाव महसूस हो सकता है।
  yoga-mild:
    en: A gentle support may show in small ways.
    kn: ಪುಟ್ಟ ಸಂಗತಿಗಳಲ್ಲಿ ಸೌಮ್ಯ ಬೆಂಬಲ ಕಾಣಬಹುದು.
    hi: छोटी बातों में हल्का सहयोग महसूस हो सकता है।
  yoga-background:
    en: This quality may show more in its own periods.
    kn: ಇದಕ್ಕೆ ಹೊಂದುವ ಅವಧಿಯಲ್ಲಿ ಈ ಗುಣ ಹೆಚ್ಚು ಕಾಣಬಹುದು.
    hi: इससे जुड़े दौर में यह गुण अधिक दिख सकता है।

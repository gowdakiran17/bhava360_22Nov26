version: 1
approval: draft
native_review:
  kn: pending
  hi: pending
messages:
  Supportive-1:
    en: A small step may come easily today.
    kn: ಇಂದು ಸಣ್ಣ ಹೆಜ್ಜೆ ಇಡುವುದು ಸುಲಭವಾಗಬಹುದು.
    hi: आज छोटा कदम उठाना सहज लग सकता है।
  Supportive-2:
    en: You may find room for a fresh start.
    kn: ಹೊಸದಾಗಿ ಆರಂಭಿಸಲು ಅವಕಾಶ ಸಿಗಬಹುದು.
    hi: नई शुरुआत की गुंजाइश मिल सकती है।
  Supportive-3:
    en: Working together may feel easier.
    kn: ಒಟ್ಟಿಗೆ ಕೆಲಸ ಮಾಡುವುದು ಸುಲಭವಾಗಬಹುದು.
    hi: साथ काम करना सहज लग सकता है।
  Steady-1:
    en: A familiar routine may suit today.
    kn: ಇಂದು ಪರಿಚಿತ ದಿನಚರಿ ಹೊಂದಬಹುದು.
    hi: आज परिचित दिनचर्या अनुकूल लग सकती है।
  Steady-2:
    en: You can take things at your own pace.
    kn: ನಿಮ್ಮದೇ ಗತಿಯಲ್ಲಿ ಸಾಗಬಹುದು.
    hi: आप अपनी गति से आगे बढ़ सकते हैं।
  Steady-3:
    en: A little planning may help today.
    kn: ಇಂದು ಕೊಂಚ ಯೋಜನೆ ನೆರವಾಗಬಹುದು.
    hi: आज थोड़ी तैयारी मदद कर सकती है।
  Take care-1:
    en: You can leave room to pause today.
    kn: ಇಂದು ವಿರಾಮಕ್ಕೆ ಸಮಯ ಬಿಡಬಹುದು.
    hi: आज ठहरने का समय रख सकते हैं।
  Take care-2:
    en: You may prefer a lighter schedule.
    kn: ಹಗುರವಾದ ವೇಳಾಪಟ್ಟಿ ನಿಮಗೆ ಹೊಂದಬಹುದು.
    hi: हल्की दिनचर्या आपको भा सकती है।
  Take care-3:
    en: Taking your time may help.
    kn: ನಿಧಾನವಾಗಿ ಸಾಗುವುದು ನೆರವಾಗಬಹುದು.
    hi: थोड़ा समय लेकर चलना मदद कर सकता है।
  phase-1:
    en: This may be a slower, steadier phase.
    kn: ಇದು ನಿಧಾನವಾಗಿ, ಸ್ಥಿರವಾಗಿ ಸಾಗುವ ಹಂತವಾಗಬಹುದು.
    hi: यह धीमा और स्थिर दौर हो सकता है।
  phase-2:
    en: You may notice a slower, steadier phase.
    kn: ನಿಧಾನವಾದ, ಸ್ಥಿರವಾದ ಹಂತವನ್ನು ಗಮನಿಸಬಹುದು.
    hi: आप एक धीमा और स्थिर दौर महसूस कर सकते हैं।
  phase-3:
    en: A slower, steadier phase may be taking shape.
    kn: ನಿಧಾನವಾದ, ಸ್ಥಿರವಾದ ಹಂತ ಆರಂಭವಾಗುತ್ತಿರಬಹುದು.
    hi: एक धीमा और स्थिर दौर उभर सकता है।
  good-travel-1:
    en: You can make time for a journey.
    kn: ಪ್ರಯಾಣ ಮಾಡಲು ಸಮಯ ಮೀಸಲಿಡಬಹುದು.
    hi: आप इसके लिए समय निकाल सकते हैं — यात्रा।
  good-travel-2:
    en: Today may suit a journey.
    kn: ಇಂದು ಪ್ರಯಾಣ ಮಾಡಲು ಅನುಕೂಲವಾಗಬಹುದು.
    hi: आज इसके लिए जगह बन सकती है — यात्रा।
  good-travel-3:
    en: You may feel ready for a journey.
    kn: ಪ್ರಯಾಣ ಮಾಡಲು ಸಿದ್ಧತೆ ಅನಿಸಬಹುದು.
    hi: आज आप इस ओर कदम बढ़ा सकते हैं — यात्रा।
  easy-travel-1:
    en: You can leave extra time for a journey.
    kn: ಪ್ರಯಾಣ ಮಾಡಲು ಹೆಚ್ಚುವರಿ ಸಮಯ ಬಿಡಬಹುದು.
    hi: इसके लिए थोड़ा और समय रख सकते हैं — यात्रा।
  easy-travel-2:
    en: You may prefer to postpone a journey.
    kn: ಪ್ರಯಾಣ ಮಾಡಲು ಸ್ವಲ್ಪ ಕಾಯಬಹುದು.
    hi: इसे कुछ देर टाल सकते हैं — यात्रा।
  easy-travel-3:
    en: You can keep plans flexible for a journey.
    kn: ಪ್ರಯಾಣ ಮಾಡುವ ಯೋಜನೆಯಲ್ಲಿ ಬದಲಾವಣೆಗೆ ಅವಕಾಶ ಬಿಡಬಹುದು.
    hi: इसके लिए योजना लचीली रख सकते हैं — यात्रा।
  good-starting-work-1:
    en: You can make time for a new task.
    kn: ಹೊಸ ಕೆಲಸ ಮಾಡಲು ಸಮಯ ಮೀಸಲಿಡಬಹುದು.
    hi: आप इसके लिए समय निकाल सकते हैं — नया काम।

version: 1
approval: draft
profile: parashari-synthesis-v1
order:
- promise
- period
- transit
- window
- card
scope: Bind one chart, area recipe and interval. Resolve the area in life-areas/recipes.yaml, including its release
  flags and sensitivity settings. Apply matched bhanga and softening to the bound graha before counting any factor.
availability: shared/confidence/output-matrix.yaml
promise:
  tradition: CLASSICAL Parashari lordship, occupants, aspects, karakas and divisional confirmation.
  arithmetic: MODERN/POPULAR Bhava360 bands, counted without rescaling for absent evidence.
  house_priority: The first recipe house supplies the primary house, its lord and direct testimony. Start with the lord's
    grade. Compare the qualifying factor band to that grade and combine its direction with one net supporting-house
    direction (Strong supports, Moderate is neutral, Weak challenges). A split preserves the starting grade. All
    qualifiers together move at most one step. Withhold when the primary Lagna evidence is missing. Wealth needs
    both resources and gains; a weak or unknown gains lord cannot confirm the highest band.
  difficulty_roles:
    health: {6: resistance}
    career: {6: service and problem-solving}
    business: {6: managing competition}
    travel-relocation: {12: residence away}
    spirituality: {12: retreat}
  difficulty_policy: Read the sixth in health as capacity to meet difficulties only; it cannot establish good health.
    Interpret the eighth as change and shared obligations, the twelfth as outlay, retreat or residence away according
    to context. Without a bound area role, difficult houses supply context only.
  source_note: BPHS bhava chapters and Phaladeepika ch.15 (edition locators pending). The grading arithmetic is editorial.
  factors:
  - - promise-house-lord
    - Area lord Strong or Moderate in the KB-35 grade.
  - - promise-occupants
    - At least one functional Benefic or Yogakaraka and no functionally Malefic occupant with a Weak grade. Empty
      is unscored.
  - - promise-house-aspects
    - Full functional benefic aspects to house and lord outnumber malefic aspects. Count each source and distinct
      target once.
  - - promise-significator
    - Strict majority of the recipe karakas grade Strong or Moderate.
  - - promise-moon-relative
    - Repeat the first three tests in the Moon chart; at least two pass. Functional polarity still requires the actual
      Lagna.
  - - promise-varga-lagna
    - The D9 lord has own/exalted/MT/friendly dignity or vargottama. For career also require the D10 lord in an angle/trine
      or own/exalted sign.
  thresholds:
    Strong: 3
    Moderate: 2
  varga_gate: Require at least Moderate D1 promise before divisional confirmation can contribute.
  missing: Drop withheld or undecidable factors. Never count them as adverse. Weak stops here before searching dates.
period:
  tradition: CLASSICAL Vimshottari dasha phala
  significators: Owners and occupants of the target house, full aspectors of the house or lord, and area karakas.
    Add grahas in the stars of those direct significators once, without transitive expansion.
  ordering:
    antar: 3
    maha: 2
    pratyantar: 1
  states:
    active: Antar signifies area
    background: only Maha signifies area
    not-now: neither signifies area
    delay: Antar signifies only negating houses
transit:
  tradition: MODERN/POPULAR double transit; classical full aspects and Ashtakavarga tables.
  references:
  - transit.double.common_target
  - transit.double.moon_target
  method: At each reference test Jupiter and Saturn independently for occupation or full aspect of the area sign or
    the natal sign of its lord. Keep both reference results; Lagna confirms an event, Moon describes experience. Tier
    C has no event window.
  pace:
    minimum_sav_each: 28
    minimum_own_bav_each: 4
    below: slower
    otherwise: supported
  variant: The older low-bindu grade deduction is inactive. Pace only orders windows.
window:
  tag: MODERN/POPULAR
  horizon_years: 5
  later_limit: 3
  bounds: Intersect query horizon, active Antar, eligible Tier A Pratyantar and continuous double-transit segments
    as half-open intervals. Exclude zero duration.
  ordering: First card uses earliest start. Later windows put supported before slower, then date; use period weights
    only to break otherwise equal choices.
  peaks: In Tier A Mars or Sun occupying either natal target marks the month. The Moon marks days only inside a window
    starting in the next thirty days. Apply KB-48 stability to every displayed date.

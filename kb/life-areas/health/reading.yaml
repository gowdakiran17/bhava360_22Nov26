slots:
  present-situation: Resolve the listed houses, their lords and their placements. Select matched rules for this area in the
    active period. Cite the actual graha and house.
  upcoming-periods: Intersect dated dasha/antardasha intervals with relevant slow-transit windows. Include mixed evidence
    when KP is enabled; display an honest absence when no supported date exists.
  concerns-to-watch: Use only a matched qualifying or softening rule. Include its concrete factor and period.
  what-you-can-do:
    en: You might make room for a restful break.
    kn: ವಿಶ್ರಾಂತಿಗಾಗಿ ಸ್ವಲ್ಪ ಸಮಯ ಮೀಸಲಿಡಬಹುದು.
    hi: आराम के लिए थोड़ा समय निकाल सकते हैं।
omit_if: Missing Lagna removes house-based reasons. Only stable Moon-based or other independent evidence may remain.

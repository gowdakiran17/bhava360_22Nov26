summaries:
  Supportive:
    user_text:
      en: You may find it easier to make time for rest in your daily routine.
      kn: ದಿನಚರಿಯಲ್ಲಿ ವಿಶ್ರಾಂತಿಗೆ ಸಮಯ ಕಲ್ಪಿಸುವುದು ಸುಲಭವಾಗಬಹುದು.
      hi: दिनचर्या में आराम के लिए समय निकालना आसान हो सकता है।
  Steady:
    user_text:
      en: You can notice which parts of your day leave you feeling rested.
      kn: ದಿನದ ಯಾವ ಹೊತ್ತಿನಲ್ಲಿ ನಿಮಗೆ ವಿಶ್ರಾಂತಿ ಸಿಗುತ್ತದೆ ಎಂದು ಗಮನಿಸಬಹುದು.
      hi: आप ध्यान दे सकते हैं कि दिन के किस हिस्से में आपको आराम मिलता है।
  Take care:
    user_text:
      en: You can give yourself a quieter pace and ask for support when you need it.
      kn: ನಿಮಗೆ ತಕ್ಕಂತೆ ನಿಧಾನವಾಗಿ ಸಾಗಬಹುದು ಮತ್ತು ಬೇಕಾದಾಗ ನೆರವು ಕೇಳಬಹುದು.
      hi: आप अपनी गति धीमी रख सकते हैं और ज़रूरत पड़ने पर सहारा माँग सकते हैं।
scope: Everyday wellbeing and routines only. Suppress disease, diagnosis, and lifespan in every public slot. Use the
  doctor line with every tone.
always_append:
  user_text:
    en: "You can see a doctor for anything that worries you."
    kn: "ನಿಮಗೆ ಯಾವುದಾದರೂ ವಿಷಯ ಚಿಂತೆ ಉಂಟುಮಾಡಿದರೆ ವೈದ್ಯರನ್ನು ಸಂಪರ್ಕಿಸಬಹುದು."
    hi: "अगर कोई बात आपको परेशान करे, तो आप डॉक्टर से मिल सकते हैं।"

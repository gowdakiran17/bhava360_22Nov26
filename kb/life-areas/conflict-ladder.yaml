version: 1
approval: draft
profile: parashari-synthesis-v1
policy: Resolve a conflict at the earliest applicable rung. Apply distinct remaining evidence once. Resolve cancellations and softening before the ladder. Unknown has no adverse vote.
rungs:
- {id: promise, effect: Weak stops all event evaluation.}
- {id: active-yoga, effect: Only an uncancelled yoga activated by the Maha or Antar participates; inactive or unproved activation is background.}
- {id: functional, effect: Use the KB-35 chart-specific polarity for lordship; keep natural nature separate.}
- {id: participant-strength, effect: Some Weak participants make the yoga mild; all Weak removes it.}
- {id: navamsa, effect: Strong D1 plus debilitated/enemy D9 and no vargottama steps down. Weak D1 plus own/exalted D9 or vargottama steps up to Moderate at most.}
- {id: references, effect: Agreeing directional Lagna and Moon testimonies raise one step. In disagreement Lagna governs events and Moon experience. Missing testimony cannot confirm.}
- {id: enabled-systems, effect: Combine confirming and contradicting KP/Jaimini votes to at most one net step. No standalone card.}
- {id: tie, effect: Remaining equally primary support and caution yield Moderate with mixed signals.}
flags: {kp: false, jaimini: false, bhava_bala_tiebreak: false}
boundaries: Western and Numerology remain in separate sections and never vote. Western positions are tropical. After rung seven Bhava Bala may order otherwise equal candidates only. KB-48 clamps the final grade after rung eight.

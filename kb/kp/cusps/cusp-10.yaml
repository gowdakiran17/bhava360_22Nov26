rule: For a employment question, resolve Placidus cusp 10 to its sub lord. Use the four ranked house-significator
  levels of that graha. A link to any of houses 2, 6, 10, 11 supplies one piece of topic evidence. Record the
  matched houses and levels. A date requires separate period and transit evidence.

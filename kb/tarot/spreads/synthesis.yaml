approval: draft
tag: EDITORIAL
method:
- Keep draw order. Count Majors and reversals independently over all cards. At least half marks a theme; smaller shares
  add context.
- Find modal minor suit and element independently. Preserve all ties; an all-Major draw has no suit. Repeated pip
  ranks require two distinct cards.
- Bind each adjacent pair in draw order. Use the first applicable emphasized position, then the next for a practical
  reflection. No card supplies a prediction.

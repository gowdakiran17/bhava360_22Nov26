  tarot.major-arcana.death-reversed:
    career:
      en: In your work, you can use difficulty letting go as a prompt when choosing your next task.
      kn: ಮುಂದಿನ ಕೆಲಸವನ್ನು ಆಯ್ಕೆ ಮಾಡುವಾಗ ಈ ಸೂಚನೆ ನೆರವಾಗಬಹುದು. ಬಿಡುವುದು ಕಷ್ಟವೆನಿಸಿದರೆ, ನೀವು ಸಿದ್ಧರಿರುವ ಒಂದು ಸಣ್ಣ ವಿಷಯದಿಂದ
        ಆರಂಭಿಸಬಹುದು.
      hi: काम की योजना बनाते समय यदि छोड़ना कठिन लगे, तो आप किसी एक छोटी चीज़ से शुरुआत कर सकते हैं जिसे छोड़ने के
        लिए आप तैयार हैं।
    relationship:
      en: In a relationship, you can explore what difficulty letting go brings to a conversation.
      kn: ಬಿಡುವುದು ಕಷ್ಟವೆನಿಸಿದರೆ, ನೀವು ಸಿದ್ಧರಿರುವ ಒಂದು ಸಣ್ಣ ವಿಷಯದಿಂದ ಆರಂಭಿಸಬಹುದು.

traditions_differ:
- profile: modern-study-v1
  note: 'Expert comparison with the earlier KB: Jupiter: the edition''s chart (page 50), the sign table (page 185) and
    the house 11 example (page 254) all make house 11 a Jupiter pakka house. The KB list has Jupiter 2, 5, 9, 12 and
    omits 11. Mercury: the text (pages 113, 185, 652) also counts house 6 as jointly held by Mercury with Ketu, though
    the chart shows Ketu alone; KB lists Mercury 7 only (minor). The English master chart (page 106) also gives Jupiter
    as the fixed-house lord of 11 and lists Mercury with Ketu in the effect columns for 6. All other entries agree: Sun
    1, Moon 4, Mars 3 and 8, Venus 7, Saturn 8 and 10, Rahu 12 (Jupiter shares 12 per page 51), Ketu 6.'
edition_note: Use the chart and table for fixed houses. The worked example on Hindi PDF page 65 uses this term for sign
  ownership.
gaps:
- 'Exaltation and debilitation by fixed house: Hindi PDF 78 and English PDF 106. Table reserved for later review.'

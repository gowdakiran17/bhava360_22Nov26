id: glossary.terms.vimshopaka
term:
  en: Vimshopaka
  kn: ವಿಂಶೋಪಕ
  hi: विंशोपक
sanskrit:
  devanagari: विंशोपक
  kannada: ವಿಂಶೋಪಕ
  usage: traditional term
meaning:
  en: A method that combines chart weights on a twenty-part scale.
  kn: ವಿವಿಧ ನಕ್ಷೆಗಳ ತೂಕಗಳನ್ನು ಇಪ್ಪತ್ತು ಘಟಕದ ಪ್ರಮಾಣದಲ್ಲಿ ಸೇರಿಸುವ ವಿಧಾನ.
  hi: अलग पत्रियों के भार बीस इकाइयों के पैमाने पर जोड़ने की विधि।
admin_note: Use this label for a method that combines chart weights on a twenty-part scale. Read the linked entries for
  the applicable conditions and differences between methods.

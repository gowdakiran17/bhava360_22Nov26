id: glossary.terms.nakshatra
term:
  en: Nakshatra
  kn: ನಕ್ಷತ್ರ
  hi: नक्षत्र
sanskrit:
  devanagari: नक्षत्र
  kannada: ನಕ್ಷತ್ರ
  usage: traditional term
meaning:
  en: One of the sky’s 27 equal sections used to track the Moon.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸಲು ಬಳಸುವ ಆಕಾಶದ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ ಒಂದು.
  hi: चंद्रमा की स्थिति बताने के लिए आकाश के २७ बराबर हिस्सों में से एक।
admin_note: 'Application in vedic.panchang.nakshatra: Use 1 + floor((sidereal Moon modulo a turn) / 48000 arcseconds).
  Resolve that numbered KB-03 catalog row and its rule ID. Solve start and end on the Moon’s unwrapped longitude.'
aliases:
- lunar mansion
- birth star
- Nakshatras

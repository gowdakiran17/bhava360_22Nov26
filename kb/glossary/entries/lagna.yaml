id: glossary.terms.lagna
term:
  en: Lagna
  kn: ಲಗ್ನ
  hi: लग्न
sanskrit:
  devanagari: लग्न
  kannada: ಲಗ್ನ
  usage: traditional term
meaning:
  en: The sign or exact point rising in the east at a particular time and place.
  kn: ಒಂದು ಸ್ಥಳದಲ್ಲಿ ಆ ಕ್ಷಣಕ್ಕೆ ಪೂರ್ವದಲ್ಲಿ ಉದಯಿಸುವ ರಾಶಿ ಅಥವಾ ನಿಖರ ಬಿಂದು.
  hi: किसी स्थान और समय पर पूर्व में उगता हुआ चिह्न या सटीक बिंदु।
admin_note: 'Application in western.natal.ascendant: Present the tropical ascendant sign only with a reliable birth time.'
aliases:
- Ascendant
- Rising sign
- Asc
reference_rules: []

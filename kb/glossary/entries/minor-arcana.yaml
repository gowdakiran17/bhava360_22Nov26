id: glossary.terms.minor-arcana
term:
  en: Minor Arcana
  kn: ಗೌಣಪತ್ರಾಣಿ
  hi: गौणपत्राणि
sanskrit:
  devanagari: गौणपत्राणि
  kannada: ಗೌಣಪತ್ರಾಣಿ
  usage: descriptive equivalent
meaning:
  en: The fifty-six cards divided into four suits in the tarot deck.
  kn: ಟ್ಯಾರೊದಲ್ಲಿ ನಾಲ್ಕು ಗುಂಪುಗಳಲ್ಲಿರುವ ಐವತ್ತಾರು ಪತ್ರಗಳು.
  hi: टैरो में चार समूहों के छप्पन पत्ते।
admin_note: Use this label for the fifty-six cards divided into four suits in the tarot deck. Read the linked entries
  for the applicable conditions and differences between methods.

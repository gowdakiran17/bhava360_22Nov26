id: glossary.terms.muhurta
term:
  en: Muhurta
  kn: ಮುಹೂರ್ತ
  hi: मुहूर्त
sanskrit:
  devanagari: मुहूर्त
  kannada: ಮುಹೂರ್ತ
  usage: traditional term
meaning:
  en: A traditional time interval, also used to mean choosing a time to begin something.
  kn: ಸಮಯದ ಸಾಂಪ್ರದಾಯಿಕ ಅಳತೆ ಮತ್ತು ಒಂದು ಕೆಲಸವನ್ನು ಆರಂಭಿಸುವ ಹೊತ್ತಿನ ಆಯ್ಕೆ.
  hi: समय की एक पारंपरिक इकाई और काम शुरू करने का समय चुनने की विधि।
admin_note: Use this label for a traditional time interval, also used to mean choosing a time to begin something. Read
  the linked entries for the applicable conditions and differences between methods.
aliases:
- Muhurtha
- Muhurat
- Muhurtas

id: glossary.terms.ten-of-pentacles-tarot
term:
  en: Ten Of Pentacles (Tarot)
  kn: ನಾಣ್ಯ · ಹತ್ತು
  hi: मुद्रा · दस
sanskrit:
  devanagari: मुद्रा दश
  kannada: ಮುದ್ರಾ ದಶ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank ten in the pentacles family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ನಾಣ್ಯ · ಹತ್ತು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में मुद्रा · दस की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on shared foundations.
  What comes to mind in this position?'
aliases:
- Ten Of Pentacles
reference_rules:
- tarot.minor-arcana.ten-of-pentacles-upright
- tarot.minor-arcana.ten-of-pentacles-reversed
used_by:

id: glossary.terms.sun
term:
  en: Sun
  kn: ಸೂರ್ಯ
  hi: सूर्य
sanskrit:
  devanagari: सूर्य
  kannada: ಸೂರ್ಯ
  usage: traditional term
meaning:
  en: The star at the centre of our solar system.
  kn: ಸೌರವ್ಯೂಹದ ಕೇಂದ್ರದ ನಕ್ಷತ್ರ.
  hi: सौरमंडल के केंद्र का तारा।
admin_note: 'Application in western.planets.sun: The selected tropical natal body is sun. Read its sign as a style and
  its house as an area of experience.'

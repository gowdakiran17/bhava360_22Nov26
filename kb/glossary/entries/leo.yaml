id: glossary.terms.leo
term:
  en: Leo
  kn: ಸಿಂಹ
  hi: सिंह
sanskrit:
  devanagari: सिंह
  kannada: ಸಿಂಹ
  usage: traditional term
meaning:
  en: Sign number 5 in the twelve-part circle, covering degrees 120 to 150.
  kn: ರಾಶಿಚಕ್ರದ 5ನೇ ಭಾಗ, 120ರಿಂದ 150 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 5, 120 से 150 अंश तक।
admin_note: 'Application in western.signs.leo: The selected tropical point falls in [120, 150) degrees from the March
  equinox. Fixed fire; modern ruler sun, traditional ruler sun.'
aliases:
- Simha

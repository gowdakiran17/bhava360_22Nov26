id: glossary.terms.whole-sign
term:
  en: Whole sign
  kn: ಪೂರ್ಣರಾಶಿಭಾವ
  hi: पूर्णराशिभाव
sanskrit:
  devanagari: पूर्णराशिभाव
  kannada: ಪೂರ್ಣರಾಶಿಭಾವ
  usage: traditional term
meaning:
  en: A way to divide a chart in which one complete sign fills each house.
  kn: ಒಂದು ಪೂರ್ಣ ರಾಶಿಯನ್ನೇ ಒಂದು ಮನೆಯಾಗಿ ಪರಿಗಣಿಸುವ ವಿಧಾನ.
  hi: एक पूरी राशि को एक घर मानने की विधि।
admin_note: Use this label for a way to divide a chart in which one complete sign fills each house. Read the linked entries
  for the applicable conditions and differences between methods.
aliases:
- whole-sign houses
reference_rules: []

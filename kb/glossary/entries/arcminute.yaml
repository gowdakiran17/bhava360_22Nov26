id: glossary.terms.arcminute
term:
  en: Arcminute
  kn: ಕೋನ ನಿಮಿಷ
  hi: कोण मिनट
sanskrit:
  devanagari: कलामान
  kannada: ಕಲಾಮಾನ
  usage: descriptive equivalent
meaning:
  en: One sixtieth of a degree of angle.
  kn: ಒಂದು ಅಂಶದ ಅರವತ್ತನೇ ಭಾಗ.
  hi: कोण के एक अंश का साठवाँ भाग।
admin_note: Use this label for one sixtieth of a degree of angle. Read the linked entries for the applicable conditions
  and differences between methods.

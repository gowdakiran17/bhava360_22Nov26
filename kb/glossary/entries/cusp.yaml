id: glossary.terms.cusp
term:
  en: Cusp
  kn: ಭಾವಾರಮ್ಭ
  hi: भावारम्भ
sanskrit:
  devanagari: भावारम्भ
  kannada: ಭಾವಾರಮ್ಭ
  usage: traditional term
meaning:
  en: A calculated point that marks a house in the chosen way of drawing the chart.
  kn: ಆಯ್ದ ವಿಧಾನದಲ್ಲಿ ಮನೆಯ ಸ್ಥಾನ ಸೂಚಿಸುವ ಲೆಕ್ಕಿಸಿದ ಬಿಂದು.
  hi: चुनी हुई विधि में घर को दर्शाने वाला गणित से निकला बिंदु।
admin_note: Use this label for a calculated point that marks a house in the chosen way of drawing the chart. Read the
  linked entries for the applicable conditions and differences between methods.

id: glossary.terms.shobhana-calendar-yoga
term:
  en: Shobhana (calendar yoga)
  kn: ಶೋಭನ
  hi: शोभन
sanskrit:
  devanagari: शोभन
  kannada: ಶೋಭನ
  usage: traditional term
meaning:
  en: Interval 5 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 5ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 5।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Shobhana

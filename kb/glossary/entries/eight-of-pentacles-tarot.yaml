id: glossary.terms.eight-of-pentacles-tarot
term:
  en: Eight Of Pentacles (Tarot)
  kn: ನಾಣ್ಯ · ಎಂಟು
  hi: मुद्रा · आठ
sanskrit:
  devanagari: मुद्रा अष्ट
  kannada: ಮುದ್ರಾ ಅಷ್ಟ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank eight in the pentacles family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ನಾಣ್ಯ · ಎಂಟು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में मुद्रा · आठ की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on practising
  a skill. What comes to mind in this position?'
aliases:
- Eight Of Pentacles
reference_rules:
- tarot.minor-arcana.eight-of-pentacles-upright
- tarot.minor-arcana.eight-of-pentacles-reversed
used_by:

id: glossary.terms.sidereal-zodiac
term:
  en: Sidereal zodiac
  kn: ನಿರಯಣರಾಶಿಚಕ್ರ
  hi: निरयणराशिचक्र
sanskrit:
  devanagari: निरयणराशिचक्र
  kannada: ನಿರಯಣರಾಶಿಚಕ್ರ
  usage: traditional term
meaning:
  en: A way of marking sky positions with a starting point tied to stars.
  kn: ನಕ್ಷತ್ರಗಳನ್ನು ಆಧರಿಸಿ ಆಕಾಶದ ಸ್ಥಾನಗಳನ್ನು ಗುರುತಿಸುವ ವಿಧಾನ.
  hi: तारों से जुड़ी शुरुआत लेकर आकाश में जगह बताने की विधि।
admin_note: Use this label for a way of marking sky positions with a starting point tied to stars. Read the linked entries
  for the applicable conditions and differences between methods.
aliases:
- sidereal
reference_rules: []

id: glossary.terms.bhringaraja
term:
  en: Bhringaraja
  kn: ಭೃಙ್ಗರಾಜ
  hi: भृङ्गराज
sanskrit:
  devanagari: भृङ्गराज
  kannada: ಭೃಙ್ಗರಾಜ
  usage: traditional term
meaning:
  en: The traditional name for entrance position S7 in the building plan.
  kn: ಕಟ್ಟಡದ ನಕ್ಷೆಯಲ್ಲಿ S7 ಪ್ರವೇಶ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು.
  hi: भवन के नक्शे में प्रवेश की जगह S7 का पारंपरिक नाम।
admin_note: This name identifies the symbolic attribution in the cited KB table. The entrance grid places it at S7.

id: glossary.terms.cancer
term:
  en: Cancer
  kn: ಕರ್ಕಾಟಕ
  hi: कर्क
sanskrit:
  devanagari: कर्क
  kannada: ಕರ್ಕ
  usage: traditional term
meaning:
  en: Sign number 4 in the twelve-part circle, covering degrees 90 to 120.
  kn: ರಾಶಿಚಕ್ರದ 4ನೇ ಭಾಗ, 90ರಿಂದ 120 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 4, 90 से 120 अंश तक।
admin_note: 'Application in western.signs.cancer: The selected tropical point falls in [90, 120) degrees from the March
  equinox. Cardinal water; modern ruler moon, traditional ruler moon.'
aliases:
- Karka
- Karkataka

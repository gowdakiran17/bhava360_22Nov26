id: glossary.terms.shadbala
term:
  en: Shadbala
  kn: ಷಡ್ಬಲ
  hi: षड्बल
sanskrit:
  devanagari: षड्बल
  kannada: ಷಡ್ಬಲ
  usage: traditional term
meaning:
  en: A way of weighing six kinds of support for a planet in a chart.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಗ್ರಹಕ್ಕೆ ಸಿಗುವ ಆರು ಬಗೆಯ ಬಲವನ್ನು ಅಳೆಯುವ ವಿಧಾನ.
  hi: जन्मपत्री में किसी ग्रह को मिलने वाले छह तरह के बल की गणना।
admin_note: Use this label for a way of weighing six kinds of support for a planet in a chart. Read the linked entries
  for the applicable conditions and differences between methods.
aliases:
- Shad bala
- sixfold planetary strength

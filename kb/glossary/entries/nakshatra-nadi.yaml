meaning:
  en: A birth-star classification used in some traditions, with the specific method chosen before comparison.
  kn: ಹೋಲಿಕೆಗೆ ಮೊದಲು ವಿಧಾನ ಆಯ್ದು ಬಳಸುವ ಜನ್ಮನಕ್ಷತ್ರಗಳ ವರ್ಗೀಕರಣ.
  hi: तुलना से पहले विधि चुनकर इस्तेमाल किया जाने वाला जन्म तारों का वर्गीकरण।
admin_note: Private course method under review. The module and its glossary label are held. The Nadi factor in the

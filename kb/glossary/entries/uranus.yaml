id: glossary.terms.uranus
term:
  en: Uranus
  kn: ಯುರೇನಸ್
  hi: यूरेनस
sanskrit:
  devanagari: यूरेनस
  kannada: ಯೂರೇನಸ
  usage: modern name in transliteration
meaning:
  en: The planet numbered 7 outward from the Sun.
  kn: ಸೂರ್ಯನಿಂದ 7ನೇ ಗ್ರಹ.
  hi: सूर्य से 7वाँ ग्रह।
admin_note: 'Application in western.planets.uranus: Use the cohort meaning when the selected natal placement is Uranus.
  Add the personal reading only with a chart-specific contact.'

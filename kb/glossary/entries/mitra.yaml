id: glossary.terms.mitra
term:
  en: Mitra
  kn: ಮಿತ್ರ
  hi: मित्र
sanskrit:
  devanagari: मित्र
  kannada: ಮಿತ್ರ
  usage: traditional term
meaning:
  en: Mitra is a traditional figure associated with Anuradha.
  kn: 'ಚಂದ್ರನ ವಿಭಾಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು: ಅನುರಾಧಾ.'
  hi: 'चंद्र पथ के इस हिस्से से जुड़ा पारंपरिक नाम: अनुराधा।'
admin_note: This name identifies the symbolic attribution in the cited KB table. Read the linked star entries for the
  source and any competing assignment. Select the star using its measured span.
aliases: []
reference_rules:

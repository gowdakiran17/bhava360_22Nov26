id: glossary.terms.thumb-short-finger-proportion
term:
  en: Thumb Short finger proportion
  kn: ಅಂಗೈ ಪಕ್ಕದಲ್ಲಿ ಚಿಕ್ಕದಾಗಿ ಕಾಣುವ ಹೆಬ್ಬೆರಳು
  hi: हथेली के अनुपात में छोटा दिखता अँगूठा
sanskrit:
  devanagari: ह्रस्वाङ्गुष्ठ अङ्गुलिप्रमाण
  kannada: ಹ್ರಸ್ವಾಙ್ಗುಷ್ಠ ಅಙ್ಗುಲಿಪ್ರಮಾಣ
  usage: descriptive equivalent
meaning:
  en: Thumb looks short alongside the palm.
  kn: ಅಂಗೈ ಪಕ್ಕದಲ್ಲಿ ಚಿಕ್ಕದಾಗಿ ಕಾಣುವ ಹೆಬ್ಬೆರಳು.
  hi: हथेली के अनुपात में छोटा दिखता अँगूठा।
admin_note: Use the illustration for the selected physical hand. The reader reports their own choice. The linked entries
  distinguish left and right.

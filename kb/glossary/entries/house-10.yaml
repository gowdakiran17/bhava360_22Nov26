id: glossary.terms.house-10
term:
  en: House 10
  kn: ಕರ್ಮಭಾವ
  hi: कर्मभाव
sanskrit:
  devanagari: कर्मभाव
  kannada: ಕರ್ಮಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore work and public responsibilities.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ವೃತ್ತಿ ಮತ್ತು ಸಾರ್ವಜನಿಕ ಜವಾಬ್ದಾರಿ ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में काम और सार्वजनिक जिम्मेदारी से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists livelihood, public responsibilities,
  authority among its subjects.
aliases:
- Karma

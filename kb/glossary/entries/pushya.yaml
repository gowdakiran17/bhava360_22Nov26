id: glossary.terms.pushya
term:
  en: Pushya
  kn: ಪುಷ್ಯ
  hi: पुष्य
sanskrit:
  devanagari: पुष्य
  kannada: ಪುಷ್ಯ
  usage: traditional term
meaning:
  en: Section 8 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 8ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 8।
admin_note: 'Application in vedic.nakshatras.pushya: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

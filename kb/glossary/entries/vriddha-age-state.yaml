id: glossary.terms.vriddha-age-state
term:
  en: Vriddha (age state)
  kn: ವೃದ್ಧ
  hi: वृद्ध
sanskrit:
  devanagari: वृद्ध
  kannada: ವೃದ್ಧ
  usage: traditional term
meaning:
  en: A symbolic stage described as less active when a planet falls in the corresponding part of a sign.
  kn: 'ರಾಶಿಯಲ್ಲಿನ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಕೇತಿಕ ಹಂತ: ಕಡಿಮೆ ಚಟುವಟಿಕೆ.'
  hi: 'राशि में जगह से तय प्रतीकात्मक अवस्था: कम सक्रियता।'
admin_note: 'Application in vedic.states.baladi: Divide the graha’s natal sign into five successive six-degree intervals.
  Read the odd-sign order from Aries onward by sign parity and reverse the order in even signs. Normalize 30 degrees
  to the next sign before lookup.'
aliases:
- Vriddha
reference_rules:
- vedic.states.baladi
used_by:
- vedic.states.baladi
systems:
- vedic

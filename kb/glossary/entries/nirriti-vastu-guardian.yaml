id: glossary.terms.nirriti-vastu-guardian
term:
  en: Nirriti (Vastu guardian)
  kn: ನಿರ್ಋತಿ ದಿಕ್ಪಾಲ
  hi: निर्ऋति दिक्पाल
sanskrit:
  devanagari: निर्ऋति दिक्पाल
  kannada: ನಿರ್ಋತಿ ದಿಕ್ಪಾಲ
  usage: traditional term
meaning:
  en: The traditional guardian associated with the southwest part of a building plan.
  kn: ಮನೆಯ ನಕ್ಷೆಯ ನೈಋತ್ಯ ಭಾಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ಪಾಲಕ.
  hi: घर के नक्शे के दक्षिणपश्चिम भाग से जुड़े पारंपरिक रक्षक।
admin_note: 'Application in vastu.directions.southwest: The southwest is associated with Nirriti and rahu.'
aliases:
- Nirriti
reference_rules:
- vastu.directions.southwest
used_by:
- vastu.directions.southwest
systems:
- vastu

id: glossary.terms.shukla-calendar-yoga
term:
  en: Shukla (calendar yoga)
  kn: ಶುಕ್ಲ
  hi: शुक्ल
sanskrit:
  devanagari: शुक्ल
  kannada: ಶುಕ್ಲ
  usage: traditional term
meaning:
  en: Interval 24 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 24ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 24।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Shukla
reference_rules:
- vedic.panchang.yoga
used_by:
- vedic.panchang.ugadi
- vedic.panchang.yoga
systems:
- vedic

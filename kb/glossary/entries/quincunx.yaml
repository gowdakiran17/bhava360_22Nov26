id: glossary.terms.quincunx
term:
  en: Quincunx
  kn: ಪಞ್ಚಭಾವಾನ್ತರಕೋಣ
  hi: पञ्चभावान्तरकोण
sanskrit:
  devanagari: पञ्चभावान्तरकोण
  kannada: ಪಞ್ಚಭಾವಾನ್ತರಕೋಣ
  usage: descriptive equivalent
meaning:
  en: Two positions about 150 degrees apart around the sky.
  kn: ಆಕಾಶವೃತ್ತದಲ್ಲಿ ಸುಮಾರು 150 ಅಂಶ ದೂರವಿರುವ ಎರಡು ಸ್ಥಾನಗಳು.
  hi: आकाश के चक्र में लगभग 150 अंश दूर दो स्थान।
admin_note: 'Application in western.aspects.quincunx: For a bound natal pair, accept shortest circular separation within
  2 degrees of 150 degrees, inclusive.'
aliases: []

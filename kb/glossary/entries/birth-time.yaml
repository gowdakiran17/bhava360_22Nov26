id: glossary.terms.birth-time
term:
  en: Birth time
  kn: ಜನನ ಸಮಯ
  hi: जन्म समय
sanskrit:
  devanagari: जन्मकाल
  kannada: ಜನ್ಮಕಾಲ
  usage: descriptive equivalent
meaning:
  en: The recorded local date and clock time of birth used to calculate a chart.
  kn: ನಕ್ಷೆ ಲೆಕ್ಕಿಸಲು ಬಳಸುವ ಸ್ಥಳೀಯ ಜನನದ ದಿನಾಂಕ ಮತ್ತು ಸಮಯ.
  hi: पत्री निकालने के लिए जन्म की स्थानीय तारीख और समय।
admin_note: Use this label for the recorded local date and clock time of birth used to calculate a chart. Read the linked
  entries for the applicable conditions and differences between methods.
aliases: []
reference_rules: []

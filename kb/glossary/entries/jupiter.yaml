id: glossary.terms.jupiter
term:
  en: Jupiter
  kn: ಗುರು
  hi: गुरु
sanskrit:
  devanagari: बृहस्पति
  kannada: ಬೃಹಸ್ಪತಿ
  usage: traditional term
meaning:
  en: The largest planet in our solar system.
  kn: ಸೌರವ್ಯೂಹದ ಅತಿ ದೊಡ್ಡ ಗ್ರಹ.
  hi: सौरमंडल का सबसे बड़ा ग्रह।
admin_note: 'Application in western.planets.jupiter: The selected tropical natal body is jupiter. Read its sign as a
  style and its house as an area of experience.'

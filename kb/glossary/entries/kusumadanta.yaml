id: glossary.terms.kusumadanta
term:
  en: Kusumadanta
  kn: ಕುಸುಮದನ್ತ
  hi: कुसुमदन्त
sanskrit:
  devanagari: कुसुमदन्त
  kannada: ಕುಸುಮದನ್ತ
  usage: traditional term
meaning:
  en: The traditional name for entrance position W4 in the building plan.
  kn: ಕಟ್ಟಡದ ನಕ್ಷೆಯಲ್ಲಿ W4 ಪ್ರವೇಶ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು.
  hi: भवन के नक्शे में प्रवेश की जगह W4 का पारंपरिक नाम।
admin_note: This name identifies the symbolic attribution in the cited KB table. The entrance grid places it at W4.

id: glossary.terms.uttara-ashadha
term:
  en: Uttara Ashadha
  kn: ಉತ್ತರಾಷಾಢಾ
  hi: उत्तराषाढा
sanskrit:
  devanagari: उत्तराषाढा
  kannada: ಉತ್ತರಾಷಾಢಾ
  usage: traditional term
meaning:
  en: Section 21 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 21ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 21।
admin_note: 'Application in vedic.nakshatras.uttara-ashadha: Match the stable natal Moon nakshatra when its sidereal
  longitude falls in the recorded half-open span.'
aliases: []

id: glossary.terms.aries
term:
  en: Aries
  kn: ಮೇಷ
  hi: मेष
sanskrit:
  devanagari: मेष
  kannada: ಮೇಷ
  usage: traditional term
meaning:
  en: Sign number 1 in the twelve-part circle, covering degrees 0 to 30.
  kn: ರಾಶಿಚಕ್ರದ 1ನೇ ಭಾಗ, 0ರಿಂದ 30 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 1, 0 से 30 अंश तक।
admin_note: 'Application in western.signs.aries: The selected tropical point falls in [0, 30) degrees from the March
  equinox. Cardinal fire; modern ruler mars, traditional ruler mars.'
aliases:
- Mesha

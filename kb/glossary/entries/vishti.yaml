id: glossary.terms.vishti
term:
  en: Vishti
  kn: ವಿಷ್ಟಿ
  hi: विष्टि
sanskrit:
  devanagari: विष्टि
  kannada: ವಿಷ್ಟಿ
  usage: traditional term
meaning:
  en: A half lunar day named in a repeating seven-part sequence.
  kn: ಏಳು ಹೆಸರುಗಳ ಪುನರಾವರ್ತಿತ ಕ್ರಮದ ಒಂದು ಅರ್ಧ ತಿಥಿ.
  hi: सात नामों के दोहराते क्रम का एक आधा चंद्र दिन।
admin_note: 'Application in vedic.panchang.vishti: The requested activity window overlaps the computed Vishti karana
  interval.'
aliases:
- Bhadra karana
- Karana Bhadra
- ಭದ್ರಾ ಕರಣ
- भद्रा करण
reference_rules:

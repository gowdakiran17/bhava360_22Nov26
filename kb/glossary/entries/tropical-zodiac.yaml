id: glossary.terms.tropical-zodiac
term:
  en: Tropical zodiac
  kn: ಋತು ಆಧಾರಿತ ರಾಶಿಚಕ್ರ
  hi: ऋतु आधारित राशि चक्र
sanskrit:
  devanagari: सायनराशिचक्र
  kannada: ಸಾಯನರಾಶಿಚಕ್ರ
  usage: descriptive equivalent
meaning:
  en: A way of marking sky positions from the March equinox.
  kn: ಮಾರ್ಚ್ ತಿಂಗಳ ಹಗಲು ರಾತ್ರಿಯ ಸಮದಿನದಿಂದ ಆರಂಭಿಸುವ ರಾಶಿಚಕ್ರ.
  hi: मार्च में दिन और रात बराबर होने के बिंदु से शुरू होने वाला राशि चक्र।
admin_note: Use this label for a way of marking sky positions from the March equinox. Read the linked entries for the
  applicable conditions and differences between methods.
aliases:
- tropical
reference_rules: []

id: glossary.terms.pentacles
term:
  en: Pentacles
  kn: ಮುದ್ರಾಃ
  hi: मुद्राः
sanskrit:
  devanagari: मुद्राः
  kannada: ಮುದ್ರಾಃ
  usage: descriptive equivalent
meaning:
  en: The tarot suit pictured with marked discs, often used to explore practical matters.
  kn: ಪ್ರಾಯೋಗಿಕ ವಿಷಯಗಳನ್ನು ಪರಿಶೀಲಿಸಲು ಬಳಸುವ ಚಕ್ರ ಗುರುತಿನ ಪತ್ರಗಳ ಗುಂಪು.
  hi: व्यावहारिक विषयों पर विचार करने वाला चक्र चिह्न का पत्ता समूह।
admin_note: Use this label for the tarot suit pictured with marked discs, often used to explore practical matters. Read
  the linked entries for the applicable conditions and differences between methods.

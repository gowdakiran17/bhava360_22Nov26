id: glossary.terms.neecha-bhanga-raja-yoga
term:
  en: Neecha bhanga raja yoga
  kn: ನೀಚಭಙ್ಗರಾಜಯೋಗ
  hi: नीचभङ्गराजयोग
sanskrit:
  devanagari: नीचभङ्गराजयोग
  kannada: ನೀಚಭಙ್ಗರಾಜಯೋಗ
  usage: traditional term
meaning:
  en: A planet may be less at ease in its sign. Other chart factors can shape how its connection to responsibility is read.
  kn: ಗ್ರಹಕ್ಕೆ ಒಂದು ರಾಶಿಯಲ್ಲಿ ಸಹಜತೆ ಕಡಿಮೆ ಇರಬಹುದು. ಜವಾಬ್ದಾರಿಯೊಂದಿಗೆ ಅದರ ಸಂಬಂಧವನ್ನು ಓದುವಾಗ ನಕ್ಷೆಯ ಇತರ ಅಂಶಗಳನ್ನೂ ಪರಿಗಣಿಸಬಹುದು.
  hi: किसी राशि में ग्रह कम सहज माना जा सकता है। ज़िम्मेदारी से उसके संबंध को समझने में कुंडली के दूसरे संकेत भी मदद कर सकते हैं।
admin_note: 'Application in vedic.yogas.neecha-bhanga-raja: For the same debilitated classical graha, match any listed
  relief branch: The dispositor occupies a kendra from Lagna or Moon. The ruler of the selected graha’s exaltation sign
  occupies a kendra from Lagna or Moon. The distinct rulers of the debilitation and exaltation signs occupy mutual kendras.
  The dispositor casts a full graha aspect on the selected debilitated graha. Under the alternate reading of tunganatha,
  a classical planet exalted in the occupied sign is angular from Lagna or Moon. The selected graha is debilitated in
  D1 but occupies its exaltation sign in D9. The ruler of the selected graha’s D9 sign occupies a D1 angle or trine and
  either Lagna is movable or the Lagna lord occupies a movable navamsha. Also require the recovered graha in a D1 kendra
  from Lagna.'

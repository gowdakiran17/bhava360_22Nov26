id: glossary.terms.pythagorean
term:
  en: Pythagorean
  kn: ಪೈಥಾಗೋರಿಯನ್
  hi: पाइथागोरियन
sanskrit:
  devanagari: नवाङ्कपद्धति
  kannada: ನವಾಙ್ಕಪದ್ಧತಿ
  usage: descriptive equivalent
meaning:
  en: A name-reading system that cycles the letters through values from one to nine.
  kn: ಅಕ್ಷರಗಳಿಗೆ ಒಂದರಿಂದ ಒಂಬತ್ತರವರೆಗೆ ಮೌಲ್ಯಗಳನ್ನು ಪುನರಾವರ್ತಿಸಿ ನೀಡುವ ವಿಧಾನ.
  hi: अक्षरों को एक से नौ तक बार-बार मान देने की पद्धति।
admin_note: Use this label for a name-reading system that cycles the letters through values from one to nine. Read the
  linked entries for the applicable conditions and differences between methods.

id: glossary.terms.venus
term:
  en: Venus
  kn: ಶುಕ್ರ
  hi: शुक्र
sanskrit:
  devanagari: शुक्र
  kannada: ಶುಕ್ರ
  usage: traditional term
meaning:
  en: The second planet from the Sun.
  kn: ಸೂರ್ಯನಿಂದ ಎರಡನೇ ಗ್ರಹ.
  hi: सूर्य से दूसरा ग्रह।
admin_note: 'Application in western.planets.venus: The selected tropical natal body is venus. Read its sign as a style
  and its house as an area of experience.'

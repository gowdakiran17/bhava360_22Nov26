id: glossary.terms.graha
term:
  en: Graha
  kn: ಗ್ರಹ
  hi: ग्रह
sanskrit:
  devanagari: ग्रह
  kannada: ಗ್ರಹ
  usage: traditional term
meaning:
  en: A planet, light or crossing point used to read an Indian birth chart.
  kn: ಭಾರತೀಯ ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಪರಿಗಣಿಸುವ ಗ್ರಹ, ಸೂರ್ಯ, ಚಂದ್ರ ಅಥವಾ ಪಥಗಳ ಛೇದನ ಬಿಂದು.
  hi: भारतीय जन्मपत्री में देखा जाने वाला ग्रह, सूर्य, चंद्रमा या दो पथों का मिलन बिंदु।
admin_note: Use this label for a planet, light or crossing point used to read an Indian birth chart. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- Grahas
reference_rules: []

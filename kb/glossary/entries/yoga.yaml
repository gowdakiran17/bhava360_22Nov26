id: glossary.terms.yoga
term:
  en: Yoga
  kn: ಯೋಗ
  hi: योग
sanskrit:
  devanagari: योग
  kannada: ಯೋಗ
  usage: traditional term
meaning:
  en: A named arrangement in a chart or a calendar measure based on the Sun and Moon together.
  kn: ಜನ್ಮನಕ್ಷೆಯ ಒಂದು ನಿರ್ದಿಷ್ಟ ಜೋಡಣೆ ಅಥವಾ ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರರಿಂದ ಲೆಕ್ಕಿಸುವ ಪಂಚಾಂಗದ ಅಂಶ.
  hi: जन्मपत्री में एक खास मेल या सूर्य और चंद्रमा की स्थिति से निकला पंचांग का एक अंग।
admin_note: Keep chart combinations distinct from the calendar measure calculated from the sum of the Sun’s and Moon’s
  positions.
aliases:
- Yogas
reference_rules: []

id: glossary.terms.house-lord
term:
  en: House lord
  kn: ಭಾವೇಶ
  hi: भावेश
sanskrit:
  devanagari: भावेश
  kannada: ಭಾವೇಶ
  usage: traditional term
meaning:
  en: The planet ruling the sign assigned to a house.
  kn: ಒಂದು ಮನೆಗೆ ಸೇರಿದ ರಾಶಿಯ ಅಧಿಪತಿ ಗ್ರಹ.
  hi: घर से जुड़ी राशि का स्वामी ग्रह।
admin_note: Use this label for the planet ruling the sign assigned to a house. Read the linked entries for the applicable
  conditions and differences between methods.
aliases:
- house ruler
- house lords
reference_rules: []

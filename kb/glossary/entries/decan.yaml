id: glossary.terms.decan
term:
  en: Decan
  kn: ಹತ್ತು ಅಂಶಗಳ ವಿಭಾಗ
  hi: दस अंश का खंड
sanskrit:
  devanagari: दशांशखण्ड
  kannada: ದಶಾಂಶಖಣ್ಡ
  usage: descriptive equivalent
meaning:
  en: A ten-degree part of a sign, used here to associate cards with parts of the sky.
  kn: ಆಕಾಶದ ಒಂದು ರಾಶಿಯ ಹತ್ತು ಅಂಶಗಳ ಭಾಗ.
  hi: राशि का दस अंश का हिस्सा।
admin_note: Use this label for a ten-degree part of a sign, used here to associate cards with parts of the sky. Read
  the linked entries for the applicable conditions and differences between methods.
aliases:
- Decans

id: glossary.terms.neecha-bhanga
term:
  en: Neecha bhanga
  kn: ನೀಚಭಙ್ಗ
  hi: नीचभङ्ग
sanskrit:
  devanagari: नीचभङ्ग
  kannada: ನೀಚಭಙ್ಗ
  usage: traditional term
meaning:
  en: A second chart condition can moderate the traditional reading of a planet in its least supported sign.
  kn: ಗ್ರಹದ ಕಡಿಮೆ ಬೆಂಬಲದ ಸ್ಥಿತಿಯ ಓದನ್ನು ಬದಲಿಸಬಹುದಾದ ಇನ್ನೊಂದು ಜೋಡಣೆ.
  hi: दूसरा मेल जो कम बल वाली स्थिति की व्याख्या बदल सकता है।
admin_note: 'Application in vedic.yogas.neecha-bhanga: For the same debilitated classical graha, match any listed relief
  branch: The dispositor occupies a kendra from Lagna or Moon. The ruler of the selected graha’s exaltation sign occupies
  a kendra from Lagna or Moon. The distinct rulers of the debilitation and exaltation signs occupy mutual kendras. The
  dispositor casts a full graha aspect on the selected debilitated graha. Under the alternate reading of tunganatha,
  a classical planet exalted in the occupied sign is angular from Lagna or Moon. The selected graha is debilitated in
  D1 but occupies its exaltation sign in D9. The ruler of the selected graha’s D9 sign occupies a D1 angle or trine and
  either Lagna is movable or the Lagna lord occupies a movable navamsha.'

id: glossary.terms.nine-of-pentacles-tarot
term:
  en: Nine Of Pentacles (Tarot)
  kn: ನಾಣ್ಯ · ಒಂಬತ್ತು
  hi: मुद्रा · नौ
sanskrit:
  devanagari: मुद्रा नव
  kannada: ಮುದ್ರಾ ನವ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank nine in the pentacles family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ನಾಣ್ಯ · ಒಂಬತ್ತು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में मुद्रा · नौ की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on earned independence.
  What comes to mind in this position?'
aliases:
- Nine Of Pentacles
reference_rules:
- tarot.minor-arcana.nine-of-pentacles-upright
- tarot.minor-arcana.nine-of-pentacles-reversed
used_by:

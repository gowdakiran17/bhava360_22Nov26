id: glossary.terms.aquarius
term:
  en: Aquarius
  kn: ಕುಂಭ
  hi: कुंभ
sanskrit:
  devanagari: कुम्भ
  kannada: ಕುಮ್ಭ
  usage: traditional term
meaning:
  en: Sign number 11 in the twelve-part circle, covering degrees 300 to 330.
  kn: ರಾಶಿಚಕ್ರದ 11ನೇ ಭಾಗ, 300ರಿಂದ 330 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 11, 300 से 330 अंश तक।
admin_note: 'Application in western.signs.aquarius: The selected tropical point falls in [300, 330) degrees from the
  March equinox. Fixed air; modern ruler uranus, traditional ruler saturn.'
aliases:
- Kumbha

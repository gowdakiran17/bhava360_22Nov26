id: glossary.terms.ayu
term:
  en: Ayu
  kn: ಆಯುಸ್
  hi: आयुस्
sanskrit:
  devanagari: आयुस्
  kannada: ಆಯುಸ್
  usage: traditional term
meaning:
  en: A historical term for length of life in classical lists of house meanings.
  kn: ಮನೆಗಳ ಐತಿಹಾಸಿಕ ಅರ್ಥಪಟ್ಟಿಯಲ್ಲಿ ಜೀವನದ ಅವಧಿಗೆ ಬಳಸಿದ ಪದ.
  hi: घरों के अर्थ की ऐतिहासिक सूचियों में जीवन की अवधि के लिए शब्द।
admin_note: Historical terminology in the eighth-house source list. Public health reflections are limited to everyday
  wellbeing.

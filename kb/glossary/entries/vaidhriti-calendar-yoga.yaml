id: glossary.terms.vaidhriti-calendar-yoga
term:
  en: Vaidhriti (calendar yoga)
  kn: ವೈಧೃತಿ
  hi: वैधृति
sanskrit:
  devanagari: वैधृति
  kannada: ವೈಧೃತಿ
  usage: traditional term
meaning:
  en: Interval 27 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 27ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 27।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Vaidhriti

id: glossary.terms.abhijit
term:
  en: Abhijit
  kn: ಅಭಿಜಿತ್
  hi: अभिजित्
sanskrit:
  devanagari: अभिजित्
  kannada: ಅಭಿಜಿತ್
  usage: traditional term
meaning:
  en: An additional star section used in some twenty-eight-part lists.
  kn: ಕೆಲವು ೨೮ ಭಾಗಗಳ ಪಟ್ಟಿಗಳ ಹೆಚ್ಚುವರಿ ನಕ್ಷತ್ರ.
  hi: कुछ अट्ठाईस खंड वाली सूचियों का अतिरिक्त तारा खंड।
admin_note: Use this label for an additional star section used in some twenty-eight-part lists. Read the linked entries
  for the applicable conditions and differences between methods.

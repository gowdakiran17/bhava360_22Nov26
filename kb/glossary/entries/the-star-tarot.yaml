id: glossary.terms.the-star-tarot
term:
  en: The Star (Tarot)
  kn: ತಾರೆ (ಟ್ಯಾರೊ)
  hi: तारा (टैरो)
sanskrit:
  devanagari: तारापत्रम्
  kannada: ತಾರಾಪತ್ರಮ್
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 17, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 17 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 17 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on renewed hope.
  What comes to mind in this position?'
aliases:
- The Star
reference_rules:
- tarot.major-arcana.the-star-upright
- tarot.major-arcana.the-star-reversed
used_by:
- tarot.major-arcana.the-star-reversed
- tarot.major-arcana.the-star-upright
systems:
- tarot

id: glossary.terms.the-magician-tarot
term:
  en: The Magician (Tarot)
  kn: ಮಾಂತ್ರಿಕ (ಟ್ಯಾರೊ)
  hi: जादूगर (टैरो)
sanskrit:
  devanagari: जादूगर
  kannada: ಜಾದೂಗರ
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 1, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 1 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 1 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on using your
  skills. What comes to mind in this position?'
aliases:
- The Magician
reference_rules:
- tarot.major-arcana.the-magician-upright
- tarot.major-arcana.the-magician-reversed
used_by:
- tarot.major-arcana.the-magician-reversed
- tarot.major-arcana.the-magician-upright
systems:
- tarot

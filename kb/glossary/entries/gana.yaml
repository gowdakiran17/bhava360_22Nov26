id: glossary.terms.gana
term:
  en: Gana
  kn: ಗಣ
  hi: गण
sanskrit:
  devanagari: गण
  kannada: ಗಣ
  usage: traditional term
meaning:
  en: One of three traditional birth-star groups compared in matching.
  kn: ಹೊಂದಾಣಿಕೆಯಲ್ಲಿ ಹೋಲಿಸುವ ಜನ್ಮನಕ್ಷತ್ರಗಳ ಮೂರು ಗುಂಪುಗಳಲ್ಲಿ ಒಂದು.
  hi: मिलान में देखे जाने वाले जन्म तारों के तीन समूहों में से एक।
admin_note: 'Application in vedic.matching.gana: Read both natal star classes and look up their ordered temperamental
  grouping. Labels belong to the table only.'

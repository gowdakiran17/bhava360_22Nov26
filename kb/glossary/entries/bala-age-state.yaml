id: glossary.terms.bala-age-state
term:
  en: Bala (age state)
  kn: ಬಾಲ
  hi: बाल
sanskrit:
  devanagari: बाल
  kannada: ಬಾಲ
  usage: traditional term
meaning:
  en: A symbolic stage described as just beginning when a planet falls in the corresponding part of a sign.
  kn: 'ರಾಶಿಯಲ್ಲಿನ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಕೇತಿಕ ಹಂತ: ಆರಂಭ.'
  hi: 'राशि में जगह से तय प्रतीकात्मक अवस्था: शुरुआत।'
admin_note: 'Application in vedic.states.baladi: Divide the graha’s natal sign into five successive six-degree intervals.
  Read the odd-sign order from Aries onward by sign parity and reverse the order in even signs. Normalize 30 degrees
  to the next sign before lookup.'
aliases:
- Bala

id: glossary.terms.rupa
term:
  en: Rupa
  kn: ರೂಪ
  hi: रूप
sanskrit:
  devanagari: रूप
  kannada: ರೂಪ
  usage: traditional term
meaning:
  en: A full unit of planetary strength, equal to sixty smaller units.
  kn: ಗ್ರಹಬಲದ ಅರವತ್ತು ಚಿಕ್ಕ ಘಟಕಗಳಿಗೆ ಸಮವಾದ ಪೂರ್ಣ ಘಟಕ.
  hi: ग्रह बल की पूरी इकाई जिसमें साठ छोटी इकाइयाँ होती हैं।
admin_note: Use this label for a full unit of planetary strength, equal to sixty smaller units. Read the linked entries
  for the applicable conditions and differences between methods.
aliases:
- Rupas

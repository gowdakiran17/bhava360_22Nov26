id: glossary.terms.sarala-yoga
term:
  en: Sarala yoga
  kn: ಸರಲಯೋಗ
  hi: सरलयोग
sanskrit:
  devanagari: सरलयोग
  kannada: ಸರಲಯೋಗ
  usage: traditional term
meaning:
  en: A traditional pattern involving the ruler associated with change and shared resources.
  kn: ಬದಲಾವಣೆ ಮತ್ತು ಹಂಚಿಕೊಂಡ ಸಂಪನ್ಮೂಲಗಳು ಕ್ಷೇತ್ರದ ಅಧಿಪತಿಗೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ವಿನ್ಯಾಸ.
  hi: बदलाव और साझा संसाधन के क्षेत्र के स्वामी से जुड़ा पारंपरिक मेल।
admin_note: Lord of house 8 occupies house 6, 8 or 12 under the broad Vipareeta screen.

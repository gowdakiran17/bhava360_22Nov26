id: glossary.terms.d1
term:
  en: D1
  kn: D1 ಜನ್ಮಪತ್ರಿಕಾ
  hi: D1 जन्मपत्रिका
sanskrit:
  devanagari: जन्मपत्रिका
  kannada: ಜನ್ಮಪತ್ರಿಕಾ
  usage: traditional term
meaning:
  en: The birth chart used to explore life context.
  kn: ಜೀವನದ ಹಿನ್ನೆಲೆ ವಿಷಯವನ್ನು ನೋಡಲು ಬಳಸುವ ನಕ್ಷೆ.
  hi: जीवन का संदर्भ को समझने के लिए देखी जाने वाली पत्री।
admin_note: Keep the natal sign.
aliases:
- The natal chart
- birth chart
- natal chart
reference_rules:
- vedic.vargas.d1-placement

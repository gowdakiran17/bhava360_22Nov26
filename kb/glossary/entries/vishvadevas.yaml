id: glossary.terms.vishvadevas
term:
  en: Vishvadevas
  kn: ವಿಶ್ವೇದೇವಾಃ
  hi: विश्वेदेवाः
sanskrit:
  devanagari: विश्वेदेवाः
  kannada: ವಿಶ್ವೇದೇವಾಃ
  usage: traditional term
meaning:
  en: Vishvadevas is a traditional figure associated with Uttara Ashadha.
  kn: 'ಚಂದ್ರನ ವಿಭಾಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು: ಉತ್ತರಾಷಾಢಾ.'
  hi: 'चंद्र पथ के इस हिस्से से जुड़ा पारंपरिक नाम: उत्तराषाढा।'
admin_note: This name identifies the symbolic attribution in the cited KB table. Read the linked star entries for the
  source and any competing assignment. Select the star using its measured span.
aliases: []
reference_rules:

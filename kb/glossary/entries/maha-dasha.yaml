id: glossary.terms.maha-dasha
term:
  en: Maha dasha
  kn: ಮಹಾದಶಾ
  hi: महादशा
sanskrit:
  devanagari: महादशा
  kannada: ಮಹಾದಶಾ
  usage: traditional term
meaning:
  en: The main period in a sequence of longer and shorter periods.
  kn: ಸಮಯವನ್ನು ವಿಂಗಡಿಸುವ ಕ್ರಮದ ಮುಖ್ಯ ಅವಧಿ.
  hi: समय के क्रम में सबसे बड़ी अवधि।
admin_note: Use this label for the main period in a sequence of longer and shorter periods. Read the linked entries for
  the applicable conditions and differences between methods.
aliases:
- Mahadasha

id: glossary.terms.the-hanged-man-tarot
term:
  en: The Hanged Man (Tarot)
  kn: ತಲೆಕೆಳಗಾದ ವ್ಯಕ್ತಿ (ಟ್ಯಾರೊ)
  hi: लटका हुआ व्यक्ति (टैरो)
sanskrit:
  devanagari: निलम्बितपुरुष
  kannada: ನಿಲಮ್ಬಿತಪುರುಷ
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 12, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 12 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 12 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on a fresh perspective.
  What comes to mind in this position?'
aliases:
- The Hanged Man
reference_rules:
- tarot.major-arcana.the-hanged-man-upright
- tarot.major-arcana.the-hanged-man-reversed
used_by:
- tarot.major-arcana.the-hanged-man-reversed
- tarot.major-arcana.the-hanged-man-upright
systems:
- tarot

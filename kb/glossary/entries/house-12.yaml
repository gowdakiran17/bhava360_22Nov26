id: glossary.terms.house-12
term:
  en: House 12
  kn: ವ್ಯಯಭಾವ
  hi: व्ययभाव
sanskrit:
  devanagari: व्ययभाव
  kannada: ವ್ಯಯಭಾವ
  usage: traditional term
meaning:
  en: A chart theme for reflecting on rest, reflection, expenses and foreign lands.
  kn: ವಿಶ್ರಾಂತಿ, ಚಿಂತನೆ, ವೆಚ್ಚ ಮತ್ತು ವಿದೇಶ ಕುರಿತು ಯೋಚಿಸಲು ಬಳಸುವ ಜಾತಕದ ಭಾಗ.
  hi: विश्राम, चिंतन, व्यय और विदेश पर विचार करने से जुड़ा कुंडली का क्षेत्र।
admin_note: Count from the rising sign under the default whole-sign method. This house lists outgoings, rest, seclusion
  among its subjects.
aliases:
- Vyaya

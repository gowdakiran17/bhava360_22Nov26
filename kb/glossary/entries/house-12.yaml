id: glossary.terms.house-12
term:
  en: House 12
  kn: ವ್ಯಯಭಾವ
  hi: व्ययभाव
sanskrit:
  devanagari: व्ययभाव
  kannada: ವ್ಯಯಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore expenditure.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ವೆಚ್ಚ ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में खर्च से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists outgoings, rest, seclusion
  among its subjects.
aliases:
- Vyaya

id: glossary.terms.four-of-swords-tarot
term:
  en: Four Of Swords (Tarot)
  kn: ಕತ್ತಿ · ನಾಲ್ಕು
  hi: तलवार · चार
sanskrit:
  devanagari: खड्ग चतुर्
  kannada: ಖಡ್ಗ ಚತುರ್
  usage: descriptive rendering of card title
meaning:
  en: The card of rank four in the swords family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಕತ್ತಿ · ನಾಲ್ಕು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में तलवार · चार की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on a restful pause.
  What comes to mind in this position?'
aliases:
- Four Of Swords
reference_rules:
- tarot.minor-arcana.four-of-swords-upright
- tarot.minor-arcana.four-of-swords-reversed
used_by:

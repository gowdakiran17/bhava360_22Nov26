id: glossary.terms.trikona
term:
  en: Trikona
  kn: ತ್ರಿಕೋಣ
  hi: त्रिकोण
sanskrit:
  devanagari: त्रिकोण
  kannada: ತ್ರಿಕೋಣ
  usage: traditional term
meaning:
  en: The first, fifth or ninth place counted from a starting position.
  kn: ಆರಂಭದಿಂದ ಒಂದನೇ, ಐದನೇ ಅಥವಾ ಒಂಬತ್ತನೇ ಸ್ಥಾನ.
  hi: आरंभ से पहला, पाँचवाँ या नौवाँ स्थान।
admin_note: Use this label for the first, fifth or ninth place counted from a starting position. Read the linked entries
  for the applicable conditions and differences between methods.
aliases:
- trinal house

id: glossary.terms.death-tarot
term:
  en: Death (Tarot)
  kn: ಮೃತ್ಯು (ಟ್ಯಾರೊ)
  hi: मृत्यु (टैरो)
sanskrit:
  devanagari: मृत्यु
  kannada: ಮೃತ್ಯು
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 13, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 13 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 13 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You can thank an old routine for what
  it gave you and decide what to carry forward.'
aliases:
- Death
reference_rules:
- tarot.major-arcana.death-upright
- tarot.major-arcana.death-reversed
used_by:
- tarot.major-arcana.death-reversed
- tarot.major-arcana.death-upright
systems:
- tarot

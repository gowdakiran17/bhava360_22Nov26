id: glossary.terms.maraka
term:
  en: Maraka
  kn: ಮಾರಕ
  hi: मारक
sanskrit:
  devanagari: मारक
  kannada: ಮಾರಕ
  usage: traditional term
meaning:
  en: A historical house classification associated especially with the second and seventh places.
  kn: ಮುಖ್ಯವಾಗಿ ಎರಡು ಮತ್ತು ಏಳನೇ ಸ್ಥಾನಗಳಿಗೆ ಬಳಸುವ ಐತಿಹಾಸಿಕ ವರ್ಗ.
  hi: मुख्यतः दूसरे और सातवें स्थान की पारंपरिक श्रेणी।
admin_note: Use this label for a historical house classification associated especially with the second and seventh places.
  Read the linked entries for the applicable conditions and differences between methods.

id: glossary.terms.maraka
term:
  en: Maraka
  kn: ಮಾರಕ
  hi: मारक
sanskrit:
  devanagari: मारक
  kannada: ಮಾರಕ
  usage: traditional term
meaning:
  en: A historical category covering the lords and occupants of the second and seventh houses and planets conjoined
    with those lords.
  kn: ಎರಡು ಮತ್ತು ಏಳನೇ ಭಾವಗಳ ಅಧಿಪತಿಗಳು, ನಿವಾಸಿಗಳು ಮತ್ತು ಆ ಅಧಿಪತಿಗಳೊಂದಿಗೆ ಸೇರಿದ ಗ್ರಹಗಳ ಐತಿಹಾಸಿಕ ವರ್ಗ.
  hi: दूसरे और सातवें भाव के स्वामी, उनमें स्थित ग्रह और उन स्वामियों के साथ स्थित ग्रहों की पारंपरिक श्रेणी।
admin_note: Historical staff terminology only. BPHS chapter 44 and Laghu Parashari; edition-level verification pending.

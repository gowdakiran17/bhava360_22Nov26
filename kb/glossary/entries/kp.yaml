id: glossary.terms.kp
term:
  en: KP
  kn: ಕೃಷ್ಣಮೂರ್ತಿಪದ್ಧತಿ
  hi: कृष्णमूर्तिपद्धति
sanskrit:
  devanagari: कृष्णमूर्तिपद्धति
  kannada: ಕೃಷ್ಣಮೂರ್ತಿಪದ್ಧತಿ
  usage: traditional term
meaning:
  en: An Indian method that associates each chart point with the rulers of successively smaller parts of the sky.
  kn: ಆಕಾಶದ ಚಿಕ್ಕ ವಿಭಾಗಗಳಿಗೆ ನೀಡಿದ ಅಧಿಪತಿಗಳನ್ನು ಬಳಸುವ ಭಾರತೀಯ ವಿಧಾನ.
  hi: आकाश के छोटे हिस्सों से जुड़े स्वामियों को देखने की भारतीय विधि।
admin_note: Use this label for an Indian method that associates each chart point with the rulers of successively smaller
  parts of the sky. Read the linked entries for the applicable conditions and differences between methods.
aliases:
- Krishnamurti Paddhati

id: glossary.terms.house-system
term:
  en: House system
  kn: ಮನೆಯ ವಿಭಾಗ ವಿಧಾನ
  hi: भाव विभाजन विधि
sanskrit:
  devanagari: भावविभाग
  kannada: ಭಾವವಿಭಾಗ
  usage: descriptive equivalent
meaning:
  en: The method used to divide a chart into twelve areas.
  kn: ನಕ್ಷೆಯನ್ನು ಹನ್ನೆರಡು ಮನೆಗಳಾಗಿ ವಿಂಗಡಿಸುವ ವಿಧಾನ.
  hi: पत्री को बारह घरों में बाँटने की विधि।
admin_note: Use this label for the method used to divide a chart into twelve areas. Read the linked entries for the applicable
  conditions and differences between methods.
aliases:
- house systems

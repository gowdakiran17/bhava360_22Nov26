id: glossary.terms.square
term:
  en: Square
  kn: ಸಮಕೋಣ
  hi: समकोण
sanskrit:
  devanagari: समकोण
  kannada: ಸಮಕೋಣ
  usage: descriptive equivalent
meaning:
  en: Two positions about 90 degrees apart around the sky.
  kn: ಆಕಾಶವೃತ್ತದಲ್ಲಿ ಸುಮಾರು 90 ಅಂಶ ದೂರವಿರುವ ಎರಡು ಸ್ಥಾನಗಳು.
  hi: आकाश के चक्र में लगभग 90 अंश दूर दो स्थान।
admin_note: 'Application in western.aspects.square: For a bound natal pair, accept shortest circular separation within
  6 degrees of 90 degrees, inclusive.'
aliases: []

id: glossary.terms.vedha
term:
  en: Vedha
  kn: ವೇಧ
  hi: वेध
sanskrit:
  devanagari: वेध
  kannada: ವೇಧ
  usage: traditional term
meaning:
  en: A blocking relationship between positions, used differently in transit reading and marriage matching.
  kn: ಸಂಚಾರ ಅಥವಾ ಹೊಂದಾಣಿಕೆಯ ವಿಧಾನದಲ್ಲಿ ತಡೆಯೆಂದು ಪರಿಗಣಿಸುವ ಸಂಬಂಧ.
  hi: गोचर या मिलान की पद्धति में रुकावट माना गया संबंध।
admin_note: Use this label for a blocking relationship between positions, used differently in transit reading and marriage
  matching. Read the linked entries for the applicable conditions and differences between methods.

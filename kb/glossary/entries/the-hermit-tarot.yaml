id: glossary.terms.the-hermit-tarot
term:
  en: The Hermit (Tarot)
  kn: ಏಕಾಂತವಾಸಿ (ಟ್ಯಾರೊ)
  hi: एकांतवासी (टैरो)
sanskrit:
  devanagari: एकान्तवासी
  kannada: ಏಕಾನ್ತವಾಸೀ
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 9, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 9 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 9 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on solitary reflection.
  What comes to mind in this position?'
aliases:
- The Hermit
reference_rules:
- tarot.major-arcana.the-hermit-upright
- tarot.major-arcana.the-hermit-reversed
used_by:
- tarot.major-arcana.the-hermit-reversed
- tarot.major-arcana.the-hermit-upright
systems:
- tarot

id: glossary.terms.kumara-age-state
term:
  en: Kumara (age state)
  kn: ಕುಮಾರ
  hi: कुमार
sanskrit:
  devanagari: कुमार
  kannada: ಕುಮಾರ
  usage: traditional term
meaning:
  en: A symbolic stage described as developing when a planet falls in the corresponding part of a sign.
  kn: 'ರಾಶಿಯಲ್ಲಿನ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಕೇತಿಕ ಹಂತ: ಬೆಳವಣಿಗೆ.'
  hi: 'राशि में जगह से तय प्रतीकात्मक अवस्था: विकास।'
admin_note: 'Application in vedic.states.baladi: Divide the graha’s natal sign into five successive six-degree intervals.
  Read the odd-sign order from Aries onward by sign parity and reverse the order in even signs. Normalize 30 degrees
  to the next sign before lookup.'
aliases:
- Kumara
reference_rules:
- vedic.states.baladi
used_by:
- vedic.states.baladi
systems:
- vedic

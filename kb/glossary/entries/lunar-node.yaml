id: glossary.terms.lunar-node
term:
  en: Lunar node
  kn: ಚನ್ದ್ರಪಾತ
  hi: चन्द्रपात
sanskrit:
  devanagari: चन्द्रपात
  kannada: ಚನ್ದ್ರಪಾತ
  usage: traditional term
meaning:
  en: One of the two places where the Moon’s path crosses the Sun’s apparent path.
  kn: ಚಂದ್ರನ ಪಥ ಸೂರ್ಯನ ಪಥವನ್ನು ದಾಟುವ ಎರಡು ಬಿಂದುಗಳಲ್ಲಿ ಒಂದು.
  hi: चंद्रमा के पथ और सूर्य के दिखाई देने वाले मार्ग के दो कटान बिंदुओं में से एक।
admin_note: Use this label for one of the two places where the Moon’s path crosses the Sun’s apparent path. Read the
  linked entries for the applicable conditions and differences between methods.
aliases:
- lunar nodes

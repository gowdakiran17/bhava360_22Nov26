id: glossary.terms.element
term:
  en: Element
  kn: ತತ್ತ್ವ
  hi: तत्त्व
sanskrit:
  devanagari: तत्त्व
  kannada: ತತ್ತ್ವ
  usage: descriptive equivalent
meaning:
  en: A symbolic category such as earth, water, fire or air used to group features in a reading.
  kn: ಪೃಥ್ವಿ, ಜಲ, ಅಗ್ನಿ ಅಥವಾ ವಾಯುವಿನಂತಹ ಸಾಂಕೇತಿಕ ಗುಂಪು.
  hi: पृथ्वी, जल, अग्नि या वायु जैसी प्रतीकात्मक श्रेणी।
admin_note: Use this label for a symbolic category such as earth, water, fire or air used to group features in a reading.
  Read the linked entries for the applicable conditions and differences between methods.
aliases:
- elements
reference_rules: []

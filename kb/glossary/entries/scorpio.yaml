id: glossary.terms.scorpio
term:
  en: Scorpio
  kn: ವೃಶ್ಚಿಕ
  hi: वृश्चिक
sanskrit:
  devanagari: वृश्चिक
  kannada: ವೃಶ್ಚಿಕ
  usage: traditional term
meaning:
  en: Sign number 8 in the twelve-part circle, covering degrees 210 to 240.
  kn: ರಾಶಿಚಕ್ರದ 8ನೇ ಭಾಗ, 210ರಿಂದ 240 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 8, 210 से 240 अंश तक।
admin_note: 'Application in western.signs.scorpio: The selected tropical point falls in [210, 240) degrees from the March
  equinox. Fixed water; modern ruler pluto, traditional ruler mars.'
aliases:
- Vrischika

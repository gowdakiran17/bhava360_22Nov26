id: glossary.terms.house-3
term:
  en: House 3
  kn: ಸಹಜಭಾವ
  hi: सहजभाव
sanskrit:
  devanagari: सहजभाव
  kannada: ಸಹಜಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore siblings and personal effort.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಒಡಹುಟ್ಟಿದವರು ಮತ್ತು ಪ್ರಯತ್ನ ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में भाई-बहन और प्रयास से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists siblings, initiative, practised
  skills among its subjects.
aliases:
- Sahaja

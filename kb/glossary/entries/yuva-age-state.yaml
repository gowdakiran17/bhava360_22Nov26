id: glossary.terms.yuva-age-state
term:
  en: Yuva (age state)
  kn: ಯುವಾ
  hi: युवा
sanskrit:
  devanagari: युवा
  kannada: ಯುವಾ
  usage: traditional term
meaning:
  en: A symbolic stage described as fully active when a planet falls in the corresponding part of a sign.
  kn: 'ರಾಶಿಯಲ್ಲಿನ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಕೇತಿಕ ಹಂತ: ಪೂರ್ಣ ಚಟುವಟಿಕೆ.'
  hi: 'राशि में जगह से तय प्रतीकात्मक अवस्था: पूरी सक्रियता।'
admin_note: 'Application in vedic.states.baladi: Divide the graha’s natal sign into five successive six-degree intervals.
  Read the odd-sign order from Aries onward by sign parity and reverse the order in even signs. Normalize 30 degrees
  to the next sign before lookup.'
aliases:
- Yuva
reference_rules:
- vedic.states.baladi
used_by:
- vedic.states.baladi
systems:
- vedic

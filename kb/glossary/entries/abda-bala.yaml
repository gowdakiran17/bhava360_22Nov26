id: glossary.terms.abda-bala
term:
  en: Abda bala
  kn: ಅಬ್ದಬಲ
  hi: अब्दबल
sanskrit:
  devanagari: अब्दबल
  kannada: ಅಬ್ದಬಲ
  usage: traditional term
meaning:
  en: The part of time-based planetary strength assigned to the ruler of the year.
  kn: ವರ್ಷದ ಅಧಿಪತಿಗೆ ನೀಡುವ ಕಾಲಬಲದ ಭಾಗ.
  hi: वर्ष के स्वामी को दिया समय बल का भाग।
admin_note: 'Application in vedic.strength-shadbala.abda: Use the weekday lord of the first sunrise of the active 360-day
  year. For completed sunrise days d from a bound cycle epoch, the zero-based weekday is (epoch weekday + span × floor(d/span))
  modulo seven, Sunday first. Award points only to that lord.'
aliases:
- Abda
reference_rules: []
used_by:
- vedic.strength-shadbala.abda
- vedic.strength-shadbala.kala

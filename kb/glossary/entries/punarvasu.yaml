id: glossary.terms.punarvasu
term:
  en: Punarvasu
  kn: ಪುನರ್ವಸು
  hi: पुनर्वसु
sanskrit:
  devanagari: पुनर्वसु
  kannada: ಪುನರ್ವಸು
  usage: traditional term
meaning:
  en: Section 7 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 7ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 7।
admin_note: 'Application in vedic.nakshatras.punarvasu: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

id: glossary.terms.krittika
term:
  en: Krittika
  kn: ಕೃತ್ತಿಕಾ
  hi: कृत्तिका
sanskrit:
  devanagari: कृत्तिका
  kannada: ಕೃತ್ತಿಕಾ
  usage: traditional term
meaning:
  en: Section 3 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 3ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 3।
admin_note: 'Application in vedic.nakshatras.krittika: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

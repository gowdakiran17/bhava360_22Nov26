id: glossary.terms.sadhya-calendar-yoga
term:
  en: Sadhya (calendar yoga)
  kn: ಸಾಧ್ಯ
  hi: साध्य
sanskrit:
  devanagari: साध्य
  kannada: ಸಾಧ್ಯ
  usage: traditional term
meaning:
  en: Interval 22 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 22ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 22।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Sadhya

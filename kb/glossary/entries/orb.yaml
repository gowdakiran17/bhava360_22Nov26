id: glossary.terms.orb
term:
  en: Orb
  kn: ಕೋನದ ಮಿತಿ
  hi: कोण की छूट
sanskrit:
  devanagari: कोणान्तरसीमा
  kannada: ಕೋಣಾನ್ತರಸೀಮಾ
  usage: descriptive equivalent
meaning:
  en: How far an angle may be from its exact value and still count in a reading.
  kn: ಒಂದು ಕೋನವನ್ನು ಪರಿಗಣಿಸಲು ಅದರ ನಿಖರ ಅಳತೆಯಿಂದ ಇರಬಹುದಾದ ವ್ಯತ್ಯಾಸ.
  hi: तय कोण से जितना अंतर होने पर भी उस संबंध को पढ़ने में शामिल किया जाता है।
admin_note: Use this label for how far an angle may be from its exact value and still count in a reading. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- Orbs

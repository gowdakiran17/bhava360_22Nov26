id: glossary.terms.lal-kitab
term:
  en: Lal Kitab
  kn: ಲಾಲ್ ಕಿತಾಬ್
  hi: लाल किताब
sanskrit:
  devanagari: लालपुस्तकम्
  kannada: ಲಾಲಪುಸ್ತಕಮ್
  usage: descriptive equivalent
meaning:
  en: A South Asian reading tradition with its own house-based rules and suggested practices.
  kn: ಮನೆಗಳ ಆಧಾರದ ಓದು ಮತ್ತು ಐಚ್ಛಿಕ ಆಚರಣೆಗಳ ದಕ್ಷಿಣ ಏಷ್ಯಾದ ಪದ್ಧತಿ.
  hi: घरों की पढ़ाई और वैकल्पिक अभ्यासों की दक्षिण एशियाई पद्धति।
admin_note: Use this label for a South Asian reading tradition with its own house-based rules and suggested practices.
  Read the linked entries for the applicable conditions and differences between methods.

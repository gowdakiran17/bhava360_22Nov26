id: glossary.terms.pisces
term:
  en: Pisces
  kn: ಮೀನ
  hi: मीन
sanskrit:
  devanagari: मीन
  kannada: ಮೀನ
  usage: traditional term
meaning:
  en: Sign number 12 in the twelve-part circle, covering degrees 330 to 360.
  kn: ರಾಶಿಚಕ್ರದ 12ನೇ ಭಾಗ, 330ರಿಂದ 360 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 12, 330 से 360 अंश तक।
admin_note: 'Application in western.signs.pisces: The selected tropical point falls in [330, 360) degrees from the March
  equinox. Mutable water; modern ruler neptune, traditional ruler jupiter.'
aliases:
- Meena

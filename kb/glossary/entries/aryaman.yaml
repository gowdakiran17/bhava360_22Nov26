id: glossary.terms.aryaman
term:
  en: Aryaman
  kn: ಅರ್ಯಮನ್
  hi: अर्यमन्
sanskrit:
  devanagari: अर्यमन्
  kannada: ಅರ್ಯಮನ್
  usage: traditional term
meaning:
  en: Aryaman is a traditional figure associated with Uttara Phalguni.
  kn: 'ಚಂದ್ರನ ವಿಭಾಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು: ಉತ್ತರಫಲ್ಗುನೀ.'
  hi: 'चंद्र पथ के इस हिस्से से जुड़ा पारंपरिक नाम: उत्तरफल्गुनी।'
admin_note: This name identifies the symbolic attribution in the cited KB table. Read the linked star entries for the
  source and any competing assignment. Select the star using its measured span.
aliases: []

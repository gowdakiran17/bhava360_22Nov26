id: glossary.terms.five-of-wands-tarot
term:
  en: Five Of Wands (Tarot)
  kn: ಕೋಲು · ಐದು
  hi: छड़ी · पाँच
sanskrit:
  devanagari: दण्ड पञ्च
  kannada: ದಣ್ಡ ಪಞ್ಚ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank five in the wands family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಕೋಲು · ಐದು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में छड़ी · पाँच की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on creative disagreement.
  What comes to mind in this position?'
aliases:
- Five Of Wands
reference_rules:

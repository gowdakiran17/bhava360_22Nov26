id: glossary.terms.satya
term:
  en: Satya
  kn: ಸತ್ಯ
  hi: सत्य
sanskrit:
  devanagari: सत्य
  kannada: ಸತ್ಯ
  usage: traditional term
meaning:
  en: The traditional name for entrance position E6 in the building plan.
  kn: ಕಟ್ಟಡದ ನಕ್ಷೆಯಲ್ಲಿ E6 ಪ್ರವೇಶ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು.
  hi: भवन के नक्शे में प्रवेश की जगह E6 का पारंपरिक नाम।
admin_note: This name identifies the symbolic attribution in the cited KB table. The entrance grid places it at E6.

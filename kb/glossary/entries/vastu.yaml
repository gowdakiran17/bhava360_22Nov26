id: glossary.terms.vastu
term:
  en: Vastu
  kn: ವಾಸ್ತು
  hi: वास्तु
sanskrit:
  devanagari: वास्तु
  kannada: ವಾಸ್ತು
  usage: traditional term
meaning:
  en: An Indian tradition that considers direction and arrangement when looking at spaces.
  kn: ಸ್ಥಳದ ದಿಕ್ಕು ಮತ್ತು ಜೋಡಣೆಯನ್ನು ಗಮನಿಸುವ ಭಾರತೀಯ ಪರಂಪರೆ.
  hi: जगह की दिशा और व्यवस्था पर विचार करने की भारतीय परंपरा।
admin_note: Use this label for an Indian tradition that considers direction and arrangement when looking at spaces. Read
  the linked entries for the applicable conditions and differences between methods.
aliases:
- Vastu Shastra

id: glossary.terms.moon
term:
  en: Moon
  kn: ಚಂದ್ರ
  hi: चंद्र
sanskrit:
  devanagari: चन्द्र
  kannada: ಚನ್ದ್ರ
  usage: traditional term
meaning:
  en: The natural satellite of Earth.
  kn: ಭೂಮಿಯ ನೈಸರ್ಗಿಕ ಉಪಗ್ರಹ.
  hi: पृथ्वी का प्राकृतिक उपग्रह।
admin_note: 'Application in vedic.prashna.moon: Bind the Moon of the question chart. Check its applying or exact contact
  with the topic lord under judgment.yaml. Keep a separating contact as background. When the Moon is already the ascendant
  lord, count that pair only once.'
aliases:
- Chandra
- Soma

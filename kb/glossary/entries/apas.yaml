id: glossary.terms.apas
term:
  en: Apas
  kn: ಆಪಃ
  hi: आपः
sanskrit:
  devanagari: आपः
  kannada: ಆಪಃ
  usage: traditional term
meaning:
  en: Apas is a traditional figure associated with Purva Ashadha.
  kn: 'ಚಂದ್ರನ ವಿಭಾಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು: ಪೂರ್ವಾಷಾಢಾ.'
  hi: 'चंद्र पथ के इस हिस्से से जुड़ा पारंपरिक नाम: पूर्वाषाढा।'
admin_note: This name identifies the symbolic attribution in the cited KB table. Read the linked star entries for the
  source and any competing assignment. Select the star using its measured span.
aliases: []

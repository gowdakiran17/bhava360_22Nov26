id: glossary.terms.reversal
term:
  en: Reversal
  kn: ವಿಪರೀತಪತ್ರ
  hi: विपरीतपत्र
sanskrit:
  devanagari: विपरीतपत्र
  kannada: ವಿಪರೀತಪತ್ರ
  usage: descriptive equivalent
meaning:
  en: A card appearing upside down in a draw, when that option is used.
  kn: ಆ ಆಯ್ಕೆ ಇದ್ದಾಗ ಪಠಣದಲ್ಲಿ ತಲೆಕೆಳಗಾಗಿ ಬಂದ ಪತ್ರ.
  hi: विकल्प चालू होने पर पढ़ाई में उलटा आया पत्ता।
admin_note: Use this label for a card appearing upside down in a draw, when that option is used. Read the linked entries
  for the applicable conditions and differences between methods.
aliases:
- reversed
reference_rules: []

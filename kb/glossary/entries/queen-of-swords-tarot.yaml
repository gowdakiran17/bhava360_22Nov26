id: glossary.terms.queen-of-swords-tarot
term:
  en: Queen Of Swords (Tarot)
  kn: ಕತ್ತಿ · ರಾಣಿ
  hi: तलवार · रानी
sanskrit:
  devanagari: खड्ग राज्ञी
  kannada: ಖಡ್ಗ ರಾಜ್ಞೀ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank queen in the swords family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಕತ್ತಿ · ರಾಣಿ ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में तलवार · रानी की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on clear boundaries.
  What comes to mind in this position?'
aliases:
- Queen Of Swords

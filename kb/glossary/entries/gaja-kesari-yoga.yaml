id: glossary.terms.gaja-kesari-yoga
term:
  en: Gaja Kesari yoga
  kn: ಗಜಕೇಸರೀಯೋಗ
  hi: गजकेसरीयोग
sanskrit:
  devanagari: गजकेसरीयोग
  kannada: ಗಜಕೇಸರೀಯೋಗ
  usage: traditional term
meaning:
  en: A pattern based on the relative positions of Jupiter and the Moon.
  kn: ಗುರು ಮತ್ತು ಚಂದ್ರನ ಪರಸ್ಪರ ಸ್ಥಾನಗಳನ್ನು ಆಧರಿಸಿದ ವಿನ್ಯಾಸ.
  hi: बृहस्पति और चंद्रमा की आपसी स्थिति पर आधारित मेल।
admin_note: 'Moon-based screen: Jupiter occupies an angle from the Moon.'
aliases:
- gaja-kesari
- Gajakesari

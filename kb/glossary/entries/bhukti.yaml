id: glossary.terms.bhukti
term:
  en: Bhukti
  kn: ಭುಕ್ತಿ
  hi: भुक्ति
sanskrit:
  devanagari: भुक्ति
  kannada: ಭುಕ್ತಿ
  usage: traditional term
meaning:
  en: A smaller period inside a longer period in an Indian timing system.
  kn: ಭಾರತೀಯ ಕಾಲಗಣನೆಯಲ್ಲಿ ದೊಡ್ಡ ಅವಧಿಯೊಳಗಿನ ಚಿಕ್ಕ ಅವಧಿ.
  hi: भारतीय समय पद्धति में एक बड़ी अवधि के भीतर की छोटी अवधि।
admin_note: Use this label for a smaller period inside a longer period in an Indian timing system. Read the linked entries
  for the applicable conditions and differences between methods.
aliases:
- Antardasha
- Antardasa
- Antar dasha
- subperiod
- ಅಂತರ್ದಶೆ
- अंतर्दशा

id: glossary.terms.parashari
term:
  en: Parashari
  kn: ಪಾರಾಶರೀ
  hi: पाराशरी
sanskrit:
  devanagari: पाराशरी
  kannada: ಪಾರಾಶರೀ
  usage: traditional term
meaning:
  en: An Indian chart-reading tradition associated with Parashara.
  kn: ಪರಾಶರರ ಹೆಸರಿನ ಭಾರತೀಯ ಜನ್ಮನಕ್ಷೆ ಓದುವ ಪರಂಪರೆ.
  hi: पराशर से जुड़ी भारतीय जन्मपत्री पढ़ने की परंपरा।
admin_note: Use this label for an Indian chart-reading tradition associated with Parashara. Read the linked entries for
  the applicable conditions and differences between methods.
aliases: []
reference_rules: []

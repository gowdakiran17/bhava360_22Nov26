id: glossary.terms.dusthana
term:
  en: Dusthana
  kn: ದುಃಸ್ಥಾನ
  hi: दुःस्थान
sanskrit:
  devanagari: दुःस्थान
  kannada: ದುಃಸ್ಥಾನ
  usage: traditional term
meaning:
  en: A traditional grouping of chart areas linked with service, change and reflection.
  kn: ಸೇವೆ, ಬದಲಾವಣೆ ಮತ್ತು ಚಿಂತನೆಗೆ ಸಂಬಂಧಿಸಿದ ಕ್ಷೇತ್ರಗಳ ಸಾಂಪ್ರದಾಯಿಕ ಗುಂಪು.
  hi: सेवा, बदलाव और चिंतन से जुड़े क्षेत्रों का एक पारंपरिक समूह।
admin_note: Use this label for the sixth, eighth or twelfth part of a birth chart, grouped together for interpretation.
  Read the linked entries for the applicable conditions and differences between methods.
aliases:
- Dusthanas
- Dusthana house

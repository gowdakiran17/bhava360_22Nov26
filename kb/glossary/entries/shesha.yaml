id: glossary.terms.shesha
term:
  en: Shesha
  kn: ಶೇಷ
  hi: शेष
sanskrit:
  devanagari: शेष
  kannada: ಶೇಷ
  usage: traditional term
meaning:
  en: The traditional name for entrance position W7 in the building plan.
  kn: ಕಟ್ಟಡದ ನಕ್ಷೆಯಲ್ಲಿ W7 ಪ್ರವೇಶ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು.
  hi: भवन के नक्शे में प्रवेश की जगह W7 का पारंपरिक नाम।
admin_note: This name identifies the symbolic attribution in the cited KB table. The entrance grid places it at W7.

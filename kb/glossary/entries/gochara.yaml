id: glossary.terms.gochara
term:
  en: Gochara
  kn: ಗೋಚರ
  hi: गोचर
sanskrit:
  devanagari: गोचर
  kannada: ಗೋಚರ
  usage: traditional term
meaning:
  en: Where a planet is moving now compared with a chosen chart.
  kn: ಆಯ್ದ ನಕ್ಷೆಗೆ ಹೋಲಿಸಿದಾಗ ಈಗ ಗ್ರಹ ಚಲಿಸುತ್ತಿರುವ ಸ್ಥಾನ.
  hi: चुनी हुई पत्री की तुलना में अभी ग्रह की चलती हुई स्थिति।
admin_note: Use this label for where a planet is moving now compared with a chosen chart. Read the linked entries for
  the applicable conditions and differences between methods.
aliases:
- transit
- transits
- ಗೋಚಾರ

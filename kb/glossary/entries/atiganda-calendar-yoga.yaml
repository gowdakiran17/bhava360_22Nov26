id: glossary.terms.atiganda-calendar-yoga
term:
  en: Atiganda (calendar yoga)
  kn: ಅತಿಗಣ್ಡ
  hi: अतिगण्ड
sanskrit:
  devanagari: अतिगण्ड
  kannada: ಅತಿಗಣ್ಡ
  usage: traditional term
meaning:
  en: Interval 6 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 6ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 6।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Atiganda

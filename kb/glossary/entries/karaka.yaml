id: glossary.terms.karaka
term:
  en: Karaka
  kn: ಕಾರಕ
  hi: कारक
sanskrit:
  devanagari: कारक
  kannada: ಕಾರಕ
  usage: traditional term
meaning:
  en: A planet chosen to represent a subject such as learning or partnership.
  kn: ಕಲಿಕೆ ಅಥವಾ ಒಡನಾಟದಂತಹ ವಿಷಯದ ಪ್ರತಿನಿಧಿಯಾಗಿ ಪರಿಗಣಿಸುವ ಗ್ರಹ.
  hi: सीखने या साझेदारी जैसे विषय का प्रतिनिधित्व करने वाला ग्रह।
admin_note: Use this label for a planet chosen to represent a subject such as learning or partnership. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- significator
- Karakas
- significators
reference_rules: []

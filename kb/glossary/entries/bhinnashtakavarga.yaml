id: glossary.terms.bhinnashtakavarga
term:
  en: Bhinnashtakavarga
  kn: ಭಿನ್ನಾಷ್ಟಕವರ್ಗ
  hi: भिन्नाष्टकवर्ग
sanskrit:
  devanagari: भिन्नाष्टकवर्ग
  kannada: ಭಿನ್ನಾಷ್ಟಕವರ್ಗ
  usage: traditional term
meaning:
  en: A table that counts contributions separately for one planet in each sign.
  kn: ಒಂದು ಗ್ರಹಕ್ಕೆ ಪ್ರತಿ ರಾಶಿಯಲ್ಲಿ ಕೊಡುಗೆಗಳನ್ನು ಎಣಿಸುವ ಕೋಷ್ಟಕ.
  hi: हर राशि में एक ग्रह के लिए योगदान गिनने की तालिका।
admin_note: Use this label for a table that counts contributions separately for one planet in each sign. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- BAV

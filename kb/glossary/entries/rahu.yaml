id: glossary.terms.rahu
term:
  en: Rahu
  kn: ರಾಹು
  hi: राहु
sanskrit:
  devanagari: राहु
  kannada: ರಾಹು
  usage: traditional term
meaning:
  en: The point where the Moon crosses the Sun’s apparent path heading north.
  kn: ಚಂದ್ರನು ಸೂರ್ಯನ ಪಥವನ್ನು ಉತ್ತರಕ್ಕೆ ದಾಟುವ ಬಿಂದು.
  hi: वह बिंदु जहाँ चंद्रमा सूर्य के मार्ग को उत्तर की ओर काटता है।
admin_note: 'Application in vedic.planets.rahu: Match Rahu when the selected D1 chart point is its computed natal placement.'
aliases:
- ascending node
- north node
reference_rules:
- vedic.planets.rahu

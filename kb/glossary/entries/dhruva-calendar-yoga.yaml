id: glossary.terms.dhruva-calendar-yoga
term:
  en: Dhruva (calendar yoga)
  kn: ಧ್ರುವ
  hi: ध्रुव
sanskrit:
  devanagari: ध्रुव
  kannada: ಧ್ರುವ
  usage: traditional term
meaning:
  en: Interval 12 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 12ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 12।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Dhruva
reference_rules:
- vedic.panchang.yoga
used_by:
- vedic.muhurta.marriage
- vedic.panchang.yoga
systems:
- vedic

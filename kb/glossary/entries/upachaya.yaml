id: glossary.terms.upachaya
term:
  en: Upachaya
  kn: ಉಪಚಯ
  hi: उपचय
sanskrit:
  devanagari: उपचय
  kannada: ಉಪಚಯ
  usage: traditional term
meaning:
  en: Chart areas associated with effort, service, work and community.
  kn: ಪ್ರಯತ್ನ, ಸೇವೆ, ಕೆಲಸ ಮತ್ತು ಸಮುದಾಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಕ್ಷೇತ್ರಗಳು.
  hi: प्रयास, सेवा, काम और समुदाय से जुड़े क्षेत्र।
admin_note: Use this label for a group consisting of the third, sixth, tenth and eleventh places in the birth chart.
  Read the linked entries for the applicable conditions and differences between methods.

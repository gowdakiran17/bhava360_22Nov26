id: glossary.terms.mula
term:
  en: Mula
  kn: ಮೂಲ
  hi: मूल
sanskrit:
  devanagari: मूल
  kannada: ಮೂಲ
  usage: traditional term
meaning:
  en: Section 19 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 19ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 19।
admin_note: 'Application in vedic.nakshatras.mula: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

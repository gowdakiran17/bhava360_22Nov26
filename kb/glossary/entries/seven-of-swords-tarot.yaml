id: glossary.terms.seven-of-swords-tarot
term:
  en: Seven Of Swords (Tarot)
  kn: ಕತ್ತಿ · ಏಳು
  hi: तलवार · सात
sanskrit:
  devanagari: खड्ग सप्त
  kannada: ಖಡ್ಗ ಸಪ್ತ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank seven in the swords family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಕತ್ತಿ · ಏಳು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में तलवार · सात की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on a private strategy.
  What comes to mind in this position?'
aliases:
- Seven Of Swords

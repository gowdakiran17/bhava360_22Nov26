id: glossary.terms.mukhya
term:
  en: Mukhya
  kn: ಮುಖ್ಯ
  hi: मुख्य
sanskrit:
  devanagari: मुख्य
  kannada: ಮುಖ್ಯ
  usage: traditional term
meaning:
  en: The traditional name for entrance position N3 in the building plan.
  kn: ಕಟ್ಟಡದ ನಕ್ಷೆಯಲ್ಲಿ N3 ಪ್ರವೇಶ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು.
  hi: भवन के नक्शे में प्रवेश की जगह N3 का पारंपरिक नाम।
admin_note: This name identifies the symbolic attribution in the cited KB table. The entrance grid places it at N3.

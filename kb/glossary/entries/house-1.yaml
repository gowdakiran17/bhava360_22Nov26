id: glossary.terms.house-1
term:
  en: House 1
  kn: ತನುಭಾವ
  hi: तनुभाव
sanskrit:
  devanagari: तनुभाव
  kannada: ತನುಭಾವ
  usage: traditional term
meaning:
  en: A chart theme for reflecting on body, vitality and temperament.
  kn: ದೇಹ, ಚೈತನ್ಯ ಮತ್ತು ಸ್ವಭಾವ ಕುರಿತು ಯೋಚಿಸಲು ಬಳಸುವ ಜಾತಕದ ಭಾಗ.
  hi: शरीर, स्फूर्ति और स्वभाव पर विचार करने से जुड़ा कुंडली का क्षेत्र।
admin_note: Count from the rising sign under the default whole-sign method. This house lists embodiment, appearance,
  personal presence among its subjects.
aliases:
- Tanu

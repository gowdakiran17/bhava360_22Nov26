id: glossary.terms.samudrika
term:
  en: Samudrika
  kn: ಸಾಮುದ್ರಿಕ
  hi: सामुद्रिक
sanskrit:
  devanagari: सामुद्रिक
  kannada: ಸಾಮುದ್ರಿಕ
  usage: traditional term
meaning:
  en: An Indian tradition that gives symbolic readings of visible features, including the hand.
  kn: ಕೈ ಸೇರಿದಂತೆ ಕಾಣುವ ಲಕ್ಷಣಗಳನ್ನು ಸಾಂಕೇತಿಕವಾಗಿ ಓದುವ ಭಾರತೀಯ ಪರಂಪರೆ.
  hi: हाथ सहित दिखाई देने वाली बनावट को प्रतीक की तरह पढ़ने की भारतीय परंपरा।
admin_note: Use this label for an Indian tradition that gives symbolic readings of visible features, including the hand.
  Read the linked entries for the applicable conditions and differences between methods.
aliases:
- Samudrika Shastra

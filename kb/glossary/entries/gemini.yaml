id: glossary.terms.gemini
term:
  en: Gemini
  kn: ಮಿಥುನ
  hi: मिथुन
sanskrit:
  devanagari: मिथुन
  kannada: ಮಿಥುನ
  usage: traditional term
meaning:
  en: Sign number 3 in the twelve-part circle, covering degrees 60 to 90.
  kn: ರಾಶಿಚಕ್ರದ 3ನೇ ಭಾಗ, 60ರಿಂದ 90 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 3, 60 से 90 अंश तक।
admin_note: 'Application in western.signs.gemini: The selected tropical point falls in [60, 90) degrees from the March
  equinox. Mutable air; modern ruler mercury, traditional ruler mercury.'
aliases:
- Mithuna

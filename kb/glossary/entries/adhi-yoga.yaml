id: glossary.terms.adhi-yoga
term:
  en: Adhi yoga
  kn: ಅಧಿಯೋಗ
  hi: अधियोग
sanskrit:
  devanagari: अधियोग
  kannada: ಅಧಿಯೋಗ
  usage: traditional term
meaning:
  en: Mercury, Venus and Jupiter occupy places six to eight from the Moon.
  kn: ಚಂದ್ರನಿಂದ ಆರು, ಏಳು ಅಥವಾ ಎಂಟನೇ ಸ್ಥಾನಗಳಲ್ಲಿ ಬುಧ, ಶುಕ್ರ ಮತ್ತು ಗುರು ಇರುವ ಜೋಡಣೆ.
  hi: चंद्रमा से छठे से आठवें स्थानों में बुध, शुक्र और गुरु का मेल।
admin_note: Under this candidate profile Mercury, Venus and Jupiter each occupy one of the sixth, seventh or eighth signs
  from Moon.
aliases:
- adhi
reference_rules:
- vedic.yogas.adhi
used_by:
- vedic.yogas.adhi
systems:
- vedic

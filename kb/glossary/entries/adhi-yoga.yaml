id: glossary.terms.adhi-yoga
term:
  en: Adhi yoga
  kn: ಅಧಿಯೋಗ
  hi: अधियोग
sanskrit:
  devanagari: अधियोग
  kannada: ಅಧಿಯೋಗ
  usage: traditional term
meaning:
  en: A grouping of planets read in relation to the Moon.
  kn: ಚಂದ್ರನಿಗೆ ಸಂಬಂಧಿಸಿದಂತೆ ಓದುವ ಗ್ರಹಗಳ ವಿನ್ಯಾಸ.
  hi: चंद्रमा के सापेक्ष देखा जाने वाला ग्रहों का समूह।
admin_note: Under this candidate profile Mercury, Venus and Jupiter each occupy one of the sixth, seventh or eighth signs
  from Moon.
aliases:
- adhi

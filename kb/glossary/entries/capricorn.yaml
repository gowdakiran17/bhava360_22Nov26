id: glossary.terms.capricorn
term:
  en: Capricorn
  kn: ಮಕರ
  hi: मकर
sanskrit:
  devanagari: मकर
  kannada: ಮಕರ
  usage: traditional term
meaning:
  en: Sign number 10 in the twelve-part circle, covering degrees 270 to 300.
  kn: ರಾಶಿಚಕ್ರದ 10ನೇ ಭಾಗ, 270ರಿಂದ 300 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 10, 270 से 300 अंश तक।
admin_note: 'Application in western.signs.capricorn: The selected tropical point falls in [270, 300) degrees from the
  March equinox. Cardinal earth; modern ruler saturn, traditional ruler saturn.'
aliases:
- Makara

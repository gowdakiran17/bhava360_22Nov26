id: glossary.terms.dashavarga
term:
  en: Dashavarga
  kn: ದಶವರ್ಗ
  hi: दशवर्ग
sanskrit:
  devanagari: दशवर्ग
  kannada: ದಶವರ್ಗ
  usage: traditional term
meaning:
  en: A traditional set of ten charts made by subdividing the signs.
  kn: ರಾಶಿಗಳನ್ನು ಭಾಗಿಸುವ ಹತ್ತು ನಕ್ಷೆಗಳ ಸಾಂಪ್ರದಾಯಿಕ ಗುಂಪು.
  hi: राशियाँ बाँटकर बनी दस पत्रियों का पारंपरिक समूह।
admin_note: Use this label for a traditional set of ten charts made by subdividing the signs. Read the linked entries
  for the applicable conditions and differences between methods.

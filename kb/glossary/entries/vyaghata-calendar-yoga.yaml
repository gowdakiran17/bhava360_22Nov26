id: glossary.terms.vyaghata-calendar-yoga
term:
  en: Vyaghata (calendar yoga)
  kn: ವ್ಯಾಘಾತ
  hi: व्याघात
sanskrit:
  devanagari: व्याघात
  kannada: ವ್ಯಾಘಾತ
  usage: traditional term
meaning:
  en: Interval 13 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 13ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 13।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Vyaghata

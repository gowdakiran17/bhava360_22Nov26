id: glossary.terms.vayu-vastu-guardian
term:
  en: Vayu (Vastu guardian)
  kn: ವಾಯು ದಿಕ್ಪಾಲ
  hi: वायु दिक्पाल
sanskrit:
  devanagari: वायु दिक्पाल
  kannada: ವಾಯು ದಿಕ್ಪಾಲ
  usage: traditional term
meaning:
  en: The traditional guardian associated with the northwest part of a building plan.
  kn: ಮನೆಯ ನಕ್ಷೆಯ ವಾಯವ್ಯ ಭಾಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ಪಾಲಕ.
  hi: घर के नक्शे के उत्तरपश्चिम भाग से जुड़े पारंपरिक रक्षक।
admin_note: 'Application in vedic.nakshatras.swati: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases:
- Vayu

id: glossary.terms.sakata-yoga
term:
  en: Sakata yoga
  kn: ಶಕಟಯೋಗ
  hi: शकटयोग
sanskrit:
  devanagari: शकटयोग
  kannada: ಶಕಟಯೋಗ
  usage: traditional term
meaning:
  en: A traditional grouping based on the position of the Moon relative to Jupiter.
  kn: ಗುರುವಿಗೆ ಸಂಬಂಧಿಸಿದಂತೆ ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಆಧರಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ವಿನ್ಯಾಸ.
  hi: बृहस्पति के सापेक्ष चंद्रमा की स्थिति पर आधारित एक पारंपरिक मेल।
admin_note: Moon lies sixth, eighth or twelfth from Jupiter.
aliases:
- sakata

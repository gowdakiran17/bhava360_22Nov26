id: glossary.terms.koota
term:
  en: Koota
  kn: ಕೂಟ
  hi: कूट
sanskrit:
  devanagari: कूट
  kannada: ಕೂಟ
  usage: traditional term
meaning:
  en: One factor in a traditional comparison of two birth charts for marriage.
  kn: ವಿವಾಹಕ್ಕಾಗಿ ಎರಡು ಜನ್ಮನಕ್ಷೆಗಳನ್ನು ಹೋಲಿಸುವಾಗ ನೋಡುವ ಒಂದು ಅಂಶ.
  hi: विवाह के लिए दो जन्मपत्रियों की तुलना में देखा जाने वाला एक पहलू।
admin_note: Use this label for one factor in a traditional comparison of two birth charts for marriage. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:

id: glossary.terms.mars
term:
  en: Mars
  kn: ಮಂಗಳ
  hi: मंगल
sanskrit:
  devanagari: मङ्गल
  kannada: ಮಙ್ಗಲ
  usage: traditional term
meaning:
  en: The fourth planet from the Sun.
  kn: ಸೂರ್ಯನಿಂದ ನಾಲ್ಕನೇ ಗ್ರಹ.
  hi: सूर्य से चौथा ग्रह।
admin_note: 'Application in western.planets.mars: The selected tropical natal body is mars. Read its sign as a style
  and its house as an area of experience.'

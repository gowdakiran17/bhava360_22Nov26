id: glossary.terms.house-11
term:
  en: House 11
  kn: ಲಾಭಭಾವ
  hi: लाभभाव
sanskrit:
  devanagari: लाभभाव
  kannada: ಲಾಭಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore gains and aspirations.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಬಯಕೆಗಳು ಮತ್ತು ಲಾಭಗಳು ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में आकांक्षाएँ और प्राप्ति से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists receipts, fulfilment of
  aims, older siblings among its subjects.
aliases:
- Labha

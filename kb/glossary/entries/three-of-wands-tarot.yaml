id: glossary.terms.three-of-wands-tarot
term:
  en: Three Of Wands (Tarot)
  kn: ಕೋಲು · ಮೂರು
  hi: छड़ी · तीन
sanskrit:
  devanagari: दण्ड त्रि
  kannada: ದಣ್ಡ ತ್ರಿ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank three in the wands family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಕೋಲು · ಮೂರು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में छड़ी · तीन की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on exploring possibilities.
  What comes to mind in this position?'
aliases:
- Three Of Wands
reference_rules:

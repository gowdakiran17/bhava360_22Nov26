id: glossary.terms.panchaka
term:
  en: Panchaka
  kn: ಪಞ್ಚಕ
  hi: पञ्चक
sanskrit:
  devanagari: पञ्चक
  kannada: ಪಞ್ಚಕ
  usage: traditional term
meaning:
  en: A traditional fivefold grouping checked under the chosen rule when selecting a time.
  kn: ಸಮಯವನ್ನು ಆಯುವಾಗ ಪರಿಗಣಿಸುವ ಐದು ಬಗೆಯ ಗುಂಪು.
  hi: समय चुनने की विधि में देखा जाने वाला पाँच प्रकार का समूह।
admin_note: Use this label for a traditional fivefold grouping checked under the chosen rule when selecting a time. Read
  the linked entries for the applicable conditions and differences between methods.

id: glossary.terms.sripati
term:
  en: Sripati
  kn: ಶ್ರೀಪತಿ
  hi: श्रीपति
sanskrit:
  devanagari: श्रीपति
  kannada: ಶ್ರೀಪತಿ
  usage: traditional term
meaning:
  en: A way of spacing the centres of houses between four main chart directions.
  kn: ನಾಲ್ಕು ಮುಖ್ಯ ದಿಕ್ಕುಗಳ ನಡುವೆ ಮನೆಗಳ ಕೇಂದ್ರಗಳನ್ನು ಇಡುವ ವಿಧಾನ.
  hi: चार मुख्य दिशाओं के बीच घरों के केंद्र रखने की विधि।
admin_note: Use this label for a way of spacing the centres of houses between four main chart directions. Read the linked
  entries for the applicable conditions and differences between methods.

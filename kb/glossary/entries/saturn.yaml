id: glossary.terms.saturn
term:
  en: Saturn
  kn: ಶನಿ
  hi: शनि
sanskrit:
  devanagari: शनि
  kannada: ಶನಿ
  usage: traditional term
meaning:
  en: The ringed sixth planet from the Sun.
  kn: ಉಂಗುರಗಳಿರುವ ಆರನೇ ಗ್ರಹ.
  hi: छल्लों वाला सूर्य से छठा ग्रह।
admin_note: 'Application in western.planets.saturn: The selected tropical natal body is saturn. Read its sign as a style
  and its house as an area of experience.'

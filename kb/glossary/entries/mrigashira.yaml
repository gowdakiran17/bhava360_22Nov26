id: glossary.terms.mrigashira
term:
  en: Mrigashira
  kn: ಮೃಗಶಿರಸ್
  hi: मृगशिरस्
sanskrit:
  devanagari: मृगशिरस्
  kannada: ಮೃಗಶಿರಸ್
  usage: traditional term
meaning:
  en: Section 5 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 5ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 5।
admin_note: 'Application in vedic.nakshatras.mrigashira: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'

id: glossary.terms.relocation
term:
  en: Relocation
  kn: ಸ್ಥಳಾಂತರ
  hi: स्थान परिवर्तन
sanskrit:
  devanagari: स्थानपरिवर्तन
  kannada: ಸ್ಥಾನಪರಿವರ್ತನ
  usage: descriptive equivalent
meaning:
  en: Recalculating the local chart directions for another place while keeping the same moment.
  kn: ಒಂದೇ ಕ್ಷಣವನ್ನು ಉಳಿಸಿಕೊಂಡು ಇನ್ನೊಂದು ಸ್ಥಳಕ್ಕೆ ನಕ್ಷೆಯ ಸ್ಥಳೀಯ ದಿಕ್ಕುಗಳನ್ನು ಮರುಲೆಕ್ಕಿಸುವುದು.
  hi: वही क्षण रखते हुए दूसरी जगह के लिए पत्री की स्थानीय दिशाएँ फिर निकालना।
admin_note: Use this label for recalculating the local chart directions for another place while keeping the same moment.
  Read the linked entries for the applicable conditions and differences between methods.
aliases:
- relocated chart
reference_rules: []

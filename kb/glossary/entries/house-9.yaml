id: glossary.terms.house-9
term:
  en: House 9
  kn: ಧರ್ಮಭಾವ
  hi: धर्मभाव
sanskrit:
  devanagari: धर्मभाव
  kannada: ಧರ್ಮಭಾವ
  usage: traditional term
meaning:
  en: A chart theme for reflecting on dharma, teachers and good fortune.
  kn: ಧರ್ಮ, ಗುರುಗಳು ಮತ್ತು ಸೌಭಾಗ್ಯ ಕುರಿತು ಯೋಚಿಸಲು ಬಳಸುವ ಜಾತಕದ ಭಾಗ.
  hi: धर्म, शिक्षक और सौभाग्य पर विचार करने से जुड़ा कुंडली का क्षेत्र।
admin_note: Count from the rising sign under the default whole-sign method. This house lists teachers, ethical commitments,
  pilgrimage among its subjects.

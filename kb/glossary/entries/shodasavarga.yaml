id: glossary.terms.shodasavarga
term:
  en: Shodasavarga
  kn: ಷೋಡಶವರ್ಗ
  hi: षोडशवर्ग
sanskrit:
  devanagari: षोडशवर्ग
  kannada: ಷೋಡಶವರ್ಗ
  usage: traditional term
meaning:
  en: A traditional set of sixteen charts made by subdividing the signs.
  kn: ರಾಶಿಗಳನ್ನು ಭಾಗಿಸುವ ಹದಿನಾರು ನಕ್ಷೆಗಳ ಸಾಂಪ್ರದಾಯಿಕ ಗುಂಪು.
  hi: राशियाँ बाँटकर बनी सोलह पत्रियों का पारंपरिक समूह।
admin_note: Use this label for a traditional set of sixteen charts made by subdividing the signs. Read the linked entries
  for the applicable conditions and differences between methods.

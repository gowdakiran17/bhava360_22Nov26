id: glossary.terms.numerology
term:
  en: Numerology
  kn: ಸಂಖ್ಯಾಶಾಸ್ತ್ರ
  hi: अंक विद्या
sanskrit:
  devanagari: अङ्कविद्या
  kannada: ಅಙ್ಕವಿದ್ಯಾ
  usage: descriptive equivalent
meaning:
  en: A tradition that gives symbolic meanings to numbers derived from names or dates.
  kn: ಹೆಸರು ಅಥವಾ ದಿನಾಂಕದಿಂದ ಪಡೆದ ಸಂಖ್ಯೆಗಳಿಗೆ ಸಾಂಕೇತಿಕ ಅರ್ಥ ನೀಡುವ ಪರಂಪರೆ.
  hi: नाम या तारीख से निकले अंकों को प्रतीकात्मक अर्थ देने की परंपरा।
admin_note: Use this label for a tradition that gives symbolic meanings to numbers derived from names or dates. Read
  the linked entries for the applicable conditions and differences between methods.
aliases:
- Ank Jyotish

id: glossary.terms.planet
term:
  en: Planet
  kn: ಖಗೋಳದ ಗ್ರಹ
  hi: खगोलीय ग्रह
sanskrit:
  devanagari: ग्रहपिण्ड
  kannada: ಗ್ರಹಪಿಣ್ಡ
  usage: descriptive equivalent
meaning:
  en: A body orbiting a star; chart-reading traditions may group it with other sky indicators.
  kn: ನಕ್ಷತ್ರದ ಸುತ್ತ ಸುತ್ತುವ ಆಕಾಶಕಾಯ.
  hi: तारे की परिक्रमा करने वाला खगोलीय पिंड।
admin_note: Use this label for a body orbiting a star; chart-reading traditions may group it with other sky indicators.
  Read the linked entries for the applicable conditions and differences between methods.
aliases:
- planets
reference_rules: []

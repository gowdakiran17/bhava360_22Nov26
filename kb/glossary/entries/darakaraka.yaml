id: glossary.terms.darakaraka
term:
  en: Darakaraka
  kn: ದಾರಕಾರಕ
  hi: दारकारक
sanskrit:
  devanagari: दारकारक
  kannada: ದಾರಕಾರಕ
  usage: traditional term
meaning:
  en: The planet assigned to represent partnership by its place in a ranked list.
  kn: ಸ್ಥಾನಕ್ರಮದ ಪ್ರಕಾರ ಒಡನಾಟ ವಿಷಯಕ್ಕೆ ಆಯ್ದ ಗ್ರಹ.
  hi: स्थिति के क्रम से साझेदारी का प्रतिनिधित्व करने वाला ग्रह।
admin_note: 'Select the bound graha only if it holds DK: rank 7 of seven or rank 8 of eight under chara-karakas/methods.yaml.
  Require a unique rank across the chart uncertainty interval.'
aliases: []
reference_rules:

id: glossary.terms.ashtakavarga
term:
  en: Ashtakavarga
  kn: ಅಷ್ಟಕವರ್ಗ
  hi: अष्टकवर्ग
sanskrit:
  devanagari: अष्टकवर्ग
  kannada: ಅಷ್ಟಕವರ್ಗ
  usage: traditional term
meaning:
  en: A method that counts contributions from eight starting points across the signs.
  kn: ರಾಶಿಗಳಲ್ಲಿ ಎಂಟು ಆರಂಭಿಕ ಸ್ಥಾನಗಳ ಕೊಡುಗೆಗಳನ್ನು ಎಣಿಸುವ ವಿಧಾನ.
  hi: आठ शुरुआती स्थानों से मिली गिनतियों को राशियों के अनुसार रखने की विधि।
admin_note: Use this label for a method that counts contributions from eight starting points across the signs. Read the
  linked entries for the applicable conditions and differences between methods.
aliases:
- Aṣṭakavarga

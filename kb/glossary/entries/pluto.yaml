id: glossary.terms.pluto
term:
  en: Pluto
  kn: ಪ್ಲುಟೊ
  hi: प्लूटो
sanskrit:
  devanagari: प्लूटो
  kannada: ಪ್ಲೂಟೋ
  usage: modern name in transliteration
meaning:
  en: A dwarf planet beyond Neptune, used in modern Western chart reading.
  kn: ನೆಪ್ಚೂನ್ ಆಚೆಯ ಒಂದು ಕುಬ್ಜ ಗ್ರಹ.
  hi: नेपच्यून से परे एक बौना ग्रह।
admin_note: 'Application in western.planets.pluto: Use the cohort meaning when the selected natal placement is Pluto.
  Add the personal reading only with a chart-specific contact.'
aliases: []

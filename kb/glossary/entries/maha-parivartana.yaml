id: glossary.terms.maha-parivartana
term:
  en: Maha parivartana
  kn: ಮಹಾಪರಿವರ್ತನ
  hi: महापरिवर्तन
sanskrit:
  devanagari: महापरिवर्तन
  kannada: ಮಹಾಪರಿವರ್ತನ
  usage: traditional term
meaning:
  en: A traditional category of exchange between chart rulers.
  kn: ನಕ್ಷೆಯ ಅಧಿಪತಿಗಳ ಸ್ಥಾನ ವಿನಿಮಯದ ಸಾಂಪ್ರದಾಯಿಕ ವರ್ಗ.
  hi: कुंडली में स्वामियों के स्थान परिवर्तन की एक पारंपरिक श्रेणी।
admin_note: 'Application in vedic.yogas.parivartana-maha: Two distinct classical lords occupy each other’s houses and
  neither house is 3, 6, 8 or 12.'

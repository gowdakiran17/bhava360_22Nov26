id: glossary.terms.lakshmi-yoga
term:
  en: Lakshmi yoga
  kn: ಲಕ್ಷ್ಮೀಯೋಗ
  hi: लक्ष्मीयोग
sanskrit:
  devanagari: लक्ष्मीयोग
  kannada: ಲಕ್ಷ್ಮೀಯೋಗ
  usage: traditional term
meaning:
  en: A pattern connecting Venus with the chart area of teachers and guiding values.
  kn: ಶುಕ್ರನನ್ನು ಗುರುಗಳು ಮತ್ತು ಮೌಲ್ಯಗಳ ಕ್ಷೇತ್ರದೊಂದಿಗೆ ಜೋಡಿಸುವ ವಿನ್ಯಾಸ.
  hi: शुक्र को शिक्षकों और मार्गदर्शक मूल्यों के क्षेत्र से जोड़ने वाला मेल।
admin_note: Both Venus and the ninth lord occupy an own or exaltation sign in an angle or trine from Lagna. When Venus
  rules the ninth, evaluate its single placement.
aliases:
- lakshmi

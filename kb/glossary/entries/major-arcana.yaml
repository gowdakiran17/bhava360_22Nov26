id: glossary.terms.major-arcana
term:
  en: Major Arcana
  kn: ಪ್ರಧಾನಪತ್ರಾಣಿ
  hi: प्रधानपत्राणि
sanskrit:
  devanagari: प्रधानपत्राणि
  kannada: ಪ್ರಧಾನಪತ್ರಾಣಿ
  usage: descriptive equivalent
meaning:
  en: The twenty-two named picture cards in the tarot deck.
  kn: ಟ್ಯಾರೊದಲ್ಲಿನ ಹೆಸರಿರುವ ಇಪ್ಪತ್ತೆರಡು ಚಿತ್ರಪತ್ರಗಳು.
  hi: टैरो के बाईस अलग नाम वाले चित्र पत्ते।
admin_note: Use this label for the twenty-two named picture cards in the tarot deck. Read the linked entries for the
  applicable conditions and differences between methods.

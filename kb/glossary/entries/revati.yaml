id: glossary.terms.revati
term:
  en: Revati
  kn: ರೇವತೀ
  hi: रेवती
sanskrit:
  devanagari: रेवती
  kannada: ರೇವತೀ
  usage: traditional term
meaning:
  en: Section 27 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 27ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 27।
admin_note: 'Application in vedic.nakshatras.revati: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

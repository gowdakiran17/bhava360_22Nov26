meaning:
  en: The planet numbered 8 outward from the Sun.
  kn: ಸೂರ್ಯನಿಂದ 8ನೇ ಗ್ರಹ.
  hi: सूर्य से 8वाँ ग्रह।
admin_note: 'Application in western.planets.neptune: Use the cohort meaning when the selected natal placement is Neptune.

id: glossary.terms.neptune
term:
  en: Neptune
  kn: ನೆಪ್ಚೂನ್
  hi: नेपच्यून
sanskrit:
  devanagari: नेपच्यून
  kannada: ನೇಪಚ್ಯೂನ

id: glossary.terms.dhanya-yogini
term:
  en: Dhanya Yogini
  kn: ಧನ್ಯಾ ಯೋಗಿನೀ
  hi: धन्या योगिनी
sanskrit:
  devanagari: धन्या योगिनी
  kannada: ಧನ್ಯಾ ಯೋಗಿನೀ
  usage: traditional term
meaning:
  en: A period lasting 3 years in the repeating 36-year sequence.
  kn: ೩೬ ವರ್ಷದ ಚಕ್ರದಲ್ಲಿ 3 ವರ್ಷ ಇರುವ ಅವಧಿ.
  hi: ३६ वर्ष के चक्र में 3 वर्ष की अवधि।
admin_note: 'Application in vedic.dashas-yogini.balance-calculation: Number the 27 equal lunar mansions from Ashwini
  = 1. Add three to the natal Moon’s mansion number and take the remainder modulo eight, reading zero as the eighth Yogini.
  The fraction elapsed is the arc traversed in that mansion divided by 48000 arcseconds. Subtract that fraction of the
  first lord’s full years from birth to obtain the true start. Advance by the remaining fraction to obtain the end. Repeat
  the eight periods in sequence. Each parent opens with its own Yogini and divides among all eight by child years / 36.'
aliases:
- Dhanya
reference_rules:
- vedic.dashas-yogini.balance-calculation
used_by:

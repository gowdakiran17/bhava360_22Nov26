id: glossary.terms.savitar
term:
  en: Savitar
  kn: ಸವಿತೃ
  hi: सवितृ
sanskrit:
  devanagari: सवितृ
  kannada: ಸವಿತೃ
  usage: traditional term
meaning:
  en: Savitar is a traditional figure associated with Hasta.
  kn: 'ಚಂದ್ರನ ವಿಭಾಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು: ಹಸ್ತ.'
  hi: 'चंद्र पथ के इस हिस्से से जुड़ा पारंपरिक नाम: हस्त।'
admin_note: This name identifies the symbolic attribution in the cited KB table. Read the linked star entries for the
  source and any competing assignment. Select the star using its measured span.
aliases: []
reference_rules:

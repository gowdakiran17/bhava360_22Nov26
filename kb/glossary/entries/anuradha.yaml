id: glossary.terms.anuradha
term:
  en: Anuradha
  kn: ಅನುರಾಧಾ
  hi: अनुराधा
sanskrit:
  devanagari: अनुराधा
  kannada: ಅನುರಾಧಾ
  usage: traditional term
meaning:
  en: Section 17 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 17ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 17।
admin_note: 'Application in vedic.nakshatras.anuradha: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

id: glossary.terms.vimshottari
term:
  en: Vimshottari
  kn: ವಿಂಶೋತ್ತರೀ
  hi: विंशोत्तरी
sanskrit:
  devanagari: विंशोत्तरी
  kannada: ವಿಂಶೋತ್ತರೀ
  usage: traditional term
meaning:
  en: A 120-year sequence of nine periods with a starting point set by the Moon at birth.
  kn: ಜನನದ ಚಂದ್ರನ ಸ್ಥಾನದಿಂದ ಆರಂಭವಾಗುವ ಒಂಬತ್ತು ಅವಧಿಗಳ ೧೨೦ ವರ್ಷದ ಚಕ್ರ.
  hi: जन्म के चंद्रमा से शुरू होने वाला नौ अवधियों का १२० वर्ष का क्रम।
admin_note: Use this label for a 120-year sequence of nine periods with a starting point set by the Moon at birth. Read
  the linked entries for the applicable conditions and differences between methods.
aliases: []
reference_rules: []

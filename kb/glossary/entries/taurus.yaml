id: glossary.terms.taurus
term:
  en: Taurus
  kn: ವೃಷಭ
  hi: वृषभ
sanskrit:
  devanagari: वृषभ
  kannada: ವೃಷಭ
  usage: traditional term
meaning:
  en: Sign number 2 in the twelve-part circle, covering degrees 30 to 60.
  kn: ರಾಶಿಚಕ್ರದ 2ನೇ ಭಾಗ, 30ರಿಂದ 60 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 2, 30 से 60 अंश तक।
admin_note: 'Application in western.signs.taurus: The selected tropical point falls in [30, 60) degrees from the March
  equinox. Fixed earth; modern ruler venus, traditional ruler venus.'
aliases:
- Vrishabha

id: glossary.terms.udveg-choghadiya
term:
  en: Udveg (Choghadiya)
  kn: ಉದ್ವೇಗ ಬೇಲಾ
  hi: उद्वेग बेला
sanskrit:
  devanagari: उद्वेग बेला
  kannada: ಉದ್ವೇಗ ಬೇಲಾ
  usage: traditional term
meaning:
  en: One of seven labels rotated through the eight daytime or nighttime intervals of a weekday.
  kn: ಹಗಲು ಅಥವಾ ರಾತ್ರಿಯ ಎಂಟು ಅವಧಿಗಳಿಗೆ ಕ್ರಮವಾಗಿ ನೀಡುವ ಏಳು ಹೆಸರುಗಳಲ್ಲಿ ಒಂದು.
  hi: दिन या रात के आठ हिस्सों में क्रम से दिए जाने वाले सात नामों में से एक।
admin_note: This label is slot 1 in the stored day cycle. Look up the weekday-specific start and use the separate night
  cycle after sunset.
aliases:
- Udveg
reference_rules:
- vedic.panchang.choghadiya
used_by:
- vedic.panchang.choghadiya
systems:
- vedic

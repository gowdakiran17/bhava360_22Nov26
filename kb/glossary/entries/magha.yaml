id: glossary.terms.magha
term:
  en: Magha
  kn: ಮಘಾ
  hi: मघा
sanskrit:
  devanagari: मघा
  kannada: ಮಘಾ
  usage: traditional term
meaning:
  en: Section 10 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 10ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 10।
admin_note: 'Application in vedic.nakshatras.magha: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

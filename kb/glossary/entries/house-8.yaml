id: glossary.terms.house-8
term:
  en: House 8
  kn: ರನ್ಧ್ರಭಾವ
  hi: रन्ध्रभाव
sanskrit:
  devanagari: रन्ध्रभाव
  kannada: ರನ್ಧ್ರಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore sensitive matters and change.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಬದಲಾವಣೆ ಮತ್ತು ಖಾಸಗಿ ವಿಷಯಗಳು ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में बदलाव और निजी विषय से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists continuity through disruption,
  longevity (ayu), sudden change, research and occult knowledge, inheritance, insurance, private matters, a partner’s
  resources among its subjects.
aliases:
- Randhra

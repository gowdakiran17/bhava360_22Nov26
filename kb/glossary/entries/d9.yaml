id: glossary.terms.d9
term:
  en: D9
  kn: D9 ನವಾಂಶ
  hi: D9 नवांश
sanskrit:
  devanagari: नवांश
  kannada: ನವಾಂಶ
  usage: traditional term
meaning:
  en: A chart calculated from subdivisions of each sign to explore partnership.
  kn: ಸಹಭಾಗಿತ್ವ ವಿಷಯವನ್ನು ನೋಡಲು ಬಳಸುವ ನಕ್ಷೆ.
  hi: साझेदारी को समझने के लिए देखी जाने वाली पत्री।
admin_note: Start at the natal sign for movable signs, its ninth for fixed signs and its fifth for dual signs.
aliases:
- Navamsa
- Navamsha

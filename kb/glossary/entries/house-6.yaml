id: glossary.terms.house-6
term:
  en: House 6
  kn: ಅರಿಭಾವ
  hi: अरिभाव
sanskrit:
  devanagari: अरिभाव
  kannada: ಅರಿಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore challenges and obligations.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಹೊಣೆಗಾರಿಕೆ ಮತ್ತು ಸವಾಲುಗಳು ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में चुनौतियाँ और दायित्व से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists debts, disagreements, health
  concerns among its subjects.

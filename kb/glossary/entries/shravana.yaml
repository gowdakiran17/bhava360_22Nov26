id: glossary.terms.shravana
term:
  en: Shravana
  kn: ಶ್ರವಣ
  hi: श्रवण
sanskrit:
  devanagari: श्रवण
  kannada: ಶ್ರವಣ
  usage: traditional term
meaning:
  en: Section 22 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 22ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 22।
admin_note: 'Application in vedic.nakshatras.shravana: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'

id: glossary.terms.bhujaga
term:
  en: Bhujaga
  kn: ಭುಜಗ
  hi: भुजग
sanskrit:
  devanagari: भुजग
  kannada: ಭುಜಗ
  usage: traditional term
meaning:
  en: The traditional name for entrance position N6 in the building plan.
  kn: ಕಟ್ಟಡದ ನಕ್ಷೆಯಲ್ಲಿ N6 ಪ್ರವೇಶ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು.
  hi: भवन के नक्शे में प्रवेश की जगह N6 का पारंपरिक नाम।
admin_note: This name identifies the symbolic attribution in the cited KB table. The entrance grid places it at N6.

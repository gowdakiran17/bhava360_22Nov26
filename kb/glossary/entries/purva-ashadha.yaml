id: glossary.terms.purva-ashadha
term:
  en: Purva Ashadha
  kn: ಪೂರ್ವಾಷಾಢಾ
  hi: पूर्वाषाढा
sanskrit:
  devanagari: पूर्वाषाढा
  kannada: ಪೂರ್ವಾಷಾಢಾ
  usage: traditional term
meaning:
  en: Section 20 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 20ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 20।
admin_note: 'Application in vedic.nakshatras.purva-ashadha: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

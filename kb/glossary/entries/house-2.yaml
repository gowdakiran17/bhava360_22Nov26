id: glossary.terms.house-2
term:
  en: House 2
  kn: ಧನಭಾವ
  hi: धनभाव
sanskrit:
  devanagari: धनभाव
  kannada: ಧನಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore family resources and speech.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಕುಟುಂಬದ ಸಂಪನ್ಮೂಲಗಳು ಮತ್ತು ಮಾತು ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में पारिवारिक संसाधन और वाणी से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists stored resources, family
  traditions, speech among its subjects.
aliases:
- Dhana

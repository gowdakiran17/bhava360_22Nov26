id: glossary.terms.uttara-bhadrapada
term:
  en: Uttara Bhadrapada
  kn: ಉತ್ತರಭಾದ್ರಪದಾ
  hi: उत्तरभाद्रपदा
sanskrit:
  devanagari: उत्तरभाद्रपदा
  kannada: ಉತ್ತರಭಾದ್ರಪದಾ
  usage: traditional term
meaning:
  en: Section 26 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 26ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 26।
admin_note: 'Application in vedic.nakshatras.uttara-bhadrapada: Match the stable natal Moon nakshatra when its sidereal
  longitude falls in the recorded half-open span.'
aliases: []
reference_rules:

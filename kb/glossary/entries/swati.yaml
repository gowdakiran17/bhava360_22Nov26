id: glossary.terms.swati
term:
  en: Swati
  kn: ಸ್ವಾತೀ
  hi: स्वाती
sanskrit:
  devanagari: स्वाती
  kannada: ಸ್ವಾತೀ
  usage: traditional term
meaning:
  en: Section 15 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 15ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 15।
admin_note: 'Application in vedic.nakshatras.swati: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

id: glossary.terms.libra
term:
  en: Libra
  kn: ತುಲಾ
  hi: तुला
sanskrit:
  devanagari: तुला
  kannada: ತುಲಾ
  usage: traditional term
meaning:
  en: Sign number 7 in the twelve-part circle, covering degrees 180 to 210.
  kn: ರಾಶಿಚಕ್ರದ 7ನೇ ಭಾಗ, 180ರಿಂದ 210 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 7, 180 से 210 अंश तक।
admin_note: 'Application in western.signs.libra: The selected tropical point falls in [180, 210) degrees from the March
  equinox. Cardinal air; modern ruler venus, traditional ruler venus.'
aliases:
- Tula

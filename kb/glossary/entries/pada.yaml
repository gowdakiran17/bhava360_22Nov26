id: glossary.terms.pada
term:
  en: Pada
  kn: ಪಾದ
  hi: पाद
sanskrit:
  devanagari: पाद
  kannada: ಪಾದ
  usage: traditional term
meaning:
  en: One of the four equal parts of a Moon section, or a marked section of an entrance in home planning.
  kn: ಚಂದ್ರನ ವಿಭಾಗದ ನಾಲ್ಕು ಸಮಭಾಗಗಳಲ್ಲಿ ಒಂದು ಅಥವಾ ಪ್ರವೇಶದ್ವಾರದ ಗುರುತಿಸಿದ ಭಾಗ.
  hi: चंद्रमा के एक आकाश खंड का चौथाई भाग या घर के प्रवेश का चिह्नित हिस्सा।
admin_note: Use this label for one of the four equal parts of a Moon section, or a marked section of an entrance in home
  planning. Read the linked entries for the applicable conditions and differences between methods.
aliases:
- Padas
- Nakshatra quarter
- ನಕ್ಷತ್ರ ಪಾದ
- नक्षत्र चरण
- Quarter
- चरण

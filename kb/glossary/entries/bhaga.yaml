id: glossary.terms.bhaga
term:
  en: Bhaga
  kn: ಭಗ
  hi: भग
sanskrit:
  devanagari: भग
  kannada: ಭಗ
  usage: traditional term
meaning:
  en: Bhaga is a traditional figure associated with Purva Phalguni.
  kn: 'ಚಂದ್ರನ ವಿಭಾಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು: ಪೂರ್ವಫಲ್ಗುನೀ.'
  hi: 'चंद्र पथ के इस हिस्से से जुड़ा पारंपरिक नाम: पूर्वफल्गुनी।'
admin_note: This name identifies the symbolic attribution in the cited KB table. Read the linked star entries for the
  source and any competing assignment. Select the star using its measured span.
aliases: []

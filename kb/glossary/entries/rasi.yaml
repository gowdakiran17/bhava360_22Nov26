id: glossary.terms.rasi
term:
  en: Rasi
  kn: ರಾಶಿ
  hi: राशि
sanskrit:
  devanagari: राशि
  kannada: ರಾಶಿ
  usage: traditional term
meaning:
  en: One of twelve equal sections of the path used to mark positions in the sky.
  kn: ಆಕಾಶದ ಸ್ಥಾನಗಳನ್ನು ಗುರುತಿಸುವ ಮಾರ್ಗದ ಹನ್ನೆರಡು ಸಮಭಾಗಗಳಲ್ಲಿ ಒಂದು.
  hi: आकाश में स्थिति बताने वाले मार्ग के बारह बराबर भागों में से एक।
admin_note: Use this label for one of twelve equal sections of the path used to mark positions in the sky. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- Rashi
- zodiac sign
- Raasi

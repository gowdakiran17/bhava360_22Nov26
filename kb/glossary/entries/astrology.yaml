id: glossary.terms.astrology
term:
  en: Astrology
  kn: ಜ್ಯೋತಿಷ ಅಧ್ಯಯನ
  hi: ज्योतिष अध्ययन
sanskrit:
  devanagari: ज्योतिर्विचार
  kannada: ಜ್ಯೋತಿರ್ವಿಚಾರ
  usage: descriptive equivalent
meaning:
  en: A family of traditions that interpret sky positions in relation to human questions.
  kn: ಮಾನವರ ಪ್ರಶ್ನೆಗಳೊಂದಿಗೆ ಆಕಾಶದ ಸ್ಥಾನಗಳನ್ನು ಜೋಡಿಸಿ ಓದುವ ಪರಂಪರೆಗಳ ಸಮೂಹ.
  hi: आकाश की स्थितियों को मनुष्य के सवालों से जोड़कर पढ़ने की परंपराएँ।
admin_note: Use this label for a family of traditions that interpret sky positions in relation to human questions. Read
  the linked entries for the applicable conditions and differences between methods.
aliases: []
reference_rules: []

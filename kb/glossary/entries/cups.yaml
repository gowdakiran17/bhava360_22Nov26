id: glossary.terms.cups
term:
  en: Cups
  kn: ಚಷಕಾಃ
  hi: चषकाः
sanskrit:
  devanagari: चषकाः
  kannada: ಚಷಕಾಃ
  usage: descriptive equivalent
meaning:
  en: The tarot suit pictured with vessels, often used to explore feelings and relationships.
  kn: ಭಾವನೆ ಮತ್ತು ಸಂಬಂಧಗಳನ್ನು ಪರಿಶೀಲಿಸಲು ಬಳಸುವ ಪಾತ್ರೆ ಗುರುತಿನ ಪತ್ರಗಳ ಗುಂಪು.
  hi: भावनाओं और संबंधों पर विचार करने वाला प्याला चिह्न का पत्ता समूह।
admin_note: Use this label for the tarot suit pictured with vessels, often used to explore feelings and relationships.
  Read the linked entries for the applicable conditions and differences between methods.

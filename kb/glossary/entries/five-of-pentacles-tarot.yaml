id: glossary.terms.five-of-pentacles-tarot
term:
  en: Five Of Pentacles (Tarot)
  kn: ನಾಣ್ಯ · ಐದು
  hi: मुद्रा · पाँच
sanskrit:
  devanagari: मुद्रा पञ्च
  kannada: ಮುದ್ರಾ ಪಞ್ಚ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank five in the pentacles family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ನಾಣ್ಯ · ಐದು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में मुद्रा · पाँच की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on seeking practical
  help. What comes to mind in this position?'
aliases:
- Five Of Pentacles
reference_rules:
- tarot.minor-arcana.five-of-pentacles-upright
- tarot.minor-arcana.five-of-pentacles-reversed
used_by:

id: glossary.terms.ashlesha
term:
  en: Ashlesha
  kn: ಆಶ್ಲೇಷಾ
  hi: आश्लेषा
sanskrit:
  devanagari: आश्लेषा
  kannada: ಆಶ್ಲೇಷಾ
  usage: traditional term
meaning:
  en: Section 9 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 9ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 9।
admin_note: 'Application in vedic.nakshatras.ashlesha: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

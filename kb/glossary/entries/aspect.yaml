id: glossary.terms.aspect
term:
  en: Aspect
  kn: ದೃಷ್ಟಿ
  hi: दृष्टि
sanskrit:
  devanagari: दृष्टि
  kannada: ದೃಷ್ಟಿ
  usage: traditional term
meaning:
  en: A relationship between two positions in a chart defined by their angle or where they fall.
  kn: ನಕ್ಷೆಯ ಎರಡು ಸ್ಥಾನಗಳ ಕೋನ ಅಥವಾ ಅವು ಇರುವ ಸ್ಥಳದ ಆಧಾರದ ಸಂಬಂಧ.
  hi: नक्शे में दो स्थानों के बीच उनके कोण या जगह के आधार पर देखा गया संबंध।
admin_note: The Western rules use angular distance. The Indian rules may count places from a planet or link whole signs.
  Use the selected method.
aliases:
- Aspects
- Drishti
- Dṛṣṭi
reference_rules: []

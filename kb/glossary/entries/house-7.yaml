id: glossary.terms.house-7
term:
  en: House 7
  kn: ಯುವತಿಭಾವ
  hi: युवतिभाव
sanskrit:
  devanagari: युवतिभाव
  kannada: ಯುವತಿಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore partnership.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಒಡನಾಟ ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में साझेदारी से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists committed partnership, agreements,
  one-to-one dealings among its subjects.

id: glossary.terms.mount
term:
  en: Mount
  kn: ಅಂಗೈ ಉಬ್ಬು
  hi: हथेली का उभार
sanskrit:
  devanagari: करतलोन्नति
  kannada: ಕರತಲೋನ್ನತಿ
  usage: descriptive equivalent
meaning:
  en: A raised pad of the palm that a person can identify on an illustration.
  kn: ಚಿತ್ರದಲ್ಲಿ ಗುರುತಿಸಬಹುದಾದ ಅಂಗೈಯ ಎತ್ತರವಾದ ಮೃದುವಾದ ಭಾಗ.
  hi: हथेली का उभरा हुआ हिस्सा जिसे चित्र में पहचाना जा सकता है।
admin_note: Use this label for a raised pad of the palm that a person can identify on an illustration. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- palm mount
- mounts

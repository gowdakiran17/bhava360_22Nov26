id: glossary.terms.panchang
term:
  en: Panchang
  kn: ಪಞ್ಚಾಙ್ಗ
  hi: पञ्चाङ्ग
sanskrit:
  devanagari: पञ्चाङ्ग
  kannada: ಪಞ್ಚಾಙ್ಗ
  usage: traditional term
meaning:
  en: A calendar that describes each day using five measures of time and sky position.
  kn: ದಿನವನ್ನು ಕಾಲ ಮತ್ತು ಆಕಾಶಸ್ಥಾನದ ಐದು ಅಂಶಗಳಿಂದ ವಿವರಿಸುವ ಪಂಚಾಂಗ.
  hi: दिन को समय और आकाश की स्थिति से जुड़े पाँच पहलुओं से बताने वाला कैलेंडर।
admin_note: Use this label for a calendar that describes each day using five measures of time and sky position. Read
  the linked entries for the applicable conditions and differences between methods.
aliases:
- Panchanga
- Panchangam
- ಪಂಚಾಂಗ
- पंचांग

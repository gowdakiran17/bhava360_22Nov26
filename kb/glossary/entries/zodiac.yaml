id: glossary.terms.zodiac
term:
  en: Zodiac
  kn: ರಾಶಿಚಕ್ರ
  hi: राशि चक्र
sanskrit:
  devanagari: राशिचक्र
  kannada: ರಾಶಿಚಕ್ರ
  usage: descriptive equivalent
meaning:
  en: The circle used to mark places along the Sun’s apparent yearly path, usually divided into twelve signs.
  kn: ಸೂರ್ಯನ ವಾರ್ಷಿಕ ಪಥದ ಸ್ಥಾನಗಳನ್ನು ಗುರುತಿಸುವ ಹನ್ನೆರಡು ಭಾಗಗಳ ವೃತ್ತ.
  hi: सूर्य की दिखाई देने वाली सालाना राह पर जगह बताने का बारह हिस्सों वाला चक्र।
admin_note: Use this label for the circle used to mark places along the Sun’s apparent yearly path, usually divided into
  twelve signs. Read the linked entries for the applicable conditions and differences between methods.
aliases: []
reference_rules: []

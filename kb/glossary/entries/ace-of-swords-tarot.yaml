id: glossary.terms.ace-of-swords-tarot
term:
  en: Ace Of Swords (Tarot)
  kn: ಕತ್ತಿ · ಒಂದು
  hi: तलवार · इक्का
sanskrit:
  devanagari: खड्ग एक
  kannada: ಖಡ್ಗ ಏಕ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank ace in the swords family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಕತ್ತಿ · ಒಂದು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में तलवार · इक्का की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on a clear idea.
  What comes to mind in this position?'
aliases:
- Ace Of Swords
reference_rules:

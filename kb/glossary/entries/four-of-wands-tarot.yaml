id: glossary.terms.four-of-wands-tarot
term:
  en: Four Of Wands (Tarot)
  kn: ಕೋಲು · ನಾಲ್ಕು
  hi: छड़ी · चार
sanskrit:
  devanagari: दण्ड चतुर्
  kannada: ದಣ್ಡ ಚತುರ್
  usage: descriptive rendering of card title
meaning:
  en: The card of rank four in the wands family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಕೋಲು · ನಾಲ್ಕು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में छड़ी · चार की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on celebrating
  together. What comes to mind in this position?'
aliases:
- Four Of Wands
reference_rules:
- tarot.minor-arcana.four-of-wands-upright
- tarot.minor-arcana.four-of-wands-reversed
used_by:

  kn: ಮೃಗ
  hi: मृग
sanskrit:
  devanagari: मृग
  kannada: ಮೃಗ
  usage: traditional term
meaning:
  en: The traditional name for entrance position S8 in the building plan.
  kn: ಕಟ್ಟಡದ ನಕ್ಷೆಯಲ್ಲಿ S8 ಪ್ರವೇಶ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು.
  hi: भवन के नक्शे में प्रवेश की जगह S8 का पारंपरिक नाम।
admin_note: This name identifies the symbolic attribution in the cited KB table. The entrance grid places it at S8.

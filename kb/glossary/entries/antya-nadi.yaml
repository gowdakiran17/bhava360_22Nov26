id: glossary.terms.antya-nadi
term:
  en: Antya Nadi
  kn: ಅನ್ತ್ಯ ನಾಡೀ
  hi: अन्त्य नाडी
sanskrit:
  devanagari: अन्त्य नाडी
  kannada: ಅನ್ತ್ಯ ನಾಡೀ
  usage: traditional term
meaning:
  en: Birth-star group 3 of three used for one part of marriage matching.
  kn: ವಿವಾಹ ಹೊಂದಾಣಿಕೆಯಲ್ಲಿ ಬಳಸುವ ಮೂರು ನಕ್ಷತ್ರ ಗುಂಪುಗಳಲ್ಲಿ 3ನೇ ಗುಂಪು.
  hi: विवाह मिलान में जन्म तारों की तीन श्रेणियों में क्रम 3।
admin_note: 'Application in vedic.matching.nadi: Look up each Moon’s birth star in the three Nadi groups, then read the
  class-pair matrix. Keep the raw points when a selected exception softens interpretation.'
aliases:
- Antya
reference_rules:
- vedic.matching.nadi
used_by:

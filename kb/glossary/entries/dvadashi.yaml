id: glossary.terms.dvadashi
term:
  en: Dvadashi
  kn: ದ್ವಾದಶೀ
  hi: द्वादशी
sanskrit:
  devanagari: द्वादशी
  kannada: ದ್ವಾದಶೀ
  usage: traditional term
meaning:
  en: Lunar day 12 of a fortnight, measured by the changing distance of the Moon from the Sun.
  kn: ಚಂದ್ರಪಕ್ಷದ 12ನೇ ದಿನ.
  hi: चंद्र पक्ष का 12वाँ दिन।
admin_note: 'Application in vedic.panchang.tithi: At the query instant compute E = (Moon − Sun) modulo 1296000 arcseconds.
  The public number is 1 + floor(E / 43200); use the zero-based quotient for indexing only. Resolve name and paksha in
  limb-tables.yaml and bracket the two true crossings as specified in limbs.yaml.'
aliases: []
reference_rules:
- vedic.panchang.tithi
used_by:
- vedic.panchang.amavasya
- vedic.panchang.ekadashi
- vedic.panchang.purnima
- vedic.panchang.tithi

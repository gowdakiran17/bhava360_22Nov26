id: glossary.terms.virupa
term:
  en: Virupa
  kn: ವಿರೂಪ
  hi: विरूप
sanskrit:
  devanagari: विरूप
  kannada: ವಿರೂಪ
  usage: traditional term
meaning:
  en: One sixtieth of a full unit used to record planetary strength.
  kn: ಗ್ರಹಬಲದ ಪೂರ್ಣ ಘಟಕದ ಅರವತ್ತರಲ್ಲಿ ಒಂದು ಭಾಗ.
  hi: ग्रह बल की पूरी इकाई का साठवाँ हिस्सा।
admin_note: Use this label for one sixtieth of a full unit used to record planetary strength. Read the linked entries
  for the applicable conditions and differences between methods.
aliases:
- Virupas

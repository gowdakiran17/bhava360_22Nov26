id: glossary.terms.virgo
term:
  en: Virgo
  kn: ಕನ್ಯಾ
  hi: कन्या
sanskrit:
  devanagari: कन्या
  kannada: ಕನ್ಯಾ
  usage: traditional term
meaning:
  en: Sign number 6 in the twelve-part circle, covering degrees 150 to 180.
  kn: ರಾಶಿಚಕ್ರದ 6ನೇ ಭಾಗ, 150ರಿಂದ 180 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 6, 150 से 180 अंश तक।
admin_note: 'Application in western.signs.virgo: The selected tropical point falls in [150, 180) degrees from the March
  equinox. Mutable earth; modern ruler mercury, traditional ruler mercury.'
aliases:
- Kanya

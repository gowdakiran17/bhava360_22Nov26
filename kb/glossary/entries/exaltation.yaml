id: glossary.terms.exaltation
term:
  en: Exaltation
  kn: ಉಚ್ಚ
  hi: उच्च
sanskrit:
  devanagari: उच्च
  kannada: ಉಚ್ಚ
  usage: traditional term
meaning:
  en: The sign or precise position in which a planet is traditionally considered especially well placed.
  kn: ಒಂದು ಗ್ರಹಕ್ಕೆ ಹೆಚ್ಚಿನ ಬೆಂಬಲವಿದೆ ಎಂದು ಪರಿಗಣಿಸುವ ರಾಶಿ ಅಥವಾ ಬಿಂದು.
  hi: वह राशि या बिंदु जहाँ ग्रह को विशेष बल वाला माना जाता है।
admin_note: 'Application in vedic.strength-shadbala.uchcha: Take the shorter longitude arc in degrees from the exact
  KB-02 debilitation point and divide by three. The opposite point gives sixty virupas.'
aliases:
- exalted
- Uchcha
reference_rules: []

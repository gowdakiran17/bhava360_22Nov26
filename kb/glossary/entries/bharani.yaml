id: glossary.terms.bharani
term:
  en: Bharani
  kn: ಭರಣೀ
  hi: भरणी
sanskrit:
  devanagari: भरणी
  kannada: ಭರಣೀ
  usage: traditional term
meaning:
  en: Section 2 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 2ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 2।
admin_note: 'Application in vedic.nakshatras.bharani: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

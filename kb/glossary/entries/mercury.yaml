id: glossary.terms.mercury
term:
  en: Mercury
  kn: ಬುಧ
  hi: बुध
sanskrit:
  devanagari: बुध
  kannada: ಬುಧ
  usage: traditional term
meaning:
  en: The planet closest to the Sun.
  kn: ಸೂರ್ಯನಿಗೆ ಅತ್ಯಂತ ಹತ್ತಿರದ ಗ್ರಹ.
  hi: सूर्य का सबसे पास का ग्रह।
admin_note: 'Application in western.planets.mercury: The selected tropical natal body is mercury. Read its sign as a
  style and its house as an area of experience.'
aliases:
- Budha

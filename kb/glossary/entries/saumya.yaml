id: glossary.terms.saumya
term:
  en: Saumya
  kn: ಸೌಮ್ಯ
  hi: सौम्य
sanskrit:
  devanagari: सौम्य
  kannada: ಸೌಮ್ಯ
  usage: traditional term
meaning:
  en: A traditional category for a sign or planet described as gentle.
  kn: ರಾಶಿ ಅಥವಾ ಗ್ರಹಕ್ಕೆ ಸೌಮ್ಯತೆ ಸೂಚಿಸುವ ಸಾಂಪ್ರದಾಯಿಕ ವರ್ಗ.
  hi: राशि या ग्रह में कोमलता बताने वाली पारंपरिक श्रेणी।
admin_note: Use this label for a traditional category for a sign or planet described as gentle. Read the linked entries
  for the applicable conditions and differences between methods.

id: glossary.terms.debilitation
term:
  en: Debilitation
  kn: ನೀಚ
  hi: नीच
sanskrit:
  devanagari: नीच
  kannada: ನೀಚ
  usage: traditional term
meaning:
  en: The sign opposite a planet’s most strongly supported sign.
  kn: ಗ್ರಹದ ಅತ್ಯಂತ ಬಲದ ರಾಶಿಗೆ ಎದುರಾಗಿರುವ ರಾಶಿ.
  hi: ग्रह के सबसे अधिक बल वाली राशि के सामने की राशि।
admin_note: Use this label for the sign opposite a planet’s most strongly supported sign. Read the linked entries for
  the applicable conditions and differences between methods.
aliases:
- debilitated
- Neecha

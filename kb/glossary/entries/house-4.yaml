id: glossary.terms.house-4
term:
  en: House 4
  kn: ಸುಖಭಾವ
  hi: सुखभाव
sanskrit:
  devanagari: सुखभाव
  kannada: ಸುಖಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore home and learning.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಮನೆ ಮತ್ತು ಕಲಿಕೆ ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में घर और सीखना से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists home, caregiving, land and
  vehicles among its subjects.
aliases:
- Sukha

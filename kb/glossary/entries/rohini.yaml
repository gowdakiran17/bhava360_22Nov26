id: glossary.terms.rohini
term:
  en: Rohini
  kn: ರೋಹಿಣೀ
  hi: रोहिणी
sanskrit:
  devanagari: रोहिणी
  kannada: ರೋಹಿಣೀ
  usage: traditional term
meaning:
  en: Section 4 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 4ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 4।
admin_note: 'Application in vedic.nakshatras.rohini: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

id: glossary.terms.harsha-yoga
term:
  en: Harsha yoga
  kn: ಹರ್ಷಯೋಗ
  hi: हर्षयोग
sanskrit:
  devanagari: हर्षयोग
  kannada: ಹರ್ಷಯೋಗ
  usage: traditional term
meaning:
  en: A traditional pattern involving the ruler associated with daily routines and service.
  kn: ದಿನಚರಿ ಮತ್ತು ಸೇವೆ ಕ್ಷೇತ್ರದ ಅಧಿಪತಿಗೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ವಿನ್ಯಾಸ.
  hi: दिनचर्या और सेवा के क्षेत्र के स्वामी से जुड़ा पारंपरिक मेल।
admin_note: Lord of house 6 occupies house 6, 8 or 12 under the broad Vipareeta screen.

id: glossary.terms.kendra
term:
  en: Kendra
  kn: ಕೇನ್ದ್ರ
  hi: केन्द्र
sanskrit:
  devanagari: केन्द्र
  kannada: ಕೇನ್ದ್ರ
  usage: traditional term
meaning:
  en: Chart areas associated with self, home, partnerships and work.
  kn: ವ್ಯಕ್ತಿತ್ವ, ಮನೆ, ಪಾಲುದಾರಿಕೆ ಮತ್ತು ಕೆಲಸಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಕ್ಷೇತ್ರಗಳು.
  hi: पहचान, घर, साझेदारी और काम से जुड़े क्षेत्र।
admin_note: Use this label for the first, fourth, seventh or tenth place counted from a starting position. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- angular house

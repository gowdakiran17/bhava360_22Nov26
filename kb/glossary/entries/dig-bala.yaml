id: glossary.terms.dig-bala
term:
  en: Dig bala
  kn: ದಿಗ್ಬಲ
  hi: दिग्बल
sanskrit:
  devanagari: दिग्बल
  kannada: ದಿಗ್ಬಲ
  usage: traditional term
meaning:
  en: The part of a planet’s traditional strength calculated from its direction in the chart.
  kn: ನಕ್ಷೆಯಲ್ಲಿ ಗ್ರಹ ಇರುವ ದಿಕ್ಕಿನಿಂದ ಲೆಕ್ಕಿಸುವ ಬಲ.
  hi: पत्री में ग्रह की दिशा से निकला बल।
admin_note: Use this label for the part of a planet’s traditional strength calculated from its direction in the chart.
  Read the linked entries for the applicable conditions and differences between methods.
aliases:
- directional strength
- Digbala
reference_rules: []

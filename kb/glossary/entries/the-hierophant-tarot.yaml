id: glossary.terms.the-hierophant-tarot
term:
  en: The Hierophant (Tarot)
  kn: ಧರ್ಮಗುರು (ಟ್ಯಾರೊ)
  hi: धर्मगुरु (टैरो)
sanskrit:
  devanagari: धर्मगुरु
  kannada: ಧರ್ಮಗುರು
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 5, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 5 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 5 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on learning from
  tradition. What comes to mind in this position?'
aliases:
- The Hierophant
reference_rules:
- tarot.major-arcana.the-hierophant-upright
- tarot.major-arcana.the-hierophant-reversed
used_by:
- tarot.major-arcana.the-hierophant-reversed
- tarot.major-arcana.the-hierophant-upright
systems:
- tarot

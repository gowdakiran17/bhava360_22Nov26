id: glossary.terms.varga
term:
  en: Varga
  kn: ವರ್ಗ
  hi: वर्ग
sanskrit:
  devanagari: वर्ग
  kannada: ವರ್ಗ
  usage: traditional term
meaning:
  en: A chart made by dividing each sign into smaller sections to explore a particular subject.
  kn: ನಿರ್ದಿಷ್ಟ ವಿಷಯವನ್ನು ನೋಡಲು ಪ್ರತಿ ರಾಶಿಯನ್ನು ಚಿಕ್ಕ ಭಾಗಗಳಾಗಿ ವಿಂಗಡಿಸಿ ಮಾಡುವ ನಕ್ಷೆ.
  hi: किसी खास विषय को समझने के लिए हर राशि को छोटे हिस्सों में बाँटकर बना नक्शा।
admin_note: Use this label for a chart made by dividing each sign into smaller sections to explore a particular subject.
  Read the linked entries for the applicable conditions and differences between methods.
aliases:
- divisional chart
- Vargas
- ವರ್ಗ ಕುಂಡಲಿ
- वर्ग कुंडली

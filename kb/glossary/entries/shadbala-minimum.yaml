id: glossary.terms.shadbala-minimum
term:
  en: Shadbala minimum
  kn: ಷಡ್ಬಲನ್ಯೂನಮಾನ
  hi: षड्बलन्यूनमान
sanskrit:
  devanagari: षड्बलन्यूनमान
  kannada: ಷಡ್ಬಲನ್ಯೂನಮಾನ
  usage: traditional term
meaning:
  en: The traditional comparison level for the six-part strength calculation of one planet.
  kn: ಒಂದು ಗ್ರಹದ ಆರು ಬಲಗಳ ಮೊತ್ತವನ್ನು ಹೋಲಿಸುವ ಸಾಂಪ್ರದಾಯಿಕ ಮಿತಿ.
  hi: एक ग्रह के छह बलों के कुल की तुलना का पारंपरिक स्तर।
admin_note: 'Application in vedic.strength-shadbala.totals: Sum the six signed components in virupas and divide by sixty
  for rupas. Compare the unrounded result with the graha minimum using greater-than-or-equal. Separately compute Ishta
  = sqrt(U × C) and Kashta = sqrt((60 − U) × (60 − C)), where U is Uchcha and C is the selected undoubled Cheshta in
  [0,60]. Neither phala enters the total. If any required input is unknown, withhold the dependent result.'
aliases: []

id: glossary.terms.dispositor
term:
  en: Dispositor
  kn: ರಾಶ್ಯಧಿಪತಿ
  hi: राश्यधिपति
sanskrit:
  devanagari: राश्यधिपति
  kannada: ರಾಶ್ಯಧಿಪತಿ
  usage: traditional term
meaning:
  en: The planet that rules the sign occupied by another planet.
  kn: ಇನ್ನೊಂದು ಗ್ರಹ ಇರುವ ರಾಶಿಯ ಅಧಿಪತಿ.
  hi: उस राशि का स्वामी जिसमें कोई दूसरा ग्रह बैठा है।
admin_note: Use this label for the planet that rules the sign occupied by another planet. Read the linked entries for
  the applicable conditions and differences between methods.
aliases:
- sign lord
- sign ruler
reference_rules: []

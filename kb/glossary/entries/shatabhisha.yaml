id: glossary.terms.shatabhisha
term:
  en: Shatabhisha
  kn: ಶತಭಿಷಜ್
  hi: शतभिषज्
sanskrit:
  devanagari: शतभिषज्
  kannada: ಶತಭಿಷಜ್
  usage: traditional term
meaning:
  en: Section 24 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 24ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 24।
admin_note: 'Application in vedic.nakshatras.shatabhisha: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

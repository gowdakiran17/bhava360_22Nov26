id: glossary.terms.sagittarius
term:
  en: Sagittarius
  kn: ಧನು
  hi: धनु
sanskrit:
  devanagari: धनुस्
  kannada: ಧನುಸ್
  usage: traditional term
meaning:
  en: Sign number 9 in the twelve-part circle, covering degrees 240 to 270.
  kn: ರಾಶಿಚಕ್ರದ 9ನೇ ಭಾಗ, 240ರಿಂದ 270 ಅಂಶಗಳವರೆಗೆ.
  hi: बारह राशियों में क्रम 9, 240 से 270 अंश तक।
admin_note: 'Application in western.signs.sagittarius: The selected tropical point falls in [240, 270) degrees from the
  March equinox. Mutable fire; modern ruler jupiter, traditional ruler jupiter.'
aliases:
- Dhanu

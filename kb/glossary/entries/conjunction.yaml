id: glossary.terms.conjunction
term:
  en: Conjunction
  kn: ಯುತಿ
  hi: युति
sanskrit:
  devanagari: युति
  kannada: ಯುತಿ
  usage: traditional term
meaning:
  en: Two bodies occupy the same sign or appear near the same point, according to the method used.
  kn: ವಿಧಾನದ ಪ್ರಕಾರ ಎರಡು ಗ್ರಹಗಳು ಒಂದೇ ರಾಶಿಯಲ್ಲಿ ಅಥವಾ ಹತ್ತಿರ ಕಾಣುವುದು.
  hi: पद्धति के अनुसार दो ग्रहों का एक राशि में या पास दिखाई देना।
admin_note: 'Application in western.aspects.conjunction: For a bound natal pair, accept shortest circular separation
  within 8 degrees of 0 degrees, inclusive.'
aliases:
- Yuti
- conjunctions

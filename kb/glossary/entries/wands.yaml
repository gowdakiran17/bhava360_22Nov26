id: glossary.terms.wands
term:
  en: Wands
  kn: ದಣ್ಡಾಃ
  hi: दण्डाः
sanskrit:
  devanagari: दण्डाः
  kannada: ದಣ್ಡಾಃ
  usage: descriptive equivalent
meaning:
  en: The tarot suit pictured with staffs, often used to explore effort and initiative.
  kn: ಪ್ರಯತ್ನ ಮತ್ತು ಮುಂದಾಳತ್ವವನ್ನು ಪರಿಶೀಲಿಸಲು ಬಳಸುವ ಕೋಲು ಗುರುತಿನ ಪತ್ರಗಳ ಗುಂಪು.
  hi: कोशिश और पहल पर विचार करने वाला छड़ी चिह्न का पत्ता समूह।
admin_note: Use this label for the tarot suit pictured with staffs, often used to explore effort and initiative. Read
  the linked entries for the applicable conditions and differences between methods.

id: glossary.terms.house-5
term:
  en: House 5
  kn: ಪುತ್ರಭಾವ
  hi: पुत्रभाव
sanskrit:
  devanagari: पुत्रभाव
  kannada: ಪುತ್ರಭಾವ
  usage: traditional term
meaning:
  en: The part of a birth chart used to explore children and understanding.
  kn: ಜನ್ಮನಕ್ಷೆಯಲ್ಲಿ ಮಕ್ಕಳು ಮತ್ತು ತಿಳುವಳಿಕೆ ಕುರಿತು ನೋಡುವ ಭಾಗ.
  hi: जन्मपत्री में संतान और समझ से जुड़ा हिस्सा।
admin_note: Count from the rising sign under the default whole-sign method. This house lists children, discernment, transmission
  of learning among its subjects.
aliases:
- Putra

id: glossary.terms.dauvarika
term:
  en: Dauvarika
  kn: ದೌವಾರಿಕ
  hi: दौवारिक
sanskrit:
  devanagari: दौवारिक
  kannada: ದೌವಾರಿಕ
  usage: traditional term
meaning:
  en: The traditional name for entrance position W2 in the building plan.
  kn: ಕಟ್ಟಡದ ನಕ್ಷೆಯಲ್ಲಿ W2 ಪ್ರವೇಶ ಸ್ಥಾನಕ್ಕೆ ನೀಡುವ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು.
  hi: भवन के नक्शे में प्रवेश की जगह W2 का पारंपरिक नाम।
admin_note: This name identifies the symbolic attribution in the cited KB table. The entrance grid places it at W2.

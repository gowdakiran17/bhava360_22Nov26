id: glossary.terms.madhya-nadi
term:
  en: Madhya Nadi
  kn: ಮಧ್ಯ ನಾಡೀ
  hi: मध्य नाडी
sanskrit:
  devanagari: मध्य नाडी
  kannada: ಮಧ್ಯ ನಾಡೀ
  usage: traditional term
meaning:
  en: Birth-star group 2 of three used for one part of marriage matching.
  kn: ವಿವಾಹ ಹೊಂದಾಣಿಕೆಯಲ್ಲಿ ಬಳಸುವ ಮೂರು ನಕ್ಷತ್ರ ಗುಂಪುಗಳಲ್ಲಿ 2ನೇ ಗುಂಪು.
  hi: विवाह मिलान में जन्म तारों की तीन श्रेणियों में क्रम 2।
admin_note: 'Application in vedic.matching.nadi: Look up each Moon’s birth star in the three Nadi groups, then read the
  class-pair matrix. Keep the raw points when a selected exception softens interpretation.'
aliases:
- Madhya
reference_rules:
- vedic.matching.nadi
used_by:
- vedic.matching.nadi

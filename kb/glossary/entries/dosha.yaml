id: glossary.terms.dosha
term:
  en: Dosha
  kn: ದೋಷ
  hi: दोष
sanskrit:
  devanagari: दोष
  kannada: ದೋಷ
  usage: traditional term
meaning:
  en: A traditional label for a combination that readers examine more closely.
  kn: ಹೆಚ್ಚು ಗಮನದಿಂದ ಪರಿಶೀಲಿಸುವ ಜೋಡಣೆಗೆ ಬಳಸುವ ಸಾಂಪ್ರದಾಯಿಕ ಹೆಸರು.
  hi: किसी विशेष मेल का पारंपरिक नाम जिसे पढ़ते समय अधिक ध्यान से देखा जाता है।
admin_note: Use this label for a traditional label for a combination that readers examine more closely. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- Doshas

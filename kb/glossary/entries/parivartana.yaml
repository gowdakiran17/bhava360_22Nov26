id: glossary.terms.parivartana
term:
  en: Parivartana
  kn: ಪರಿವರ್ತನ
  hi: परिवर्तन
sanskrit:
  devanagari: परिवर्तन
  kannada: ಪರಿವರ್ತನ
  usage: traditional term
meaning:
  en: Two planets each occupy a sign ruled by the other.
  kn: ಎರಡು ಗ್ರಹಗಳು ಪರಸ್ಪರರ ರಾಶಿಯಲ್ಲಿ ಇರುವುದು.
  hi: दो ग्रहों का एक दूसरे की राशि में होना।
admin_note: 'Application in vedic.yogas.parivartana: For the bound pair of distinct houses, their two distinct classical
  sign rulers each occupy the other house in the same whole-sign D1 chart. A shared ruler cannot exchange with itself.'
aliases:
- mutual exchange
- exchange of signs
reference_rules: []

id: glossary.terms.rulership
term:
  en: Rulership
  kn: ಅಧಿಪತ್ಯ
  hi: स्वामित्व
sanskrit:
  devanagari: अधिपत्य
  kannada: ಅಧಿಪತ್ಯ
  usage: descriptive equivalent
meaning:
  en: The traditional association that assigns a planet responsibility for a sign.
  kn: ಒಂದು ರಾಶಿಗೆ ನಿರ್ದಿಷ್ಟ ಗ್ರಹವನ್ನು ಅಧಿಪತಿಯಾಗಿ ನೀಡುವ ಸಂಬಂಧ.
  hi: किसी राशि को एक ग्रह का क्षेत्र मानने वाला पारंपरिक संबंध।
admin_note: Use this label for the traditional association that assigns a planet responsibility for a sign. Read the
  linked entries for the applicable conditions and differences between methods.
aliases:
- rulerships
reference_rules: []

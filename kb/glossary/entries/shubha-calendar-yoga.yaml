id: glossary.terms.shubha-calendar-yoga
term:
  en: Shubha (calendar yoga)
  kn: ಶುಭ
  hi: शुभ
sanskrit:
  devanagari: शुभ
  kannada: ಶುಭ
  usage: traditional term
meaning:
  en: Interval 23 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 23ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 23।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Shubha

id: glossary.terms.vastu-zone
term:
  en: Vastu zone
  kn: ವಾಸ್ತು ವಲಯ
  hi: वास्तु क्षेत्र
sanskrit:
  devanagari: वास्तुविभाग
  kannada: ವಾಸ್ತುವಿಭಾಗ
  usage: descriptive equivalent
meaning:
  en: A part of a floor plan identified by its direction or its position at the centre.
  kn: ದಿಕ್ಕು ಅಥವಾ ಕೇಂದ್ರದ ಸ್ಥಾನದಿಂದ ಗುರುತಿಸುವ ಮನೆಯ ನಕ್ಷೆಯ ಒಂದು ಭಾಗ.
  hi: घर के नक्शे का वह हिस्सा जिसकी पहचान दिशा या बीच की जगह से होती है।
admin_note: Use this label for a part of a floor plan identified by its direction or its position at the centre. Read
  the linked entries for the applicable conditions and differences between methods.
aliases:
- Vastu zones

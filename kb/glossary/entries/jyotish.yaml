id: glossary.terms.jyotish
term:
  en: Jyotish
  kn: ಜ್ಯೋತಿಷ
  hi: ज्योतिष
sanskrit:
  devanagari: ज्योतिष
  kannada: ಜ್ಯೋತಿಷ
  usage: traditional term
meaning:
  en: An Indian tradition of calendar calculation and interpretation of the sky.
  kn: ಕಾಲಗಣನೆ ಮತ್ತು ಆಕಾಶದ ಸ್ಥಾನಗಳ ಅರ್ಥೈಸುವಿಕೆಯ ಭಾರತೀಯ ಪರಂಪರೆ.
  hi: समय की गणना और आकाश की स्थिति पढ़ने की भारतीय परंपरा।
admin_note: Use this label for an Indian tradition of calendar calculation and interpretation of the sky. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- Jyotisha

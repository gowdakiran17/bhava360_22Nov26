id: glossary.terms.trine
term:
  en: Trine
  kn: ತ್ರಿಕೋಣಸಮ್ಬನ್ಧ
  hi: त्रिकोणसम्बन्ध
sanskrit:
  devanagari: त्रिकोणसम्बन्ध
  kannada: ತ್ರಿಕೋಣಸಮ್ಬನ್ಧ
  usage: descriptive equivalent
meaning:
  en: Two positions about 120 degrees apart around the sky.
  kn: ಆಕಾಶವೃತ್ತದಲ್ಲಿ ಸುಮಾರು 120 ಅಂಶ ದೂರವಿರುವ ಎರಡು ಸ್ಥಾನಗಳು.
  hi: आकाश के चक्र में लगभग 120 अंश दूर दो स्थान।
admin_note: 'Application in western.aspects.trine: For a bound natal pair, accept shortest circular separation within
  6 degrees of 120 degrees, inclusive.'

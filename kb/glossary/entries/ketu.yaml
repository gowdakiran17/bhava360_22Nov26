id: glossary.terms.ketu
term:
  en: Ketu
  kn: ಕೇತು
  hi: केतु
sanskrit:
  devanagari: केतु
  kannada: ಕೇತು
  usage: traditional term
meaning:
  en: The point where the Moon crosses the Sun’s apparent path heading south.
  kn: ಚಂದ್ರನು ಸೂರ್ಯನ ಪಥವನ್ನು ದಕ್ಷಿಣಕ್ಕೆ ದಾಟುವ ಬಿಂದು.
  hi: वह बिंदु जहाँ चंद्रमा सूर्य के मार्ग को दक्षिण की ओर काटता है।
admin_note: 'Application in vedic.planets.ketu: Match Ketu when the selected D1 chart point is its computed natal placement.'
aliases:
- descending node
- south node

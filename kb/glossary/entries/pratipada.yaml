id: glossary.terms.pratipada
term:
  en: Pratipada
  kn: ಪ್ರತಿಪದಾ
  hi: प्रतिपदा
sanskrit:
  devanagari: प्रतिपदा
  kannada: ಪ್ರತಿಪದಾ
  usage: traditional term
meaning:
  en: Lunar day 1 of a fortnight, measured by the changing distance of the Moon from the Sun.
  kn: ಚಂದ್ರಪಕ್ಷದ 1ನೇ ದಿನ.
  hi: चंद्र पक्ष का 1वाँ दिन।
admin_note: 'Application in vedic.panchang.tithi: At the query instant compute E = (Moon − Sun) modulo 1296000 arcseconds.
  The public number is 1 + floor(E / 43200); use the zero-based quotient for indexing only. Resolve name and paksha in
  limb-tables.yaml and bracket the two true crossings as specified in limbs.yaml.'
aliases: []
reference_rules:
- vedic.panchang.tithi
used_by:
- vedic.panchang.tithi
- vedic.panchang.ugadi

id: glossary.terms.short-finger-proportion
term:
  en: Short finger proportion
  kn: ಅಂಗೈಗೆ ಹೋಲಿಸಿದರೆ ಚಿಕ್ಕ ಬೆರಳುಗಳು
  hi: हथेली की तुलना में छोटी उँगलियाँ
sanskrit:
  devanagari: ह्रस्व अङ्गुलिप्रमाण
  kannada: ಹ್ರಸ್ವ ಅಙ್ಗುಲಿಪ್ರಮಾಣ
  usage: descriptive equivalent
meaning:
  en: Fingers look short relative to the palm.
  kn: ಅಂಗೈಗೆ ಹೋಲಿಸಿದರೆ ಚಿಕ್ಕ ಬೆರಳುಗಳು.
  hi: हथेली की तुलना में छोटी उँगलियाँ।
admin_note: Use the illustration for the selected physical hand. The reader reports their own choice. The linked entries
  distinguish left and right.

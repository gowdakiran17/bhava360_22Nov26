id: glossary.terms.kalapurusha
term:
  en: Kalapurusha
  kn: ಕಾಲಪುರುಷ
  hi: कालपुरुष
sanskrit:
  devanagari: कालपुरुष
  kannada: ಕಾಲಪುರುಷ
  usage: traditional term
meaning:
  en: A symbolic figure used to associate the twelve signs with parts of the body.
  kn: ಹನ್ನೆರಡು ರಾಶಿಗಳಿಗೆ ದೇಹದ ಭಾಗಗಳನ್ನು ಸಾಂಕೇತಿಕವಾಗಿ ಜೋಡಿಸುವ ಆಕೃತಿ.
  hi: बारह राशियों को शरीर के अंगों से जोड़ने वाला प्रतीकात्मक रूप।
admin_note: Use this label for a symbolic figure used to associate the twelve signs with parts of the body. Read the
  linked entries for the applicable conditions and differences between methods.

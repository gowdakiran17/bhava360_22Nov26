id: glossary.terms.the-chariot-tarot
term:
  en: The Chariot (Tarot)
  kn: ರಥ (ಟ್ಯಾರೊ)
  hi: रथ (टैरो)
sanskrit:
  devanagari: रथ
  kannada: ರಥ
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 7, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 7 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 7 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on choosing a
  direction. What comes to mind in this position?'
aliases:
- The Chariot
reference_rules:
- tarot.major-arcana.the-chariot-upright
- tarot.major-arcana.the-chariot-reversed
used_by:
- tarot.major-arcana.the-chariot-reversed
- tarot.major-arcana.the-chariot-upright
systems:
- tarot

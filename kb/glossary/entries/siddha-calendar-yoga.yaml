id: glossary.terms.siddha-calendar-yoga
term:
  en: Siddha (calendar yoga)
  kn: ಸಿದ್ಧ
  hi: सिद्ध
sanskrit:
  devanagari: सिद्ध
  kannada: ಸಿದ್ಧ
  usage: traditional term
meaning:
  en: Interval 21 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 21ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 21।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Siddha
reference_rules:
- vedic.panchang.yoga
used_by:
- vedic.panchang.yoga
systems:
- vedic

id: glossary.terms.electional-astrology
term:
  en: Electional astrology
  kn: ಆರಂಭಕಾಲದ ಆಯ್ಕೆ
  hi: आरंभ समय का चयन
sanskrit:
  devanagari: मुहूर्तविचार
  kannada: ಮುಹೂರ್ತವಿಚಾರ
  usage: descriptive equivalent
meaning:
  en: Using calendar and sky conditions to compare possible starting times for an activity.
  kn: ಕೆಲಸಕ್ಕೆ ಆರಂಭದ ಸಮಯಗಳನ್ನು ಹೋಲಿಸಲು ಪಂಚಾಂಗ ಮತ್ತು ಆಕಾಶದ ಸ್ಥಿತಿಗಳನ್ನು ಬಳಸುವುದು.
  hi: किसी काम के संभावित आरंभ समयों की तुलना के लिए पंचांग और आकाश की स्थितियाँ देखना।
admin_note: Use this label for using calendar and sky conditions to compare possible starting times for an activity.
  Read the linked entries for the applicable conditions and differences between methods.
aliases:
- electional

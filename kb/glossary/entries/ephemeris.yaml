id: glossary.terms.ephemeris
term:
  en: Ephemeris
  kn: ಗ್ರಹಸಾರಣೀ
  hi: ग्रहसारणी
sanskrit:
  devanagari: ग्रहसारणी
  kannada: ಗ್ರಹಸಾರಣೀ
  usage: traditional term
meaning:
  en: A table or calculation giving the positions of celestial bodies for particular times.
  kn: ನಿಗದಿತ ಕಾಲಕ್ಕೆ ಆಕಾಶಕಾಯಗಳ ಸ್ಥಾನ ತೋರಿಸುವ ಕೋಷ್ಟಕ ಅಥವಾ ಲೆಕ್ಕ.
  hi: तय समय पर आकाशीय पिंडों की जगह देने वाली तालिका या गणना।
admin_note: Use this label for a table or calculation giving the positions of celestial bodies for particular times.
  Read the linked entries for the applicable conditions and differences between methods.

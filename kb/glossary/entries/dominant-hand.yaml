id: glossary.terms.dominant-hand
term:
  en: Dominant hand
  kn: ಪ್ರಧಾನಹಸ್ತ
  hi: प्रधानहस्त
sanskrit:
  devanagari: प्रधानहस्त
  kannada: ಪ್ರಧಾನಹಸ್ತ
  usage: traditional term
meaning:
  en: The hand a person reports using more often for skilled tasks.
  kn: ಸೂಕ್ಷ್ಮ ಕೆಲಸಕ್ಕೆ ತಾನು ಹೆಚ್ಚು ಬಳಸುವುದಾಗಿ ವ್ಯಕ್ತಿಯೇ ಗುರುತಿಸುವ ಕೈ.
  hi: बारीक काम के लिए व्यक्ति जिस हाथ का अधिक उपयोग बताता है।
admin_note: Use this label for the hand a person reports using more often for skilled tasks. Read the linked entries
  for the applicable conditions and differences between methods.

id: glossary.terms.palmistry
term:
  en: Palmistry
  kn: ಹಸ್ತಸಾಮುದ್ರಿಕ
  hi: हस्तरेखा अध्ययन
sanskrit:
  devanagari: हस्तसामुद्रिक
  kannada: ಹಸ್ತಸಾಮುದ್ರಿಕ
  usage: descriptive equivalent
meaning:
  en: A tradition of using the shapes and creases of a hand as subjects for reflection.
  kn: ಕೈಯ ಆಕಾರ ಮತ್ತು ಗೆರೆಗಳನ್ನು ಚಿಂತನೆಗೆ ಬಳಸುವ ಪರಂಪರೆ.
  hi: हाथ की बनावट और रेखाओं पर विचार करने की परंपरा।
admin_note: Use this label for a tradition of using the shapes and creases of a hand as subjects for reflection. Read
  the linked entries for the applicable conditions and differences between methods.
aliases:
- palm reading

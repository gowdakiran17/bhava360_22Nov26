id: glossary.terms.vimala-yoga
term:
  en: Vimala yoga
  kn: ವಿಮಲಯೋಗ
  hi: विमलयोग
sanskrit:
  devanagari: विमलयोग
  kannada: ವಿಮಲಯೋಗ
  usage: traditional term
meaning:
  en: A traditional pattern involving the ruler associated with rest and reflection.
  kn: ವಿಶ್ರಾಂತಿ ಮತ್ತು ಚಿಂತನೆ ಕ್ಷೇತ್ರದ ಅಧಿಪತಿಗೆ ಸಂಬಂಧಿಸಿದ ಸಾಂಪ್ರದಾಯಿಕ ವಿನ್ಯಾಸ.
  hi: विश्राम और चिंतन के क्षेत्र के स्वामी से जुड़ा पारंपरिक मेल।
admin_note: Lord of house 12 occupies house 6, 8 or 12 under the broad Vipareeta screen.

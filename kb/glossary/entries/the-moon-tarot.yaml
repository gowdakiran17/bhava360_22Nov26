id: glossary.terms.the-moon-tarot
term:
  en: The Moon (Tarot)
  kn: ಚಂದ್ರನ ಪತ್ರ (ಟ್ಯಾರೊ)
  hi: चाँद का पत्ता (टैरो)
sanskrit:
  devanagari: चन्द्रचित्र
  kannada: ಚನ್ದ್ರಚಿತ್ರ
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 18, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 18 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 18 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on uncertainty.
  What comes to mind in this position?'
aliases: []
reference_rules:

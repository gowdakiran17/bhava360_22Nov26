id: glossary.terms.amala-yoga
term:
  en: Amala yoga
  kn: ಅಮಲಯೋಗ
  hi: अमलयोग
sanskrit:
  devanagari: अमलयोग
  kannada: ಅಮಲಯೋಗ
  usage: traditional term
meaning:
  en: A traditionally supportive planet occupies the tenth place from the chosen starting point.
  kn: ಆರಂಭದ ಬಿಂದುವಿನಿಂದ ಹತ್ತನೇ ಸ್ಥಾನದಲ್ಲಿ ಬೆಂಬಲದ ಗ್ರಹ ಇರುವ ಜೋಡಣೆ.
  hi: चुनी शुरुआत से दसवें स्थान में सहायक माना गया ग्रह।
admin_note: At least one graha classified as benefic under the selected profile occupies the tenth sign from the named
  reference.
aliases:
- amala
reference_rules:
- vedic.yogas.amala
used_by:
- vedic.yogas.amala
systems:
- vedic

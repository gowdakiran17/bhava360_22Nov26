id: glossary.terms.amala-yoga
term:
  en: Amala yoga
  kn: ಅಮಲಯೋಗ
  hi: अमलयोग
sanskrit:
  devanagari: अमलयोग
  kannada: ಅಮಲಯೋಗ
  usage: traditional term
meaning:
  en: A traditional pattern linking a supportive planet with work and responsibilities.
  kn: ಪೂರಕ ಗ್ರಹವನ್ನು ಕೆಲಸ ಮತ್ತು ಜವಾಬ್ದಾರಿಗಳೊಂದಿಗೆ ಜೋಡಿಸುವ ಸಾಂಪ್ರದಾಯಿಕ ವಿನ್ಯಾಸ.
  hi: सहायक ग्रह को काम और ज़िम्मेदारियों से जोड़ने वाला पारंपरिक मेल।
admin_note: At least one graha classified as benefic under the selected profile occupies the tenth sign from the named
  reference.

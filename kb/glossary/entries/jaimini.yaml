id: glossary.terms.jaimini
term:
  en: Jaimini
  kn: ಜೈಮಿನಿ
  hi: जैमिनि
sanskrit:
  devanagari: जैमिनि
  kannada: ಜೈಮಿನಿ
  usage: traditional term
meaning:
  en: An Indian chart-reading tradition that uses relationships between signs and ranks planets by their positions.
  kn: ರಾಶಿಗಳ ಸಂಬಂಧ ಮತ್ತು ಗ್ರಹಗಳ ಕ್ರಮವನ್ನು ಬಳಸುವ ಭಾರತೀಯ ಪರಂಪರೆ.
  hi: राशियों के संबंध और ग्रहों के क्रम का उपयोग करने वाली भारतीय परंपरा।
admin_note: Use this label for an Indian chart-reading tradition that uses relationships between signs and ranks planets
  by their positions. Read the linked entries for the applicable conditions and differences between methods.

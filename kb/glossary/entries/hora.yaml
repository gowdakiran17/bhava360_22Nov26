id: glossary.terms.hora
term:
  en: Hora
  kn: ಹೋರಾ
  hi: होरा
sanskrit:
  devanagari: होरा
  kannada: ಹೋರಾ
  usage: traditional term
meaning:
  en: An interval assigned to a planet in a repeated sequence, or a two-part chart in a different context.
  kn: ಗ್ರಹಕ್ಕೆ ನೀಡಿದ ಕಾಲಭಾಗ ಅಥವಾ ಇನ್ನೊಂದು ಬಳಕೆಯಲ್ಲಿ ಎರಡು ಭಾಗಗಳ ನಕ್ಷೆ.
  hi: ग्रह को दिया समय खंड या दूसरे प्रयोग में दो हिस्सों की पत्री।
admin_note: 'Application in vedic.strength-shadbala.hora: Split daylight and night into twelve equal temporal hours each.
  Start at sunrise with the vara lord in the recurring hora order. Advance by the zero-based hour index, adding twelve
  for a night hour. Award sixty to that lord.'
aliases:
- planetary hour
reference_rules: []

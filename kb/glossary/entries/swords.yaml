id: glossary.terms.swords
term:
  en: Swords
  kn: ಖಡ್ಗಾಃ
  hi: खड्गाः
sanskrit:
  devanagari: खड्गाः
  kannada: ಖಡ್ಗಾಃ
  usage: descriptive equivalent
meaning:
  en: The tarot suit pictured with blades, often used to explore thought and communication.
  kn: ವಿಚಾರ ಮತ್ತು ಸಂವಹನವನ್ನು ಪರಿಶೀಲಿಸಲು ಬಳಸುವ ಕತ್ತಿ ಗುರುತಿನ ಪತ್ರಗಳ ಗುಂಪು.
  hi: सोच और बातचीत पर विचार करने वाला तलवार चिह्न का पत्ता समूह।
admin_note: Use this label for the tarot suit pictured with blades, often used to explore thought and communication.
  Read the linked entries for the applicable conditions and differences between methods.

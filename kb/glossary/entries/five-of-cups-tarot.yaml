id: glossary.terms.five-of-cups-tarot
term:
  en: Five Of Cups (Tarot)
  kn: ಪಾತ್ರೆ · ಐದು
  hi: प्याला · पाँच
sanskrit:
  devanagari: चषक पञ्च
  kannada: ಚಷಕ ಪಞ್ಚ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank five in the cups family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಪಾತ್ರೆ · ಐದು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में प्याला · पाँच की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on disappointment.
  What comes to mind in this position?'
aliases:
- Five Of Cups
reference_rules:
- tarot.minor-arcana.five-of-cups-upright
- tarot.minor-arcana.five-of-cups-reversed
used_by:

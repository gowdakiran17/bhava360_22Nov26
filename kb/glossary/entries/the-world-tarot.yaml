id: glossary.terms.the-world-tarot
term:
  en: The World (Tarot)
  kn: ವಿಶ್ವ (ಟ್ಯಾರೊ)
  hi: संसार (टैरो)
sanskrit:
  devanagari: विश्व
  kannada: ವಿಶ್ವ
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 21, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 21 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 21 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on completion.
  What comes to mind in this position?'
aliases:
- The World
reference_rules:
- tarot.major-arcana.the-world-upright
- tarot.major-arcana.the-world-reversed
used_by:
- tarot.major-arcana.the-world-reversed
- tarot.major-arcana.the-world-upright
systems:
- tarot

id: glossary.terms.ten-of-swords-tarot
term:
  en: Ten Of Swords (Tarot)
  kn: ಕತ್ತಿ · ಹತ್ತು
  hi: तलवार · दस
sanskrit:
  devanagari: खड्ग दश
  kannada: ಖಡ್ಗ ದಶ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank ten in the swords family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಕತ್ತಿ · ಹತ್ತು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में तलवार · दस की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on a difficult
  ending. What comes to mind in this position?'
aliases:
- Ten Of Swords
reference_rules:
- tarot.minor-arcana.ten-of-swords-upright
- tarot.minor-arcana.ten-of-swords-reversed
used_by:

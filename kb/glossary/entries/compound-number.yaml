id: glossary.terms.compound-number
term:
  en: Compound number
  kn: ಸಂಯುಕ್ತಾಙ್ಕ
  hi: संयुक्ताङ्क
sanskrit:
  devanagari: संयुक्ताङ्क
  kannada: ಸಂಯುಕ್ತಾಙ್ಕ
  usage: traditional term
meaning:
  en: The total before repeated addition reduces it to a single digit.
  kn: ಪುನಃ ಕೂಡಿಸಿ ಒಂದಂಕಿಗೆ ಇಳಿಸುವ ಮೊದಲಿನ ಒಟ್ಟು.
  hi: बार-बार जोड़कर एक अंक बनाने से पहले का कुल।
admin_note: Use this label for the total before repeated addition reduces it to a single digit. Read the linked entries
  for the applicable conditions and differences between methods.

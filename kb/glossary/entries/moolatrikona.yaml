id: glossary.terms.moolatrikona
term:
  en: Moolatrikona
  kn: ಮೂಲತ್ರಿಕೋಣ
  hi: मूलत्रिकोण
sanskrit:
  devanagari: मूलत्रिकोण
  kannada: ಮೂಲತ್ರಿಕೋಣ
  usage: traditional term
meaning:
  en: A designated part of a sign where a planet is traditionally understood to function with particular ease.
  kn: ಗ್ರಹವು ಸುಲಲಿತವಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ ಎಂದು ಪರಿಗಣಿಸುವ ರಾಶಿಯ ಭಾಗ.
  hi: राशि का वह हिस्सा जहाँ ग्रह को अपना काम करने में सहज माना जाता है।
admin_note: Use this label for a designated part of a sign where a planet is traditionally understood to function with
  particular ease. Read the linked entries for the applicable conditions and differences between methods.
aliases:
- Mulatrikona
reference_rules: []

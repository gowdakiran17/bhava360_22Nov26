id: glossary.terms.hasta
term:
  en: Hasta
  kn: ಹಸ್ತ
  hi: हस्त
sanskrit:
  devanagari: हस्त
  kannada: ಹಸ್ತ
  usage: traditional term
meaning:
  en: Section 13 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 13ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 13।
admin_note: 'Application in vedic.nakshatras.hasta: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

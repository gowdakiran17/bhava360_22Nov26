id: glossary.terms.bhava
term:
  en: Bhava
  kn: ಭಾವ
  hi: भाव
sanskrit:
  devanagari: भाव
  kannada: ಭಾವ
  usage: traditional term
meaning:
  en: One of twelve parts of a chart, each used to explore an area of life.
  kn: ಜೀವನದ ಒಂದೊಂದು ವಿಷಯವನ್ನು ನೋಡಲು ಬಳಸುವ ಜನ್ಮನಕ್ಷೆಯ ಹನ್ನೆರಡು ಭಾಗಗಳಲ್ಲಿ ಒಂದು.
  hi: जन्मपत्री के बारह हिस्सों में से एक जिससे जीवन के किसी पहलू को देखा जाता है।
admin_note: Use this label for one of twelve parts of a chart, each used to explore an area of life. Read the linked
  entries for the applicable conditions and differences between methods.
aliases:
- House
- Houses
- Bhavas

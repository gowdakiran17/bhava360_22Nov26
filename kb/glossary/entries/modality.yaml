id: glossary.terms.modality
term:
  en: Modality
  kn: ರಾಶಿಸ್ವಭಾವ
  hi: राशिस्वभाव
sanskrit:
  devanagari: राशिस्वभाव
  kannada: ರಾಶಿಸ್ವಭಾವ
  usage: traditional term
meaning:
  en: A way of grouping signs by a pattern of beginning, holding steady or adapting.
  kn: ಆರಂಭಿಸುವ, ಸ್ಥಿರವಾಗಿರುವ ಅಥವಾ ಹೊಂದಿಕೊಳ್ಳುವ ಗುಣದಿಂದ ರಾಶಿಗಳನ್ನು ವರ್ಗೀಕರಿಸುವ ಕ್ರಮ.
  hi: शुरुआत, स्थिरता या बदलाव के ढंग से राशियों को समूहों में रखने की विधि।
admin_note: Use this label for a way of grouping signs by a pattern of beginning, holding steady or adapting. Read the
  linked entries for the applicable conditions and differences between methods.

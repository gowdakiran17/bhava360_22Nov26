id: glossary.terms.wheel-of-fortune-tarot
term:
  en: Wheel Of Fortune (Tarot)
  kn: ಅದೃಷ್ಟಚಕ್ರ (ಟ್ಯಾರೊ)
  hi: भाग्यचक्र (टैरो)
sanskrit:
  devanagari: भाग्यचक्र
  kannada: ಭಾಗ್ಯಚಕ್ರ
  usage: descriptive rendering of card title
meaning:
  en: A named picture card, numbered 10, used as a prompt for reflection.
  kn: ಚಿಂತನೆಗೆ ಬಳಸುವ 10 ಸಂಖ್ಯೆಯ ಚಿತ್ರಪತ್ರ.
  hi: चिंतन के लिए चित्र वाला पत्ता, जिसका क्रमांक 10 है।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on a changing
  cycle. What comes to mind in this position?'
aliases:
- Wheel Of Fortune
reference_rules:
- tarot.major-arcana.wheel-of-fortune-upright
- tarot.major-arcana.wheel-of-fortune-reversed
used_by:
- tarot.major-arcana.wheel-of-fortune-reversed
- tarot.major-arcana.wheel-of-fortune-upright
systems:
- tarot

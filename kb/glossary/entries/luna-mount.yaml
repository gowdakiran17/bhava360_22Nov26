id: glossary.terms.luna-mount
term:
  en: Luna mount
  kn: ಮಣಿಕಟ್ಟಿನ ಬಳಿ ಹೊರ ಅಂಚಿನ ಉಬ್ಬು
  hi: कलाई के पास बाहरी किनारे पर उभार

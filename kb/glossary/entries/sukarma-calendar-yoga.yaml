id: glossary.terms.sukarma-calendar-yoga
term:
  en: Sukarma (calendar yoga)
  kn: ಸುಕರ್ಮಾ
  hi: सुकर्मा
sanskrit:
  devanagari: सुकर्मा
  kannada: ಸುಕರ್ಮಾ
  usage: traditional term
meaning:
  en: Interval 7 of 27 found by adding the positions of the Sun and Moon.
  kn: ಸೂರ್ಯ ಮತ್ತು ಚಂದ್ರನ ಸ್ಥಾನಗಳನ್ನು ಕೂಡಿಸಿ ಪಡೆಯುವ ೨೭ ಅವಧಿಗಳಲ್ಲಿ 7ನೇ ಭಾಗ.
  hi: सूर्य और चंद्रमा की जगह जोड़ने से मिलने वाले २७ हिस्सों में क्रम 7।
admin_note: 'Application in vedic.panchang.yoga: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000
  arcseconds). Select the ordered yoga and solve the bracketing sum-angle crossings.'
aliases:
- Sukarma

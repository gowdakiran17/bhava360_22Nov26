id: glossary.terms.vara
term:
  en: Vara
  kn: ವಾರ
  hi: वार
sanskrit:
  devanagari: वार
  kannada: ವಾರ
  usage: traditional term
meaning:
  en: The weekday, often counted from local sunrise in an Indian calendar.
  kn: ಭಾರತೀಯ ಪಂಚಾಂಗದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಸೂರ್ಯೋದಯದಿಂದ ಎಣಿಸುವ ವಾರದ ದಿನ.
  hi: सप्ताह का दिन जिसे भारतीय पंचांग में प्रायः सूर्योदय से गिनते हैं।
admin_note: 'Application in vedic.strength-shadbala.vara: Use the weekday lord of the first sunrise of the active sunrise
  day. For completed sunrise days d from a bound cycle epoch, the zero-based weekday is (epoch weekday + span × floor(d/span))
  modulo seven, Sunday first. Award points only to that lord.'
aliases:
- weekday ruler

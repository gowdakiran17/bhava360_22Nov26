id: glossary.terms.jyeshtha
term:
  en: Jyeshtha
  kn: ಜ್ಯೇಷ್ಠಾ
  hi: ज्येष्ठा
sanskrit:
  devanagari: ज्येष्ठा
  kannada: ಜ್ಯೇಷ್ಠಾ
  usage: traditional term
meaning:
  en: Section 18 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 18ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 18।
admin_note: 'Application in vedic.nakshatras.jyeshtha: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

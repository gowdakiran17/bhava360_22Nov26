id: glossary.terms.ardra
term:
  en: Ardra
  kn: ಆರ್ದ್ರಾ
  hi: आर्द्रा
sanskrit:
  devanagari: आर्द्रा
  kannada: ಆರ್ದ್ರಾ
  usage: traditional term
meaning:
  en: Section 6 of the 27 equal parts used to locate the Moon along its path.
  kn: ಚಂದ್ರನ ಸ್ಥಾನವನ್ನು ಗುರುತಿಸುವ ೨೭ ಸಮಭಾಗಗಳಲ್ಲಿ 6ನೇ ಭಾಗ.
  hi: चंद्रमा की जगह बताने वाले २७ बराबर हिस्सों में क्रम 6।
admin_note: 'Application in vedic.nakshatras.ardra: Match the stable natal Moon nakshatra when its sidereal longitude
  falls in the recorded half-open span.'
aliases: []

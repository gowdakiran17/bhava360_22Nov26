id: glossary.terms.three-of-swords-tarot
term:
  en: Three Of Swords (Tarot)
  kn: ಕತ್ತಿ · ಮೂರು
  hi: तलवार · तीन
sanskrit:
  devanagari: खड्ग त्रि
  kannada: ಖಡ್ಗ ತ್ರಿ
  usage: descriptive rendering of card title
meaning:
  en: The card of rank three in the swords family of the deck.
  kn: ಟ್ಯಾರೊ ಪತ್ರಗಳ ಗುಂಪಿನಲ್ಲಿ ಕತ್ತಿ · ಮೂರು ಗುರುತಿನ ಪತ್ರ.
  hi: टैरो की गड्डी में तलवार · तीन की पहचान वाला पत्ता।
admin_note: 'Deck identity is shared by both orientations. Upright reflection: You may wish to reflect on a hurt feeling.
  What comes to mind in this position?'
aliases:
- Three Of Swords

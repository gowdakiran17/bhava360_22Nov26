id: glossary.terms.degree
term:
  en: Degree
  kn: ಅಂಶ
  hi: अंश
sanskrit:
  devanagari: अंश
  kannada: ಅಂಶ
  usage: descriptive equivalent
meaning:
  en: One of the 360 equal parts of a full turn.
  kn: ಪೂರ್ಣ ಸುತ್ತಿನ ೩೬೦ ಸಮಭಾಗಗಳಲ್ಲಿ ಒಂದು.
  hi: पूरे चक्र के ३६० बराबर भागों में से एक।
admin_note: Use this label for one of the 360 equal parts of a full turn. Read the linked entries for the applicable
  conditions and differences between methods.
aliases:
- degrees
reference_rules: []

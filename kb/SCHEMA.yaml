version: 1
scope: Rule and meaning entries
entry_template: templates/entry.yaml
supported_locales:
  required: [en, kn, hi]
  planned: [te, ta, ml, es, fr]
  fallback: en
localized_copy:
  fields: [user_text, remedy.user_text]
  resolution: Resolve each field separately. Use the requested locale when present, otherwise use that field’s English text.
  authoring: Supply nonblank strings for required locales. Omit planned keys until their text is available.
canonical_id: system.topic-key.slug
example_id: vedic.houses.mars-house-7
conditions:
  root: all, any or not
  single_leaf: Wrap one typed fact predicate in an all list.
  nested_leaves: Use fact, op and value.
confidence: [high, medium, low, disputed]
traditions_differ: A disputed entry records the profile and the point of disagreement.
exceptions: Store cancellations here with a when predicate, a cancel or soften effect, and a reason.
life_areas:
  catalogue: life-areas/catalog.yaml
  assignments: Tag every clearly applicable area using its catalogue key.
  empty: Use [] for an area-neutral definition or a rule whose area depends on the specific planet, house or activity supplied at runtime.
user_tones: [Supportive, Steady, Take care]
vedic_sign_entries:
  extension: rasi
  fields: [element, modality, ruler, traditional_gender, nature, kalapurusha_body_parts, exaltation_peak_degrees, debilitation_peak_degrees, moolatrikona_sign_for, moolatrikona_degree_limits]
  dignity: Peak degrees are measured within this sign. Empty collections mean no assignment among the seven classical grahas. Moolatrikona sign membership alone cannot establish a degree-specific dignity.
  glossary: Movable, fixed and dual describe modes of expression. Krura and saumya are traditional forceful and gentle sign classes. Gender and body correspondences are symbolic.
  degree_limits: Pairs give the degree boundaries in Phaladeepika I.7. Preserve exact exaltation peaks at shared boundaries; confirm endpoint precedence before emitting a single dignity label.
vedic_planet_entries:
  extension: graha
  fields: [karakatvas, nature, dignity, natural_friendships, directional_strength, symbolic_body_parts]
  own_sign_degrees: Sign membership spans 0 inclusive to 30 exclusive. Retain overlapping dignity flags and use the KB-01 degree limits for moolatrikona.
  natural_friendships: Directed natal relationships from the selected graha to the other six classical grahas. Keep temporary relationships separate.
  directional_strength: Peak house identifies the angle for maximum dig bala. Exact strength depends on angular distance.
  nodes: Empty dignity tables and unassigned friendships and dig bala denote a deliberate doctrine choice.
  functional_nature: For each whole-sign Lagna list houses owned. The strict single-graha yogakaraka flag requires ownership of both an angle (4, 7 or 10) and a trine (5 or 9). Nodes rule no houses in this profile.
vedic_nakshatra_entries:
  extension: nakshatra
  fields: [number, span_degrees, span_arcminutes, signs_spanned, vimshottari_lord, deity, symbol, gana, muhurta_nature, padas]
  coordinates: Exact absolute sidereal arcminutes from Aries. Start inclusive and end exclusive. Normalize 360 degrees to zero before lookup.
  padas: Four successive 200-arcminute quarters, each binding its natal rasi and its D9 sign.
vedic_house_entries:
  extension: bhava
  applies_to: The twelve vedic.houses.house-N reference entries.
  fields: [number, significations, groupings, natural_karakas, symbolic_body_parts, bhavat_bhavam]
  bhavat_bhavam: Count N houses inclusively from house N, wrapping after twelve.
  body_convention: Kalapurusha sequence by ordinal house, irrespective of the occupying sign.
western_outer_planet_entries:
  extension: outer_planet
  fields: [themes, discovery_year, modern_rulership, traditional_ruler, generational_use, personal_use, orbs]
  orbs: Resolve the named natal table and compare absolute angular deviation inclusively. Only listed major aspects qualify for personal use.
vedic_state_entries:
  extension: state
  fields_by_state:
    baladi:
    - eligible
    - width_degrees
    - interval
    - odd_sign_order
    - even_sign_order
    - state_meanings
    combustion:
    - reference_table
    - orbs
    - reference_body
    - separation
    - boundary
    - motion_selector
    graha-drishti:
    - reference_table
    - inclusive_distances
    - direction
    - calculation
    graha-yuddha:
    - eligible
    - distinct_pair
    - separation
    - maximum_exclusive_degrees
    - winner
    - tie_or_missing_latitude
    - winner_scope
    vakri:
    - eligible
    - observable
    - unit
    - test
    - station
    vargottama:
    - eligible
    - charts
    - same_graha
    - comparison
    - d9_method
    yuti:
    - eligible
    - distinct_pair
    - comparison
    - orb_degrees
vedic_planets_in_signs:
  extension: placement
  fields: [dignity, themes]
  sign_class: Sign-level exaltation, debilitation or ownership takes precedence over the natural relationship to the ruler. Unassigned nodal dignity is disputed.
  degree_sensitive: Retain the KB-01/02 limits for moolatrikona and own sign, and the exact peak for exaltation or debilitation. A sign-only match cannot establish an exact degree state.
  cancellation: A debility exception references a candidate rule and applies only to the same selected graha.
vedic_planets_in_houses:
  extension: placement
  fields: [graha, house, reference, related_placement, themes, grouping_effects, dig_bala]
  reference: Whole-sign natal house counted from a stable Lagna.
  related_placement: Treat this entry and the linked vedic.houses placement as one piece of evidence.
  dig_bala: Match the KB-02 peak house. Calculating a strength value requires angular distance. Nodes are unassigned.
  related_rules: Optional top-level list of separate rules to consult. Each rule evaluates its own conditions.
vedic_house_lord_entries:
  extension: house_pair
  fields: [source_house, occupied_house, themes, source_groups, occupied_groups, logic, reciprocal_placement]
  chart: Use the classical ruler of the source house sign in the natal whole-sign chart. Bind modifiers and candidate associations to the same lords and chart.
  related_rules: Evaluate each yoga separately. Raja and dhana require distinct eligible lords actually joined or exchanged in this profile. Exchanges require reciprocal occupation and distinct grahas.
  life_areas: Deduplicated union of both KB-04 houses.
vedic_dosha_entries:
  reference_paths: Matching and transit entries link to their governing KB tables using kb-relative paths.
  evaluation: Preserve natal formation separately from any relief, pair-only adjustment or timed interval.
vedic_varga_entries:
  extension: varga
  method_catalog: vedic/vargas/methods.yaml
  input: Use the same unrounded sidereal longitude for the selected point or Lagna in every division. Normalize modulo 360 degrees.
  equal_parts: With zero-based natal sign and part indices, take floor(degrees within sign × parts / 30). Add stride × part to the seed modulo 12. The D2 rows give the result directly.
  unequal_parts: D30 selects the parity row using lower-inclusive, upper-exclusive band edges in degrees.
  seed_order: Aries is odd. Parity runs odd/even, modality movable/fixed/dual, element fire/earth/air/water.
  reading: Count houses from the divisional Lagna. Recompute it throughout the stated birth-time uncertainty. Use each method's existing read_access setting.
  weights: Absolute Vimshopaka points within each 20-point scheme. Zero marks a chart outside the ten-chart scheme. These are weights for planetary dignity aggregation.
vedic_shadbala_entries:
  extension: calculation
  numeric_roles: [admin, tester]
  public_fields: [user_text]
  public_copy: Select a complete locale map from the reviewed qualitative phrase list in vedic/strength/shadbala/components.yaml. Do not interpolate any input, component, threshold or result into public text.
  units: Sixty virupas (shashtiamsas of strength) make one rupa. Keep full precision until an authorized diagnostic display.
vedic_ashtakavarga_entries:
  extension: calculation
  numeric_roles: [admin, tester]
  public_fields: [user_text]
  public_projection: Render only localized qualitative text. Keep offset tables, contributor bits, sign counts, reductions and pinda out of public evidence.
  input: Raw prastara is indexed by target graha, contributor and sidereal sign. Each supportive mark contributes one.
  reduction: Preserve raw BAV and SAV. Apply the named occupancy and weight profiles only to the separate reduced rows.
vedic_saturn_transit_labels:
  applies_to: [vedic/transits, vedic/doshas]
  public_fields: [user_text, remedy.user_text]
  technical_fields_access: [admin]
  projection: Render localized copy only. Titles, phase names, identifiers, fact chains and timing evidence are administrative metadata.
kp_entries:
  public_fields: [user_text, remedy.user_text]
  technical_fields_access: [admin]
  projection: Only render the localized reflection after evaluation. Keep titles, cusp degrees, numbered intervals, house groups, ruling roles and significator chains in administrative evidence.
jaimini_entries:
  public_fields: [user_text, remedy.user_text]
  technical_fields_access: [admin]
  projection: Render only the reviewed locale copy. Scheme, rank, karaka identity, chart frame, pada steps, aspect pairs, intervention counts, titles and source evidence are administrative.

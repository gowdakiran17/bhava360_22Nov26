  label: traditional-practice
  cost: free
  user_text:
    en: If you like, you can help elders or workers with a routine task at an agreed time.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ, ಹಿರಿಯರಿಗೆ ಅಥವಾ ಕಾರ್ಮಿಕರಿಗೆ ದಿನನಿತ್ಯದ ಕೆಲಸದಲ್ಲಿ ಒಪ್ಪಿದ ಸಮಯಕ್ಕೆ ನೆರವಾಗಬಹುದು.
    hi: चाहें तो आप बुज़ुर्गों या कामगारों को तय समय पर रोज़मर्रा के काम में मदद दे सकते हैं।

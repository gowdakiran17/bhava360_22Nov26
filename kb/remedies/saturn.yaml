id: remedies.conduct.saturn
approval: draft
linked_to: vedic.planets.saturn
remedy:
  type: service
  optional: true
  label: traditional-practice
  cost: free
  user_text:
    en: If you like, you can offer someone dependable help with a routine task and follow through at the agreed time.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ, ಯಾರಿಗಾದರೂ ದಿನನಿತ್ಯದ ಕೆಲಸದಲ್ಲಿ ನೆರವು ನೀಡುವುದಾಗಿ ಹೇಳಿ, ಒಪ್ಪಿದ ಸಮಯಕ್ಕೆ ಅದನ್ನು ಮಾಡಬಹುದು.
    hi: चाहें तो आप किसी के रोज़मर्रा के काम में मदद की पेशकश कर सकते हैं और तय समय पर अपना वादा निभा सकते हैं।
native_review:
  kn: pending
  hi: pending
options:
  japa:
    type: mantra-japa
    cost: free
    optional: true
    label: traditional-practice
    weekday: Saturday
    form: nama
    sources:
    - title: Navagraha Mantra · Name mantras and weekdays
      url: https://kundlinaksha.com/blog/navagraha-mantra
      locator: saturn
    user_text:
      en: If you like, on Saturday you can quietly repeat “Om Shanaishcharaya Namah.”
      kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಶನಿವಾರ “ಓಂ ಶನೈಶ್ಚರಾಯ ನಮಃ” ಎಂದು ಮನಸ್ಸಿನಲ್ಲಿ ಜಪಿಸಬಹುದು.
      hi: चाहें तो शनिवार को आप “ॐ शनैश्चराय नमः” मन ही मन दोहरा सकते हैं।
  charity:
    type: charity
    cost: free
    optional: true
    label: traditional-practice
    sources:
    - title: Plant World in Hindu Consciousness
      url: https://vbuss.org/sites/vbuss.org/files/1-Plant-World%20in%20Hindu%20Consciousness%20%281%29.pdf
      locator: Navadhanya list; grain association. Sharing existing food is an editorial adaptation.
    user_text:
      en: If you already have black sesame to spare, you can share some with someone who would welcome it.
      kn: ನಿಮ್ಮಲ್ಲಿ ಹೆಚ್ಚುವರಿ ಕಪ್ಪು ಎಳ್ಳು ಇದ್ದರೆ, ಬಯಸುವವರೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳಬಹುದು.
      hi: यदि आपके पास अतिरिक्त काले तिल हो, तो आप इसे किसी इच्छुक व्यक्ति के साथ बाँट सकते हैं।

      en: If you like, on Tuesday you can quietly repeat “Om Ketave Namah.”
      kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಮಂಗಳವಾರ “ಓಂ ಕೇತವೇ ನಮಃ” ಎಂದು ಮನಸ್ಸಿನಲ್ಲಿ ಜಪಿಸಬಹುದು.
      hi: चाहें तो मंगलवार को आप “ॐ केतवे नमः” मन ही मन दोहरा सकते हैं।

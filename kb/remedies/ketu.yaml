  user_text:
    en: If you like, you can sit quietly and repeat a short prayer from your own tradition.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಶಾಂತವಾಗಿ ಕುಳಿತು ನಿಮ್ಮ ಪರಂಪರೆಯ ಸಣ್ಣ ಪ್ರಾರ್ಥನೆಯನ್ನು ಪುನರಾವರ್ತಿಸಬಹುದು.
    hi: चाहें तो आप शांत बैठकर अपनी परंपरा की कोई छोटी प्रार्थना दोहरा सकते हैं।

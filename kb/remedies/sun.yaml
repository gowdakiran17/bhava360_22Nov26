    user_text:
      en: If you like, on Sunday you can quietly repeat “Om Suryaya Namah.”
      kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಭಾನುವಾರ “ಓಂ ಸೂರ್ಯಾಯ ನಮಃ” ಎಂದು ಮನಸ್ಸಿನಲ್ಲಿ ಜಪಿಸಬಹುದು.
      hi: चाहें तो रविवार को आप “ॐ सूर्याय नमः” मन ही मन दोहरा सकते हैं।
  charity:
    type: charity
    cost: free
    optional: true
    label: traditional-practice
    sources:
    - title: Plant World in Hindu Consciousness
      url: https://vbuss.org/sites/vbuss.org/files/1-Plant-World%20in%20Hindu%20Consciousness%20%281%29.pdf
      locator: Navadhanya list; grain association. Sharing existing food is an editorial adaptation.
    user_text:
      en: If you already have wheat to spare, you can share some with someone who would welcome it.
      kn: ನಿಮ್ಮಲ್ಲಿ ಹೆಚ್ಚುವರಿ ಗೋಧಿ ಇದ್ದರೆ, ಬಯಸುವವರೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳಬಹುದು.
      hi: यदि आपके पास अतिरिक्त गेहूँ हो, तो आप इसे किसी इच्छुक व्यक्ति के साथ बाँट सकते हैं।

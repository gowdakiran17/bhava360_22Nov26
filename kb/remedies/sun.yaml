  user_text:
    en: If you like, you can set aside a quiet moment in the morning to choose a priority.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಬೆಳಿಗ್ಗೆ ಶಾಂತವಾಗಿ ಕುಳಿತು ದಿನದ ಆದ್ಯತೆಯನ್ನು ಆರಿಸಬಹುದು.
    hi: चाहें तो आप सुबह कुछ शांत समय निकालकर दिन की एक प्राथमिकता चुन सकते हैं।

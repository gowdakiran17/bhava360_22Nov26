    user_text:
      en: If you already have pigeon peas to spare, you can share some with someone who would welcome it.
      kn: ನಿಮ್ಮಲ್ಲಿ ಹೆಚ್ಚುವರಿ ತೊಗರಿ ಬೇಳೆ ಇದ್ದರೆ, ಬಯಸುವವರೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳಬಹುದು.
      hi: यदि आपके पास अतिरिक्त अरहर की दाल हो, तो आप इसे किसी इच्छुक व्यक्ति के साथ बाँट सकते हैं।

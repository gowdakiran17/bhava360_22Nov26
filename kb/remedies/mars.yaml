      en: If you like, on Tuesday you can quietly repeat “Om Mangalaya Namah.”
      kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಮಂಗಳವಾರ “ಓಂ ಮಂಗಳಾಯ ನಮಃ” ಎಂದು ಮನಸ್ಸಿನಲ್ಲಿ ಜಪಿಸಬಹುದು.
      hi: चाहें तो मंगलवार को आप “ॐ मंगलाय नमः” मन ही मन दोहरा सकते हैं।

  user_text:
    en: If you like, you can ask someone whether they would welcome a hand with a task.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಯಾರಿಗಾದರೂ ಕೆಲಸದಲ್ಲಿ ನೆರವು ಬೇಕೇ ಎಂದು ಕೇಳಬಹುದು.
    hi: चाहें तो आप किसी से पूछ सकते हैं कि किसी काम में उन्हें मदद चाहिए या नहीं।

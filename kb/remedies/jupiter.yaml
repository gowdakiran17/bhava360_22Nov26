      en: If you like, on Thursday you can quietly repeat “Om Brihaspataye Namah.”
      kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಗುರುವಾರ “ಓಂ ಬೃಹಸ್ಪತಯೇ ನಮಃ” ಎಂದು ಮನಸ್ಸಿನಲ್ಲಿ ಜಪಿಸಬಹುದು.
      hi: चाहें तो गुरुवार को आप “ॐ बृहस्पतये नमः” मन ही मन दोहरा सकते हैं।

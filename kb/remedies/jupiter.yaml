  user_text:
    en: If it fits your practice, you can quietly repeat a familiar mantra for a moment.
    kn: ನಿಮ್ಮ ಆಚರಣೆಗೆ ಹೊಂದಿದರೆ ಪರಿಚಿತ ಮಂತ್ರವನ್ನು ಸ್ವಲ್ಪ ಹೊತ್ತು ಮನಸ್ಸಿನಲ್ಲಿ ಜಪಿಸಬಹುದು.
    hi: यदि यह आपकी परंपरा के अनुकूल हो, तो आप कुछ देर कोई परिचित मंत्र मन ही मन दोहरा सकते हैं।

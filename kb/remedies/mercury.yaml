    en: If you like, you can share a skill you already know with someone who would like to learn.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಕಲಿಯಲು ಆಸಕ್ತಿ ಇರುವವರಿಗೆ ನಿಮಗಿರುವ ಕೌಶಲವನ್ನು ಹಂಚಬಹುದು.
    hi: चाहें तो आप किसी इच्छुक व्यक्ति को अपना कोई हुनर सिखा सकते हैं।

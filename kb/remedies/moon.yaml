id: remedies.conduct.moon
approval: draft
linked_to: vedic.planets.moon
remedy:
  type: routine
  optional: true
  cost: free
  user_text:
    en: If you like, you can pause in the evening to notice what helped you feel settled.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಸಂಜೆ ಸ್ವಲ್ಪ ವಿರಾಮ ತೆಗೆದುಕೊಂಡು ಯಾವುದು ನಿಮಗೆ ನೆಮ್ಮದಿ ನೀಡಿತು ಎಂದು ಗಮನಿಸಬಹುದು.
    hi: चाहें तो शाम को ठहरकर देख सकते हैं कि किस बात से आपको सुकून मिला।
native_review:
  kn: pending
  hi: pending
options:
  service:
    type: service
    cost: free
    optional: true
    user_text:
      en: If you like, you can give your time to help someone with a task they choose.
      kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಯಾರಾದರೂ ಆಯ್ದ ಕೆಲಸಕ್ಕೆ ನಿಮ್ಮ ಸಮಯ ನೀಡಿ ನೆರವಾಗಬಹುದು.
      hi: चाहें तो आप किसी के चुने हुए काम में अपना समय देकर मदद कर सकते हैं।
  japa:
    type: mantra-japa
    cost: free
    optional: true
    weekday: Monday
    form: nama
    sources:
    - title: Navagraha Mantra · Name mantras and weekdays
      url: https://kundlinaksha.com/blog/navagraha-mantra
      locator: moon
    user_text:
      en: If you like, on Monday you can quietly repeat “Om Chandraya Namah.”
      kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಸೋಮವಾರ “ಓಂ ಚಂದ್ರಾಯ ನಮಃ” ಎಂದು ಮನಸ್ಸಿನಲ್ಲಿ ಜಪಿಸಬಹುದು.
      hi: चाहें तो सोमवार को आप “ॐ चन्द्राय नमः” मन ही मन दोहरा सकते हैं।
  charity:
    type: charity
    cost: free
    optional: true
    sources:
    - title: Plant World in Hindu Consciousness
      url: https://vbuss.org/sites/vbuss.org/files/1-Plant-World%20in%20Hindu%20Consciousness%20%281%29.pdf
      locator: Navadhanya list; grain association. Sharing existing food is an editorial adaptation.
    user_text:
      en: If you already have rice to spare, you can share some with someone who would welcome it.
      kn: ನಿಮ್ಮಲ್ಲಿ ಹೆಚ್ಚುವರಿ ಅಕ್ಕಿ ಇದ್ದರೆ, ಬಯಸುವವರೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳಬಹುದು.
      hi: यदि आपके पास अतिरिक्त चावल हो, तो आप इसे किसी इच्छुक व्यक्ति के साथ बाँट सकते हैं।

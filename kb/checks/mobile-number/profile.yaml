check: mobile-number
approval: draft
adapter: phone
normalization: Accept exactly ten national decimal digits. Also accept an explicit +91 prefix before those ten digits.
  Remove whitespace, hyphens and balanced formatting parentheses. Preserve leading zeros. Reject other prefixes,
  extensions and letters.
steps:
- Canonicalize Unicode decimal digits to ASCII. Sum the digit values and repeatedly sum decimal digits to one digit.
  Zero alone has no number meaning. Use the matching Ank Jyotish root as descriptive evidence.
- Bind any compatible comparison IDs below only when their inputs and predicates hold. Deduplicate the evidence
  and use the parent recipe for a full-profile tone.
compatibility_table: numerology/ank-jyotish/compatibility.yaml
numerology_ids:
- numerology.ank-jyotish.check-mobile-number-ruler-compatibility
- numerology.ank-jyotish.check-mobile-number-birth-root
- numerology.ank-jyotish.check-mobile-number-repeats
- numerology.ank-jyotish.check-mobile-number-distinct-destiny-match
- numerology.chaldean.check-mobile-number-compound-known
- numerology.ank-jyotish.check-mobile-number-missing-digits
- numerology.ank-jyotish.mobile-digit-total

bound_interval: Zero inclusive, upper endpoint exclusive. Use next sign at thirty.
faces: Three ten-degree faces per tropical sign. Start Aries with Mars; cycle Mars, Sun, Venus, Mercury, Moon, Saturn,
  Jupiter continuously.
sect:
  day:
  - sun
  - jupiter
  - saturn
  night:
  - moon
  - venus
  - mars
  mercury: Morning rising is diurnal and evening setting nocturnal; unresolved phase withholds.
planet_direction:
  sun: responsibility
  moon: care
  mercury: communication
  venus: cooperation
  mars: initiative
  jupiter: perspective
  saturn: structure
interpretation: Own/exalted supports the bound planetary theme; fall/detriment qualifies it with caution. No single
  dignity implies an event.

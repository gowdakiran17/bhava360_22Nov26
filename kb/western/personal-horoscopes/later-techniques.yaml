approval: draft
release: post-mvp
techniques:
  essential_dignity: Select domicile, exaltation, triplicity, term and face tables for the same historical school.
  house_rulers: Use classical domicile ruler of each cusp sign. Outer co-rulers require a separate convention.
  profections: Advance one sign from the rising sign per completed year at the solar anniversary, modulo twelve. Use
    its ruler; withhold without a reliable rising sign.

approval: draft
zodiac: tropical
longitude: Geocentric apparent ecliptic longitude of date. Normalize to [0,360). Signs are equal half-open sectors
  starting at the March equinox.
houses:
  default: placidus
  systems:
    placidus:
      code: P
      admin_label: Placidus
    whole-sign:
      code: W
      admin_label: Whole sign
    koch:
      code: K
      admin_label: Koch
    equal:
      code: E
      admin_label: Equal from Ascendant
  assignment: Normalize to a turn. Include the start cusp and exclude the next cusp in zodiac order. Whole sign begins
    at zero of the rising sign. Equal begins at the Ascendant degree.
  polar_failure: For failed Placidus or Koch discard any automatically substituted cusps. Recompute whole sign from
    a valid stable tropical rising sign. Otherwise withhold house-dependent results.
  fallback_labels:
    placidus: Whole sign (Placidus unavailable)
    koch: Whole sign (Koch unavailable)
  record:
  - requested_system
  - effective_system
  - effective_code
  - fallback_used
  - admin_label
planets:
- western.planets.sun
- western.planets.moon
- western.planets.mercury
- western.planets.venus
- western.planets.mars
- western.planets.jupiter
- western.planets.saturn
- western.planets.uranus
- western.planets.neptune
- western.planets.pluto
natal_aspects:
- conjunction
- sextile
- square
- trine
- opposition
natal_orbs: aspects/orbs.yaml#natal
quincunx: Enable the minor aspect for stand-alone quincunx or Yod queries.
patterns: Distinct natal bodies from the ten-planet list only; apply all required edges to the same instant. Canonicalize
  by member set and apex. A maximal sign cluster counts once.
transit_orb_degrees: 1
secondary_orb_degrees: 1
secondary_days_per_year: 365.2425
timing: Use five major aspects by default, and opt-in quincunx. Solve exact oriented branches and station tangencies.
  Retain all dated passes; withhold when a natal target is unknown.
outer_planets: Use the existing KB-02b entries and their personal-contact filters; sign placements alone supply cohort
  context.
public:
  label: Western (tropical)
  tones:
  - Supportive
  - Steady
  - Take care
  localization: shared/localization/reading.yaml
  selection: Cooperative testimony may give Supportive; tension needing attention may give Take care; mixed or neutral
    testimony gives Steady. Use only supported natal or timing facts. Omit unresolved readings.
  fields:
  - localized_tone
  - user_text
  evidence: Bodies, orbs, exact times, house method and pattern members are available for chart evidence. No score
    in public copy.
pattern_geometry:
  grand-trine:
    edges:
    - trine
    - trine
    - trine
  t-square:
    edges:
    - opposition
    - square
    - square
    apex: third
  yod:
    edges:
    - sextile
    - quincunx
    - quincunx
    apex: third
  stellium:
    same: sign
    minimum_bodies: 3
    maximal: true
pattern_edge_order:
- base-to-base
- first-base-to-third
- second-base-to-third
phase_index: For secondary lunar phases take floor(((progressed Moon minus progressed Sun) mod 360)/45). Index zero
  begins at conjunction. A change is a solved crossing of a sector boundary.
auxiliary_points:
  interpretation: Chiron, nodes and Fortune have optional R3 reflective readings when enabled and computable. Reliable
    angles have their own contact rules and remain outside planetary pattern membership.
  chiron: Compute geocentric tropical Chiron only when local ephemeris data are available; otherwise unknown.
  nodes: Compute mean ascending node; descending node is opposite modulo 360.
  mc_ic: Use actual meridian MC from Swiss angles and IC opposite even in equal and whole-sign charts.
  fortune: Day uses (ASC + Moon - Sun) modulo 360. Night uses (ASC + Sun - Moon) modulo 360. Use solar centre geometric
    altitude at the observer, day at or above zero. Missing sect or Ascendant withholds Fortune.
technique_orbs: aspects/orbs.yaml
point_interpretation: Stable ASC and MC support personal contacts. MC describes public work and IC private foundations.
  Their readings remain gated until R3.
minor_aspects: Quincunx is opt-in for standalone and Yod queries.
r3_readings:
- western.r3-readings.north-node
- western.r3-readings.south-node
- western.r3-readings.chiron
- western.r3-readings.fortune
- western.r3-readings.composite
- western.r3-readings.solar-arc

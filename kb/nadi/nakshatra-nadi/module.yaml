traditions_differ:
  ayanamsa: The owner selected KP sidereal mode 5 for every chart.
  node: Use the true node throughout, consistent with the locked KP convention.
  house_system: The owner adopted Sripati bhava chalita on 24 Nov 2026 following the live classes. Use chalita for
    occupancy and the signs counted from Lagna for ownership. Jyoti found 35/35 matches with whole signs, 32/35
    with chalita and 16/35 with Placidus in file 2, PDF pp. 45–49. Later KP cusp sub-lord work uses its separate
    Placidus frame.
  outer_planets: Discard outer-body inputs with an internal diagnostic.
  dasha_year: Use Julian years of 365.25 days. Compare the course conversion of 360 days on a separate timeline.
  node_aspects: Nodes cast no aspects. Count same-sign conjunctions and incoming sign-count aspects from the seven
    grahas.
  node_dignity: Leave node dignity unset because the illustrations disagree.
  sun_nature: Treat the Sun as neutral within this method only. This label has no effect on house unions.
  line_weight: Only a permitted event reaches the internal tie-break (SL 0.5, NL 0.3, PL 0.2). A self-star lord
    uses NL 0.6 and PL 0.4. The loss ordering in file 4, PDF p. 26 is an alternative.

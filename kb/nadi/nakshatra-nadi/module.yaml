traditions_differ:
  ayanamsa: Use KP mode 5. The course leaves its software setting unstated; compare Lahiri only in a separate record.
  node: Use true nodes on the KP path and mean nodes only in the Lahiri comparison.
  house_system: Placidus is provisional. Compare whole signs independently; withhold polar cusp testimony when Placidus
    fails.
  outer_planets: Discard outer-body inputs with an internal diagnostic.
  dasha_year: Use Julian years of 365.25 days. Compare the course conversion of 360 days on a separate timeline.
  node_aspects: Keep only the opposition cast by a node. The alternative image includes additional aspects. For
    node agency judge incoming planetary aspects.
  node_dignity: Leave node dignity unset because the illustrations disagree.
  sun_nature: Treat the Sun as neutral within this method only. This label has no effect on house unions.
held_topics:
- health
- litigation
- childbirth

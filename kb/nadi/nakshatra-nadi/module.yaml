resolved_questions:
  power-and-circle:
    answer: Each line circles the occupied whole-sign house of its planet. The distinct NL and SL circles supply
      the power houses. For a hit, use the SL circle as row and the NL circle as column.
    locators: 4-english-basic-book.pdf pp. 14, 17, 18, 24–28, 31–47; owner software demonstration, 17 Nov 2026 IST;
      Owner confirmation, 24 Nov 2026 IST, Prashna Deep Secrets, Power Position tab
    confidence: high
    answered: '2026-11-24'
    basis: Jyoti’s review and Kiran’s confirmation in the Power Position tab on 24 Nov 2026 IST.
  house-frame:
    answer: Use KP ayanamsa mode 5 and the true node. Assign the rising sign to the first house and each successive
      sign to the next house. Use its sign ruler for lordship. Withhold houses when birth time or Lagna is unavailable
      or unstable.
    locators: 2-new-file-56pp.pdf pp. 45–49 (worked examples); 4-english-basic-book.pdf p. 2 (alternative cusp method)
    confidence: high
    answered: '2026-11-24'
    basis: Owner decision, 24 Nov 2026, 7:04 PM IST (Asia/Calcutta). The 35/35 whole-sign match in the worked charts
      supersedes the Batch 15 Placidus default.
  planet-line:
    answer: PL uses the planet’s own combination, NL uses its star lord’s and SL uses its sub lord’s. Nodes use
      their agency combination on PL.
    locators: 4-english-basic-book.pdf pp. 3–4; 2-new-file-56pp.pdf pp. 45–49
    confidence: high
    answered: '2026-11-24'
    basis: Kiran confirmed the line identities on 24 Nov 2026 IST in the Prashna Deep Secrets Power Position tab.
      PL means Planet Lord Occupancy, NL Nakshatra Lord occupancy and SL Sub Lord occupancy.
      The leading house is occupied; brackets identify owned houses or node agency.
  node-association:
    answer: Include the occupied bhava and the combinations of the dispositor, same-sign grahas and grahas aspecting
      the node by sign. Only the seven grahas can be agents.
    locators: 4-english-basic-book.pdf p. 5; 1-signature-course.pdf p. 51 (different aspect tradition)
    confidence: medium
    answered: '2026-11-24'
    basis: owner answer + Jyoti verification

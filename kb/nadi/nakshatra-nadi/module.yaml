- products
- gemstones
- rudraksha
- lucky items and colours
- donation schedules
- percentages and grades
- certainty or fate
- death, illness and fear
practice_label:
  en: Traditional practice
  kn: ಸಾಂಪ್ರದಾಯಿಕ ಆಚರಣೆ
  hi: पारंपरिक अभ्यास
practices:
- label: Traditional practice
  free: true
  optional: true
  user_text:
    en: You may choose a quiet moment for prayer or chanting.
    kn: ನೀವು ಶಾಂತ ಸಮಯದಲ್ಲಿ ಪ್ರಾರ್ಥನೆ ಅಥವಾ ಜಪ ಮಾಡಬಹುದು.
    hi: आप शांत समय में प्रार्थना या जप कर सकते हैं।
- label: Traditional practice
  free: true
  optional: true
  user_text:
    en: You may offer your time to an elder, teacher or neighbour.
    kn: ನೀವು ಹಿರಿಯರಿಗೆ, ಶಿಕ್ಷಕರಿಗೆ ಅಥವಾ ನೆರೆಹೊರೆಯವರಿಗೆ ಸಮಯ ನೀಡಬಹುದು.
    hi: आप किसी बुज़ुर्ग, शिक्षक या पड़ोसी को अपना समय दे सकते हैं।
- label: Traditional practice
  free: true
  optional: true
  user_text:
    en: You may set aside time to reflect or study.
    kn: ನೀವು ಚಿಂತನೆ ಅಥವಾ ಅಧ್ಯಯನಕ್ಕೆ ಸಮಯ ಮೀಸಲಿಡಬಹುದು.
    hi: आप चिंतन या अध्ययन के लिए समय निकाल सकते हैं।
preview_copy:
  mixed:
    en: This period may offer openings alongside delays. You can take decisions at your own pace.
    kn: ಈ ಸಮಯದಲ್ಲಿ ಅವಕಾಶಗಳ ಜೊತೆಗೆ ವಿಳಂಬವೂ ಇರಬಹುದು. ನಿಮ್ಮ ಗತಿಯಲ್ಲಿ ನಿರ್ಧಾರ ತೆಗೆದುಕೊಳ್ಳಬಹುದು.
    hi: इस समय अवसर के साथ कुछ देरी भी हो सकती है। आप अपनी गति से निर्णय ले सकते हैं।
  supportive:
    en: You may find room to explore this area.
    kn: ಈ ವಿಷಯವನ್ನು ಅನ್ವೇಷಿಸಲು ನಿಮಗೆ ಅವಕಾಶ ಸಿಗಬಹುದು.
    hi: आपको इस विषय को समझने का अवसर मिल सकता है।
  withheld:
    en: With a birth time, you may be able to explore this theme.
    kn: ಜನನ ಸಮಯ ಲಭ್ಯವಿದ್ದರೆ ನೀವು ಈ ವಿಷಯವನ್ನು ಅನ್ವೇಷಿಸಬಹುದು.
    hi: जन्म का समय मिलने पर आप इस विषय पर विचार कर सकते हैं।
  wellbeing:
    en: You may focus on everyday wellbeing.
    kn: ನೀವು ದಿನನಿತ್ಯದ ಕ್ಷೇಮದ ಕಡೆಗೆ ಗಮನ ಕೊಡಬಹುದು.
    hi: आप रोज़मर्रा की देखभाल पर ध्यान दे सकते हैं।
  vehicle:
    en: You may wish to review your vehicle plans.
    kn: ನೀವು ವಾಹನದ ಯೋಜನೆಗಳನ್ನು ಪರಿಶೀಲಿಸಬಹುದು.
    hi: आप वाहन से जुड़ी योजनाओं पर विचार कर सकते हैं।

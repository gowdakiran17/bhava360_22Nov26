open_questions:
  power-and-circle: Define power position and circle (NN-M13); without them the hit-theory and many ranked lists
    cannot be implemented.
  house-frame: 'Confirm house system: KP Placidus cusps (E p2) or sign-based houses (B pp45-49 examples)?'
  planet-line: Confirm PL means the planet itself, not its sign lord (NN-M03).
  node-association: 'Node combination: same-sign or same-house conjunction; sign-count aspects or degree aspects?'
additional_review:
- Ayanamsa the course software uses (KP new, KP old, Lahiri)?
- Both-absent case of the 11/12 bifurcation (E p15 scenario 4).
- H p5 (child birth) repeats the marriage wording for house 8, apparently a copy slip; which reading is intended?
- 'Retrograde, combustion and transit: confirm they are deliberately ignored.'
- 'Donations: allowed only as optional, no-cost service, or dropped entirely?'

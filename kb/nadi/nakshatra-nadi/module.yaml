    kn: ನೀವು ನಿಮ್ಮ ಯೋಜನೆಗಳಿಗೆ ಹೆಚ್ಚಿನ ಸಮಯ ನೀಡಬಹುದು.
    hi: आप अपनी योजनाओं को थोड़ा और समय दे सकते हैं।

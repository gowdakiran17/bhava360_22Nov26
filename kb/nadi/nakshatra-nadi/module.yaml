    kn: ಸದ್ಯಕ್ಕೆ ಸಮಯದ ವಿಚಾರವನ್ನು ತೆರೆದಿಡಬಹುದು.
    hi: आप फिलहाल समय का प्रश्न खुला रख सकते हैं।
  challenging:

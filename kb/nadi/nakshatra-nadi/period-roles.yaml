rule: The KP cusp sub-lord establishes the natal promise for the requested theme. Periods can time it only when
  that promise is available. Use Maha for background, Antar for the active theme and Pratyantar for qualification.
  A major lord alone cannot time an event. Require an event-house witness on NL. An untenanted period lord may use
  PL or NL. For a self-star lord PL and NL describe fruit and tone together; ignore SL. Otherwise PL describes the
  source and SL qualifies a permitted outcome.

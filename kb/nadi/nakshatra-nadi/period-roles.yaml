rule: Use Maha for background, Antar for the active theme and Pratyantar for qualification. A major lord alone cannot
  time an event. Require an event-house witness on NL. An untenanted period lord may use PL or NL. A self-star lord
  requires NL and ignores SL. PL identifies the source; after permission, SL qualifies the outcome, or NL does so
  for a self-star lord.

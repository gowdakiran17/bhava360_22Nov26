rule: PL uses the planet’s own combination, NL uses its star lord’s and SL uses its sub lord’s. Nodes use their
  agency combination on PL. Require an event-house witness on NL. An untenanted period lord may use PL or NL. A
  self-star lord requires NL and ignores SL. PL identifies the source; after permission, SL qualifies the outcome,
  or NL does so for a self-star lord.

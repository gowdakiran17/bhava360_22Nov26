version: 1
value_types:
- integer
- decimal
- boolean
- enum
- instant
- interval
instant_format: ISO 8601 with explicit UTC offset
interval_bounds: start-inclusive-end-exclusive
operators:
  eq: same-type literal
  in: membership in a nonempty list of same-type literals
groups:
  all: every child
  any: at least one child
  not: single child
unknown: Missing, unstable or incompatible evidence yields unknown. Evaluate using the three-valued rules in the KB README.
facts:
  prashna.category:
    type: enum
    producer: vedic.prashna
    origin: Normalized accepted question category before chart analysis.
    unknown_if: Required input, mode or validation of the bound question is missing.
    values:
    - job
    - marriage
    - health
    - lost-item
    - travel
    - property
    - litigation
  prashna.access:
    type: enum
    producer: vedic.prashna
    origin: Intent-first public or administrative output gate from questions.yaml.
    unknown_if: Required input, mode or validation of the bound question is missing.
    values:
    - public-reflection
    - health-referral
    - legal-referral
    - admin-study
  prashna.mode:
    type: enum
    producer: vedic.prashna
    origin: Explicitly selected method.
    unknown_if: Required input, mode or validation of the bound question is missing.
    values:
    - standard
    - kerala
    - kp-number
  prashna.leaning:
    type: enum
    producer: vedic.prashna
    origin: Independent positive and frictional testimonies combined under judgment.yaml.
    unknown_if: Required input, mode or validation of the bound question is missing.
    values:
    - leans-toward
    - leans-against
    - mixed
    - unclear
  prashna.arudha.observed:
    type: boolean
    producer: vedic.prashna
    origin: Bind the sign explicitly recorded from the questioner’s placement of the token in the Kerala sign diagram.
      Keep this observed sign, its ruler, and the actual Prashna lagna separately. Missing observation gives no
      Arudha.
    unknown_if: Required input, mode or validation of the bound question is missing.
  prashna.ashtamangala.observed:
    type: boolean
    producer: vedic.prashna
    origin: Advanced administrative study. Bind three positive integer cowrie heap counts in the recorded reading
      order. For each take 1 + ((count − 1) modulo 8); retain the three digits separately and preserve the recorded
      Arudha if available. Never simulate a ritual input or send this evidence to the public projection.
    unknown_if: Required input, mode or validation of the bound question is missing.
  prashna.moon.bound:
    type: boolean
    producer: vedic.prashna
    origin: Bind the Moon of the question chart. Check its applying or exact contact with the topic lord under judgment.yaml.
      Keep a separating contact as background. When the Moon is already the ascendant lord, count that pair only
      once.
    unknown_if: Required input, mode or validation of the bound question is missing.
  prashna.timing.verified:
    type: boolean
    producer: vedic.prashna
    origin: Use the local day of the earliest verified future perfection as a review window under judgment.yaml.
      Require an identified pair, a solved instant, stable reference and an eligible leaning.
    unknown_if: Required input, mode or validation of the bound question is missing.
  prashna.kp.bound:
    type: boolean
    producer: vedic.prashna
    origin: After the intent gate, require an integer 1–249, current judgment time and place. Delegate to kp/number-horary/input.yaml
      and kp.number-horary.arc for the selected numbered ascendant, KP ayanamsa and Placidus frame. Use KP-17 evidence
      only.
    unknown_if: Required input, mode or validation of the bound question is missing.
  muhurta.activity:
    type: enum
    producer: vedic.muhurta
    origin: Canonical activity resolved through selection.yaml aliases.
    unknown_if: Missing required evidence, unresolved participant or unsplit material boundary.
    values:
    - marriage
    - griha-pravesha
    - vehicle-purchase
    - business-start
    - naming
    - travel
    - education-start
    - property-registration
  muhurta.window.tone:
    type: enum
    producer: vedic.muhurta
    origin: Apply the scoring-free administrative evaluation to the complete bound window and required participants.
      Hard-excluded windows are omitted from recommendations.
    unknown_if: Missing required evidence, unresolved participant or unsplit material boundary.
    values:
    - Supportive
    - Steady
    - Take care
  muhurta.relief.chandra:
    type: boolean
    producer: vedic.muhurta
    origin: 'For the same participant: the election Moon is eighth from the natal Moon and their Tara category
      is supportive. Soften only their eighth-house Chandra caution to neutral.'
    unknown_if: Missing required evidence, unresolved participant or unsplit material boundary.
  muhurta.relief.naming_tuesday:
    type: boolean
    producer: vedic.muhurta
    origin: 'For naming on Tuesday: the local civil date is the tenth, twelfth or sixteenth day counted inclusively
      from the child’s local birth date. Cancel only the Tuesday caution.'
    unknown_if: Missing required evidence, unresolved participant or unsplit material boundary.
  muhurta.relief.entry_navamsa:
    type: boolean
    producer: vedic.muhurta
    origin: 'For house entry: the election lagna is movable and its KB-11 D9 sign is Taurus. Cancel only the movable-lagna
      caution.'
    unknown_if: Missing required evidence, unresolved participant or unsplit material boundary.
  muhurta.relief.janma_star:
    type: boolean
    producer: vedic.muhurta
    origin: For first letters or the purchase-registration of land, the election star is the participant’s actual
      birth star. Cancel only that participant’s Janma Tara caution; another star in the same Tara class does
      not qualify.
    unknown_if: Missing required evidence, unresolved participant or unsplit material boundary.
  panchang.pradosh.active:
    type: boolean
    producer: vedic.panchang
    origin: Trayodashi has a positive intersection with the local evening window.
    unknown_if: Missing tithi or horizon data.
  panchang.tithi.number:
    type: integer
    producer: vedic.panchang
    origin: At the query instant compute E = (Moon − Sun) modulo 1296000 arcseconds. The public number is 1 +
      floor(E / 43200); use the zero-based quotient for indexing only. Resolve name and paksha in limb-tables.yaml
      and bracket the two true crossings as specified in limbs.yaml.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
    range:
    - 1
    - 30
  panchang.vara.index:
    type: integer
    producer: vedic.panchang
    origin: Take the civil weekday at the most recent local sunrise. Sunday is index zero. Look up the seven
      weekday lords in limb-tables.yaml.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
    range:
    - 0
    - 6
  panchang.nakshatra.number:
    type: integer
    producer: vedic.panchang
    origin: Use 1 + floor((sidereal Moon modulo a turn) / 48000 arcseconds). Resolve that numbered KB-03 catalog
      row and its rule ID. Solve start and end on the Moon’s unwrapped longitude.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
    range:
    - 1
    - 27
  panchang.yoga.number:
    type: integer
    producer: vedic.panchang
    origin: Use 1 + floor(((sidereal Moon + sidereal Sun) modulo a turn) / 48000 arcseconds). Select the ordered
      yoga and solve the bracketing sum-angle crossings.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
    range:
    - 1
    - 27
  panchang.karana.index:
    type: integer
    producer: vedic.panchang
    origin: Use floor(((Moon − Sun) modulo a turn) / 21600 arcseconds). Use the fixed index map at 0 and 57–59;
      for 1–56 use movable[(index−1) modulo 7]. Solve the flanking 6° crossings.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
    range:
    - 0
    - 59
  panchang.rahu_kalam.active:
    type: boolean
    producer: vedic.panchang
    origin: For the local sunrise weekday select j from limbs.yaml day_eighths_sunday_first.rahu. Let D = (sunset
      − sunrise)/8. Match from sunrise + (j−1)D inclusive until sunrise + jD exclusive.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.yamaganda.active:
    type: boolean
    producer: vedic.panchang
    origin: For the local sunrise weekday select j from limbs.yaml day_eighths_sunday_first.yamaganda. Let D
      = (sunset − sunrise)/8. Match from sunrise + (j−1)D inclusive until sunrise + jD exclusive.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.gulika_kalam.active:
    type: boolean
    producer: vedic.panchang
    origin: For the local sunrise weekday select j from limbs.yaml day_eighths_sunday_first.gulika. Let D = (sunset
      − sunrise)/8. Match from sunrise + (j−1)D inclusive until sunrise + jD exclusive.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.abhijit_muhurta.active:
    type: boolean
    producer: vedic.panchang
    origin: Use daytime slot 8 of 15 in day-night.yaml; its midpoint is halfway between sunrise and sunset.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.brahma_muhurta.active:
    type: boolean
    producer: vedic.panchang
    origin: Before the specified sunrise select slot 14 of 15 of the night beginning at the previous sunset;
      endpoints are two and one seasonal night muhurtas before sunrise.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.choghadiya.active:
    type: boolean
    producer: vedic.panchang
    origin: Use eight equal elapsed slots of day or night. Starting at the weekday’s first label in day-night.yaml
      advance one position in the matching seven-label cycle per slot; sunset begins night slot one.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.hora.active:
    type: boolean
    producer: vedic.panchang
    origin: Divide daylight and night independently into twelve. Day slot one has the vara lord. Advance in the
      seven-lord hora_cycle for each slot without restarting at sunset; night slot one is the thirteenth from
      the day start.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.adhika_masa.active:
    type: boolean
    producer: vedic.panchang
    origin: Within the selected new-moon interval classify the month using calendar-profiles.yaml. Match exactly
      zero solar ingresses. Label using the sign of the next ingress; keep a two-ingress month separately flagged.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.ugadi.active:
    type: boolean
    producer: vedic.panchang
    origin: Match the selected local date to the Ugadi selector in calendar-profiles.yaml after resolving the
      amanta Chaitra month and both adjacent sunrises.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.deepavali.active:
    type: boolean
    producer: vedic.panchang
    origin: Match the local date selected by the Deepavali evening rule in calendar-profiles.yaml. Bind the ritual,

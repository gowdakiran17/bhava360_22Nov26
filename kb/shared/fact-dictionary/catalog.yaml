    type: boolean
    producer: western.tropical
    origin: Two endpoints oppose one another and a third, the apex, squares both. Test all three edges.
    unknown_if: Unbound body, chart frame or required ephemeris input missing or unstable.
  western.patterns.stellium:
    type: boolean
    producer: western.tropical
    origin: Group at least three distinct natal planets in one tropical sign, returning one maximal group per sign.
      Schools also use four planets, house clusters or a chain of conjunctions.
    unknown_if: Unbound body, chart frame or required ephemeris input missing or unstable.
  western.patterns.yod:
    type: boolean
    producer: western.tropical
    origin: Two base planets form a sextile and a third, the apex, forms a quincunx to both. Use the quincunx orb
      on both long edges; enable quincunx for this search.
    unknown_if: Unbound body, chart frame or required ephemeris input missing or unstable.
  western.transits.natal-contact:
    type: boolean
    producer: western.tropical
    origin: Use a dated transiting tropical body against a fixed tropical natal body. Test the configured aspect and
      separate transit orb. Track applying, exact and separating passes by UTC instant; retain repeat passes across
      a station.
    unknown_if: Unbound body, chart frame or required ephemeris input missing or unstable.
  western.progressions.secondary-contact:
    type: boolean
    producer: western.tropical
    origin: Use birth JD plus elapsed days divided by 365.2425 as the progressed ephemeris JD. Compare the progressed
      tropical planet to the natal planet within the separate progression orb. The date describes symbolic development.
    unknown_if: Unbound body, chart frame or required ephemeris input missing or unstable.
  western.returns.solar-return:
    type: boolean
    producer: western.tropical
    origin: Solve the annual ascending crossing of the unwrapped tropical solar longitude at the natal solar longitude
      plus an integral turn near the requested anniversary. Cast for the location at the return instant; compare return
      angles and Sun house with the natal chart. Without a reliable location omit houses and angles.
    unknown_if: Unbound body, chart frame or required ephemeris input missing or unstable.

    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.
  panchang.sankranti.active:
    type: boolean
    producer: vedic.panchang
    origin: Match the sunrise day containing a solved forward sidereal solar crossing of an integer multiple
      of 30 degrees. Bind the entered sign and crossing instant.
    unknown_if: Required city, instant, ephemeris, calendar profile or interval boundaries are missing or unstable.

version: 1
value_types:
- integer
- decimal
- boolean
- enum
- instant
- interval
instant_format: ISO 8601 with explicit UTC offset
interval_bounds: start-inclusive-end-exclusive
operators:
  eq: same-type literal
  in: membership in a nonempty list of same-type literals
groups:
  all: every child
  any: at least one child
  not: single child
unknown: Missing, unstable or incompatible evidence yields unknown. Evaluate using the three-valued rules in the KB README.
facts:
  dosha.mars.house_list:
    type: enum
    producer: vedic.doshas
    origin: Resolved list ID from vedic/doshas/profiles.yaml. Default inclusive.
    unknown_if: Bound chart inputs, reference, profile or interval are missing or unstable.
    values:
    - inclusive
    - lagna_five
    - family_five
    - four
  dosha.mars.reference_distance:
    type: integer
    producer: vedic.doshas
    origin: Inclusive natal sign distance from the separately selected Lagna, Moon or Venus to Mars; evaluate
      each origin independently.
    unknown_if: Bound chart inputs, reference, profile or interval are missing or unstable.
    range:
    - 1
    - 12
  dosha.mars.sgs_aspects_candidate:
    type: boolean
    producer: vedic.doshas
    origin: Mars fully aspects one of the five SGS candidate houses counted from Lagna.
    unknown_if: Lagna or the Mars placement is unresolved.
  dosha.mars.sgs_lagna_exempt:
    type: boolean
    producer: vedic.doshas
    origin: Lagna is in the six exempt signs in the SGS convention.
    unknown_if: Lagna or the Mars placement is unresolved.
  dosha.mars.relief_profile:
    type: enum
    producer: vedic.doshas
    origin: Bound cancellation convention. Require the documented list/reference combination for a named author
      profile.
    unknown_if: Bound chart inputs, reference, profile or interval are missing or unstable.
    values:
    - library
    - bphs
    - raman
    - rath
    - sgs
  dosha.mars.benefic_contact:
    type: boolean
    producer: vedic.doshas
    origin: A natural benefic joins Mars by sign or fully aspects its sign. Use Jupiter, Venus, waxing Moon,
      and Mercury when unassociated with natural malefics. For Mercury consider Sun, Mars, Saturn, nodes and
      waning Moon.
    unknown_if: Bound chart inputs, reference, profile or interval are missing or unstable.
  dosha.mars.pair_balanced:
    type: boolean
    producer: vedic.doshas
    origin: In a consented matching context only, both charts satisfy the same Manglik screen after natal exceptions,
      with the identical list, origin and relief profile. Applies to pair interpretation only; preserve individual
      raw placements.
    unknown_if: Bound chart inputs, reference, profile or interval are missing or unstable.
  dosha.mars.raman_house_sign:
    type: boolean
    producer: vedic.doshas

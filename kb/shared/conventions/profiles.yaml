version: 1
presentation_flags:
  modern_outer:
    type: boolean
    default: false
    bodies: [uranus, neptune, pluto]
    when_enabled: [chart_overlay, labelled_context]
    calculation_inputs: []
    excluded_from: [dignity, friendships, dasha, yogas, ashtakavarga, shadbala, kp_significators, kp_star_lords, kp_sub_lords]
    usage: Compute optional display coordinates separately. Context may describe the overlay only. Keep the presentation flag and its bodies outside all scoring, candidate lists, derived facts and rule evaluation.
calculation_profiles:
  modern-study-v1: {system: lal-kitab, tag: MODERN, approval: draft, enabled: false, scope: owner-controlled separate optional modern systems}
  vedic-lahiri-v1:
    presentation_flags: [modern_outer]
    engine: Swiss Ephemeris
    ephemeris_flag: runtime-backend
    allowed_backends: [SEFLG_SWIEPH, SEFLG_MOSEPH]
    actual_backend: Required in each record. Inspect the returned position flags and store the single backend used.
    position_flags: [runtime-backend, SEFLG_SIDEREAL, SEFLG_SPEED]
    frame: apparent-geocentric
    excluded_position_flags: [SEFLG_TRUEPOS, SEFLG_HELCTR, SEFLG_BARYCTR, SEFLG_TOPOCTR, SEFLG_NONUT]
    sidereal_mode_name: SE_SIDM_LAHIRI
    ayanamsa_definition: true ayanamsa, Swiss default
    lagna: {routine: swe_houses_ex, flag: SEFLG_SIDEREAL, house_code: W, result: "ascmc[0]"}
    ketu: (rahu_longitude_deg + 180) modulo 360
    tolerances_inclusive: {longitude_deg: 0.002, ayanamsa_deg: 0.001, lagna_deg: 0.01, sunrise_seconds: 60}
    time_policy: shared/conventions/time.yaml
    rise_set_parameters: vedic/panchang/rise-set.yaml
    zodiac: sidereal
    ayanamsa: Lahiri
    sidereal_mode: 1
    houses: whole-sign
    node:
      default: mean
      mixing: forbidden
      alternative: true-node
      owner_confirmation: confirmed-by-PRD-v1.2
    combustion_orbs: vedic/states/combustion-orbs.yaml
    node_aspects: seventh-only
    sunrise: apparent-upper-limb-with-refraction
    vimshottari_year_days:
      default: julian-365.25
      days: 365.25
      alternatives: {mean-gregorian: 365.2425, savana: 360}
    ashtakavarga_variant: bphs-seven-graha-337
  kp-placidus-v1:
    presentation_flags: [modern_outer]
    zodiac: sidereal
    houses: placidus
    node: {default: true-node, mixing: forbidden}
    ayanamsa_family: KP
    sidereal_mode: 5
    exact_variant: Swiss Ephemeris SE_SIDM_KRISHNAMURTI (5), traditional sidereal house algorithm
    polar_fallback: unknown
    on_cusp_failure:
      withhold: [cuspal-sub-lords, house-significators, kp-prashna]
      retain: [planet-star-lords, planet-sub-lords, independent-parashari]
      note:
        en: House details are unavailable here. You can still explore the planetary context.
        kn: ಇಲ್ಲಿ ಭಾವದ ವಿವರಗಳು ಲಭ್ಯವಿಲ್ಲ. ಗ್ರಹಗಳ ಸಂದರ್ಭವನ್ನು ಪರಿಶೀಲಿಸಬಹುದು.
        hi: यहाँ भाव विवरण उपलब्ध नहीं हैं। आप ग्रहों का संदर्भ देख सकते हैं।
  western-tropical-v1:
    zodiac: tropical
    house_options: [placidus, whole-sign, koch, equal]
    houses: placidus
    fallback_from: [placidus, koch]
    polar_fallback: whole-sign
    label_fallback: true

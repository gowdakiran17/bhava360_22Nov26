version: 1
inputs:
  chart: Bind the active profile, birth-time precision, convention, date and relevant place.
  timing: Use the current timing city or label the fallback. Preserve the original natal instant and place.
  ai: With consent, allow first name and minimum derived evidence only. Exclude contact details, raw identifiers, exact coordinates and raw images from text prompts.
  mobile_and_vehicle: Process raw numbers in memory. Never log or send them to AI. Persist only by explicit save.
  palm: Separate reading consent and confirmed illustrated choices only. Future photo input is disabled by default and requires separate explicit consent. Default retention is zero days.
  face: On-device only with immediate photo deletion. Exclude sensitive-trait inference.
  fixtures: Synthetic only, excluded from production retrieval.
copy:
  user_tones: [Supportive, Steady, Take care]
  evidence: Every personal statement must resolve to supplied facts. Mark each AI-written sentence with ✦ AI.
  style: Use gentle possibilities and practical choices. Exclude guarantees, fear, pressure, scores and colour-only signals.
  matching_exception: Traditional points as text only.
  fixed_response_topics: [diagnosis, death-or-lifespan, pregnancy-or-child-sex, legal-outcomes, gambling-or-stock-tips, self-harm]
  sensitive_routing: Route to approved localized boundary messages. For self-harm use the support flow with current verified resources.
  reading_footer_en: Guidance for reflection, not a guarantee. Not medical, financial or legal advice.
  reflection_line_en: For reflection. You choose what to do.
  reflection_modules: [tarot, palmistry, face-reading]
  practices: {allowed: [mantra, charity, conduct], optional: true, free: true, label_en: Traditional practice}
  excluded: [gems, crystals, lucky-colours, paid-remedies, pujas-as-remedies]
  admin_only: [technical-rule-chain, rule-ids, sources, raw-strengths, bindus, prompts, confidence]

messages:
  health:
    en: For health questions, a qualified clinician can help you decide what care you need.
    kn: ಆರೋಗ್ಯದ ಪ್ರಶ್ನೆಗಳಿಗೆ ಅರ್ಹ ವೈದ್ಯರು ಸೂಕ್ತ ಆರೈಕೆ ಆರಿಸಲು ನೆರವಾಗಬಹುದು.
    hi: स्वास्थ्य से जुड़े सवालों में योग्य चिकित्सक देखभाल तय करने में मदद कर सकते हैं।
  life-or-pregnancy:
    en: For questions about pregnancy or life expectancy, a healthcare professional can offer individual guidance.
    kn: ಗರ್ಭಧಾರಣೆ ಅಥವಾ ಆಯುಷ್ಯದ ಪ್ರಶ್ನೆಗಳಿಗೆ ಆರೋಗ್ಯ ತಜ್ಞರಿಂದ ವೈಯಕ್ತಿಕ ಮಾರ್ಗದರ್ಶನ ಪಡೆಯಬಹುದು.
    hi: गर्भावस्था या आयु से जुड़े सवालों के लिए स्वास्थ्य विशेषज्ञ से व्यक्तिगत मार्गदर्शन ले सकते हैं।
  legal:
    en: For your legal options, you can speak with a qualified lawyer.
    kn: ಕಾನೂನು ಆಯ್ಕೆಗಳ ಕುರಿತು ಅರ್ಹ ವಕೀಲರೊಂದಿಗೆ ಮಾತನಾಡಬಹುದು.
    hi: कानूनी विकल्पों के लिए योग्य वकील से बात कर सकते हैं।
  money-verdict:
    en: You can review the practical risks with a qualified financial adviser.
    kn: ಹಣಕಾಸಿನ ಅಪಾಯಗಳನ್ನು ಅರ್ಹ ಸಲಹೆಗಾರರೊಂದಿಗೆ ಪರಿಶೀಲಿಸಬಹುದು.
    hi: वित्तीय जोखिमों पर योग्य सलाहकार से बात कर सकते हैं।
  immediate-support:
    en: If you feel at risk of harming yourself, reach out to someone nearby and contact local emergency services now.
    kn: ನಿಮಗೆ ಹಾನಿ ಮಾಡಿಕೊಳ್ಳುವ ಅಪಾಯವಿದ್ದರೆ ಈಗಲೇ ಹತ್ತಿರದವರ ನೆರವು ಪಡೆದು ಸ್ಥಳೀಯ ತುರ್ತು ಸೇವೆಯನ್ನು ಸಂಪರ್ಕಿಸಿ.
    hi: यदि आपको खुद को नुकसान पहुँचाने का खतरा है तो अभी किसी पास के व्यक्ति की मदद लें और स्थानीय आपात सेवा से संपर्क करें।
support_route: Self-harm signals bypass all reading engines. Show the reviewed local support directory for the user’s country.

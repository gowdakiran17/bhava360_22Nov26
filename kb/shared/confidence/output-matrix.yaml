version: 1
approval: draft
tag: MODERN/POPULAR
profile: birth-time-confidence-v1
tier_policy: shared/confidence/birth-time-tiers.yaml
actions:
  show: Eligible only when the output and all material dependencies are proved stable.
  hide: Omit the output and any evidence depending on it.
  month-resolution: Compare each bound at calendar-month precision. Show months only when all possible bounds agree at that resolution.
  cap-moderate: Clamp the final stable card grade after the conflict ladder. Preserve lower grades and the internal KB-35 worksheet.
binding: Resolve each dependency for the selected planet, house, query, period, convention and local reporting zone. Apply the same stability check to the actual output and its material inputs.
dates: Compare dates or months in the same reporting zone. Event windows in B use the Antar bounds without a peak. Never promote a working noon instant to a known event time.
promise: Apply the gate to each factor independently. Insufficient evidence is unknown. A dependent factor inherits the full restrictions of its source, including a hidden D24 or unstable D10.
scope: Policy permission alone does not release a post-MVP module, create a cusp solution or establish a chart fact.

implementation_references:
  vedastro-library:
    system: vedic
    repository: https://github.com/VedAstro/VedAstro
    revision: 4d14da8ae07560d5a4d8ba95ea6f5f5cf997e298
    calculation_directory: Library/Logic/Calculate
    scope_evidence: https://github.com/VedAstro/VedAstro/blob/4d14da8ae07560d5a4d8ba95ea6f5f5cf997e298/README.md
    rights_evidence: https://github.com/VedAstro/VedAstro/blob/4d14da8ae07560d5a4d8ba95ea6f5f5cf997e298/LICENSE.md
    repository_license: MIT
    license_scope: The software notice requires retaining copyright and permission notices with copies or substantial portions.
      Linked books, third-party assets and dependencies require their own rights records.
    use: Cross-check implementations for charts, divisional charts, matching and Panchang. Record the exact function, revision,
      inputs and convention before comparing a result. Interpretive claims still require an edition and passage.
  pyjhora:
    repository: https://github.com/naturalstupid/PyJHora
    revision: f8c6de2f54338752bdb667384a8b0ca5791c5bdf
    paths:
    - src/jhora/const.py
    - src/jhora/horoscope/chart/charts.py
    - src/jhora/horoscope/chart/ashtakavarga.py
    - src/jhora/horoscope/match/compatibility.py
    use: Comparison of selected algorithms and traditional numerical tables. Pin variant for independent worked examples.
edition_contract:
  required:
  - work_id
  - edition_id
  - title_as_printed
  - language
  - publication_details
  - verified_by
  publication_details: Identify the specific imprint or manuscript, year or edition statement, translator or editor where
    credited, and volume for a multi-volume work.
  locator: Record chapter and verse where numbered, otherwise a precise page, section or stable object ID. Cite the actual
    edition consulted.
  draft_handling: An unresolved edition is null. Mark verification pending and record the missing evidence.

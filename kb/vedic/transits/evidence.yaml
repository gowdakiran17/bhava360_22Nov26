version: 1
approval: draft
origins:
- natal Moon sign
- natal Lagna sign
groups:
  short:
  - moon
  - sun
  - mercury
  - venus
  - mars
  long:
  - jupiter
  - saturn
  - rahu
  - ketu
phases:
  sade-sati:
  - 12
  - 1
  - 2
  ashtama-shani:
  - 8
  ardhashtama:
  - 4
windows: Solve all sign crossings, including retrograde exits and returns; attach start/end instants to each continuous
  phase.
modifiers: Evaluate Vedha obstruction under its own planet/house table and bindus from raw BAV on separate evidence
  chips.
kb16:
  reference: One sidereal profile per chart. For index 0..11 use 1 + (transit sign - natal reference sign) modulo
    12, applying modulo before adding one. Evaluate each body only inside its dated sign window.
  vedha: vedic/transits/vedha.yaml
  raw_bav: vedic/strength/ashtakavarga/bindu.yaml
  kakshya: vedic/strength/ashtakavarga/kakshya.yaml
  aspects: vedic/aspects/full-graha.yaml
  timing: vedic/dashas/vimshottari/periods.yaml
  phase_links:
  - vedic.doshas.sade-sati
  - vedic.doshas.ashtama-shani
  delivery: Attach area modifiers only to the bound target topic. Phase names annotate the existing Saturn house reading.
    Emit a single nodal-axis reading. Display the raw BAV band and kakshya support separately; numerical details are
    admin/tester-only.
birth_time_availability: shared/confidence/output-matrix.yaml
phase_variants:
  kantaka:
    admin_only: true
    moon_distances:
    - 1
    - 4
    - 7
    - 10
  degree_based: 'Start Saturn at natal Moon longitude minus 45 degrees; split into three successive 30-degree intervals.
    Sign-based default; withhold if natal Moon crosses a sign boundary and the phase changes. Wording: modules/home/month.yaml.'
  kantaka_variant_id: kantaka-kendras
  degree_variant_id: saturn-degree-phase
contact_modifiers:
  reentry: Split each retrograde exit and return into distinct windows; attach repeated-contact emphasis without a
    second vote.
  station: A speed reversal within one degree of the natal point extends emphasis; editorial orb, shortest angular
    distance.
  dignity: Own or exalted sign supports expression, debilitation qualifies it. Bind the moving body and its transit
    sign.
  tara: Inclusive nakshatra distances 1, 10 and 19 are Janma, Anujanma and Trijanma contacts. Mark repetition; no
    standalone vote.
phase_reading: Use vedic.doshas.sade-sati for the formation and modules/home/month.yaml for the reading and gentle
  phase wording.

approval: draft
binding: Bind one target and one reference. Moon stance, vedha and Saturn phases apply only to Moon. BAV requires
  a stable Lagna; node BAV has no row. Missing facts are unknown. Support and challenge are separate chips. Forward
  Vedha is unblocked by convention on the node Moon rows because nodes have no forward pairs. Traditional BAV rows
  require their own availability; non-applicable factors do not vote.

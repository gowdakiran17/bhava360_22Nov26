predicates:
  challenge:
    all:
    - fact: transit.contact.area_target
      op: eq
      value: true
    - any:
      - fact: transit.vedha.blocked
        op: eq
        value: true
      - fact: transit.bav.band
        op: eq
        value: Take care
      - fact: transit.saturn.phase_challenge
        op: eq
        value: true
      - fact: transit.moon.house_stance
        op: eq
        value: caution
  support:
    all:
    - fact: transit.contact.area_target
      op: eq
      value: true
    - any:
      - all:
        - fact: transit.moon.house_stance
          op: eq
          value: support
        - fact: transit.vedha.blocked
          op: eq
          value: false
      - fact: transit.bav.supportive
        op: eq
        value: true
      - all:
        - any:
          - fact: transit.double.common_target
            op: eq
            value: true
          - fact: transit.double.moon_target
            op: eq
            value: true
        - fact: transit.double.pace_supported
          op: eq
          value: true

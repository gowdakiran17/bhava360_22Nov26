  note: Count signs inclusively from the natal Moon. A Lagna reading uses the natal ascendant to locate topics separately
    (§25.3). Moon-relative classifications and vedha belong to the Moon reading. Some schools extend Kantaka to
    angular houses. This profile selects the fourth alone.

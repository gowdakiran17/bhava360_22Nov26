id: vedic.houses.house-7
system: vedic
topic: houses
title: House 7 · Yuvati
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Use these meanings when house 7 of the computed natal whole-sign chart is selected.
conditions:
  all:
  - fact: d1.selected_house.number
    op: eq
    value: 7
bhava:
  number: 7
  significations:
  - committed partnership
  - agreements
  - one-to-one dealings
  groupings:
  - kendra
  - maraka
  natural_karakas:
  - venus
  symbolic_body_parts:
  - lower abdomen
  bhavat_bhavam:
    from_house: 7
    count: 7
    target_house: 1
meaning: Agreements work through conversation. You can ask a partner what each of you understood before deciding
  together.
life_areas:
- love-marriage
- business
strength_notes:
- when:
    fact: d1.selected_house.house_lord_karaka_strong
    op: eq
    value: true
  effect: stronger
  reason: Agreement among the strengths of the house, its lord and its natural significator can lend weight to
    the selected theme.
exceptions: []
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: Count whole signs from the rising sign. Bhava chalit charts can move a graha across a house boundary.
    Sripati is one cusp-based method and needs its own house calculation.

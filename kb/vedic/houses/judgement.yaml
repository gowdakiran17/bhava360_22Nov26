approval: draft
reference: life-areas/pipeline.yaml
checks:
- - lord
  - Trace the area lord to its placement and grade.
- - occupants
  - Inspect functional nature and strength of each occupant.
- - aspects
  - Compare full aspects on the house and its lord.
- - karaka
  - Read the relevant significator in context.
- - bhavat-bhavam
  - 'context: count the same distance again; explain recurrence.'
- - varga
  - Confirm using the released area varga.
- - sav
  - 'context: explain sign support only when available.'
karaka_bhava_nashaya:
  tag: CLASSICAL
  weight_class: modifier
  direction: caution
  source: Uttara Kalamrita, bhava karakas; edition/locator pending.
  method: Use house natural karakas; Jupiter with children or Venus with partnership in its own topic house qualifies
    expectations. Some traditions require affliction; never add another promise count.

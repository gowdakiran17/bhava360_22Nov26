id: vedic.houses.house-11
system: vedic
topic: houses
title: House 11 · Labha
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Use these meanings when house 11 of the computed natal whole-sign chart is selected.
conditions:
  all:
  - fact: d1.selected_house.number
    op: eq
    value: 11
bhava:
  number: 11
  significations:
  - receipts
  - fulfilment of aims
  - older siblings
  groupings:
  - upachaya
  natural_karakas:
  - jupiter
  symbolic_body_parts:
  - ankles
  bhavat_bhavam:
    from_house: 11
    count: 11
    target_house: 9
meaning: A gain may matter because of the aim it serves. You can name a goal before deciding how to use a new
  resource.
life_areas:
- money
- career
- family-home
strength_notes:
- when:
    fact: d1.selected_house.house_lord_karaka_strong
    op: eq
    value: true
  effect: stronger
  reason: Agreement among the strengths of the house, its lord and its natural significator can lend weight to
    the selected theme.
exceptions: []
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: Count whole signs from the rising sign. Bhava chalit charts can move a graha across a house boundary.
    Sripati is one cusp-based method and needs its own house calculation.

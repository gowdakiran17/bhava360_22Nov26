user_text:
  en: You can ask what feels fair to each person.
  kn: ಹಂಚಿಕೊಂಡ ಜವಾಬ್ದಾರಿಗಳು ಬದಲಾದಾಗ ಇಬ್ಬರಿಗೂ ಯಾವುದು ನ್ಯಾಯವೆನಿಸುತ್ತದೆ ಎಂದು ಕೇಳಬಹುದು.
  hi: साझी ज़िम्मेदारियाँ बदलें तो आप पूछ सकते हैं कि दोनों को क्या उचित लगता है।

  user_text:
    en: "You can write down one shared responsibility you would like to discuss."
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ನೀವು ಚರ್ಚಿಸಲು ಬಯಸುವ ಒಂದು ಹಂಚಿಕೆಯ ಜವಾಬ್ದಾರಿಯನ್ನು ಬರೆದಿಡಬಹುದು.
    hi: "चाहें तो कोई एक साझी ज़िम्मेदारी लिख सकते हैं जिस पर आप बात करना चाहते हैं।"

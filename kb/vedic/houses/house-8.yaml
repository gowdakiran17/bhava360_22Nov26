    the selected theme.
exceptions: []
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: Count whole signs from the rising sign. Bhava chalit charts can move a graha across a house boundary.
    Sripati is one cusp-based method and needs its own house calculation.
- profile: parashari-lahiri-whole-sign-draft-v1
  note: Shared resources are read here through the second house from the seventh. Longevity (ayu) is a classical topic in Phaladeepika I.14.
    Sudden change and inquiry into hidden subjects extend the disruption and secrecy themes. Inheritance and
    insurance are applications of the shared-resource reading. Insurance is modern terminology.

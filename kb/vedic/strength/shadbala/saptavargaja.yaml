id: vedic.strength-shadbala.saptavargaja
system: vedic
topic: strength/shadbala
title: Saptavargaja bala
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Sum the seven unweighted dignity awards. In D1 first test the KB-02 half-open moolatrikona interval. Next
  test sign ownership in each varga. Otherwise combine the target’s natural relation to its sign lord (+1, 0,
  −1) with its temporary relation (+1 for the specified D1 sign distances from target to lord, −1 otherwise).
  Index the relationship awards by the sum plus two. Use natural relationships from KB-02 and classical sign lords
  and divisions from KB-11.

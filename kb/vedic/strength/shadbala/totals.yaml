id: vedic.strength-shadbala.totals
system: vedic
topic: strength/shadbala
title: Shadbala totals and Ishta/Kashta phala
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Sum the six signed components in virupas and divide by sixty for rupas. Compare the unrounded result with
  the graha minimum using greater-than-or-equal. Separately compute Ishta = sqrt(U × C) and Kashta = sqrt((60
  − U) × (60 − C)), where U is Uchcha and C is the selected undoubled Cheshta in [0,60]. Neither phala enters
  the total. If any required input is unknown, withhold the dependent result.

id: vedic.strength-shadbala.drik
system: vedic
topic: strength/shadbala
title: Drik bala
doctrine_profile: vedic-editorial-v1
approval: draft
rule: For each other classical graha compute (target longitude − caster longitude) modulo 360. Interpolate the
  common aspect between consecutive knots. At the start and end of each special-aspect interval use the selected
  caster’s special peak at the indicated knot, interpolating between adjacent knot values. Add benefic aspects
  and subtract malefic aspects, then divide by four. Jupiter and Venus are benefic. Moon is benefic for elongation
  in (0,180]; Mercury is benefic unless sharing a natal sign with Sun, Mars, Saturn or a dark Moon.

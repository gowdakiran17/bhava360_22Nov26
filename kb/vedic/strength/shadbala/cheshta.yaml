id: vedic.strength-shadbala.cheshta
system: vedic
topic: strength/shadbala
title: Cheshta bala
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Use solar Ayana for the Sun and lunar Paksha for the Moon. For Mars, Jupiter and Saturn use the mean Sun
  as the fast point and the planet mean as the slow point. For Mercury and Venus swap these roles. Move halfway
  from the slow point to the true planet along the shortest signed arc in [−180,180). Divide the shorter arc from
  that midpoint to the fast point by three. Mean and true longitudes must share frame and epoch.

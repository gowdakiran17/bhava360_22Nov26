id: vedic.strength-shadbala.yuddha
system: vedic
topic: strength/shadbala
title: Yuddha bala
doctrine_profile: vedic-editorial-v1
approval: draft
rule: For each eligible pair with shorter separation strictly below one degree, compare the signed ecliptic latitudes
  per KB-05. Transfer the absolute difference of their pre-war Kala amounts to the northern graha from the southern
  graha. The pre-war amount is the sum of the other eight Kala terms. Accumulate disjoint pairs simultaneously.
  Withhold affected results for an unresolved winner or overlapping pairs.

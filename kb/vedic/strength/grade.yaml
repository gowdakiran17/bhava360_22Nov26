paksha_notes: CLASSICAL phase dependence (BPHS chapters 3 and 27, Phaladeepika chapter 2). The symmetric linear signed
  scale is editorial.
grade_variants:
- Combust exalted dignity retained by default
- Retrograde debilitated uplift per Uttara Kalamrita 2.6 is optional
- Debilitated vargottama retains D9 dignity and repetition separately
limits: Deduplicate reliefs that describe the same physical contact.
sandhi:
  window_degrees: 1
  distance: smaller arc to nearest sign boundary or selected bhava sandhi
  effect: Within the window mark the relevant dignity or placement provisional; withhold if the declared interval
    crosses the boundary. No second numeric penalty.
  modelling_limit: Sign and house sandhi strength attenuation is not modelled. KB-48 still withholds evidence on an actual boundary crossing.

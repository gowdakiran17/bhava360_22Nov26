version: 1
approval: draft
profile: planet-strength-grade-v1
tag: MODERN/POPULAR
visibility: admin-only
basis: Bhava360 practitioner synthesis of classical dignity, house, aspect and avastha considerations. Add the unrounded
  terms before assigning a band.
inputs:
  dignity: Use the resolved KB dignity label for each division, with vedic/dignity/sign-dignities.yaml endpoint precedence
    and vedic/dignity/relationships.yaml directed compound friendship.
  cancellation: Count distinct physical causes among the true branches of vedic.yogas.neecha-bhanga for the same debilitated
    D1 graha. An undecided count with multiple possible awards withholds the grade.
  house: From Lagna, or from the Moon only when Lagna is explicitly withheld. Count the angle/trine overlap once.
  combustion: Use the inclusive speed-specific orbs in vedic/states/combustion-orbs.yaml.
  war: Use the resolved planetary-war loser flag.
  received_aspects: Complete set of distinct full aspects under vedic/aspects/full-graha.yaml. Classify each caster
    and retrograde target under vedic/planets/benefic-profile.yaml. Nodes cast only the seventh.
  vargottama: Same D1 and D9 sign.
dignity:
  exaltation-peak: 3
  exaltation-sign: 3
  moolatrikona: 2.5
  own-sign: 2
  mitra: 1
  adhi-mitra: 1
  sama: 0
  shatru: -1
  adhi-shatru: -1
  debilitation-sign: -2
node_dignity: 0
cancellation_awards:
- -2
- 0
- 1
house_terms:
  angle_or_trine: 1
  difficult: -1
  malefic_upachaya: 1
  other: 0
combust:
  mercury: -0.5
  venus: -0.5
  other: -1
war_loser: -1
retrograde_benefic: 0.5
aspect_unit: 0.5
aspect_net_cap: 1
d9_factor: 0.5
vargottama: 1
bands:
  Strong: 3
  Moderate: 1
traditions_differ:
- Node dignities vary by school. Neither division assigns dignity points to a node by default.
- Multiple independent relief conditions earn +1 by Bhava360 choice. No cancellation award in D9.
- The earlier consultation-method section 8.1 composite includes Shadbala. It is a non-default variant; no Shadbala
  quantity feeds this grade.

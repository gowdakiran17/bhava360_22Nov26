version: 1
approval: draft
reference: https://github.com/naturalstupid/PyJHora/blob/f8c6de2f54338752bdb667384a8b0ca5791c5bdf/src/jhora/horoscope/chart/ashtakavarga.py
order:
- raw BAV
- trine minimum subtraction
- same-owner pair reduction
- weighted pinda
same_owner_pairs:
- Aries/Scorpio
- Taurus/Libra
- Gemini/Virgo
- Sagittarius/Pisces
- Capricorn/Aquarius
occupancy: Default to the seven natal grahas. Only the separately labeled comparison uses its expanded occupancy mask.
cases:
  either_zero_or_both_occupied: Preserve both values.
  both_empty_equal: Set both to zero.
  both_empty_unequal: Set both to the smaller value.
  one_occupied: Retain occupied value. Empty value becomes zero if less than or equal to occupied, otherwise reduce it to
    the occupied value.
worked_example:
  fixture: Scenario 1
  target: saturn
  signs: [aries, scorpio]
  occupants: [[sun], []]
  case: one_occupied
  after_trikona: [3, 1]
  after_ekadhipatya: [3, 0]
  explanation: The Sun occupies Aries and Scorpio is empty. Keep Aries at three and clear the smaller Scorpio value.

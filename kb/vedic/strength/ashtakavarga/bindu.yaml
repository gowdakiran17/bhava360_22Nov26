accumulate: Start each row at zero. Each contributor adds one to each sign reached by the listed one-based
  offsets from its own natal sign. Sum the seven target rows by sign for raw SAV.
totals:
  sun: 48
  moon: 49
  mars: 39
  mercury: 54
  jupiter: 56
  venus: 52
  saturn: 39
reduction: Keep raw BAV/SAV for transit use. On a copy subtract the smallest value in each elemental trine
  from all three. Then reduce dual-owned signs under the selected occupancy convention.
pinda: For each reduced row sum sign bindus × sign weights for Rashi Pinda. Sum reduced bindus in occupied
  signs × graha weights for Graha Pinda. Add the two for Shodhya Pinda. Use the named weight and occupancy
  profiles in shodhya-pinda.yaml and shodhana.yaml.

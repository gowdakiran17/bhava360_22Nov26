id: vedic.dashas-ashtottari.conditional-cycle
system: vedic
topic: dashas/ashtottari
title: Ashtottari · eligibility and timing
doctrine_profile: vedic-editorial-v1
approval: draft
rule: 'Default: require Rahu outside the natal Lagna and in an angular or trinal whole sign counted from the
  natal Lagna lord’s occupied sign. When eligible, take the Moon’s sidereal longitude in arcminutes modulo 21600.
  Add 21600 if below 4000. Locate it in the half-open edges in periods.yaml. Back-project the fraction traversed
  of the entire multi-star arc times its lord’s full years. Cycle through eight lords. Each Antar starts with
  the successor of the Maha lord and ends with the Maha lord. Allocate parent duration × child years / 108.'
conditions:
  all:
  - fact: dasha.ashtottari.conditional_cycle
    op: eq
    value: true
meaning: Use as a conditional second reading. Unknown eligibility withholds its dates. Read an eligible interval
  through the natal lord’s topics.

id: vedic.dashas-yogini.balance-calculation
system: vedic
topic: dashas/yogini
title: Yogini · birth balance
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Number the 27 equal lunar mansions from Ashwini = 1. Add three to the natal Moon’s mansion number and take
  the remainder modulo eight, reading zero as the eighth Yogini. The fraction elapsed is the arc traversed in
  that mansion divided by 48000 arcseconds. Subtract that fraction of the first lord’s full years from birth
  to obtain the true start. Advance by the remaining fraction to obtain the end. Repeat the eight periods in
  sequence. Each parent opens with its own Yogini and divides among all eight by child years / 36.

id: vedic.dashas-kalachakra.pada-wheel
system: vedic
topic: dashas/kalachakra
title: Kalachakra · advanced admin timing
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Select the birth Moon’s star group and pada using the half-open angular intervals in periods.yaml. Multiply
  its traversed pada fraction by the sum of the nine listed sign years. Walk that row cumulatively to find the
  running sign and time already elapsed in it. Back-project its full start. Continue through the ordered sign
  occurrences. After a row move to the next pada; after pada four move to pada one of the other subgroup in the
  same direction family. For an Antar take nine consecutive sign occurrences beginning at the parent occurrence,
  crossing rows as needed. Divide the parent duration in proportion to their individual years over their actual
  sum.

rule: Within the dated Ketu Maha and Saturn Antar, read the major lord’s ongoing topic through the subperiod lord’s
  natal placement. Bind the dated lord to its D1 occupied house, sign placement and every house it rules from
  the natal Lagna using periods.yaml reading_context. Use the sign ruler and natal associations for nodes. Retain
  only topics supported by these resolved entries. Compare their relative houses, shared topics and confirmed
  associations.

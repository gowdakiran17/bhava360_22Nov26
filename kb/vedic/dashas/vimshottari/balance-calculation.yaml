id: vedic.dashas-vimshottari.balance-calculation
system: vedic
topic: dashas/vimshottari
title: Birth balance from the natal Moon
doctrine_profile: vedic-editorial-v1
approval: draft
rule: 'Normalize the sidereal Moon longitude to [0°,360°). Each of the 27 stars spans 48000 arcseconds. Divide
  longitude by this width: the integer quotient selects the star from Ashwini and the remainder is the arc traversed.
  With f = remainder / 48000 and Y = years of the star lord, elapsed years = Y × f and remaining years = Y × (1
  − f). Maha starts at birth minus elapsed time and ends at birth plus remaining time. At an exact edge, select
  the next star with its full balance.'

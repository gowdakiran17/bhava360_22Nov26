id: vedic.dashas-vimshottari.mars-mars-antar
system: vedic
topic: dashas/vimshottari
title: Mars Maha · Mars Antar
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Within the dated Mars Maha and Mars Antar, read the major lord’s ongoing topic through the subperiod lord’s
  natal placement. Bind the dated lord to its D1 occupied house, sign placement and every house it rules from
  the natal Lagna using periods.yaml reading_context. Use the sign ruler and natal associations for nodes. Retain
  only topics supported by these resolved entries. Both roles bind to the same graha. Give its supported theme
  one emphasis.
conditions:
  all:
  - fact: dasha.vimshottari.maha_lord
    op: eq
    value: mars
  - fact: dasha.vimshottari.antar_lord
    op: eq
    value: mars
  - fact: dasha.vimshottari.pair_context_ready
    op: eq
    value: true
meaning: You may be ready to act on a practical task. You can choose a manageable first step.
life_areas:
- career
- property-vehicles
strength_notes:

  - fact: dasha.vimshottari.maha_lord
    op: eq
    value: venus
  - fact: dasha.vimshottari.antar_lord
    op: eq
    value: sun
  - fact: dasha.vimshottari.pair_context_ready
    op: eq
    value: true
meaning: You may be considering what you and another person value. You can clarify who will make the decision.

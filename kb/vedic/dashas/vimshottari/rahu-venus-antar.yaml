    value: rahu
  - fact: dasha.vimshottari.antar_lord
    op: eq
    value: venus
  - fact: dasha.vimshottari.pair_context_ready
    op: eq
    value: true
meaning: An unfamiliar option may be drawing your attention. You can discuss what feels fair to both of you.

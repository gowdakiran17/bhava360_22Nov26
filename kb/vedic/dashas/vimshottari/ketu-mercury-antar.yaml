id: vedic.dashas-vimshottari.ketu-mercury-antar
system: vedic
topic: dashas/vimshottari
title: Ketu Maha · Mercury Antar
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Within the dated Ketu Maha and Mercury Antar, read the major lord’s ongoing topic through the subperiod
  lord’s natal placement. Bind the dated lord to its D1 occupied house, sign placement and every house it rules
  from the natal Lagna using periods.yaml reading_context. Use the sign ruler and natal associations for nodes.
  Retain only topics supported by these resolved entries. Compare their relative houses, shared topics and confirmed
  associations.
conditions:
  all:
  - fact: dasha.vimshottari.maha_lord
    op: eq
    value: ketu
  - fact: dasha.vimshottari.antar_lord
    op: eq
    value: mercury
  - fact: dasha.vimshottari.pair_context_ready
    op: eq
    value: true
meaning: You may want to make space for something simpler. You can check that an agreement means the same thing
  to everyone.
life_areas:
- spirituality

id: vedic.dashas-sandhi.junction
system: vedic
topic: dashas/sandhi
title: Dasha sandhi · junction
doctrine_profile: vedic-editorial-v1
approval: draft
rule: For neighbouring dated periods of the same profile and level, accept the junction only when the outgoing
  end equals the incoming start. Its duration is zero. At that instant the incoming period owns the reading.
  A display range [a,b) contains the junction if a ≤ boundary < b. Preserve both lords as context. If birth-time
  uncertainty spans the boundary, describe the transition and withhold a unique active lord. A child turnover
  uses its own parent subdivision.
conditions:
  all:
  - fact: dasha.sandhi.junction
    op: eq
    value: true
meaning: Use at an actual period change, including subperiod changes. Derive its life area from the houses of
  the two bound periods.

id: vedic.dashas-narayana.progression
system: vedic
topic: dashas/narayana
title: Narayana · progressed sign
doctrine_profile: vedic-editorial-v1
approval: draft
rule: At birth begin with the stronger of Lagna and its seventh, using the strength comparison in periods.yaml.
  Use the ninth from that seed to select direction as in Chara. Traverse the seed-modality offsets in that direction.
  Saturn in the seed gives ordinary forward succession; otherwise Ketu in the seed reverses the normal direction.
  Compute first-cycle lengths by directed lord distance and dignity as in Chara. Cap a first-pass length at twelve for this complementary profile. In the second pass the same
  sign receives twelve minus its first length. Skip zero spans. For Antar take the stronger of the parent sign
  and its seventh. Start in the sign occupied by its lord. Count forward from an odd start, backward from an
  even start. Saturn in the stronger sign forces forward; otherwise Ketu there reverses direction. Each child
  takes one twelfth.
conditions:
  all:
  - fact: dasha.narayana.progression
    op: eq
    value: true
meaning: Use this sign-based period for a stable D1 chart to examine shifts in house emphasis. If the seventh
  supplied the seed, read the sign opposite the dated sign as the progressed Lagna.

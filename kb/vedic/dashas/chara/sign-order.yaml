title: Chara · Jaimini sign order
doctrine_profile: vedic-editorial-v1
approval: draft
rule: 'Start the K.N. Rao implementation at the natal Lagna at birth. Count to the ninth sign inclusively. If
  it is Cancer, Leo, Virgo, Capricorn, Aquarius or Pisces, step backward through all twelve major signs; otherwise
  step forward. For duration, use the period sign’s own foot group: count directed steps to its resolved ruler,
  with zero steps worth twelve years. Add one for exaltation or subtract one for debilitation. Use classical
  dignity for the seven grahas; leave nodes unadjusted in this profile. Skip a zero duration. Divide a full Maha
  equally among twelve Antars. Start one sign ahead for Aries, Leo, Virgo, Libra, Aquarius or Pisces and one
  behind for the others. Continue in that direction and end with the parent.'

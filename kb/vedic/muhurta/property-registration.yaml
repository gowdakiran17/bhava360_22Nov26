doctrine_profile: vedic-editorial-v1
approval: draft
rule: For the selected activity compare a city-specific, boundary-stable interval using this profile and the
  shared ranking policy. Require the listed participants. Bind all factors and each exception to this same interval.
conditions:
  all:
  - fact: muhurta.activity
    op: eq
    value: property-registration
  - fact: muhurta.window.eligible
    op: eq
    value: true
meaning: You can compare signing times that allow everyone to review the papers.
life_areas:
- property-vehicles
- money
strength_notes: []
exceptions:
- when:
    fact: muhurta.relief.chandra
    op: eq
    value: true
  effect: soften
  reason: 'For the same participant: the election Moon is eighth from the natal Moon and their Tara category
    is supportive. Soften only their eighth-house Chandra caution to neutral.'
- when:
    fact: muhurta.relief.janma_star
    op: eq
    value: true
  effect: cancel
  reason: For first letters or the purchase-registration of land, the election star is the participant’s actual
    birth star. Cancel only that participant’s Janma Tara caution; another star in the same Tara class does
    not qualify.
traditions_differ:
- profile: vedic-editorial-v1
  note: Draft daytime profile. Raman supplies the cited activity and cancellation principles. Exact shortlists
    for yoga, karana, lagna and other unlisted preferences are editorial choices; regional and family practice
    may differ. Land-purchase criteria are adapted to signing. An actual registry appointment and document requirements
    govern practical availability.

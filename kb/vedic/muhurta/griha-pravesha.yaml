    value: true
  effect: soften
  reason: 'For the same participant: the election Moon is eighth from the natal Moon and their Tara category is supportive.
    Soften only their eighth-house Chandra caution to neutral.'
- when:
    fact: muhurta.relief.entry_navamsa
    op: eq
    value: true
  effect: cancel
  reason: 'For house entry: the election lagna is movable and its KB-11 D9 sign is Taurus. Cancel only the movable-lagna
    caution.'

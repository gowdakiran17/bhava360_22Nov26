tara: Count inclusively from birth star to window star, wrap 27 then cycle 1..9. Categories 2,4,6,8,9 support
  this profile.
chandra: Count window Moon from each natal Moon inclusively. Base supportive houses 1,3,6,7,10,11; lunar-phase
  variants separate.
participants: Use the required natal chart or charts in the selected activity profile. Rank surviving windows
  by ranking_policy; use existing draft preferences for activities outside KB-20.

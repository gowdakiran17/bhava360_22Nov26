    op: eq
    value: true
  effect: soften
  reason: 'For the same participant: the election Moon is eighth from the natal Moon and their Tara category
    is supportive. Soften only their eighth-house Chandra caution to neutral.'
- when:
    fact: muhurta.relief.naming_tuesday
    op: eq
    value: true
  effect: cancel
  reason: 'For naming on Tuesday: the local civil date is the tenth, twelfth or sixteenth day counted inclusively
    from the child’s local birth date. Cancel only the Tuesday caution.'

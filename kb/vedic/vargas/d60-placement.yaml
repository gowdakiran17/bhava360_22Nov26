id: vedic.vargas.d60-placement
system: vedic
topic: vargas
title: D60 · Shashtyamsa
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Count forward from the natal sign in half-degree steps. Use 60 equal half-open parts of 30°/60. An exact
  boundary opens the next part.
conditions:
  all:
  - fact: varga.d60.verified_placement
    op: eq
    value: true
meaning: With a closely established birth time, you may explore small distinctions in a theme already visible
  in the natal chart.
life_areas:
- spirituality
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: Other methods start all signs at Aries or reverse even signs. The ordering of named sixtyfold portions
    also varies and does not by itself select a chart-sign method.

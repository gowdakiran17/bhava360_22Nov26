user_text:
  en: With a closely established birth time, you may explore small distinctions in a theme already visible in
    the natal chart.
  kn: ಜನ್ಮಸಮಯ ನಿಖರವಾಗಿ ತಿಳಿದಿದ್ದರೆ ಜನ್ಮಕುಂಡಲಿಯಲ್ಲಿ ಕಾಣುವ ವಿಷಯದ ಸೂಕ್ಷ್ಮ ವ್ಯತ್ಯಾಸಗಳನ್ನು ಪರಿಶೀಲಿಸಬಹುದು.
  hi: जन्म समय सटीक रूप से ज्ञात हो तो आप जन्मकुंडली में दिख रहे किसी विषय की बारीकियाँ देख सकते हैं।

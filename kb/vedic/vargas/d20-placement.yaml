user_text:
  en: You may find a form of reflection or study that fits your daily life.
  kn: ನಿಮ್ಮ ದಿನಚರಿಗೆ ಹೊಂದುವ ಚಿಂತನೆ ಅಥವಾ ಅಧ್ಯಯನದ ಕ್ರಮವನ್ನು ಕಂಡುಕೊಳ್ಳಬಹುದು.
  hi: आप मनन या अध्ययन का ऐसा तरीका खोज सकते हैं जो आपकी दिनचर्या में सहज बैठे।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  user_text:
    en: If you like, write down one example from your own experience.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ನಿಮ್ಮ ಅನುಭವದ ಒಂದು ಉದಾಹರಣೆಯನ್ನು ಬರೆದಿಡಬಹುದು.
    hi: चाहें तो अपने अनुभव से एक उदाहरण लिख सकते हैं।
varga:
  method_id: parashari-d20-v1
  calculation:
    parts: 20
    seed: modality_sign
    stride: 1
    starts:
    - aries
    - sagittarius
    - leo
  whole_sign_houses:
    1: orientation to practice
    5: study and recitation
    9: teachers and tradition
    12: quiet contemplation
  lords: From this divisional Lagna, identify the classical ruler of each listed house sign and read its placement
    in this chart.
  d1_anchor: Compare the D1 topic house and its ruler with the corresponding divisional houses and their rulers.
  vimshopaka_points:
    shodasavarga: 0.5
    dashavarga: 0
  purpose: spiritual practice

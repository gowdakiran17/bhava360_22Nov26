id: vedic.vargas.d20-placement
system: vedic
topic: vargas
title: D20 · Vimsamsa
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Start at Aries, Sagittarius or Leo for movable, fixed or dual signs respectively. Use 20 equal half-open
  parts of 30°/20. An exact boundary opens the next part.
conditions:
  all:
  - fact: varga.d20.verified_placement
    op: eq
    value: true
meaning: You may find a form of reflection or study that fits your daily life.
life_areas:
- spirituality
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: Even-sign reversal and cyclic Vimsamsa are alternative assignments.

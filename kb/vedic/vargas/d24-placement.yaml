  kn: ಹೊಸ ವಿಷಯವನ್ನು ಕಲಿಯುವ ಮತ್ತು ನಂತರ ನೆನಪಿಸಿಕೊಳ್ಳುವ ವಿಧಾನಗಳನ್ನು ಹೋಲಿಸಬಹುದು.

id: vedic.vargas.d24-placement
system: vedic
topic: vargas
title: D24 · Chaturvimsamsa
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Start at Leo for odd signs and Cancer for even signs. Use 24 equal half-open parts of 30°/24. An exact
  boundary opens the next part.
conditions:
  all:
  - fact: varga.d24.verified_placement
    op: eq
    value: true
meaning: You can compare the ways you learn a new idea and remember it later.
life_areas:
- learning
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: Some Siddhamsa methods count backward from Cancer in even signs or change the even-sign seed to Leo.

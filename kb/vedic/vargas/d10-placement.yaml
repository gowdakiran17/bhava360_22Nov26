user_text:
  en: You may notice which responsibilities suit you by comparing your daily work with the role others rely
    on you to fill.
  kn: ದಿನನಿತ್ಯದ ಕೆಲಸ ಮತ್ತು ಇತರರು ನಿಮ್ಮಿಂದ ನಿರೀಕ್ಷಿಸುವ ಪಾತ್ರವನ್ನು ಹೋಲಿಸಿದಾಗ ಯಾವ ಜವಾಬ್ದಾರಿಗಳು ನಿಮಗೆ ಹೊಂದಿಕೆಯಾಗುತ್ತವೆ
    ಎಂದು ತಿಳಿಯಬಹುದು.
  hi: रोज़ के काम और दूसरों की आपसे अपेक्षाओं को साथ देखकर आप समझ सकते हैं कि कौन सी ज़िम्मेदारियाँ आपको अनुकूल
    लगती हैं।

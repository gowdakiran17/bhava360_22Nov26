id: vedic.vargas.d10-placement
system: vedic
topic: vargas
title: D10 · Dasamsa
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Start at the natal sign for odd signs and its ninth for even signs. Use 10 equal half-open parts of 30°/10.
  An exact boundary opens the next part.
conditions:
  all:
  - fact: varga.d10.verified_placement
    op: eq
    value: true
meaning: You may notice which responsibilities suit you by comparing your daily work with the role others rely
  on you to fill.
life_areas:
- career
- business
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: An alternative starts at the same ninth sign for even signs and then counts backward. The selected profile
    counts forward for both parities.

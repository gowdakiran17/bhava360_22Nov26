  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  cost: free
  user_text:
    en: If you like, list one duty you enjoy and one you would like to clarify.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ನಿಮಗೆ ಇಷ್ಟವಾದ ಒಂದು ಕರ್ತವ್ಯ ಮತ್ತು ಇನ್ನಷ್ಟು ಸ್ಪಷ್ಟತೆ ಬೇಕಾದ ಮತ್ತೊಂದು ಕರ್ತವ್ಯವನ್ನು ಬರೆದಿಡಬಹುದು.
    hi: चाहें तो एक ज़िम्मेदारी लिखें जो आपको पसंद है और एक जिसके बारे में आप अधिक स्पष्टता चाहते हैं।
varga:
  method_id: parashari-d10-v1
  calculation:
    parts: 10
    seed: natal_plus_parity_offset
    stride: 1
    offsets:
    - 0
    - 8
  whole_sign_houses:
    1: approach to work
    6: service and daily duties
    10: public responsibility
    11: professional networks and gains
  lords: From this divisional Lagna, identify the classical ruler of each listed house sign and read its placement
    in this chart.
  d1_anchor: Read the D1 tenth house and its lord first. Compare their indications with the D10 Lagna, tenth
    house and their lords.
  vimshopaka_points:
    shodasavarga: 0.5
    dashavarga: 1.5
  purpose: professional responsibilities

id: vedic.vargas.d3-placement
system: vedic
topic: vargas
title: D3 · Drekkana
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Count the first, fifth and ninth signs from the natal sign. Use 3 equal half-open parts of 30°/3. An exact
  boundary opens the next part.
conditions:
  all:
  - fact: varga.d3.verified_placement
    op: eq
    value: true
meaning: You may notice which shared efforts bring you closer to a sibling.
life_areas:
- family-home
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: Parivritti Traya cycles forward across the zodiac instead of taking trines from each natal sign.

user_text:
  en: You may notice which shared efforts bring you closer to a sibling.
  kn: ಯಾವ ಕೆಲಸಗಳನ್ನು ಒಟ್ಟಿಗೆ ಮಾಡಿದಾಗ ಒಡಹುಟ್ಟಿದವರೊಂದಿಗೆ ಆತ್ಮೀಯತೆ ಹೆಚ್ಚುತ್ತದೆ ಎಂದು ಗಮನಿಸಬಹುದು.
  hi: आप देख सकते हैं कि कौन से साझा काम भाई-बहनों से निकटता बढ़ाते हैं।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  user_text:
    en: If you like, write down one example from your own experience.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ನಿಮ್ಮ ಅನುಭವದ ಒಂದು ಉದಾಹರಣೆಯನ್ನು ಬರೆದಿಡಬಹುದು.
    hi: चाहें तो अपने अनुभव से एक उदाहरण लिख सकते हैं।
varga:
  method_id: parashari-d3-v1
  calculation:
    parts: 3
    seed: natal
    stride: 4
  whole_sign_houses:
    1: personal initiative
    3: younger siblings and cooperation
    11: older siblings
  lords: From this divisional Lagna, identify the classical ruler of each listed house sign and read its placement
    in this chart.
  d1_anchor: Compare the D1 topic house and its ruler with the corresponding divisional houses and their rulers.
  vimshopaka_points:
    shodasavarga: 1
    dashavarga: 1.5
  purpose: sibling relationships

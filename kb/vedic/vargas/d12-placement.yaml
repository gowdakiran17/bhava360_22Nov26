id: vedic.vargas.d12-placement
system: vedic
topic: vargas
title: D12 · Dwadasamsa
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Begin at the natal sign. Use 12 equal half-open parts of 30°/12. An exact boundary opens the next part.
conditions:
  all:
  - fact: varga.d12.verified_placement
    op: eq
    value: true
meaning: You may recognize an influence from your upbringing in a habit you still value.
life_areas:
- family-home
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: An even-sign reversal method counts the divisions backward in even natal signs.

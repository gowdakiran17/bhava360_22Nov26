id: vedic.vargas.d2-placement
system: vedic
topic: vargas
title: D2 · Hora
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Odd signs use Leo then Cancer. Even signs reverse the pair. Use 2 equal half-open parts of 30°/2. An exact
  boundary opens the next part.
conditions:
  all:
  - fact: varga.d2.verified_placement
    op: eq
    value: true
meaning: The two horas may help you reflect on how you gather and use resources.
life_areas:
- money
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: The cyclic Hora distributes the halves across twelve signs. Kashinatha uses another assignment. Both
    differ from the two-sign solar and lunar Hora.

id: vedic.vargas.d7-placement
system: vedic
topic: vargas
title: D7 · Saptamsa
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Begin at the natal sign for odd signs and its seventh for even signs. Use 7 equal half-open parts of 30°/7.
  An exact boundary opens the next part.
conditions:
  all:
  - fact: varga.d7.verified_placement
    op: eq
    value: true
meaning: You may explore how you offer guidance and share the work of caring for others.
life_areas:
- children
- family-home
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: Some methods count backward in even signs after starting at the seventh.

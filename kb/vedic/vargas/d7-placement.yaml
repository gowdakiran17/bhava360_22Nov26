user_text:
  en: You may explore how you offer guidance and share the work of caring for others.
  kn: ನೀವು ಹೇಗೆ ಮಾರ್ಗದರ್ಶನ ನೀಡುತ್ತೀರಿ ಮತ್ತು ಆರೈಕೆಯ ಕೆಲಸವನ್ನು ಹಂಚಿಕೊಳ್ಳುತ್ತೀರಿ ಎಂದು ಯೋಚಿಸಬಹುದು.
  hi: आप देख सकते हैं कि आप मार्गदर्शन कैसे देते हैं और देखभाल की ज़िम्मेदारी कैसे बाँटते हैं।

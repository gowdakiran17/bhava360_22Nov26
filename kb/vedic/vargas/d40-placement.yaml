  en: You may recognize a family custom that you would like to carry forward.
  kn: ಮುಂದುವರಿಸಲು ಬಯಸುವ ಕುಟುಂಬದ ಆಚರಣೆಯನ್ನು ಗುರುತಿಸಬಹುದು.
  hi: आप परिवार की ऐसी परंपरा पहचान सकते हैं जिसे आप आगे बढ़ाना चाहते हैं।

id: vedic.vargas.d40-placement
system: vedic
topic: vargas
title: D40 · Khavedamsa
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Start at Aries for odd signs and Libra for even signs. Use 40 equal half-open parts of 30°/40. An exact
  boundary opens the next part.
conditions:
  all:
  - fact: varga.d40.verified_placement
    op: eq
    value: true
meaning: You may recognize a family custom that you would like to carry forward.
life_areas:
- family-home
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: Some readers emphasize maternal lineage where the classical theme is broader. Cyclic Khavedamsa is a
    separate calculation.

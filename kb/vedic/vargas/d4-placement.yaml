  - fact: varga.d4.verified_placement
    op: eq
    value: true
meaning: You may reflect on which kinds of support help a place feel like home.
life_areas:
- family-home
- property-vehicles
- travel-relocation
strength_notes:
- when:
    fact: varga.reading.topic_supported
    op: eq
    value: true
  effect: stronger
  reason: Give the theme more interpretive weight when the relevant house and its ruler both support it.
exceptions:
- when:
    fact: varga.reading.house_unstable
    op: eq
    value: true
  effect: cancel
  reason: Omit this house-based reading if the divisional Lagna or the referenced house changes within the birth-time
    range.
traditions_differ:
- profile: vedic-editorial-v1
  note: Cyclic Chaturthamsa advances one sign per quarter. The selected method moves between angular signs.

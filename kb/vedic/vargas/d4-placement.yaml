id: vedic.vargas.d4-placement
system: vedic
topic: vargas
title: D4 · Chaturthamsa
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Count the first, fourth, seventh and tenth signs from the natal sign. Use 4 equal half-open parts of 30°/4.
  An exact boundary opens the next part.
conditions:

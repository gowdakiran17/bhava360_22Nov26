tara: For each direction cycle the inclusive star count through nine. This profile awards 1.5 for each remainder other
  than 3, 5, 7. Both inclusive counts equal one for a shared star.
bhakoot: Award 0 for 2/12, 5/9 or 6/8 sign relationships, otherwise 7 in the base table. Keep a separately reviewed exception
  for identical or mutually friendly sign lords.
nadi: Repeat 0,1,2,2,1,0 across the 27 birth stars from Ashwini. Different classes give 8, identical classes 0. Treat same-star/different-pada
  parihara as an explicitly selected variant.
parihara: Keep raw points and exception reasoning separate. Varna is a traditional chart grouping and carries no inference
  about a person’s caste.

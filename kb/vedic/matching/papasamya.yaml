rule: POPULAR editorial comparison. On both charts use identical reference, eligible malefics and houses (Sun, Mars,
  Saturn and nodes in 1/2/4/7/8/12 from each stable reference (Lagna, Moon, Venus), comparing like with like). Count
  distinct residual placements with unit weight after applicable cancellations. Compare equal versus unequal burden
  only as context, without changing koota totals. Missing either chart withholds.

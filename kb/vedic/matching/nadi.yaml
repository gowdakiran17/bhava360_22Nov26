id: vedic.matching.nadi
system: vedic
topic: matching
title: Nadi koota
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Look up each Moon’s birth star in the three Nadi groups, then read the class-pair matrix. Keep the raw points
  when a selected exception softens interpretation.
conditions:
  all:
  - fact: match.profile
    op: eq
    value: north
  - fact: match.pair.ready
    op: eq
    value: true
  - fact: match.moons.stable
    op: eq
    value: true
meaning: You can talk about the daily routines that help each of you feel at ease.
life_areas:
- love-marriage
strength_notes: []
exceptions:
- when:
    fact: match.nadi.pada_parihara
    op: eq
    value: true
  effect: soften
  reason: Same birth star and distinct padas qualify under the selected parihara variant.
- when:
    fact: match.nadi.quarter_relief
    op: eq
    value: true
  effect: cancel
  reason: With Raman quarter reckoning expressly selected, a shared star-level Nadi is set aside when the two quarter
    Nadis differ. Number all 108 quarters from zero at Ashwini and repeat adi, madhya, antya, antya, madhya, adi.
    Preserve the star-level score.
traditions_differ:
- profile: vedic-editorial-v1
  note: KB-10 allows same-star, different-pada softening in the selected variant. Raman also describes a separate
    quarter-based Nadi reckoning. Dashakoota omits this factor.

user_text:
  en: You may find a demanding commitment easier to keep if you give it a regular place in your week.
  kn: ಕಷ್ಟದ ಜವಾಬ್ದಾರಿಗೆ ವಾರದಲ್ಲಿ ನಿಗದಿತ ಸಮಯ ಕೊಟ್ಟರೆ ಅದನ್ನು ನಿಭಾಯಿಸುವುದು ಸುಲಭವಾಗಬಹುದು.
  hi: किसी कठिन ज़िम्मेदारी के लिए हफ़्ते में समय तय करने से उसे निभाना आसान लग सकता है।

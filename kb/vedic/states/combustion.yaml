id: vedic.states.combustion
system: vedic
topic: states
title: Asta · combustion
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: For an eligible graha, match when its shortest natal longitude separation from the Sun is at or below its
  motion-specific threshold. Exclude the Sun and both nodes.
conditions:
  all:
  - fact: d1.state.combustion
    op: eq
    value: true
state:
  reference_table: vedic/states/combustion-orbs.yaml
  orbs:
    direct:
      moon: 12
      mars: 17
      mercury: 14
      jupiter: 11
      venus: 10
      saturn: 15
    retrograde:
      mars: 17
      mercury: 12
      jupiter: 11
      venus: 8
      saturn: 15
  reference_body: sun
  separation: shortest circular longitude distance
  boundary: inclusive
  motion_selector: Negative longitude speed selects retrograde. Positive speed selects direct. At a station use
    a shared threshold where both rows agree; Mercury and Venus require a resolved motion branch.
meaning: Combustion may make the graha’s own concerns harder to distinguish from the priorities signified by the
  Sun. Judge the placement alongside its house, rulership and other strengths.
life_areas: []
strength_notes: []
exceptions: []
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: The classical source calculates heliacal visibility with horizon-dependent quantities. This natal profile
    uses the shortest ecliptic arc, includes the exact limit and uses the Moon’s threshold as a solar-proximity
    flag. Lunar phase strength is assessed separately.
sources:

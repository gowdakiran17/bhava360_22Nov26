    kn: ಎರಡೂ ವಿಷಯಗಳ ಬಗ್ಗೆ ಮಾತನಾಡಲು ಸಮಯ ಕೊಡಬಹುದು.
    hi: बातचीत में दोनों विषयों के लिए समय रख सकते हैं।

id: vedic.states.baladi
system: vedic
topic: states
title: Baladi avastha · five age states
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Divide the graha’s natal sign into five successive six-degree intervals. Read the odd-sign order from Aries
  onward by sign parity and reverse the order in even signs. Normalize 30 degrees to the next sign before lookup.
conditions:
  all:
  - fact: d1.state.baladi
    op: in
    value: &id001
    - bala
    - kumara
    - yuva
    - vriddha
    - mrita
state:
  eligible:
  - sun
  - moon
  - mars
  - mercury
  - jupiter
  - venus
  - saturn
  width_degrees: 6
  interval: start inclusive, end exclusive
  odd_sign_order: *id001
  even_sign_order:
  - mrita
  - vriddha
  - yuva
  - kumara
  - bala
  state_meanings:
    bala: just beginning
    kumara: developing
    yuva: fully active
    vriddha: less active
    mrita: quiescent
meaning: The age label may qualify how readily a graha expresses its theme. It describes a stage in a symbolic
  cycle.

id: vedic.doshas.mars-partnership
system: vedic
topic: doshas
title: Manglik · Kuja dosha
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Count whole signs to natal Mars from the bound origin and apply only its selected house list. The library default
  counts 1, 2, 4, 7, 8 and 12 from Lagna. Evaluate natal exceptions first, then any pair-only exception. The SGS regional
  profile additionally checks full Mars aspects.
conditions:
  any:
  - all:
    - fact: dosha.mars.house_list
      op: eq
      value: inclusive
    - fact: dosha.mars.reference_distance
      op: in
      value:
      - 1
      - 2
      - 4
      - 7
      - 8
      - 12
  - all:
    - fact: dosha.mars.house_list
      op: eq
      value: lagna_five
    - fact: dosha.mars.reference_distance
      op: in
      value:
      - 1
      - 4
      - 7
      - 8
      - 12
  - all:
    - fact: dosha.mars.house_list
      op: eq
      value: family_five
    - fact: dosha.mars.reference_distance
      op: in
      value:
      - 2
      - 4
      - 7
      - 8
      - 12
  - all:
    - fact: dosha.mars.house_list
      op: eq
      value: four
    - fact: dosha.mars.reference_distance
      op: in
      value:
      - 4
      - 7
      - 8
      - 12
  - all:
    - fact: dosha.mars.relief_profile
      op: eq
      value: sgs
    - fact: dosha.mars.sgs_aspects_candidate
      op: eq
      value: true
meaning: The placement may prompt a conversation about pace, initiative and how two people settle differences.
life_areas:
- love-marriage
strength_notes:
- when:
    all:
    - fact: dosha.mars.relief_profile
      op: in
      value:
      - library
    - fact: dosha.mars.dignity_exception
      op: eq
      value: true
  effect: weaker
  reason: Own-sign or exalted Mars may qualify the reading in the library dignity convention.
exceptions:
- when:
    all:
    - fact: dosha.mars.relief_profile
      op: in
      value:
      - library
      - regional-lagna
    - fact: dosha.mars.benefic_contact
      op: eq
      value: true
  effect: cancel
  reason: A benefic joins or fully aspects Mars in the selected regional reading.
- when:
    all:
    - fact: dosha.mars.relief_profile
      op: in
      value:
      - library
      - regional-lagna
      - raman
      - sgs
    - fact: dosha.mars.pair_balanced
      op: eq
      value: true
  effect: cancel
  reason: In a matched pair only, comparable surviving placements balance the pair interpretation. Keep both natal
    records.
- when:
    all:
    - fact: dosha.mars.relief_profile
      op: in
      value:
      - raman
    - fact: dosha.mars.raman_house_sign
      op: eq
      value: true
  effect: cancel
  reason: 'House/sign exemptions: 2 Gemini/Virgo, 4 Aries/Scorpio, 7 Cancer/Capricorn, 8 Sagittarius/Pisces, 12 Taurus/Libra.'
- when:
    all:
    - fact: dosha.mars.relief_profile
      op: in
      value:
      - raman
    - fact: dosha.mars.raman_sign
      op: eq
      value: true
  effect: cancel
  reason: Mars occupies Leo or Aquarius in Raman’s convention.
- when:
    all:
    - fact: dosha.mars.relief_profile
      op: in
      value:
      - raman
    - fact: dosha.mars.raman_companion
      op: eq
      value: true
  effect: cancel
  reason: Raman recognises the Moon or Jupiter sharing the Mars sign.
- when:
    all:
    - fact: dosha.mars.relief_profile
      op: in
      value:
      - raman
    - fact: dosha.mars.raman_ascendant
      op: eq
      value: true
  effect: cancel
  reason: Raman recognises Jupiter or Venus in Lagna.
- when:
    all:
    - fact: dosha.mars.relief_profile
      op: in
      value:
      - library
    - fact: dosha.mars.dignity_exception
      op: eq
      value: true
  effect: soften
  reason: Own-sign or exalted Mars mitigates the library interpretation.
- when:
    all:
    - fact: dosha.mars.relief_profile
      op: eq
      value: sgs
    - fact: dosha.mars.sgs_lagna_exempt
      op: eq
      value: true
  effect: cancel
  reason: The SGS almanac exempts six ascendant signs in its regional convention.
traditions_differ:
- profile: vedic-editorial-v1
  note: MODERN/POPULAR regional Kuja doctrine. Default Lagna 1/2/4/7/8/12; other schools omit the second or compare
    Moon and Venus as separately labelled references. Resolve natal reliefs before pair balance. Raman, Muhurtha,
    marriage chapter.
- profile: vedic-editorial-v1
  note: BPHS Stri Jataka ch.80 vv.47–49 is the classical root. Expanded references and remedies are modern regional
    practice.

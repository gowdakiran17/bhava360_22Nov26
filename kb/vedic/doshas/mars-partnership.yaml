  edition: bphs-80
  chapter: 80
  verse: 47–49
  other_locator: Sanskrit and English
  supports: First-house list, benefic aspect or conjunction, and two-chart qualification.
  verification: verified
- book: Brihat Parashara Hora Shastra
  work_id: bphs
  edition: bphs-80-four
  chapter: 80
  verse: '47'
  other_locator: English rendering
  supports: Four-house textual variant.
  verification: verified
- book: Muhurtha (Electional Astrology)
  work_id: raman-muhurtha
  edition: raman-muhurtha
  chapter: null
  verse: null
  other_locator: Marriage · The So-called Kuja Dosha
  supports: Later list, references, sign exceptions and counteracting placements.
  verification: verified
- book: Mangalika Dosha
  work_id: rath-mangala
  edition: rath-mangala
  chapter: null
  verse: null
  other_locator: Defining Mangalika Dosha; Chandra Lagna
  supports: Alternative house lists and distinct Moon reference.
  verification: verified
- book: SGS Panchangam
  work_id: sgs-panchangam
  edition: sgs-fixed
  chapter: null
  verse: null
  other_locator: Fixed information, section 31
  supports: Regional aspect-based screen, six ascendant exemptions and pair comparison.
  verification: verified
confidence: disputed
review_notes: Keep the bound chart, reference and convention with the explanation. Native-language review pending.
user_text:
  en: You can discuss how each of you handles disagreement.
  kn: ಭಿನ್ನಾಭಿಪ್ರಾಯವನ್ನು ಇಬ್ಬರೂ ಹೇಗೆ ನಿಭಾಯಿಸುತ್ತೀರಿ ಎಂದು ಚರ್ಚಿಸಬಹುದು.
  hi: आप चर्चा कर सकते हैं कि मतभेद को आप दोनों कैसे सँभालते हैं।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  user_text:
    en: If you like, give each person a turn to speak before deciding together.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಒಟ್ಟಾಗಿ ತೀರ್ಮಾನಿಸುವ ಮೊದಲು ಇಬ್ಬರಿಗೂ ಮಾತನಾಡಲು ಅವಕಾಶ ಕೊಡಬಹುದು.
    hi: चाहें तो साथ में फ़ैसला लेने से पहले दोनों को अपनी बात कहने का अवसर दें।

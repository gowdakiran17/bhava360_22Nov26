saturn_points: Divide sunrise-to-sunset or sunset-to-next-sunrise into eight equal segments. Seven rulers run in weekday
  order starting with day lord, or fifth from day lord by night. Last segment unruled. Gulika is ascendant at start
  of Saturn segment, Mandi at midpoint (labelled midpoint variant). Unknown horizon or Lagna withholds.
traditions_differ: Some schools identify Mandi with Gulika; do not combine variants.

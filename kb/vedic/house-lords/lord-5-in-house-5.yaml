  en: When helping someone understand an idea, you can ask what someone else could learn from your example.
  kn: ಯಾರಿಗಾದರೂ ಒಂದು ವಿಚಾರವನ್ನು ಅರ್ಥಮಾಡಿಸಲು ನೆರವಾಗುವಾಗ ನಿಮ್ಮ ಉದಾಹರಣೆಯಿಂದ ಇನ್ನೊಬ್ಬರು ಏನು ಕಲಿಯಬಹುದು ಎಂದು ಯೋಚಿಸಬಹುದು.
  hi: जब आप किसी को कोई बात समझाएँ, आप सोच सकते हैं कि आपके उदाहरण से कोई और क्या सीख सकता है।

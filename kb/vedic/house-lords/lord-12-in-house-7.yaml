user_text:
  en: When setting aside time or money, you can ask the other person what they understood you to be offering.
  kn: ಸಮಯ ಅಥವಾ ಹಣ ಮೀಸಲಿಡುವಾಗ ನೀವು ಏನು ನೀಡಲು ಮುಂದಾಗಿದ್ದೀರಿ ಎಂದು ಇನ್ನೊಬ್ಬರು ಹೇಗೆ ಅರ್ಥಮಾಡಿಕೊಂಡರು ಎಂಬುದನ್ನು ಕೇಳಬಹುದು.
  hi: जब आप समय या पैसा अलग रखें, आप दूसरे व्यक्ति से पूछ सकते हैं कि उन्होंने आपकी पेशकश को कैसे समझा।

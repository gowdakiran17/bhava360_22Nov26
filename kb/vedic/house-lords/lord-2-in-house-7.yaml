  en: When planning how to use family resources, you can ask the other person what they understood you to be offering.
  kn: ಕುಟುಂಬದ ಸಂಪನ್ಮೂಲಗಳನ್ನು ಬಳಸುವ ಬಗ್ಗೆ ಯೋಚಿಸುವಾಗ ನೀವು ಏನು ನೀಡಲು ಮುಂದಾಗಿದ್ದೀರಿ ಎಂದು ಇನ್ನೊಬ್ಬರು ಹೇಗೆ ಅರ್ಥಮಾಡಿಕೊಂಡರು
    ಎಂಬುದನ್ನು ಕೇಳಬಹುದು.
  hi: जब आप परिवार के संसाधनों की योजना बनाएँ, आप दूसरे व्यक्ति से पूछ सकते हैं कि उन्होंने आपकी पेशकश को कैसे
    समझा।

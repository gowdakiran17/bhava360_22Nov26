  en: When planning work others rely on, you can clarify who will handle a shared cost if arrangements change.
  kn: ಇತರರು ಅವಲಂಬಿಸಿರುವ ಕೆಲಸದ ಯೋಜನೆ ಮಾಡುವಾಗ ವ್ಯವಸ್ಥೆ ಬದಲಾದರೆ ಹಂಚಿಕೊಂಡ ವೆಚ್ಚವನ್ನು ಯಾರು ನೋಡಿಕೊಳ್ಳುತ್ತಾರೆ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಬಹುದು.
  hi: जब आप ऐसे काम की योजना बनाएँ जिस पर दूसरे निर्भर हैं, आप स्पष्ट कर सकते हैं कि व्यवस्था बदले तो साझा खर्च
    कौन सँभालेगा।

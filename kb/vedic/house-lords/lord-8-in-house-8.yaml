  en: When shared responsibilities change, you can clarify who will handle a shared cost if arrangements change.
  kn: ಹಂಚಿಕೊಂಡ ಹೊಣೆಗಳು ಬದಲಾಗುವಾಗ ವ್ಯವಸ್ಥೆ ಬದಲಾದರೆ ಹಂಚಿಕೊಂಡ ವೆಚ್ಚವನ್ನು ಯಾರು ನೋಡಿಕೊಳ್ಳುತ್ತಾರೆ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಬಹುದು.
  hi: जब साझी ज़िम्मेदारियाँ बदलें, आप स्पष्ट कर सकते हैं कि व्यवस्था बदले तो साझा खर्च कौन सँभालेगा।

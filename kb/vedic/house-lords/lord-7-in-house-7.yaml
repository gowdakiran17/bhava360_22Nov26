user_text:
  en: When making an agreement with someone, you can ask the other person what they understood you to be offering.
  kn: ಯಾರೊಂದಿಗಾದರೂ ಒಪ್ಪಂದ ಮಾಡಿಕೊಳ್ಳುವಾಗ ನೀವು ಏನು ನೀಡಲು ಮುಂದಾಗಿದ್ದೀರಿ ಎಂದು ಇನ್ನೊಬ್ಬರು ಹೇಗೆ ಅರ್ಥಮಾಡಿಕೊಂಡರು ಎಂಬುದನ್ನು
    ಕೇಳಬಹುದು.
  hi: जब आप किसी के साथ समझौता तय करें, आप दूसरे व्यक्ति से पूछ सकते हैं कि उन्होंने आपकी पेशकश को कैसे समझा।

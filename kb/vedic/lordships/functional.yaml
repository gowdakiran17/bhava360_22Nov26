version: 1
approval: draft
tag: CLASSICAL
profile: functional-lordship-v1
scope: Classical per-Lagna lists (BPHS chapter 34 and Laghu Parashari chapter 2). Generic first-match order below is the named MODERN variant generic-lordship-order.
precedence: [lagna-lord, kendra-and-trikona, luminary-eighth, trikona-with-eighth-exception, eighth, three-six-eleven, pure-kendra, two-or-twelve]
kendradhipati_policy: The flag indicates eligibility. Apply to a naturally benefic Mercury or waxing Moon under the natural profile; a naturally malefic pure kendra lord also resolves Neutral. Strong qualifies Jupiter or Venus in a dual Lagna.
mt_policy: On dual ownership keep the MT house for commentary. The MT annotation does not override the selected per-Lagna list.
node_policy: Use the resolved occupied-house testimony first, then association, then sign dispositor. Node ownership is always empty. Evaluate the separate conditional association flag for the current chart. Missing chart data is unknown.
traditions_differ: Generic ownership and dispositor-only node readings remain alternatives. The default gives priority to the individual classical Lagna lists.
maraka_policy: Staff metadata only. Excluded from tone, public copy and longevity assessment.

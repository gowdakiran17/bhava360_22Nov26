version: 1
approval: draft
tag: CLASSICAL
profile: functional-lordship-v1
scope: Whole-sign natal lordship, using the first matching precedence below. All flags and grades are internal.
precedence: [lagna-lord, kendra-and-trikona, luminary-eighth, trikona-with-eighth-exception, eighth, three-six-eleven, pure-kendra, two-or-twelve]
kendradhipati_policy: The flag indicates eligibility. Apply to a naturally benefic Mercury or waxing Moon under the natural profile; a naturally malefic pure kendra lord also resolves Neutral. Strong qualifies Jupiter or Venus in a dual Lagna.
mt_policy: On dual ownership keep the MT house for commentary. It does not override first-match polarity.
node_policy: Resolve the D1 sign owner. A Yogakaraka dispositor gives benefic polarity to its node without transferring the yoga flag. Missing Lagna or dispositor leaves polarity unknown.
traditions_differ: Association with a conjunct graha is an alternative node treatment. Trikona plus eighth ownership is neutral in the default table.
maraka_policy: Staff metadata only. Excluded from tone, public copy and longevity assessment.

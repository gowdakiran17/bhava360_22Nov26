  en: Your rising sign is Capricorn. You can look at Saturn when reflecting on how you express yourself.
  kn: ನಿಮ್ಮ ಲಗ್ನ ಮಕರ. ನಿಮ್ಮ ಅಭಿವ್ಯಕ್ತಿಯ ಶೈಲಿಯನ್ನು ತಿಳಿಯಲು ಅದರ ಅಧಿಪತಿಯ ಸ್ಥಾನವನ್ನು ನೋಡಬಹುದು. ಈ ಲಗ್ನದ ಅಧಿಪತಿ ಶನಿ.
  hi: आपका लग्न मकर है। अपनी अभिव्यक्ति को समझने के लिए आप उसके स्वामी की स्थिति देख सकते हैं। इस लग्न के स्वामी शनि हैं।

  en: Your rising sign is Scorpio. You can look at Mars when reflecting on how you express yourself.
  kn: ನಿಮ್ಮ ಲಗ್ನ ವೃಶ್ಚಿಕ. ನಿಮ್ಮ ಅಭಿವ್ಯಕ್ತಿಯ ಶೈಲಿಯನ್ನು ತಿಳಿಯಲು ಅದರ ಅಧಿಪತಿಯ ಸ್ಥಾನವನ್ನು ನೋಡಬಹುದು. ಈ ಲಗ್ನದ ಅಧಿಪತಿ ಮಂಗಳ.
  hi: आपका लग्न वृश्चिक है। अपनी अभिव्यक्ति को समझने के लिए आप उसके स्वामी की स्थिति देख सकते हैं। इस लग्न के स्वामी मंगल
    हैं।

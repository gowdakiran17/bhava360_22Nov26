id: vedic.yogas.parivartana-maha
system: vedic
topic: yogas
title: Maha Parivartana
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Two distinct classical lords occupy each other’s houses and neither house is 3, 6, 8 or 12.
conditions:
  all:
  - fact: d1.lords.reciprocal_exchange
    op: eq
    value: true
  - fact: d1.lords.exchange_class
    op: eq
    value: maha
meaning: A reciprocal exchange may connect the two topics through mutual support.
life_areas: []
strength_notes:
- when:
    fact: vedic.yoga.parivartana-maha.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.parivartana-maha.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never cancel
    an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: Use one class per pair. Dusthana membership takes precedence over the third-house class.

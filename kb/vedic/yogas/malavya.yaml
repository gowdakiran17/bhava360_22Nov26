id: vedic.yogas.malavya
system: vedic
topic: yogas
title: Malavya
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Venus occupies a whole-sign angle from Lagna and its own or exaltation sign.
conditions:
  all:
  - fact: d1.venus.distance_from_lagna
    op: in
    value:
    - 1
    - 4
    - 7
    - 10
  - fact: d1.venus.own_or_exalted
    op: eq
    value: true
meaning: An angular, dignified Venus may make aesthetic judgement and cooperation more prominent in the house it
  occupies.
life_areas:
- family-home
strength_notes:
- when:
    fact: vedic.yoga.malavya.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.malavya.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.anchor_combust
    op: eq
    value: true
  effect: soften
  reason: The anchor is within its motion-specific combustion orb.
- when:
    fact: d1.yoga.anchor_war_loser
    op: eq
    value: true
  effect: cancel
  reason: The forming planet loses planetary war under the selected strict school.
- when:
    fact: d1.yoga.anchor_d9_debilitated
    op: eq
    value: true
  effect: soften
  reason: Debilitation in D9 qualifies the angular D1 formation.
- when:
    fact: d1.yoga.luminary_conjunction
    op: eq
    value: true
  effect: soften
  reason: Selected school softens an anchor joined by Sun or Moon.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: Use Lagna as the origin. A parallel lunar-origin reading requires a separately labelled chart reference.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 1–4
  other_locator: Named yoga or graha combination
  supports: Five angular dignity formations and their individual grahas.
  verification: verified
confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors. Kannada
  and Hindi await native review.
user_text:
  en: Attention to beauty and cooperation may help you make a shared space welcoming.
  kn: ಒಟ್ಟಾಗಿ ಸ್ಥಳವನ್ನು ಅಂದಗೊಳಿಸುವ ಸಣ್ಣ ಕೆಲಸವೂ ಎಲ್ಲರಿಗೂ ಆತ್ಮೀಯತೆ ತರಬಹುದು.
  hi: मिलकर किसी साझा जगह को सँवारना वहाँ अपनापन बढ़ाने का एक तरीका हो सकता है।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  cost: free
  user_text:
    en: You may notice what helps people feel welcome.
    kn: ಜನರಿಗೆ ಆತ್ಮೀಯತೆ ಮೂಡಿಸುವ ವಿಷಯಗಳನ್ನು ನೀವು ಗಮನಿಸಬಹುದು.
    hi: आप देख सकते हैं कि लोगों को अपनापन किससे मिलता है।
related_rules:
- vedic.yogas.activation
participants:
- venus
evidence:
  direction: support
  weight_class: primary
  time_scope: natal
  reference: lagna
  area_strength:
    family-home: core

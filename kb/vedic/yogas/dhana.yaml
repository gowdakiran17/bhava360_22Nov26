id: vedic.yogas.dhana
system: vedic
topic: yogas
title: Dhana lord association
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Include links among the Lagna, resource and trinal lords, including the direct resource-resource and trine-trine
  pairs.
conditions:
  all:
  - fact: d1.lords.wealth_trine_link
    op: eq
    value: true
meaning: A resource house connected to a trine may make learning or guidance relevant to financial choices.
life_areas:
- money
strength_notes:
- when:
    fact: vedic.yoga.dhana.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.dhana.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.forming_lord_owns_eighth
    op: eq
    value: true
  effect: soften
  reason: A participating eighth lord qualifies the promise.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: Use distinct lords, a conjunction or reciprocal exchange and the actual houses owned in this chart.
- profile: mutual-full-aspect
  note: A labelled aspect variant accepts mutual full aspect between the two distinct forming lords.

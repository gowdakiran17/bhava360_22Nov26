id: vedic.yogas.amala
system: vedic
topic: yogas
title: Amala
doctrine_profile: vedic-editorial-v1
approval: draft
rule: At least one graha classified as benefic under the selected profile occupies the tenth sign from the named
  reference.
conditions:
  any:
  - fact: d1.moon.tenth_has_benefic
    op: eq
    value: true
  - fact: d1.lagna.tenth_has_benefic
    op: eq
    value: true
meaning: A benefic in the tenth may bring values into visible work and commitments.
life_areas:
- career
strength_notes:
- when:
    fact: vedic.yoga.amala.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.amala.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.mixed_nature_witness
    op: eq
    value: true
  effect: soften
  reason: Resolve the actual contributing grahas. A mixed benefic and malefic witness does not support an unqualified
    positive reading.
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: Record which origin matches. This profile admits a benefic even where another graha also occupies the sign.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 12, 19
  other_locator: Named yoga or graha combination
  supports: Tenth from Moon or Lagna and the associated conduct theme.
  verification: verified
confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors. Kannada
  and Hindi await native review.
user_text:
  en: Your conduct at work may express a value you care about.
  kn: ಕೆಲಸದ ಸ್ಥಳದಲ್ಲಿ ನಿಮಗೆ ಮುಖ್ಯವೆನಿಸುವ ಮೌಲ್ಯ ನಿಮ್ಮ ನಡೆನುಡಿಯಲ್ಲಿ ಕಾಣಿಸಬಹುದು.
  hi: काम पर आपका व्यवहार बता सकता है कि आप किस उसूल को अहमियत देते हैं।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  cost: free
  user_text:
    en: You may reflect on how you carry responsibility in public.
    kn: ಸಾರ್ವಜನಿಕ ಹೊಣೆಯನ್ನು ಹೇಗೆ ನಿಭಾಯಿಸುತ್ತೀರಿ ಎಂದು ಯೋಚಿಸಬಹುದು.
    hi: सार्वजनिक ज़िम्मेदारी निभाने के अपने तरीके पर विचार कर सकते हैं।
related_rules:
- vedic.yogas.activation
participants:
- matched-benefics
evidence:
  direction: support
  weight_class: primary
  time_scope: natal
  reference: none
  area_strength:
    career: core

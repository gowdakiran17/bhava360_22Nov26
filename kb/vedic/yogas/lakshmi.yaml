    kn: ಹಣಕಾಸಿನ ಆಯ್ಕೆಯೊಂದನ್ನು ನೀವು ಪಾಲಿಸಲು ಬಯಸುವ ಮೌಲ್ಯದೊಂದಿಗೆ ಜೋಡಿಸಬಹುದು.
    hi: आप किसी आर्थिक चुनाव को उस मूल्य से जोड़ सकते हैं जिस पर आप अमल करना चाहते हैं।

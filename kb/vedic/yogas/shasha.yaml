  kn: ತಾಳ್ಮೆ ಬೇಡುವ ಹೊಣೆಗಾರಿಕೆಗಳು ನಿಮಗೆ ಹಿಡಿಸಬಹುದು.
  hi: धैर्य माँगने वाली ज़िम्मेदारियाँ आपको पसंद आ सकती हैं।

id: vedic.yogas.parivartana
system: vedic
topic: yogas
title: Parivartana · reciprocal house-lord exchange
doctrine_profile: vedic-editorial-v1
approval: draft
rule: For the bound pair of distinct houses, their two distinct classical sign rulers each occupy the other house
  in the same whole-sign D1 chart. A shared ruler cannot exchange with itself.
conditions:
  all:
  - fact: d1.lords.reciprocal_exchange
    op: eq
    value: true
meaning: A reciprocal exchange may make each house’s concerns depend on decisions in the other.
life_areas: []
strength_notes:
- when:
    fact: vedic.yoga.parivartana.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.parivartana.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: Classify the specific house pair. A graha owning both houses cannot exchange with itself.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 32–34
  other_locator: Named yoga or graha combination
  supports: Reciprocal exchange and its three classes.
  verification: verified
confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors. Kannada
  and Hindi await native review. Resolve the actual participants before assigning a direction.
user_text:
  en: A decision in one part of life may depend on an agreement elsewhere.
  kn: ಪರಸ್ಪರ ಅವಲಂಬನೆ ಗುರುತಿಸುವುದು ನಿಮಗೆ ನೆರವಾಗಬಹುದು.
  hi: आपसी निर्भरता पहचानना आपके लिए उपयोगी हो सकता है।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  cost: free
  user_text:
    en: You can consider what each side of an exchange needs from the other.
    kn: ವಿನಿಮಯದಲ್ಲಿ ಎರಡೂ ಕಡೆಯವರಿಗೆ ಪರಸ್ಪರ ಏನು ಬೇಕಿದೆ ಎಂದು ಯೋಚಿಸಬಹುದು.
    hi: आप सोच सकते हैं कि लेन-देन में दोनों पक्षों को एक-दूसरे से क्या चाहिए।

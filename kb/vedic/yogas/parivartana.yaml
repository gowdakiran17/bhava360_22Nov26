title: Parivartana · reciprocal house-lord exchange
doctrine_profile: vedic-editorial-v1
approval: draft
rule: For the bound pair of distinct houses, their two distinct classical sign rulers each occupy the other house
  in the same whole-sign D1 chart. A shared ruler cannot exchange with itself.
conditions:

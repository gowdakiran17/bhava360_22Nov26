id: vedic.yogas.durudhara
system: vedic
topic: yogas
title: Durudhara
doctrine_profile: vedic-editorial-v1
approval: draft
rule: At least one of Mars, Mercury, Jupiter, Venus or Saturn occupies the second and twelfth sign(s) counted
  from the natal Moon; for both sides require a separate occupant on each.
conditions:
  all:
  - any:
    - fact: d1.mars.distance_from_moon
      op: in
      value:
      - 2
    - fact: d1.mercury.distance_from_moon
      op: in
      value:
      - 2
    - fact: d1.jupiter.distance_from_moon
      op: in
      value:
      - 2
    - fact: d1.venus.distance_from_moon
      op: in
      value:
      - 2
    - fact: d1.saturn.distance_from_moon
      op: in
      value:
      - 2
  - any:
    - fact: d1.mars.distance_from_moon
      op: in
      value:
      - 12
    - fact: d1.mercury.distance_from_moon
      op: in
      value:
      - 12
    - fact: d1.jupiter.distance_from_moon
      op: in
      value:
      - 12
    - fact: d1.venus.distance_from_moon
      op: in
      value:
      - 12
    - fact: d1.saturn.distance_from_moon
      op: in
      value:
      - 12
meaning: Support on both sides of the Moon may suggest balancing preparation with follow-through.
life_areas:
- career
strength_notes:
- when:
    fact: vedic.yoga.durudhara.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.durudhara.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.mixed_nature_witness
    op: eq
    value: true
  effect: soften
  reason: Resolve the actual contributing grahas. A mixed benefic and malefic witness does not support an unqualified
    positive reading.
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never cancel
    an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: Only Mars, Mercury, Jupiter, Venus and Saturn count. When both flanks are occupied, present Durudhara
    once rather than stacking the two one-sided readings.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 5–7
  other_locator: Named yoga or graha combination
  supports: Flanking placements and their distinct readings.
  verification: verified
confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors. Kannada and Hindi

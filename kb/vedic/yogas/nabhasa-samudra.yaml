id: vedic.yogas.nabhasa-samudra
system: vedic
topic: yogas
title: Nabhasa Samudra
doctrine_profile: vedic-editorial-v1
approval: draft
rule: The seven classical grahas occupy exactly one listed whole-sign house set, with each listed house occupied.
  See formation.patterns.
conditions:
  all:
  - fact: d1.yoga.nabhasa_samudra_formed
    op: eq
    value: true
meaning: Moving between different responsibilities may help you see what needs attention.
life_areas: []
strength_notes:
- when:
    fact: vedic.yoga.nabhasa-samudra.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.nabhasa-samudra.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.

id: vedic.yogas.sakata
system: vedic
topic: yogas
title: Sakata
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Moon lies sixth, eighth or twelfth from Jupiter.
conditions:
  all:
  - fact: d1.moon.distance_from_jupiter
    op: in
    value:
    - 6
    - 8
    - 12
meaning: An uneven rhythm in resources or support may invite planning across more than one phase.
life_areas:
- family-home
strength_notes:
- when:
    fact: vedic.yoga.sakata.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.sakata.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.moon.distance_from_lagna
    op: in
    value:
    - 1
    - 4
    - 7
    - 10
  effect: cancel
  reason: Moon angular from Lagna in this cancellation profile.
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: This is the lunar Shakata, distinct from the Nabhasa formation of the same name.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 14, 17
  other_locator: Named yoga or graha combination
  supports: Moon–Jupiter distance and the angular Moon exception.
  verification: verified
confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors. Kannada
  and Hindi await native review.
user_text:
  en: When support feels uneven, you can leave some flexibility in your plans.
  kn: ಬದಲಾಗುವ ನೆರವಿಗೆ ಹೊಂದಿಕೊಳ್ಳುವುದು ನಿಮಗೆ ನೆರವಾಗಬಹುದು.
  hi: बदलते सहारे के लिए गुंजाइश रखना आपके लिए उपयोगी हो सकता है।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  cost: free
  user_text:
    en: You can make room for support from people you trust.
    kn: ನಂಬಿಕೆಯ ಜನರಿಂದ ನೆರವು ಪಡೆಯಲು ಅವಕಾಶ ಮಾಡಿಕೊಳ್ಳಬಹುದು.
    hi: आप भरोसेमंद लोगों का सहारा ले सकते हैं।

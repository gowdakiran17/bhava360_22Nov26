id: vedic.yogas.budhaditya
system: vedic
topic: yogas
title: Budhaditya
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Sun and Mercury occupy one sign.
conditions:
  all:
  - fact: d1.mercury.distance_from_sun
    op: in
    value:
    - 1
meaning: A shared sign may bring communication and decision-making into the same setting.
life_areas:
- learning
strength_notes:
- when:
    fact: vedic.yoga.budhaditya.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.budhaditya.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.mercury_combust
    op: eq
    value: true
  effect: soften
  reason: Measure Mercury–Sun separation using the inclusive direct or retrograde combustion orb.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
- when:
    fact: d1.yoga.mercury_deep_combust
    op: eq
    value: true
  effect: cancel
  reason: Mercury within three degrees of Sun, inclusive; operational threshold.
- when:
    fact: d1.yoga.mercury_gate_miss
    op: eq
    value: true
  effect: cancel
  reason: Mercury below Moderate and outside natal angles and trines.
traditions_differ:
- profile: vedic-editorial-v1
  note: The shared-sign screen includes close conjunctions. Assess Mercury’s combustion separately.
- profile: budhaditya-close-orb
  note: A tighter editorial variant softens at separation up to 3 degrees inclusive instead of the full combustion
    orb.
sources:

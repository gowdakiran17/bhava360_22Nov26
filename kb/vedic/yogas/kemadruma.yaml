confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors. Kannada
  and Hindi await native review.
user_text:
  en: During quieter stretches you can name a person or routine that helps you feel connected.
  kn: ಶಾಂತ ದಿನಗಳಲ್ಲಿ ಯಾರ ಒಡನಾಟ ಅಥವಾ ಯಾವ ದಿನಚರಿ ನಿಮಗೆ ಆತ್ಮೀಯತೆಯ ಭಾವ ನೀಡುತ್ತದೆ ಎಂಬುದನ್ನು ಗುರುತಿಸಬಹುದು.
  hi: शांत दिनों में आप किसी ऐसे व्यक्ति या दिनचर्या को पहचान सकते हैं जिससे आपको जुड़ाव महसूस होता है।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  cost: free
  user_text:
    en: You can ask someone you trust for help with one small task.
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಒಂದು ಸಣ್ಣ ಕೆಲಸಕ್ಕೆ ನಂಬಿಕೆಯ ವ್ಯಕ್ತಿಯ ನೆರವು ಕೇಳಬಹುದು.
    hi: चाहें तो किसी भरोसेमंद व्यक्ति से एक छोटे काम में मदद माँग सकते हैं।
related_rules:

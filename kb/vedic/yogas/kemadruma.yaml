id: vedic.yogas.kemadruma
system: vedic
topic: yogas
title: Kemadruma
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Neither adjacent sign to the Moon contains Mars, Mercury, Jupiter, Venus or Saturn. Apply the cancellations
  before displaying the reading.
conditions:
  all:
  - fact: d1.moon.eligible_flank
    op: eq
    value: false
meaning: With both lunar flanks empty, it may help to consider what support is available when doing something independently.
life_areas:
- family-home
- learning
strength_notes:
- when:
    fact: vedic.yoga.kemadruma.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.kemadruma.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.moon.distance_from_lagna
    op: in
    value:
    - 1
    - 4
    - 7
    - 10
  effect: cancel
  reason: Moon is angular from Lagna.
- when:
    any:
    - fact: d1.mars.distance_from_moon
      op: eq
      value: 1
    - fact: d1.mercury.distance_from_moon
      op: eq
      value: 1
    - fact: d1.jupiter.distance_from_moon
      op: eq
      value: 1
    - fact: d1.venus.distance_from_moon
      op: eq
      value: 1
    - fact: d1.saturn.distance_from_moon
      op: eq
      value: 1
  effect: cancel
  reason: An eligible graha shares the lunar sign.
- when:
    any:
    - fact: d1.mars.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
    - fact: d1.mercury.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
    - fact: d1.jupiter.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
    - fact: d1.venus.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
    - fact: d1.saturn.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
  effect: cancel
  reason: An eligible graha occupies another angle from the Moon.
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
- when:
    fact: d1.yoga.kemadruma_angular
    op: eq
    value: true
  effect: cancel
  reason: At least one classical graha besides Moon occupies an angle from Lagna.
- when:
    fact: d1.yoga.moon_benefic_aspect
    op: eq
    value: true
  effect: cancel
  reason: A natural benefic casts a full graha aspect to the Moon.
traditions_differ:
- profile: vedic-editorial-v1
  note: Use the five non-luminary classical planets for companionship and lunar angles. Schools differ on angular
    and navamsha qualifications. This profile tests D1 whole signs.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 5–7
  other_locator: Named yoga or graha combination
  supports: Empty lunar flanks and the stated angular or conjunction exceptions.
  verification: verified
- book: Brihat Jataka
  work_id: brihat-jataka
  edition: brihat-jataka-iyer-brihatjataka00varaiala
  chapter: 13
  verse: '3'
  other_locator: Named yoga or graha combination
  supports: Lunar neighbours and alternative kendra/navamsha readings.
  verification: verified
- book: Saravali

id: vedic.yogas.kemadruma
system: vedic
topic: yogas
title: Kemadruma
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Neither adjacent sign to the Moon contains Mars, Mercury, Jupiter, Venus or Saturn. Apply the cancellations
  before displaying the reading.
conditions:
  all:
  - fact: d1.moon.eligible_flank
    op: eq
    value: false
meaning: With both lunar flanks empty, it may help to consider what support is available when doing something
  independently.
life_areas:
- family-home
- learning
strength_notes:
- when:
    fact: d1.yoga.anchor_meets_strength
    op: eq
    value: true
  effect: weaker
  reason: When the Moon meets its shadbala minimum, give less weight to an interpretation of limited support.
    The flank count stays the same.
exceptions:
- when:
    fact: d1.moon.distance_from_lagna
    op: in
    value:
    - 1
    - 4
    - 7
    - 10
  effect: cancel
  reason: Moon is angular from Lagna.
- when:
    any:
    - fact: d1.mars.distance_from_moon
      op: eq
      value: 1
    - fact: d1.mercury.distance_from_moon
      op: eq
      value: 1
    - fact: d1.jupiter.distance_from_moon
      op: eq
      value: 1
    - fact: d1.venus.distance_from_moon
      op: eq
      value: 1
    - fact: d1.saturn.distance_from_moon
      op: eq
      value: 1
  effect: cancel
  reason: An eligible graha shares the lunar sign.
- when:
    any:
    - fact: d1.mars.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
    - fact: d1.mercury.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
    - fact: d1.jupiter.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
    - fact: d1.venus.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
    - fact: d1.saturn.distance_from_moon
      op: in
      value:
      - 4
      - 7
      - 10
  effect: cancel
  reason: An eligible graha occupies another angle from the Moon.
traditions_differ:
- profile: vedic-editorial-v1
  note: Use the five non-luminary classical planets for companionship and lunar angles. Schools differ on
    angular and navamsha qualifications. This profile tests D1 whole signs.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 5–7
  other_locator: Named yoga or graha combination
  supports: Empty lunar flanks and the stated angular or conjunction exceptions.
  verification: verified
- book: Brihat Jataka
  work_id: brihat-jataka
  edition: brihat-jataka-iyer-brihatjataka00varaiala
  chapter: 13
  verse: '3'
  other_locator: Named yoga or graha combination
  supports: Lunar neighbours and alternative kendra/navamsha readings.
  verification: verified
confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors.
  Kannada and Hindi await native review.
user_text:
  en: When a task feels like yours alone, you can name one person you would feel comfortable asking for help.
  kn: ಒಂದು ಕೆಲಸವನ್ನು ಒಬ್ಬರೇ ಮಾಡಬೇಕೆನಿಸಿದಾಗ ನೆರವು ಕೇಳಲು ನಿಮಗೆ ಹಿತವೆನಿಸುವ ಒಬ್ಬರನ್ನು ನೆನಪಿಸಿಕೊಳ್ಳಬಹುದು.
  hi: जब कोई काम अकेले सँभालना पड़े, तो आप किसी ऐसे व्यक्ति को याद कर सकते हैं जिससे मदद माँगना सहज लगे।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  cost: free
  user_text:
    en: "You can ask someone you trust for help with one small task."
    kn: ಇಚ್ಛೆಯಿದ್ದರೆ ಒಂದು ಸಣ್ಣ ಕೆಲಸಕ್ಕೆ ನಂಬಿಕೆಯ ವ್ಯಕ್ತಿಯ ನೆರವು ಕೇಳಬಹುದು.
    hi: चाहें तो किसी भरोसेमंद व्यक्ति से एक छोटे काम में मदद माँग सकते हैं।
evidence:
  direction: caution
  weight_class: primary
  time_scope: natal
  reference: moon
  area_strength:
    family-home: core
    learning: related

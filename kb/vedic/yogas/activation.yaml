facts_contract:
  active: Use the yoga-specific active fact in KB-36 before including any period testimony.
  gate: Resolve independently per formation witness. A singleton cannot be mixed-strength; a soften exception still
    uses gentle copy.
  bhanga: An unknown material cancellation withholds the reading. An unverified school-specific qualification is a
    labelled draft, not a verified classical verse.
variants:
  mutual-full-aspect: Explicit opt-in for Chandra-Mangala, Raja and Dhana.
  budhaditya-close-orb: Optional 3 degree inclusive separation in place of the motion-specific orb.

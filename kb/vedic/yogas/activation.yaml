participants: Deduplicate physical grahas, including the actual lords in the matched formation. Evaluate alternative
  witnesses separately.
gate:
  full: Every actual participant grades Strong or Moderate.
  mild: Mixed capable and Weak participants.
  hidden: Every participant grades Weak.
  unknown: Missing material grades withhold the display.
activation: Maha or Antar among participants or forming lords. Known absence gives background. Unknown dasha is unknown;
  never contributes caution. Cancelled or hidden formations cannot contribute. No activation creates natal promise.
display:
  cancel: omit
  soften: yoga-mild
  mild: yoga-mild
  background: yoga-background
  unknown: background overview only
  sensitive: admin-only

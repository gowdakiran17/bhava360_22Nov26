id: vedic.yogas.ruchaka
system: vedic
topic: yogas
title: Ruchaka
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Mars occupies a whole-sign angle from Lagna and its own or exaltation sign.
conditions:
  all:
  - fact: d1.mars.distance_from_lagna
    op: in
    value:
    - 1
    - 4
    - 7
    - 10
  - fact: d1.mars.own_or_exalted
    op: eq
    value: true
meaning: An angular, dignified Mars may make taking initiative and directing effort more prominent in the house
  it occupies.
life_areas:
- career
strength_notes:
- when:
    fact: vedic.yoga.ruchaka.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.ruchaka.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.anchor_combust
    op: eq
    value: true
  effect: soften
  reason: The anchor is within its motion-specific combustion orb.
- when:
    fact: d1.yoga.anchor_war_loser
    op: eq
    value: true
  effect: cancel
  reason: The forming planet loses planetary war under the selected strict school.
- when:
    fact: d1.yoga.anchor_d9_debilitated
    op: eq
    value: true
  effect: soften
  reason: Debilitation in D9 qualifies the angular D1 formation.
- when:
    fact: d1.yoga.luminary_conjunction
    op: eq
    value: true
  effect: soften
  reason: Selected school softens an anchor joined by Sun or Moon.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: Use Lagna as the origin. A parallel lunar-origin reading requires a separately labelled chart reference.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 1–4
  other_locator: Named yoga or graha combination
  supports: Five angular dignity formations and their individual grahas.
  verification: verified
confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors. Kannada
  and Hindi await native review.
user_text:
  en: A task that calls for initiative may benefit from a clear plan of action.
  kn: ಕ್ರಿಯೆಗೆ ಯೋಜನೆ ರೂಪಿಸುವುದು ನಿಮಗೆ ನೆರವಾಗಬಹುದು.
  hi: पहल की योजना बनाना आपके लिए उपयोगी हो सकता है।
native_review:
  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  cost: free
  user_text:
    en: You may enjoy taking the initiative when a task needs action.
    kn: ಕೆಲಸಕ್ಕೆ ಚಾಲನೆ ನೀಡಲು ನೀವು ಆಸಕ್ತಿ ತೋರಬಹುದು.
    hi: काम शुरू करने में आप पहल कर सकते हैं।
related_rules:
- vedic.yogas.activation
participants:
- mars
evidence:
  direction: support
  weight_class: primary
  time_scope: natal
  reference: lagna
  area_strength:
    career: core

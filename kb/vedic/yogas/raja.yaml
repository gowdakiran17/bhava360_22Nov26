id: vedic.yogas.raja
system: vedic
topic: yogas
title: Kendra–trikona association
doctrine_profile: vedic-editorial-v1
approval: draft
rule: A link between distinct angular and trinal lords, or one Yogakaraka holding both offices.
conditions:
  all:
  - fact: d1.lords.kendra_trikona_link
    op: eq
    value: true
meaning: The link may bring a guiding value into a visible responsibility.
life_areas:
- career
strength_notes:
- when:
    fact: vedic.yoga.raja.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.raja.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.forming_lord_owns_eighth
    op: eq
    value: true
  effect: soften
  reason: A participating eighth lord qualifies the promise.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: Use distinct lords of 1/4/7/10 and 5/9. The wider textual family includes aspects and other placements.
- profile: mutual-full-aspect
  note: A labelled aspect variant accepts mutual full aspect between the two distinct forming lords.
sources:
- book: Brihat Parashara Hora Shastra
  work_id: bphs
  edition: bphs-sanskritdocuments-45
  chapter: 34
  verse: 11–12
  other_locator: Named yoga or graha combination
  supports: Relations between angular and trinal lords; the KB selects conjunction and exchange.
  verification: verified
- work_id: laghu-parashari
  book: Laghu Parashari
  edition: null
  chapter: 2
  verse: null
  other_locator: Chapter 2
  supports: Single lord of a non-Lagna angle and trine; edition verification pending.
  verification: pending
confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors. Kannada
  and Hindi await native review.
user_text:
  en: You can bring your guiding principles into the responsibilities you accept.
  kn: ಹೊಸ ಹೊಣೆ ಒಪ್ಪುವಾಗ ಅದರಲ್ಲಿ ನಿಮ್ಮ ತತ್ವಗಳನ್ನು ಹೇಗೆ ಪಾಲಿಸಬಹುದು ಎಂದು ಕೇಳಿಕೊಳ್ಳಿ.
  hi: कोई जिम्मेदारी स्वीकार करते समय सोचें कि उसमें अपने सिद्धांतों को कैसे निभा सकते हैं।

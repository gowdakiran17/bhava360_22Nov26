  kn: ದೀರ್ಘಕಾಲದ ಯೋಜನೆಗಳಿಗೆ ನೆರವಾಗುವ ಸಂಪನ್ಮೂಲಗಳನ್ನು ಪರಿಶೀಲಿಸಬಹುದು.
  hi: दीर्घकालीन योजनाओं में सहायक संसाधनों की समीक्षा कर सकते हैं।

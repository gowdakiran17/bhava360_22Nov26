id: vedic.yogas.vasumati
system: vedic
topic: yogas
title: Vasumati
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Every eligible benefic is in house 3, 6, 10 or 11 from the same specified reference; reject an empty eligible set.
conditions:
  any:
  - fact: d1.moon.benefics_all_in_upachaya
    op: eq
    value: true
  - fact: d1.lagna.benefics_all_in_upachaya
    op: eq
    value: true
meaning: You may wish to review which resources support your longer-term plans.
life_areas:
- money
strength_notes:
- when:
    fact: vedic.yoga.vasumati.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.vasumati.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.mixed_nature_witness
    op: eq
    value: true
  effect: soften
  reason: Resolve the actual contributing grahas. A mixed benefic and malefic witness does not support an unqualified
    positive reading.
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never cancel
    an unrelated match.
traditions_differ: []
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 19
  other_locator: null
  supports: Formation with all benefics in upachaya houses from the same reference.
  verification: verified
confidence: medium
review_notes: Review exact locator, convention and native copy before release.
user_text:

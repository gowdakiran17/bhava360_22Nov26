id: vedic.yogas.adhi
system: vedic
topic: yogas
title: Adhi
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Under this candidate profile Mercury, Venus and Jupiter each occupy one of the sixth, seventh or eighth
  signs from Moon.
conditions:
  all:
  - fact: d1.mercury.distance_from_moon
    op: in
    value:
    - 6
    - 7
    - 8
  - fact: d1.venus.distance_from_moon
    op: in
    value:
    - 6
    - 7
    - 8
  - fact: d1.jupiter.distance_from_moon
    op: in
    value:
    - 6
    - 7
    - 8
meaning: Several benefic influences across the Moon’s sixth through eighth signs may emphasise support in
  handling responsibilities.
life_areas:
- career
strength_notes:
- when:
    fact: vedic.yoga.adhi.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.adhi.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.mixed_nature_witness
    op: eq
    value: true
  effect: soften
  reason: Resolve the actual contributing grahas. A mixed benefic and malefic witness does not support an unqualified
    positive reading.
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never cancel
    an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: All three named grahas must fall within the group. They may share a sign. Other readings distinguish
    partial formations.
sources:
- book: Brihat Jataka
  work_id: brihat-jataka
  edition: brihat-jataka-iyer-brihatjataka00varaiala
  chapter: 13
  verse: '2'
  other_locator: Named yoga or graha combination
  supports: Benefic placements in the sixth through eighth from the Moon.
  verification: verified
confidence: medium
review_notes: Draft whole-sign D1 interpretation. Recheck birth-time sensitivity for Lagna-based factors.
  Kannada and Hindi await native review.

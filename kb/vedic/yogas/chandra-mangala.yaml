id: vedic.yogas.chandra-mangala
system: vedic
topic: yogas
title: Chandra Mangala
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Moon and Mars occupy the same sign in this conjunction-only profile.
conditions:
  all:
  - fact: d1.mars.distance_from_moon
    op: in
    value:
    - 1
meaning: Initiative may follow quickly when a practical need comes into view.
life_areas:
- business
strength_notes:
- when:
    fact: vedic.yoga.chandra-mangala.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.chandra-mangala.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: This profile uses conjunction. Some practitioners also consider mutual aspects.
- profile: mutual-full-aspect
  note: Optional mutual seventh aspect may form the combination; conjunction remains the default.

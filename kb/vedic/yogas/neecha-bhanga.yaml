exceptions:
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never cancel
    an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: The alternate exaltee reading and the navamsha branches are identified separately. Retrogression is a strength
    variant. The raja entry adds the library’s stricter angularity requirement for the recovered planet.
- profile: vedic-editorial-v1
  note: MODERN dispositor-exchange relief branch. This editorial extension is not attributed to Phaladeepika 7.26–30,
    BPHS or Jataka Parijata 7. Raja promotion additionally requires the recovered planet angular from Lagna.

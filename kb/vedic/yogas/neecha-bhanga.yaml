id: vedic.yogas.neecha-bhanga
system: vedic
topic: yogas
title: Neecha Bhanga candidate
doctrine_profile: vedic-editorial-v1
approval: draft
rule: 'For the same debilitated classical graha, match any listed relief branch: The dispositor occupies a
  kendra from Lagna or Moon. The ruler of the selected graha’s exaltation sign occupies a kendra from Lagna
  or Moon. The distinct rulers of the debilitation and exaltation signs occupy mutual kendras. The dispositor
  casts a full graha aspect on the selected debilitated graha. Under the alternate reading of tunganatha,
  a classical planet exalted in the occupied sign is angular from Lagna or Moon. The selected graha is debilitated
  in D1 but occupies its exaltation sign in D9. The ruler of the selected graha’s D9 sign occupies a D1 angle
  or trine and either Lagna is movable or the Lagna lord occupies a movable navamsha.'
conditions:
  any:
  - fact: d1.dignity.debility_lord_angular
    op: eq
    value: true
  - fact: d1.dignity.exaltation_lord_angular
    op: eq
    value: true
  - fact: d1.dignity.mutual_kendras
    op: eq
    value: true
  - fact: d1.dignity.dispositor_aspect
    op: eq
    value: true
  - fact: d1.dignity.exaltee_angular
    op: eq
    value: true
  - fact: d1.dignity.exalted_navamsha
    op: eq
    value: true
  - fact: d1.dignity.navamsha_lord_support
    op: eq
    value: true
meaning: Support elsewhere in the chart may qualify how a difficult dignity is expressed.
life_areas:
- learning
- career
strength_notes:
- when:
    fact: d1.yoga.anchor_meets_strength
    op: eq
    value: true
  effect: stronger
  reason: Assess the shadbala minimum for the selected debilitated graha in this match before giving the reading
    greater weight.
- when:
    fact: d1.dignity.debilitated_vakri
    op: eq
    value: true
  effect: stronger
  reason: Uttara Kalamrita II.6 gives retrograde debility motional strength; this profile keeps the D1 sign
    dignity.
exceptions: []

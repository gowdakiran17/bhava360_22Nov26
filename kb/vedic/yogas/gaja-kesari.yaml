id: vedic.yogas.gaja-kesari
system: vedic
topic: yogas
title: Gaja Kesari
doctrine_profile: vedic-editorial-v1
approval: draft
rule: 'Moon-based screen: Jupiter occupies an angle from the Moon.'
conditions:
  all:
  - fact: d1.jupiter.distance_from_moon
    op: in
    value:
    - 1
    - 4
    - 7
    - 10
meaning: Jupiter in a lunar angle may connect judgement with the needs that receive attention.
life_areas:
- learning
strength_notes:
- when:
    fact: vedic.yoga.gaja-kesari.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.gaja-kesari.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.jupiter.debilitated
    op: eq
    value: true
  effect: soften
  reason: Jupiter occupies its debilitation sign under the dignity register.
- when:
    fact: d1.yoga.jupiter_afflicted
    op: eq
    value: true
  effect: soften
  reason: Strict dignity-and-affliction school softens when Jupiter is combust, in an enemy sign or receives an unrelieved
    full malefic aspect.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never cancel
    an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: This is the Moon–Jupiter angular screen. Stricter versions also assess affliction and dignity.
- profile: vedic-editorial-v1
  note: Labelled Lagna-origin variant considers angular Jupiter from Lagna; Moon-origin remains the default.
sources:
- book: Phaladeepika

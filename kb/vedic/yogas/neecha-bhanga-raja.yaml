id: vedic.yogas.neecha-bhanga-raja
system: vedic
topic: yogas
title: Neecha Bhanga Raja candidate
doctrine_profile: vedic-editorial-v1
approval: draft
rule: 'For the same debilitated classical graha, match any listed relief branch: It exchanges signs with its distinct
  dispositor. The dispositor occupies a kendra from Lagna or Moon. The ruler of the selected graha’s exaltation
  sign occupies a kendra from Lagna or Moon. The distinct rulers of the debilitation and exaltation signs occupy
  mutual kendras. The dispositor casts a full graha aspect on the selected debilitated graha. Under the alternate
  reading of tunganatha, a classical planet exalted in the occupied sign is angular from Lagna or Moon. The selected
  graha is debilitated in D1 but occupies its exaltation sign in D9. The ruler of the selected graha’s D9 sign occupies
  a D1 angle or trine and either Lagna is movable or the Lagna lord occupies a movable navamsha. Also require the
  recovered graha in a D1 kendra from Lagna.'
conditions:
  all:
  - any:
    - fact: d1.dignity.exchange_with_dispositor
      op: eq
      value: true
    - fact: d1.dignity.debility_lord_angular
      op: eq
      value: true
    - fact: d1.dignity.exaltation_lord_angular
      op: eq
      value: true
    - fact: d1.dignity.mutual_kendras
      op: eq
      value: true
    - fact: d1.dignity.dispositor_aspect
      op: eq
      value: true
    - fact: d1.dignity.exaltee_angular
      op: eq
      value: true
    - fact: d1.dignity.exalted_navamsha
      op: eq
      value: true
    - fact: d1.dignity.navamsha_lord_support
      op: eq
      value: true
  - fact: d1.dignity.recovered_planet_angular
    op: eq
    value: true

id: vedic.yogas.sarala
system: vedic
topic: yogas
title: Sarala
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Lord of house 8 occupies house 6, 8 or 12 under the broad Vipareeta screen.
conditions:
  all:
  - fact: d1.lord_8.distance_from_lagna
    op: in
    value:
    - 6
    - 8
    - 12
meaning: A demanding house topic may become an area of practical experience when its ruler occupies a dusthana.
life_areas:
- career
strength_notes:
- when:
    fact: vedic.yoga.sarala.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.sarala.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.other_lord_association
    op: eq
    value: true
  effect: cancel
  reason: Strict Viparita school excludes conjunction or mutual full aspect with a distinct unrelated house lord.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: Includes the ruler in its own dusthana. Stricter viparita readings restrict other associations and may require
    a different dusthana.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 6
  verse: 57, 65
  other_locator: Named yoga or graha combination
  supports: House yoga name and interpretation. The broad three-dusthana placement screen is the KB convention.
  verification: verified
confidence: medium

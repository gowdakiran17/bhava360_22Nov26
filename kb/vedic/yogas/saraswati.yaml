id: vedic.yogas.saraswati
system: vedic
topic: yogas
title: Saraswati
doctrine_profile: vedic-editorial-v1
approval: draft
rule: Mercury, Venus and Jupiter each occupy house 1, 2, 4, 5, 7, 9 or 10 from Lagna. Jupiter also meets its strength
  minimum in an own, exaltation or naturally friendly sign.
conditions:
  all:
  - fact: d1.mercury.distance_from_lagna
    op: in
    value:
    - 1
    - 2
    - 4
    - 5
    - 7
    - 9
    - 10
  - fact: d1.venus.distance_from_lagna
    op: in
    value:
    - 1
    - 2
    - 4
    - 5
    - 7
    - 9
    - 10
  - fact: d1.jupiter.distance_from_lagna
    op: in
    value:
    - 1
    - 2
    - 4
    - 5
    - 7
    - 9
    - 10
  - fact: d1.jupiter.saraswati_strength
    op: eq
    value: true
meaning: Language, judgement and creative practice may support learning together.
life_areas:
- learning
- career
strength_notes:
- when:
    fact: vedic.yoga.saraswati.gate
    op: eq
    value: full
  effect: stronger
  reason: Allow the normal reading when activation permits.
- when:
    fact: vedic.yoga.saraswati.gate
    op: eq
    value: mild
  effect: weaker
  reason: Use only the softened reading for mixed participant strength.
exceptions:
- when:
    fact: d1.yoga.participant_afflicted
    op: eq
    value: true
  effect: soften
  reason: A bound forming participant loses war or is combust; retain only softened language. Editorial qualification
    pending school review.
- when:
    fact: d1.yoga.foundation_cancelled
    op: eq
    value: true
  effect: cancel
  reason: The bound prerequisite has been withdrawn by a matched cancellation. Apply only to that witness; never
    cancel an unrelated match.
traditions_differ:
- profile: vedic-editorial-v1
  note: The text calls for strength. This profile operationalises it using Jupiter’s shadbala minimum and natural
    sign relationships.

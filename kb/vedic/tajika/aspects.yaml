orb: Inclusive arithmetic mean of the two planetary orbs.
geometry: Count signs first. Zero-based sign offsets 0, 2 or 10, 3 or 9, 4 or 8 and 6 select conjunction, sextile, square,
  trine and opposition respectively. All other offsets have no aspect. Test the signed degree residual of that ray
  against the inclusive mean orb. Applying conjunction is ithasala.
motion: 'Residual times relative signed longitude speed: negative applying (faster body closes the gap), positive
  separating, zero residual exact. Equal speeds away from exact are stationary.'
transfer: 'Nakta: a faster intermediary separates from one principal and next applies to the other, before interruption.
  Yamaya: both principals apply to the same slower collector. Require distinct actors and no direct applying link.'
reception: Mutual domicile reception if each occupies a sign ruled by the other. Record independently; reception alone
  does not establish perfection.
traditions_differ: Neelakanthi groups conjunction and opposition as open hostility. An applying conjunction counts as ithasala. The support label here describes application testimony alone. Interpret its quality from the participating planets.

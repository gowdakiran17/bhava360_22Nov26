version: 1
approval: draft
origin: Local sunrise changes vara; angular limb changes occur at their exact ephemeris crossings.
vara: Weekday of the most recent local sunrise.
tithi: 1 + floor(((Moon − Sun) mod 360) / 12). First 15 waxing, next 15 waning.
nakshatra: 1 + floor(sidereal Moon / (40/3)).
yoga: 1 + floor(((sidereal Moon + sidereal Sun) mod 360) / (40/3)).
karana: Index lunar elongation in 6° half-tithis from zero. Index 0 Kimstughna; 1..56 cycle Bava, Balava, Kaulava, Taitila,
  Gara, Vanija, Vishti; 57..59 Shakuni, Chatushpada, Naga.
sunrise_rules: Repeated tithi at successive sunrises and a tithi entirely between sunrises need separate festival rules. Keep
  regional amanta/purnimanta profiles.

window_formula: For anchors A,B and one-based slot j of n return [A+(j-1)(B-A)/n, A+j(B-A)/n). Use elapsed
  time, then convert to local display. For Brahma preceding a sunrise use the preceding sunset as A and that
  sunrise as B.

month_bounds: New moon inclusive to next new moon exclusive. Count solved forward sidereal solar sign ingresses
  inside. One names an ordinary month; zero takes the following ingress name and marks adhika; two record both
  ingress names and flag kshaya for regional handling.
purnimanta: Bright fortnight uses the same month name as amanta. During the dark fortnight label by the next
  bright fortnight; preserve intercalary status and profile. An unresolved exceptional month mapping suppresses
  a dated festival.
pradosha: For this evening profile use the first fifth of sunset-to-next-sunrise; require strictly positive
  overlap. Other authorities measure evening in ghatis.
ugadi: Use the first Chaitra lunation of the amanta year (including adhika Chaitra in this profile). Select
  the sunrise in Shukla Pratipada. For two matching sunrises use the earlier. For none use the sunrise immediately
  preceding the start of Pratipada.
deepavali: For Lakshmi Puja use regular Ashvina Amavasya in amanta (Kartika Krishna in purnimanta). Choose
  the local date whose pradosha intersects the tithi; if both qualify choose later. If neither qualifies, withhold
  this profile’s date and request the applicable regional yama-based determination.
sankranti: An ingress instant belongs to the sunrise-to-sunrise day containing it. This is a transit-day marker;
  ritual observance may move to another civil date.

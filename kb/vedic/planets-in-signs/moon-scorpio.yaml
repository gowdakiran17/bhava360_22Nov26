user_text:
  en: When someone turns to you for comfort, you can give an unanswered question time before pressing for a response.
  kn: ಯಾರಾದರೂ ನೆಮ್ಮದಿ ಅರಸಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದಾಗ ಉತ್ತರ ಸಿಗದ ಪ್ರಶ್ನೆಗೆ ತಕ್ಷಣ ಉತ್ತರ ಬಯಸದೆ ಸ್ವಲ್ಪ ಸಮಯ ಕೊಡಬಹುದು.
  hi: जब कोई सहारे के लिए आपके पास आए, आप किसी अनसुलझे सवाल पर तुरंत जवाब माँगने से पहले थोड़ा समय दे सकते हैं।

    kn: ಆತ್ಮೀಯರಿಗೆ ಯಾವ ನೆರವು ಬೇಕೆಂದು ಕೇಳಬಹುದು.
    hi: किसी करीबी से पूछ सकते हैं कि उन्हें कैसी मदद चाहिए।

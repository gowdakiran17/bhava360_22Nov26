id: vedic.planets-in-signs.moon-scorpio
system: vedic
topic: planets-in-signs
title: Moon in Scorpio
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match the selected natal D1 Moon when its stable sidereal sign is Scorpio.
conditions:
  all:
  - fact: d1.selected_point.graha
    op: eq
    value: moon
  - fact: d1.selected_point.sign
    op: eq
    value: scorpio
placement:
  dignity:
    sign_class: debilitated
    ruler: mars
    natural_relation_to_ruler: neutral
    debilitation_peak_degrees: 3
  themes:
  - responding to a need
  - patient inquiry
meaning: Moon in Scorpio can bring responding to a need into situations that call for patient inquiry. The sign-level
  debility calls for checking the condition of the sign ruler before drawing a conclusion.
life_areas:
- family-home
- love-marriage
strength_notes:
- when:
    fact: d1.mars.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Mars rules the sign. Its own or exalted placement may support the expression of this placement.
exceptions:
- when:
    fact: d1.dignity.neecha_bhanga_matched
    op: eq
    value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Apply the cancellation screen to this Moon placement. A matched relief condition can qualify the debility reading.

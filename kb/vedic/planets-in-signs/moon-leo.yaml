  dignity:
    sign_class: friend
    ruler: sun
    natural_relation_to_ruler: friend
  themes:
  - responding to a need
  - visible leadership
meaning: Moon in Leo can bring responding to a need into situations that call for visible leadership.
life_areas:
- family-home
- love-marriage
strength_notes:
- when:
    fact: d1.sun.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Sun rules the sign. Its own or exalted placement may support the expression of this placement.

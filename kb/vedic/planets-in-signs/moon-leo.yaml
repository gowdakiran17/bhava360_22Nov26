user_text:
  en: When someone turns to you for comfort, you can make clear which part you are willing to take responsibility
    for.
  kn: ಯಾರಾದರೂ ನೆಮ್ಮದಿ ಅರಸಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದಾಗ ಯಾವ ಭಾಗದ ಹೊಣೆ ವಹಿಸಲು ಸಿದ್ಧರಿದ್ದೀರಿ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಬಹುದು.
  hi: जब कोई सहारे के लिए आपके पास आए, आप स्पष्ट कर सकते हैं कि कौन सी ज़िम्मेदारी लेने के लिए आप तैयार हैं।

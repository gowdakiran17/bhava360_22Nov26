user_text:
  en: When you take on a lasting commitment, you can choose a first step small enough to repeat tomorrow.
  kn: ದೀರ್ಘಕಾಲದ ಹೊಣೆ ವಹಿಸಿಕೊಳ್ಳುವಾಗ ನಾಳೆಯೂ ಮುಂದುವರಿಸಬಹುದಾದ ಸಣ್ಣ ಹೆಜ್ಜೆಯನ್ನು ಆರಿಸಬಹುದು.
  hi: जब आप लंबे समय की ज़िम्मेदारी लें, आप ऐसा छोटा पहला कदम चुन सकते हैं जिसे कल भी दोहरा सकें।

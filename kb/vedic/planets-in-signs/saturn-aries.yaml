id: vedic.planets-in-signs.saturn-aries
system: vedic
topic: planets-in-signs
title: Saturn in Aries
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match the selected natal D1 Saturn when its stable sidereal sign is Aries.
conditions:
  all:
  - fact: d1.selected_point.graha
    op: eq
    value: saturn
  - fact: d1.selected_point.sign
    op: eq
    value: aries
placement:
  dignity:
    sign_class: debilitated
    ruler: mars
    natural_relation_to_ruler: enemy
    debilitation_peak_degrees: 20
  themes:
  - sustaining a commitment
  - initiative
meaning: Saturn’s concern with keeping a commitment can meet Aries’s impulse to begin quickly. A smaller first
  promise may be easier to sustain once the initial push has passed.
life_areas:
- career
- learning
strength_notes:
- when:
    fact: d1.mars.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Mars rules the sign. Its own or exalted placement may support the expression of this placement.
exceptions:
- when:
    fact: d1.dignity.neecha_bhanga_matched
    op: eq
    value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Apply the cancellation screen to this Saturn placement. A matched relief condition can qualify the debility reading.

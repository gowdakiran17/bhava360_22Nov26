  kn: pending
  hi: pending
remedy:
  type: conduct
  optional: true
  free: true
  user_text:
    en: You can give credit to someone who helped you lead a task.
    kn: ಕೆಲಸವನ್ನು ಮುನ್ನಡೆಸಲು ನೆರವಾದವರ ಕೊಡುಗೆಯನ್ನು ಗುರುತಿಸಬಹುದು.
    hi: काम सँभालने में मदद करने वाले को श्रेय दे सकते हैं।

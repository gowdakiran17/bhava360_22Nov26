  work_id: brihat-jataka
  edition: brihat-jataka-iyer-brihatjataka00varaiala
  chapter: 2
  verse: 15–17
  other_locator: Natural relationships
  supports: Directed relationship of the graha to the sign ruler.
  verification: verified
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 1
  verse: 6–7
  other_locator: Sign definitions
  supports: Sign ownership, dignity peaks and degree-limited moolatrikona.
  verification: verified
- book: Brihat Jataka
  work_id: brihat-jataka
  edition: brihat-jataka-iyer-brihatjataka00varaiala
  chapter: 18
  verse: '3'
  other_locator: Sun in Libra, planetary placement discussion
  supports: Classical placement context. The practical reflection is an editorial interpretation.
  verification: verified
confidence: medium
review_notes: Natural relationship is read from graha to dispositor. Degree ranges qualify sign-level flags. Native-language
  review pending.
user_text:
  en: When a decision falls to you, you may find it helpful to hear what a fair exchange would mean to the other
    person.
  kn: ತೀರ್ಮಾನದ ಹೊಣೆ ನಿಮ್ಮ ಮೇಲಿದ್ದಾಗ ನ್ಯಾಯವಾದ ವಿನಿಮಯವೆಂದರೆ ಇನ್ನೊಬ್ಬರಿಗೆ ಏನು ಅರ್ಥ ಎಂದು ಕೇಳುವುದು ನೆರವಾಗಬಹುದು.
  hi: जब फ़ैसले की ज़िम्मेदारी आप पर हो, यह सुनना मददगार हो सकता है कि दूसरे व्यक्ति के लिए निष्पक्ष लेन-देन का
    क्या अर्थ है।

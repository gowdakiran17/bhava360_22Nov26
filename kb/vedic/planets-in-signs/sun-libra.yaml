id: vedic.planets-in-signs.sun-libra
system: vedic
topic: planets-in-signs
title: Sun in Libra
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match the selected natal D1 Sun when its stable sidereal sign is Libra.
conditions:
  all:
  - fact: d1.selected_point.graha
    op: eq
    value: sun
  - fact: d1.selected_point.sign
    op: eq
    value: libra
placement:
  dignity:
    sign_class: debilitated
    ruler: venus
    natural_relation_to_ruler: enemy
    debilitation_peak_degrees: 10
  themes:
  - taking responsibility
  - reciprocity
meaning: Sun in Libra can bring taking responsibility into situations that call for reciprocity. The sign-level
  debility calls for checking the condition of the sign ruler before drawing a conclusion.
life_areas:
- career
- business
strength_notes:
- when:
    fact: d1.venus.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Venus rules the sign. Its own or exalted placement may support the expression of this placement.
exceptions:
- when:
    fact: d1.dignity.neecha_bhanga_matched
    op: eq
    value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Apply the cancellation screen to this Sun placement. A matched relief condition can qualify the debility reading.
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: Brihat Jataka II.15 records an alternative friendship list. This profile uses the directed relationships
    in II.16–17.
sources:

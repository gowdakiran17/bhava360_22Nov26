user_text:
  en: When you take on a lasting commitment, you may learn something by asking who else relies on the same arrangement.
  kn: ದೀರ್ಘಕಾಲದ ಹೊಣೆ ವಹಿಸಿಕೊಳ್ಳುವಾಗ ಇದೇ ವ್ಯವಸ್ಥೆಯನ್ನು ಇನ್ನಾರು ಅವಲಂಬಿಸಿದ್ದಾರೆ ಎಂದು ಕೇಳುವುದರಿಂದ ಹೊಸದನ್ನು ತಿಳಿಯಬಹುದು.
  hi: जब आप लंबे समय की ज़िम्मेदारी लें, यही व्यवस्था और किसके काम आती है, यह पूछने से आपको कुछ नया समझ आ सकता
    है।

  en: When someone turns to you for comfort, you may find it helpful to hear what a fair exchange would mean to
    the other person.
  kn: ಯಾರಾದರೂ ನೆಮ್ಮದಿ ಅರಸಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದಾಗ ನ್ಯಾಯವಾದ ವಿನಿಮಯವೆಂದರೆ ಇನ್ನೊಬ್ಬರಿಗೆ ಏನು ಅರ್ಥ ಎಂದು ಕೇಳುವುದು ನೆರವಾಗಬಹುದು.
  hi: जब कोई सहारे के लिए आपके पास आए, यह सुनना मददगार हो सकता है कि दूसरे व्यक्ति के लिए निष्पक्ष लेन-देन का
    क्या अर्थ है।

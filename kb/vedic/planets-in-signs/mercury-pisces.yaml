id: vedic.planets-in-signs.mercury-pisces
system: vedic
topic: planets-in-signs
title: Mercury in Pisces
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match the selected natal D1 Mercury when its stable sidereal sign is Pisces.
conditions:
  all:
  - fact: d1.selected_point.graha
    op: eq
    value: mercury
  - fact: d1.selected_point.sign
    op: eq
    value: pisces
placement:
  dignity:
    sign_class: debilitated
    ruler: jupiter
    natural_relation_to_ruler: neutral
    debilitation_peak_degrees: 15
  themes:
  - exchanging ideas
  - imaginative reflection
meaning: Mercury in Pisces can bring exchanging ideas into situations that call for imaginative reflection. The
  sign-level debility calls for checking the condition of the sign ruler before drawing a conclusion.
life_areas:
- learning
- business
strength_notes:
- when:
    fact: d1.jupiter.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Jupiter rules the sign. Its own or exalted placement may support the expression of this placement.
exceptions:
- when:
    fact: d1.dignity.neecha_bhanga_matched
    op: eq
    value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Apply the cancellation screen to this Mercury placement. A matched relief condition can qualify the debility reading.

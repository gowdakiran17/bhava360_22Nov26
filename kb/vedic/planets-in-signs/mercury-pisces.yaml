  en: When you explain a new idea, you can leave room for an idea that is still taking shape.
  kn: ನೀವು ಹೊಸ ವಿಚಾರವನ್ನು ವಿವರಿಸುವಾಗ ಇನ್ನೂ ರೂಪುಗೊಳ್ಳುತ್ತಿರುವ ಕಲ್ಪನೆಗೆ ಅವಕಾಶ ಕೊಡಬಹುದು.
  hi: जब आप कोई नया विचार समझाएँ, आप ऐसे विचार को थोड़ा समय दे सकते हैं जो अभी आकार ले रहा है।

id: vedic.planets-in-signs.moon-taurus
system: vedic
topic: planets-in-signs
title: Moon in Taurus
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match the selected natal D1 Moon when its stable sidereal sign is Taurus.
conditions:
  all:
  - fact: d1.selected_point.graha
    op: eq
    value: moon
  - fact: d1.selected_point.sign
    op: eq
    value: taurus
placement:
  dignity:
    sign_class: exalted
    ruler: venus
    natural_relation_to_ruler: neutral
    exaltation_peak_degrees: 3
    moolatrikona_degree_limits:
    - 3
    - 30
  themes:
  - responding to a need
  - continuity
meaning: Moon in Taurus can bring responding to a need into situations that call for continuity. Its moolatrikona
  range runs from 3° to 30° within the sign. Check the actual longitude and any shared exaltation boundary.
life_areas:
- family-home
- love-marriage
strength_notes:
- when:
    fact: d1.venus.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Venus rules the sign. Its own or exalted placement may support the expression of this placement.

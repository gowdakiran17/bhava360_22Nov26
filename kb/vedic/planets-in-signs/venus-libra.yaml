    moolatrikona_degree_limits:
    - 0
    - 15
  themes:
  - making room for agreement
  - reciprocity
meaning: Venus in Libra can bring making room for agreement into situations that call for reciprocity. Its moolatrikona
  range runs from 0° up to but excluding 15°; from 15° to the end of Libra the single label is own sign. Check the actual longitude and any shared exaltation boundary.

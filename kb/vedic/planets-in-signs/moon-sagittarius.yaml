  en: When someone turns to you for comfort, you can ask which principle you would still stand by in a different
    setting.
  kn: ಯಾರಾದರೂ ನೆಮ್ಮದಿ ಅರಸಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದಾಗ ಬೇರೆ ಸಂದರ್ಭದಲ್ಲಿಯೂ ಯಾವ ತತ್ವವನ್ನು ಪಾಲಿಸುತ್ತೀರಿ ಎಂದು ಯೋಚಿಸಬಹುದು.
  hi: जब कोई सहारे के लिए आपके पास आए, आप सोच सकते हैं कि बदली हुई परिस्थिति में भी आप किस सिद्धांत को अपनाएँगे।

id: vedic.planets-in-signs.jupiter-capricorn
system: vedic
topic: planets-in-signs
title: Jupiter in Capricorn
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match the selected natal D1 Jupiter when its stable sidereal sign is Capricorn.
conditions:
  all:
  - fact: d1.selected_point.graha
    op: eq
    value: jupiter
  - fact: d1.selected_point.sign
    op: eq
    value: capricorn
placement:
  dignity:
    sign_class: debilitated
    ruler: saturn
    natural_relation_to_ruler: neutral
    debilitation_peak_degrees: 5
  themes:
  - offering guidance
  - sustained work
meaning: Jupiter in Capricorn can bring offering guidance into situations that call for sustained work. The sign-level
  debility calls for checking the condition of the sign ruler before drawing a conclusion.
life_areas:
- learning
- spirituality
strength_notes:
- when:
    fact: d1.saturn.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Saturn rules the sign. Its own or exalted placement may support the expression of this placement.
exceptions:
- when:
    fact: d1.dignity.neecha_bhanga_matched
    op: eq
    value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Apply the cancellation screen to this Jupiter placement. A matched relief condition can qualify the debility reading.

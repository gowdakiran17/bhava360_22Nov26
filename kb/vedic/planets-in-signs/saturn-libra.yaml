user_text:
  en: When you take on a lasting commitment, you may find it helpful to hear what a fair exchange would mean to
    the other person.
  kn: ದೀರ್ಘಕಾಲದ ಹೊಣೆ ವಹಿಸಿಕೊಳ್ಳುವಾಗ ನ್ಯಾಯವಾದ ವಿನಿಮಯವೆಂದರೆ ಇನ್ನೊಬ್ಬರಿಗೆ ಏನು ಅರ್ಥ ಎಂದು ಕೇಳುವುದು ನೆರವಾಗಬಹುದು.
  hi: जब आप लंबे समय की ज़िम्मेदारी लें, यह सुनना मददगार हो सकता है कि दूसरे व्यक्ति के लिए निष्पक्ष लेन-देन का
    क्या अर्थ है।

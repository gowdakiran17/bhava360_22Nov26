    op: eq
    value: true
  effect: stronger
  reason: Mercury rules the sign. Its own or exalted placement may support the expression of this placement.
exceptions:
- when:
    fact: d1.dignity.neecha_bhanga_matched
    op: eq
    value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Apply the cancellation screen to this Venus placement. A matched relief condition can qualify the debility reading.

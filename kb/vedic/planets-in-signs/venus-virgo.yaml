id: vedic.planets-in-signs.venus-virgo
system: vedic
topic: planets-in-signs
title: Venus in Virgo
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match the selected natal D1 Venus when its stable sidereal sign is Virgo.
conditions:

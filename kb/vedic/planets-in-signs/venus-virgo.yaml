    value: venus
  - fact: d1.selected_point.sign
    op: eq
    value: virgo
placement:
  dignity:
    sign_class: debilitated
    ruler: mercury
    natural_relation_to_ruler: friend
    debilitation_peak_degrees: 27
  themes:
  - making room for agreement
  - careful adjustment
meaning: Venus in Virgo can bring making room for agreement into situations that call for careful adjustment.
  The sign-level debility calls for checking the condition of the sign ruler before drawing a conclusion.
life_areas:
- love-marriage
- family-home
strength_notes:
- when:

id: vedic.planets-in-signs.mars-cancer
system: vedic
topic: planets-in-signs
title: Mars in Cancer
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match the selected natal D1 Mars when its stable sidereal sign is Cancer.
conditions:
  all:
  - fact: d1.selected_point.graha
    op: eq
    value: mars
  - fact: d1.selected_point.sign
    op: eq
    value: cancer
placement:
  dignity:
    sign_class: debilitated
    ruler: moon
    natural_relation_to_ruler: friend
    debilitation_peak_degrees: 28
  themes:
  - directing effort
  - care and belonging
meaning: Mars in Cancer can bring directing effort into situations that call for care and belonging. The sign-level
  debility calls for checking the condition of the sign ruler before drawing a conclusion.
life_areas:
- career
- learning
strength_notes:
- when:
    fact: d1.moon.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Moon rules the sign. Its own or exalted placement may support the expression of this placement.
exceptions:
- when:
    fact: d1.dignity.neecha_bhanga_matched
    op: eq
    value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Apply the cancellation screen to this Mars placement. A matched relief condition can qualify the debility reading.

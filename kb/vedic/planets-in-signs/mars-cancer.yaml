  en: When you are ready to act, you can ask what would help the people involved feel at home.
  kn: ನೀವು ಹೆಜ್ಜೆ ಇಡಲು ಸಿದ್ಧರಾದಾಗ ಭಾಗಿಯಾದವರಿಗೆ ಆತ್ಮೀಯತೆ ಮೂಡಲು ಏನು ನೆರವಾಗುತ್ತದೆ ಎಂದು ಕೇಳಬಹುದು.
  hi: जब आप कदम उठाने को तैयार हों, आप पूछ सकते हैं कि साथ जुड़े लोगों को किस चीज़ से अपनापन महसूस होगा।

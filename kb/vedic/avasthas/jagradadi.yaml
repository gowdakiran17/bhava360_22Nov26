copy:
  jagrat:
    en: You can give a task your full attention.
    kn: ಕೆಲಸಕ್ಕೆ ಪೂರ್ಣ ಗಮನ ಕೊಡಬಹುದು.
    hi: किसी काम पर पूरा ध्यान दे सकते हैं।
  swapna:
    en: You can sketch an idea before testing it.
    kn: ವಿಚಾರವನ್ನು ಪ್ರಯೋಗಿಸುವ ಮೊದಲು ರೂಪರೇಖೆ ಬರೆಯಬಹುದು.
    hi: विचार आज़माने से पहले उसकी रूपरेखा बना सकते हैं।
  sushupti:
    en: You can let a decision rest for a while.
    kn: ನಿರ್ಧಾರಕ್ಕೆ ಸ್ವಲ್ಪ ಕಾಲಾವಕಾಶ ಕೊಡಬಹುದು.
    hi: फैसले को कुछ समय दे सकते हैं।

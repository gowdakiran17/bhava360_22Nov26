contact: Use the shared mean orb and signed angular residual; separating contacts are background. An applying same-sign conjunction within orb supplies ithasala testimony (Prasna Tantra ch.II).
actors: Test question Lagna lord to primary topic lord and Moon to primary topic lord. Deduplicate unordered pairs;
  omit self-pairs. Context houses explain scope and do not cast independent votes. For lost-item recovery also test
  the fourth lord occupying the ascendant (Prasna Tantra III.76).
leaning:
  support_only: leans-toward
  friction_only: leans-against
  both: mixed
  neither: unclear
unknown: Missing primary, Moon, position or motion inputs leaves insufficient evidence. A separating contact alone
  cannot produce a negative verdict.
timing: Verify the earliest forward perfection before a station or intervening prohibition, within the query horizon.
  A sign ingress alone does not end the contact. Report its local civil date as a review date.
traditions_differ: Use observed motion here. Symbolic sign-modality time units are a separate tradition.
reason_copy:
  querent-support:
    en: Your plans and the matter you asked about may be coming together.
    kn: ನಿಮ್ಮ ಯೋಜನೆಗಳು ಮತ್ತು ನೀವು ಕೇಳಿದ ವಿಷಯ ಒಂದಕ್ಕೊಂದು ಹೊಂದಿಕೊಳ್ಳಬಹುದು.
    hi: आपकी योजना और जिस विषय पर आपने पूछा है, उनमें तालमेल बन सकता है।
  querent-friction:
    en: Your plans may need an adjustment before you can move ahead.
    kn: ಮುಂದೆ ಸಾಗಲು ನಿಮ್ಮ ಯೋಜನೆಯಲ್ಲಿ ಸ್ವಲ್ಪ ಬದಲಾವಣೆ ಬೇಕಾಗಬಹುದು.
    hi: आगे बढ़ने से पहले आपको अपनी योजना में कुछ बदलाव करना पड़ सकता है।
  moon-support:
    en: The way the situation is unfolding may give you an opening.
    kn: ಪರಿಸ್ಥಿತಿ ಸಾಗುತ್ತಿರುವ ರೀತಿಯಿಂದ ನಿಮಗೆ ಒಂದು ಅವಕಾಶ ಸಿಗಬಹುದು.
    hi: हालात जिस तरह बदल रहे हैं, उनसे आपको एक अवसर मिल सकता है।
  moon-friction:
    en: Changing circumstances may call for another look at your plans.
    kn: ಬದಲಾಗುತ್ತಿರುವ ಪರಿಸ್ಥಿತಿಯಲ್ಲಿ ನಿಮ್ಮ ಯೋಜನೆಯನ್ನು ಮತ್ತೆ ಪರಿಶೀಲಿಸಬಹುದು.
    hi: बदलते हालात में आप अपनी योजना पर फिर विचार कर सकते हैं।
  recovery-context:
    en: The reading suggests that another search may be worthwhile.
    kn: ಇನ್ನೊಮ್ಮೆ ಹುಡುಕುವುದು ಉಪಯುಕ್ತವಾಗಬಹುದು ಎಂಬ ಸೂಚನೆ ಇದೆ.
    hi: इस संकेत के आधार पर एक बार फिर तलाश करना उपयोगी हो सकता है।
  reception:
    en: Each side may have something useful to offer the other.
    kn: ಎರಡೂ ಕಡೆ ಪರಸ್ಪರ ನೆರವಾಗಬಹುದು.
    hi: दोनों पक्ष एक दूसरे की मदद कर सकते हैं।
  nakta:
    en: An intermediary may help bring the plans together.
    kn: ಮಧ್ಯವರ್ತಿಯ ನೆರವು ಯೋಜನೆಗಳನ್ನು ಒಗ್ಗೂಡಿಸಬಹುದು.
    hi: मध्यस्थ योजनाओं में तालमेल बनाने में मदद कर सकता है।
  yamaya:
    en: A shared contact may help coordinate the next step.
    kn: ಸಾಮಾನ್ಯ ಸಂಪರ್ಕವು ಮುಂದಿನ ಹೆಜ್ಜೆಗೆ ನೆರವಾಗಬಹುದು.
    hi: साझा संपर्क अगले कदम में मदद कर सकता है।
reason_binding: For a qualifying pair use querent-support or querent-friction when the source is the ascendant lord,
  otherwise moon-support or moon-friction. The fourth lord in the ascendant supplies recovery-context only on the
  lost-item route. Emit each reason once.
aspect_core: vedic/tajika/aspects.yaml
strength: Grade Lagna lord in D1 and stable Navamsha separately; note own/exalted, neutral or impaired, combustion
  and applying Moon contact. Reception or a proven transfer qualifies the outcome; never manufacture a review date.
reuse: Nakta, Yamaya and mutual reception are bound once using vedic/tajika/aspects.yaml. Incomplete history or an
  interrupted transfer withholds that testimony.
strength_context: Read the question Lagna, its ruler in D1, their stable navamsha, and Moon dignity and phase as capacity
  context. An unstable navamsha is withheld. Mutual reception qualifies an existing leaning. A verified, uninterrupted
  translation or collection may contribute support. Neither witness supplies a date on its own.

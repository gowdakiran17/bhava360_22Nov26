ashtamangala: Three actually counted heaps; reduce each count modulo eight with zero as eight. Do not synthesize a
  heap.
trisphuta: Normalize question Lagna + Moon + Gulika longitudes in the same sidereal frame. Missing Gulika or horizon
  withholds.
badhaka: 'Movable rising sign: eleventh lord. Fixed: ninth lord. Dual: seventh lord. Withhold on unstable Lagna. Private
  study only; no health, longevity or personal accusation.'
access: Require explicit Kerala study mode and authorized staff. Public intent referrals precede all calculations.

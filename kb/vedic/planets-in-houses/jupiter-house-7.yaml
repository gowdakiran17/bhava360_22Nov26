title: Jupiter in house 7
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match Jupiter in whole-sign D1 house 7 from a stable natal Lagna.
conditions:
  all:
  - fact: d1.jupiter.house_from_lagna
    op: eq
    value: 7
placement:
  graha: jupiter
  house: 7
  reference: lagna
  related_placement: vedic.houses.jupiter-house-7
  themes:
  - learning through guidance
  - committed partnership
  - agreements
  grouping_effects:
    kendra: An angular house brings the topic into recurring, visible decisions.
    maraka: Maraka is a traditional technical classification. Use the ordinary house topics in this reading.
  dig_bala:
    direction: east
    peak_house: 1
    peak_house_matches: false
    note: The peak for Jupiter is in house 1. Exact strength depends on angular distance from the pivot.
meaning: Jupiter in house 7 may bring learning through guidance into questions of committed partnership. When
  making an agreement, you can look for a lesson worth passing on.
life_areas:
- love-marriage
- business
strength_notes:
- when:
    fact: d1.jupiter.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Own or exaltation sign supplies a supporting dignity factor. Check other strengths separately.
- when:
    fact: d1.jupiter.debilitated
    op: eq
    value: true
  effect: weaker
  reason: Debilitation qualifies this graha’s expression; check separately sourced cancellations before interpreting.
exceptions:
- when:
    all:
    - fact: d1.jupiter.debilitated
      op: eq
      value: true
    - fact: d1.dignity.neecha_bhanga_matched
      op: eq
      value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Qualify the debility modifier when the cancellation candidate matches this same graha. The house placement
    still applies.

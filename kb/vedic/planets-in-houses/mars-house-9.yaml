id: vedic.planets-in-houses.mars-house-9
system: vedic
topic: planets-in-houses
title: Mars in house 9
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match Mars in whole-sign D1 house 9 from a stable natal Lagna.
conditions:
  all:
  - fact: d1.mars.house_from_lagna
    op: eq
    value: 9
placement:
  graha: mars
  house: 9
  reference: lagna
  related_placement: vedic.houses.mars-house-9
  themes:
  - directing effort
  - teachers
  - ethical commitments
  grouping_effects:
    trikona: A trinal house can connect experience here with learning, judgement or a guiding value.
  dig_bala:
    direction: south
    peak_house: 10
    peak_house_matches: false
    note: The peak for Mars is in house 10. Exact strength depends on angular distance from the pivot.
meaning: Mars in house 9 may bring directing effort into questions of teachers. When considering advice from a
  teacher, you can choose one practical step and check whom it affects.
life_areas:
- learning
- spirituality
- travel-relocation
strength_notes:
- when:
    fact: d1.mars.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Own or exaltation sign supplies a supporting dignity factor. Check other strengths separately.
- when:
    fact: d1.mars.debilitated
    op: eq
    value: true
  effect: weaker
  reason: Debilitation qualifies this graha’s expression; check separately sourced cancellations before interpreting.
exceptions:
- when:
    all:
    - fact: d1.mars.debilitated
      op: eq
      value: true
    - fact: d1.dignity.neecha_bhanga_matched
      op: eq
      value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Qualify the debility modifier when the cancellation candidate matches this same graha. The house placement
    still applies.

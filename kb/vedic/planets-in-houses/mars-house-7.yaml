id: vedic.planets-in-houses.mars-house-7
system: vedic
topic: planets-in-houses
title: Mars in house 7
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match Mars in whole-sign D1 house 7 from a stable natal Lagna.
conditions:
  all:
  - fact: d1.mars.house_from_lagna
    op: eq
    value: 7
related_rules: [vedic.doshas.mars-partnership]
placement:
  graha: mars
  house: 7
  reference: lagna
  related_placement: vedic.houses.mars-house-7
  themes:
  - directing effort
  - committed partnership
  - agreements
  grouping_effects:
    kendra: An angular house brings the topic into recurring, visible decisions.
    maraka: Maraka is a traditional technical classification. Use the ordinary house topics in this reading.
  dig_bala:
    direction: south
    peak_house: 10
    peak_house_matches: false
    note: The peak for Mars is in house 10. Exact strength depends on angular distance from the pivot.
meaning: Mars may bring initiative to a partnership. Naming who can take the next step can give that energy a
  practical outlet when two people work at different speeds.
life_areas:
- love-marriage
- business
strength_notes:
- when:
    fact: d1.mars.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Own or exaltation sign supplies a supporting dignity factor. Check other strengths separately.
- when:
    fact: d1.mars.debilitated
    op: eq
    value: true
  effect: weaker
  reason: Debilitation qualifies this graha’s expression; check separately sourced cancellations before interpreting.
exceptions:
- when:
    all:
    - fact: d1.mars.debilitated
      op: eq
      value: true
    - fact: d1.dignity.neecha_bhanga_matched
      op: eq
      value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Qualify the debility modifier when the cancellation candidate matches this same graha. The house placement
    still applies.
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: This entry counts whole signs from Lagna. A count from the Moon can place the graha in another house and
    requires its own reference and reading.

  en: Before acting on a shared decision, you can ask your partner which step each of you wants to take.
  kn: ಒಟ್ಟಾಗಿ ತೆಗೆದುಕೊಂಡ ತೀರ್ಮಾನವನ್ನು ಜಾರಿಗೆ ತರುವ ಮೊದಲು ಯಾರು ಯಾವ ಹೆಜ್ಜೆ ಇಡಲು ಬಯಸುತ್ತಾರೆ ಎಂದು ಸಂಗಾತಿಯೊಂದಿಗೆ ಚರ್ಚಿಸಬಹುದು.
  hi: साझा फ़ैसले पर आगे बढ़ने से पहले आप अपने साथी से बात कर सकते हैं कि कौन सा कदम कौन उठाना चाहता है।

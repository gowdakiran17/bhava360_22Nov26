id: vedic.planets-in-houses.moon-house-11
system: vedic
topic: planets-in-houses
title: Moon in house 11
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match Moon in whole-sign D1 house 11 from a stable natal Lagna.
conditions:
  all:
  - fact: d1.moon.house_from_lagna
    op: eq
    value: 11
placement:
  graha: moon
  house: 11
  reference: lagna
  related_placement: vedic.houses.moon-house-11
  themes:
  - attending to changing needs
  - receipts
  - fulfilment of aims
  grouping_effects:
    upachaya: An upachaya house places emphasis on capacities that can develop through practice.
  dig_bala:
    direction: north
    peak_house: 4
    peak_house_matches: false
    note: The peak for Moon is in house 4. Exact strength depends on angular distance from the pivot.
meaning: Moon in house 11 may bring attending to changing needs into questions of receipts. When a goal comes
  within reach, you may find it helpful to ask what feels different today.
life_areas:
- money
- career
- family-home
strength_notes:
- when:
    fact: d1.moon.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Own or exaltation sign supplies a supporting dignity factor. Check other strengths separately.
- when:
    fact: d1.moon.debilitated
    op: eq
    value: true
  effect: weaker
  reason: Debilitation qualifies this graha’s expression; check separately sourced cancellations before interpreting.
exceptions:
- when:
    all:
    - fact: d1.moon.debilitated
      op: eq
      value: true
    - fact: d1.dignity.neecha_bhanga_matched
      op: eq
      value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Qualify the debility modifier when the cancellation candidate matches this same graha. The house placement
    still applies.
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: This entry counts whole signs from Lagna. A count from the Moon can place the graha in another house and
    requires its own reference and reading.

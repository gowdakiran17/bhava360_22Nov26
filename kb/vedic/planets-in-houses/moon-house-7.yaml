id: vedic.planets-in-houses.moon-house-7
system: vedic
topic: planets-in-houses
title: Moon in house 7
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match Moon in whole-sign D1 house 7 from a stable natal Lagna.
conditions:
  all:
  - fact: d1.moon.house_from_lagna
    op: eq
    value: 7
placement:
  graha: moon
  house: 7
  reference: lagna
  related_placement: vedic.houses.moon-house-7
  themes:
  - attending to changing needs
  - committed partnership
  - agreements
  grouping_effects:
    kendra: An angular house brings the topic into recurring, visible decisions.
    maraka: Maraka is a traditional technical classification. Use the ordinary house topics in this reading.
  dig_bala:
    direction: north
    peak_house: 4
    peak_house_matches: false
    note: The peak for Moon is in house 4. Exact strength depends on angular distance from the pivot.
meaning: Moon in house 7 may bring attending to changing needs into questions of committed partnership. When making
  an agreement, you may find it helpful to ask what feels different today.
life_areas:
- love-marriage
- business
strength_notes:
- when:
    fact: d1.moon.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Own or exaltation sign supplies a supporting dignity factor. Check other strengths separately.
- when:
    fact: d1.moon.debilitated
    op: eq
    value: true
  effect: weaker
  reason: Debilitation qualifies this graha’s expression; check separately sourced cancellations before interpreting.
exceptions:
- when:
    all:
    - fact: d1.moon.debilitated
      op: eq
      value: true
    - fact: d1.dignity.debility_lord_angular
      op: eq
      value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Qualify the debility modifier when the cancellation candidate matches this same graha. The house placement
    still applies.
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: This entry counts whole signs from Lagna. A count from the Moon can place the graha in another house and
    requires its own reference and reading.
sources:
- book: Phaladeepika
  work_id: phaladeepika
  edition: phaladeepika-sastri-1950
  chapter: 8
  verse: 5–7
  other_locator: Moon in the twelve houses from Lagna
  supports: Classical placement context. The practical reflection is editorial.
  verification: verified
- book: Phaladeepika

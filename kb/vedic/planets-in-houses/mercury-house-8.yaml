id: vedic.planets-in-houses.mercury-house-8
system: vedic
topic: planets-in-houses
title: Mercury in house 8
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match Mercury in whole-sign D1 house 8 from a stable natal Lagna.
conditions:
  all:
  - fact: d1.mercury.house_from_lagna
    op: eq
    value: 8
placement:
  graha: mercury
  house: 8
  reference: lagna
  related_placement: vedic.houses.mercury-house-8
  themes:
  - putting ideas into words
  - continuity through disruption
  - longevity (ayu)
  grouping_effects:
    dusthana: This house can call for attention to costs, complications or matters that take time to resolve.
  dig_bala:
    direction: east
    peak_house: 1
    peak_house_matches: false
    note: The peak for Mercury is in house 1. Exact strength depends on angular distance from the pivot.
meaning: Mercury in house 8 may bring putting ideas into words into questions of continuity through disruption.
  When a shared responsibility changes, you can put the main question into your own words.
life_areas:
- money
- love-marriage
- health
- spirituality
strength_notes:
- when:
    fact: d1.mercury.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Own or exaltation sign supplies a supporting dignity factor. Check other strengths separately.
- when:
    fact: d1.mercury.debilitated
    op: eq
    value: true
  effect: weaker
  reason: Debilitation qualifies this graha’s expression; check separately sourced cancellations before interpreting.
exceptions:
- when:
    all:
    - fact: d1.mercury.debilitated
      op: eq
      value: true
    - fact: d1.dignity.neecha_bhanga_matched
      op: eq
      value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Qualify the debility modifier when the cancellation candidate matches this same graha. The house placement
    still applies.
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: This entry counts whole signs from Lagna. A count from the Moon can place the graha in another house and

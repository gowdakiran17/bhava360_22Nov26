user_text:
  en: When making a decision about home, you can decide what you can keep doing on a difficult week.
  kn: ಮನೆಗೆ ಸಂಬಂಧಿಸಿದ ತೀರ್ಮಾನ ತೆಗೆದುಕೊಳ್ಳುವಾಗ ಕಷ್ಟದ ವಾರದಲ್ಲಿಯೂ ಯಾವುದನ್ನು ಮುಂದುವರಿಸಬಹುದು ಎಂದು ಯೋಚಿಸಬಹುದು.
  hi: घर के बारे में फ़ैसला करते समय, आप सोच सकते हैं कि कठिन सप्ताह में भी क्या जारी रख पाएँगे।

id: vedic.planets-in-houses.saturn-house-4
system: vedic
topic: planets-in-houses
title: Saturn in house 4
doctrine_profile: parashari-lahiri-whole-sign-draft-v1
approval: draft
rule: Match Saturn in whole-sign D1 house 4 from a stable natal Lagna.
conditions:
  all:
  - fact: d1.saturn.house_from_lagna
    op: eq
    value: 4
placement:
  graha: saturn
  house: 4
  reference: lagna
  related_placement: vedic.houses.saturn-house-4
  themes:
  - keeping commitments
  - home
  - caregiving
  grouping_effects:
    kendra: An angular house brings the topic into recurring, visible decisions.
  dig_bala:
    direction: west
    peak_house: 7
    peak_house_matches: false
    note: The peak for Saturn is in house 7. Exact strength depends on angular distance from the pivot.
meaning: Saturn in house 4 may bring keeping commitments into questions of home. When making a decision about
  home, you can decide what you can keep doing on a difficult week.
life_areas:
- family-home
- property-vehicles
strength_notes:
- when:
    fact: d1.saturn.own_or_exalted
    op: eq
    value: true
  effect: stronger
  reason: Own or exaltation sign supplies a supporting dignity factor. Check other strengths separately.
- when:
    fact: d1.saturn.debilitated
    op: eq
    value: true
  effect: weaker
  reason: Debilitation qualifies this graha’s expression; check separately sourced cancellations before interpreting.
exceptions:
- when:
    all:
    - fact: d1.saturn.debilitated
      op: eq
      value: true
    - fact: d1.dignity.neecha_bhanga_matched
      op: eq
      value: true
  effect: soften
  rule_id: vedic.yogas.neecha-bhanga
  reason: Qualify the debility modifier when the cancellation candidate matches this same graha. The house placement
    still applies.
traditions_differ:
- profile: parashari-lahiri-whole-sign-draft-v1
  note: This entry counts whole signs from Lagna. A count from the Moon can place the graha in another house and
    requires its own reference and reading.
